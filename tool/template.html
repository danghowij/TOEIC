<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOEIC Study Deck</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17243a;
      --muted: #68758a;
      --paper: #ffffff;
      --line: #dfe5ee;
      --blue: #1769e0;
      --blue-soft: #eaf2ff;
      --green: #15805d;
      --green-soft: #e5f7f0;
      --red: #c83c4d;
      --red-soft: #ffebee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #f3f6fa;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, select { font: inherit; }
    .shell { max-width: 1500px; margin: 0 auto; padding: 16px 24px 24px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 14px;
      margin-bottom: 18px;
      padding: 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    label.small { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    select, .button {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
      color: var(--ink);
      cursor: pointer;
    }
    .button.primary { border-color: var(--blue); color: white; background: var(--blue); font-weight: 700; }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .counter { align-self: center; color: var(--muted); font-size: 14px; }
    .score {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .score span {
      min-width: 66px;
      padding: 6px 9px;
      text-align: center;
      color: var(--muted);
      border-radius: 9px;
      background: #f2f6fa;
      font-size: 11px;
      font-weight: 700;
    }
    .score strong { display: block; color: var(--ink); font-size: 16px; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 18px;
      align-items: start;
    }
    .study-card, .answer-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(23, 36, 58, .06);
    }
    .study-card { padding: 16px; overflow: hidden; }
    .view-switcher { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
    .view-button.active { color: #fff; border-color: var(--ink); background: var(--ink); }
    .source-layout { display: grid; gap: 18px; }
    .source-document {
      max-width: 900px;
      margin: 0 auto;
      padding: clamp(22px, 4vw, 44px);
      color: #202b3d;
      text-align: left;
      border: 1px solid #d8ddd7;
      border-radius: 6px;
      background: #fffef9;
      box-shadow: 0 14px 36px rgba(42, 47, 40, .08);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(16px, 1.35vw, 19px);
      line-height: 1.72;
    }
    .source-kicker {
      margin-bottom: 18px;
      color: #8b5138;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .source-body { white-space: pre-wrap; }
    .source-body p { margin: 0 0 1em; }
    .source-body strong { color: #0b5e55; background: #dcf4e9; box-shadow: 0 0 0 3px #dcf4e9; }
    .source-questions { display: grid; gap: 12px; margin-top: 18px; }
    .source-question {
      padding: 16px 18px;
      border: 1px solid #dce3eb;
      border-radius: 12px;
      background: #f8fafc;
      text-align: left;
    }
    .source-question-title { margin-bottom: 10px; font-weight: 800; line-height: 1.5; }
    .source-choice-list { display: grid; gap: 7px; }
    .source-choice { padding: 7px 10px; border-radius: 7px; line-height: 1.45; }
    .source-choice.correct { color: #075a42; background: #dff5eb; font-weight: 800; }
    .source-image { text-align: center; overflow: auto; }
    .source-image img { display: block; max-width: 100%; height: auto; margin: auto; }
    .source-warning { margin: 12px auto 0; max-width: 900px; color: var(--muted); font-size: 12px; text-align: center; }
    .translation-actions { display: flex; justify-content: center; margin-top: 16px; }
    .translation-panel {
      margin-top: 12px;
      padding: clamp(18px, 3vw, 28px);
      text-align: left;
      border: 1px solid #cfe3df;
      border-radius: 12px;
      background: linear-gradient(145deg, #f4fbf8, #f8fbff);
    }
    .translation-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .translation-title { margin: 0; font-size: 18px; }
    .translation-note { color: var(--muted); font-size: 12px; }
    .translation-text { line-height: 1.7; }
    .translation-text strong { color: #0b5e55; font-weight: 800; }
    .translation-text h2, .translation-text h3 { margin: 1.25em 0 .55em; line-height: 1.25; }
    .translation-text h2:first-child, .translation-text h3:first-child { margin-top: 0; }
    .translation-text h2 { font-size: 20px; }
    .translation-text h3 { font-size: 17px; }
    .translation-text p { margin: 0 0 1em; }
    .translation-text ul { margin: 0 0 1em; padding-left: 22px; }
    .translation-text hr { margin: 24px 0; border: 0; border-top: 1px dashed #9fc9bf; }
    .translation-answers {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #cfe3df;
      line-height: 1.6;
    }
    .translation-answers strong { color: var(--blue); }
    .answer-card { padding: 16px; position: sticky; top: 18px; }
    h1 { margin: 0 0 5px; font-size: 19px; }
    .question { padding: 12px 0; border-top: 1px solid var(--line); }
    .question:first-of-type { border-top: 0; }
    /* Each image contains at most five questions, so keep the actions aligned. */
    .quiz-form { height: 420px; }
    .question-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .question-title { font-weight: 800; }
    .question-status { font-size: 12px; font-weight: 800; text-align: right; }
    .question-status.correct { color: var(--green); }
    .question-status.wrong { color: var(--red); }
    .question-status.ungraded { color: var(--muted); }
    .choices {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: 100%;
      gap: 6px;
    }
    .choice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 32px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }
    .choice input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--blue);
      cursor: pointer;
    }
    .choice.correct { color: var(--green); }
    .choice.correct input { accent-color: var(--green); }
    .choice.wrong { color: var(--red); }
    .choice.wrong input { accent-color: var(--red); }
    .question.ungraded { opacity: .72; }
    .result { min-height: 22px; margin: 12px 0; font-size: 14px; font-weight: 700; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .actions .primary { grid-column: 1 / -1; }
    .empty { padding: 50px 20px; text-align: center; color: var(--muted); }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .answer-card { position: static; }
      .counter { width: 100%; margin-left: 0; }
      .score { width: 100%; margin-left: 0; }
      .score span { flex: 1; }
      .shell { padding: 10px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="controls">
      <label class="small">Chế độ
        <select id="mode">
          <option value="ordered">Theo thứ tự</option>
          <option value="random">Ngẫu nhiên</option>
          <option value="wrong">Ôn câu sai</option>
          <option value="answers">Hiện đáp án ngay</option>
        </select>
      </label>
      <label class="small">Sách
        <select id="book"></select>
      </label>
      <label class="small">Test
        <select id="test"></select>
      </label>
      <button class="button primary" id="startButton">Bắt đầu lượt mới</button>
      <button class="button" id="resetButton">Xóa điểm</button>
      <div class="score" aria-label="Kết quả hiện tại">
        <span>Đúng<strong id="correctScore">0</strong></span>
        <span>Sai<strong id="wrongScore">0</strong></span>
        <span>Điểm<strong id="percentScore">0%</strong></span>
      </div>
      <span class="counter" id="counter"></span>
    </section>
    <section class="workspace">
      <div class="study-card" id="imagePanel"></div>
      <aside class="answer-card" id="answerPanel"></aside>
    </section>
  </main>
  <script>
    const DATA = __TOEIC_DATA__;
    const state = {
      deck: [], index: 0, checked: false,
      correct: 0, wrong: 0, wrongIds: new Set(), translationVisible: false,
      sourceView: "image"
    };
    const $ = (id) => document.getElementById(id);
    const shuffle = (items) => {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };
    function setupFilters() {
      const books = [...new Map(
        DATA.items.map(item => [item.book, item.bookLabel])
      ).entries()].sort((a, b) => a[1].localeCompare(b[1], undefined, {numeric: true}));
      $("book").innerHTML = '<option value="*">Tất cả sách</option>' +
        books.map(([value, label]) =>
          `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`
        ).join("");
      $("book").onchange = () => {
        setupTests();
        start();
      };
      $("test").onchange = start;
      $("mode").onchange = () => {
        if ($("mode").value === "answers" && state.deck.length) {
          state.checked = false;
          render();
          return;
        }
        start();
      };
      setupTests();
    }
    function setupTests() {
      const selectedBook = $("book").value;
      const tests = [...new Map(
        DATA.items
          .filter(item => selectedBook === "*" || item.book === selectedBook)
          .map(item => [item.test, item.testLabel])
      ).entries()].sort((a, b) => a[1].localeCompare(b[1], undefined, {numeric: true}));
      $("test").innerHTML = '<option value="*">Tất cả test</option>' +
        tests.map(([value, label]) =>
          `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`
        ).join("");
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => (
        {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]
      ));
    }
    function start() {
      const book = $("book").value;
      const test = $("test").value;
      const mode = $("mode").value;
      let deck = DATA.items.filter(item =>
        (book === "*" || item.book === book) &&
        (test === "*" || item.test === test)
      );
      if (mode === "wrong") deck = deck.filter(item => state.wrongIds.has(item.id));
      if (mode === "random") deck = shuffle(deck);
      state.deck = deck;
      state.index = 0;
      state.checked = false;
      state.translationVisible = mode === "answers";
      render();
    }
    function render() {
      const item = state.deck[state.index];
      $("counter").textContent = item ? `Bộ ${state.index + 1} / ${state.deck.length}` : "Không có bài phù hợp";
      if (!item) {
        $("imagePanel").innerHTML = '<div class="empty">Hãy chọn folder hoặc làm sai một bài để dùng chế độ “Ôn câu sai”.</div>';
        $("answerPanel").innerHTML = '<div class="empty">Chưa có câu hỏi.</div>';
        return;
      }
      $("imagePanel").innerHTML = `
        ${renderStudyContent(item)}
        ${renderTranslation(item)}`;
      document.querySelectorAll("[data-source-view]").forEach(button => {
        button.onclick = () => {
          state.sourceView = button.dataset.sourceView;
          render();
        };
      });
      const translationButton = $("translationButton");
      if (translationButton) translationButton.onclick = toggleTranslation;
      const questions = Object.keys(item.questions).sort((a, b) =>
        a.localeCompare(b, undefined, {numeric: true})
      );
      $("answerPanel").innerHTML = `
        <h1>${escapeHtml(item.title)}</h1>
        <form id="quizForm" class="quiz-form">
          ${questions.map(number => `
            <div class="question" data-question="${escapeHtml(number)}">
              <div class="question-head">
                <div class="question-title">Câu ${escapeHtml(number)}</div>
                <div class="question-status" aria-live="polite"></div>
              </div>
              <div class="choices">
                ${["A","B","C","D"].map(choice => `
                  <label class="choice" data-choice="${choice}">
                    <input type="radio" name="q-${escapeHtml(number)}" value="${choice}">
                    <span>${choice}</span>
                  </label>`).join("")}
              </div>
            </div>`).join("")}
        </form>
        <div class="result" id="result"></div>
        <div class="actions">
          <button class="button" id="prevButton">← Trước</button>
          <button class="button" id="nextButton">Tiếp →</button>
          <button class="button primary" id="checkButton">Chấm đáp án</button>
        </div>`;
      $("prevButton").disabled = state.index === 0;
      $("nextButton").disabled = state.index === state.deck.length - 1;
      $("prevButton").onclick = () => navigate(-1);
      $("nextButton").onclick = () => navigate(1);
      $("checkButton").onclick = checkAnswers;
      if ($("mode").value === "answers") revealAnswers(item);
    }
    function navigate(offset) {
      state.index += offset;
      state.checked = false;
      state.translationVisible = $("mode").value === "answers";
      render();
      window.scrollTo({top: 0, behavior: "smooth"});
    }
    function revealAnswers(item) {
      let gradedCount = 0;
      let ungradedCount = 0;
      for (const [number, correctAnswer] of Object.entries(item.questions)) {
        const row = document.querySelector(`[data-question="${CSS.escape(number)}"]`);
        const status = row.querySelector(".question-status");
        if (correctAnswer === "X") {
          ungradedCount++;
          row.classList.add("ungraded");
          status.classList.add("ungraded");
          status.textContent = "— Chưa có đáp án";
        } else {
          gradedCount++;
          const correctChoice = row.querySelector(`[data-choice="${correctAnswer}"]`);
          correctChoice.classList.add("correct");
          correctChoice.querySelector("input").checked = true;
          status.classList.add("correct");
          status.textContent = `Đáp án ${correctAnswer}`;
        }
        row.querySelectorAll("input").forEach(input => input.disabled = true);
      }
      $("checkButton").disabled = true;
      $("checkButton").textContent = "Đang hiện đáp án";
      const suffix = ungradedCount ? ` ${ungradedCount} câu chưa có đáp án chính thức.` : "";
      $("result").textContent = gradedCount
        ? `Đáp án đúng được tô xanh.${suffix}`
        : `Bộ này chưa có đáp án chính thức.${suffix}`;
    }
    function checkAnswers() {
      if (state.checked) return;
      const item = state.deck[state.index];
      let missingGraded = 0;
      const results = [];
      for (const [number, correctAnswer] of Object.entries(item.questions)) {
        const selected = document.querySelector(`input[name="q-${CSS.escape(number)}"]:checked`);
        if (!selected && correctAnswer !== "X") missingGraded++;
        results.push({number, selected: selected?.value, correctAnswer});
      }
      if (missingGraded) {
        $("result").textContent = `Bạn còn ${missingGraded} câu có đáp án chưa chọn.`;
        return;
      }
      state.checked = true;
      state.translationVisible = true;
      let itemHasError = false;
      let gradedCount = 0;
      let ungradedCount = 0;
      for (const result of results) {
        const row = document.querySelector(`[data-question="${CSS.escape(result.number)}"]`);
        const status = row.querySelector(".question-status");
        if (result.correctAnswer === "X") {
          ungradedCount++;
          row.classList.add("ungraded");
          status.classList.add("ungraded");
          status.textContent = "— Không tính điểm";
          row.querySelectorAll("input").forEach(input => input.disabled = true);
          continue;
        }
        gradedCount++;
        if (result.selected === result.correctAnswer) {
          state.correct++;
          row.querySelector(`[data-choice="${result.correctAnswer}"]`).classList.add("correct");
          status.classList.add("correct");
          status.textContent = "✓ Đúng";
        } else {
          state.wrong++;
          itemHasError = true;
          row.querySelector(`[data-choice="${result.selected}"]`).classList.add("wrong");
          row.querySelector(`[data-choice="${result.correctAnswer}"]`).classList.add("correct");
          status.classList.add("wrong");
          status.textContent = `✕ Sai · Đáp án ${result.correctAnswer}`;
        }
        row.querySelectorAll("input").forEach(input => input.disabled = true);
      }
      if (itemHasError) state.wrongIds.add(item.id);
      else state.wrongIds.delete(item.id);
      const suffix = ungradedCount ? ` ${ungradedCount} câu X không tính điểm.` : "";
      if (!gradedCount) {
        $("result").textContent = `Bộ này chưa có đáp án chính thức.${suffix}`;
      } else {
        $("result").textContent = (
          itemHasError
            ? "Có câu chưa đúng — đáp án đúng đã được tô xanh."
            : "Chính xác tất cả!"
        ) + suffix;
      }
      updateScore();
      render();
    }
    function splitSourceText(value, expectedNumbers) {
      const normalized = String(value || "").replace(/\r/g, "").trim();
      if (!normalized) return {intro: "", passage: "", questions: []};
      const questionBoundary = normalized.match(/(?:^|\n)\s*\d{3}[\.,]\s+\([A-D0-9©]\)/m);
      const questionStart = questionBoundary?.index ?? -1;
      const upper = questionStart >= 0 ? normalized.slice(0, questionStart) : normalized;
      const lower = questionStart >= 0 ? normalized.slice(questionStart) : "";
      const introMatch = upper.match(/^Questions?\s+\d+(?:\s*[-–]\s*\d+)?[^\n]*\n?/i);
      const intro = (introMatch ? introMatch[0].trim() : "Original English passage")
        .replace(/\s+\d+$/, "");
      const passage = cleanOcrText(introMatch ? upper.slice(introMatch[0].length) : upper);
      const starts = [...lower.matchAll(new RegExp(`(?:^|\\n)\\s*(${expectedNumbers.join("|")})[\\.,]\\s+`, "g"))];
      const questions = starts.map((match, index) => {
        const start = match.index + match[0].length;
        const end = starts[index + 1]?.index ?? lower.length;
        return parseSourceQuestion(match[1], lower.slice(start, end));
      }).filter(Boolean);
      const found = new Set(questions.map(question => question.number));
      if (expectedNumbers.some(number => !found.has(number))) questions.length = 0;
      return {intro, passage, questions};
    }
    function cleanOcrText(value) {
      const lines = String(value || "").replace(/\r/g, "").split("\n");
      const cleaned = [];
      for (let line of lines) {
        line = line.trim();
        if (!line) { cleaned.push(""); continue; }
        if (/^(?:GO\s*ON|TEST\s*!?|PART\s*[67]|Anhle|\d{1,3})\b/i.test(line) && line.length < 34) continue;
        if (line.length <= 2 && !/^[AI]$/.test(line)) continue;
        if (/^[^A-Za-z0-9]{1,8}$/.test(line)) continue;
        line = line
          .replace(/[|¦]/g, "I")
          .replace(/(?<=\s)[~:;]+[0-9A-Za-z©-]{0,5}(?=\s|[.,])/g, " _____ ")
          .replace(/(?<=\s)[0-9]{2,3}[A-Za-z©-]?(?=\s|[.,])/g, " _____ ")
          .replace(/\s+[A-Za-z]{1,2}\s*$/g, "")
          .replace(/\s{2,}/g, " ")
          .trim();
        if (line) cleaned.push(line);
      }
      return cleaned.join("\n")
        .replace(/\n{3,}/g, "\n\n")
        .replace(/\bGO\s*ON\s*TO\s*THE\s*NEXT\s*PAGE[,.]?/gi, "")
        .trim();
    }
    function parseSourceQuestion(number, block) {
      const matches = [...block.matchAll(/(?:^|\n|\s)\(([A-D])\)\s*/g)];
      if (!matches.length) return {number, text: cleanOcrText(block), choices: {}};
      const text = cleanOcrText(block.slice(0, matches[0].index));
      const choices = {};
      matches.forEach((match, index) => {
        const start = match.index + match[0].length;
        const end = matches[index + 1]?.index ?? block.length;
        choices[match[1]] = cleanOcrText(block.slice(start, end)).replace(/\s+/g, " ");
      });
      return {number, text, choices};
    }
    function renderStudyContent(item) {
      const hasText = Boolean(item.sourceContent?.status === "reviewed");
      const selected = hasText ? state.sourceView : "image";
      return `
        <div class="view-switcher" aria-label="Kiểu hiển thị đề">
          <button class="button view-button ${selected === "text" ? "active" : ""}" data-source-view="text" ${hasText ? "" : "disabled"}>${hasText ? "Đề dạng chữ" : "Đề chữ đang hiệu đính"}</button>
          <button class="button view-button ${selected === "image" ? "active" : ""}" data-source-view="image">Ảnh gốc</button>
        </div>
        ${selected === "text" ? renderSourceText(item) : renderSourceImage(item)}`;
    }
    function renderSourceImage(item) {
      const source = $("mode").value === "answers" ? item.markedImage || item.image : item.image;
      return `<div class="source-image"><img src="${source}" alt="${escapeHtml(item.title)}"></div>`;
    }
    function renderSourceText(item) {
      const content = item.sourceContent;
      const reveal = state.checked || $("mode").value === "answers";
      const questionMap = new Map((content.questions || []).map(question => [String(question.number), question]));
      const questions = Object.keys(item.questions).sort((a, b) => Number(a) - Number(b));
      return `<div class="source-layout">
        ${(content.documents || []).map((document, index) => `<article class="source-document">
          <div class="source-kicker">${escapeHtml(document.title || `Document ${index + 1}`)}</div>
          <div class="source-body">${renderSourceParagraphs(document.content || "")}</div>
        </article>`).join("")}
        <section class="source-questions">
          ${questions.map(number => renderSourceQuestion(questionMap.get(number), number, item.questions[number], reveal)).join("")}
        </section>
        <p class="source-warning">Nội dung đã được hiệu đính từ ảnh/PDF gốc. Bạn vẫn có thể chuyển sang “Ảnh gốc” để đối chiếu bố cục.</p>
      </div>`;
    }
    function renderSourceParagraphs(value) {
      return escapeHtml(value).split(/\n{2,}/).map(part => `<p>${part.replace(/\n/g, "<br>")}</p>`).join("");
    }
    function renderSourceQuestion(question, number, answer, reveal) {
      const text = question?.text || `Question ${number}`;
      const choices = question?.choices || {};
      return `<article class="source-question">
        <div class="source-question-title"><span>${escapeHtml(number)}.</span> ${escapeHtml(text)}</div>
        <div class="source-choice-list">
          ${["A","B","C","D"].map(letter => choices[letter]
            ? `<div class="source-choice ${reveal && answer === letter ? "correct" : ""}"><strong>(${letter})</strong> ${escapeHtml(choices[letter])}</div>`
            : "").join("")}
        </div>
      </article>`;
    }
    function renderInlineMarkdown(value) {
      return escapeHtml(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }
    function renderRichMarkdown(value) {
      const lines = String(value || "").replace(/\r/g, "").split("\n");
      const output = [];
      let paragraph = [];
      let list = [];
      const flushParagraph = () => {
        if (!paragraph.length) return;
        output.push(`<p>${paragraph.map(renderInlineMarkdown).join("<br>")}</p>`);
        paragraph = [];
      };
      const flushList = () => {
        if (!list.length) return;
        output.push(`<ul>${list.map(item => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</ul>`);
        list = [];
      };
      for (const line of lines) {
        if (!line.trim()) { flushParagraph(); flushList(); continue; }
        if (line.trim() === "---") { flushParagraph(); flushList(); output.push("<hr>"); continue; }
        const heading = line.match(/^(#{2,3})\s+(.+)$/);
        if (heading) {
          flushParagraph(); flushList();
          const level = heading[1].length;
          output.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }
        const bullet = line.match(/^[-*]\s+(.+)$/);
        if (bullet) { flushParagraph(); list.push(bullet[1]); continue; }
        flushList(); paragraph.push(line);
      }
      flushParagraph(); flushList();
      return output.join("");
    }
    function renderTranslation(item) {
      if (!item.translation) return "";
      const visible = state.translationVisible || $("mode").value === "answers";
      const note = item.translationStatus === "reviewed"
        ? "Đã hiệu đính"
        : "Bản dịch tự động · Có thể cần hiệu đính";
      const answers = Object.entries(item.questions)
        .map(([number, answer]) => `${escapeHtml(number)} ${escapeHtml(answer)}`)
        .join(", ");
      return `
        <div class="translation-actions">
          <button class="button" id="translationButton" type="button">
            ${visible ? "Ẩn bản dịch" : "Xem bản dịch tiếng Việt"}
          </button>
        </div>
        <section class="translation-panel" id="translationPanel" ${visible ? "" : "hidden"}>
          <div class="translation-head">
            <h2 class="translation-title">Bản dịch tiếng Việt</h2>
            <span class="translation-note">${escapeHtml(note)}</span>
          </div>
          <div class="translation-text">${renderRichMarkdown(item.translation)}</div>
          <div class="translation-answers">Đáp án: <strong>${answers}</strong>.</div>
        </section>`;
    }
    function toggleTranslation() {
      state.translationVisible = !state.translationVisible;
      const panel = $("translationPanel");
      const button = $("translationButton");
      if (!panel || !button) return;
      panel.hidden = !state.translationVisible;
      button.textContent = state.translationVisible
        ? "Ẩn bản dịch"
        : "Xem bản dịch tiếng Việt";
    }
    function renderTranslationPanel(item) {
      const panel = $("translationPanel");
      const button = $("translationButton");
      if (!item.translation || !panel || !button) return;
      panel.hidden = false;
      button.textContent = "Ẩn bản dịch";
    }
    function updateScore() {
      const total = state.correct + state.wrong;
      $("correctScore").textContent = state.correct;
      $("wrongScore").textContent = state.wrong;
      $("percentScore").textContent = total ? `${Math.round(state.correct / total * 100)}%` : "0%";
    }
    $("startButton").onclick = start;
    $("resetButton").onclick = () => {
      state.correct = 0;
      state.wrong = 0;
      state.wrongIds.clear();
      updateScore();
      start();
    };
    setupFilters();
    start();
  </script>
</body>
</html>
