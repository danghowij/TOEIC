h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 176–180","questions":{"176":"B","177":"C","178":"B","179":"D","180":"D"},"image":"data/h3/test04/176_BCBDD.png","markedImage":"marked/h3/test04/176_BCBDD.png","translation":"**Tài liệu 1 — Thông báo họp công khai của Thành phố Griggston**\n\nMột cuộc họp tại tòa thị chính đã được lên lịch để thảo luận kế hoạch đề xuất cho hai dự án cải thiện đường sá: kéo dài Marigold Street từ Route 103 và sửa chữa các điểm nguy hiểm trên Hartford Street. Dự án Marigold Street dự kiến kéo dài hai tuần, còn dự án kia khoảng năm ngày. Văn phòng Quy hoạch Giao thông Griggston đã cấp kinh phí cho cả hai.\n\nCông việc có thể gây gián đoạn giao thông và ảnh hưởng đến nhà ở, doanh nghiệp trong khu vực. Thành phố đã lập **kế hoạch chuyển hướng giao thông trong suốt thời gian thi công cả hai dự án**, đồng thời chỉ cho phép sử dụng máy móc gây tiếng ồn vào ban ngày.\n\n**Ngày:** Thứ Ba, ngày 10 tháng 1  \n**Giờ:** 6:30 tối  \n**Địa điểm:** Tòa thị chính Griggston, phòng 5A ở tầng hầm thứ nhất; phòng có lối đi đầy đủ cho người khuyết tật.\n\nĐại diện Văn phòng Quy hoạch Giao thông cùng nhà thầu và chuyên gia tư vấn dự án sẽ trình bày tổng quan công việc, sau đó nhận câu hỏi của người dân. Mọi thắc mắc hoặc nhận xét về hai dự án có thể gửi đến chuyên viên quy hoạch cấp cao Lois Oliveira tại l.oliveira@griggstoncity.gov.\n\n---\n\n**Tài liệu 2 — Thư của Tòa thị chính Griggston, ngày 15 tháng 2**\n\nKính gửi ông Shawn Davis,\n\nTôi viết thư để bày tỏ lòng cảm kích về công việc xuất sắc mà công ty ông đã thực hiện trong dự án xây dựng Marigold Street. Ông và **đội ngũ 10 người** luôn đúng giờ, chuyên nghiệp và hiểu biết.\n\nNgười dân và chủ doanh nghiệp quanh khu vực đã phản hồi rất tích cực, đặc biệt khen ngợi những lối đi lát gạch đẹp mắt được lắp đặt. Đây là lần thứ năm chúng tôi thuê công ty ông; tôi rất vui vì doanh nghiệp của ông và Thành phố Griggston tiếp tục duy trì quan hệ hợp tác. Tôi đã **chuyển khoản thanh toán cho dịch vụ theo hợp đồng vào tài khoản ngân hàng của công ty ông** như thỏa thuận thông thường.\n\nVăn phòng tôi cũng đang thực hiện một dự án tương tự tại Rosedale Avenue. Chi tiết sẽ được xác nhận sau vài tuần, nhưng tôi muốn cân nhắc giao việc cho công ty ông. Khối lượng và thời gian gần tương đương dự án Marigold Street, có thể bắt đầu vào cuối tháng 4. Xin cho biết ông có quan tâm không.\n\nMột lần nữa xin cảm ơn. Hy vọng chúng ta tiếp tục hợp tác.\n\nTrân trọng,  \nLois Oliveira  \nChuyên viên quy hoạch cấp cao","translationStatus":"reviewed"},{"id":"h3/test04/181_BBADB.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 181–185","questions":{"181":"B","182":"B","183":"A","184":"D","185":"B"},"image":"data/h3/test04/181_BBADB.png","markedImage":"marked/h3/test04/181_BBADB.png","translation":"**Tài liệu 1 — Carlson Counters**\n\nMặt bàn trong nhà hoặc nơi làm việc của bạn đã cũ hay lỗi thời? Hãy để Carlson Counters mang diện mạo hoàn toàn mới cho nhà bếp, văn phòng, phòng tắm hoặc quầy lễ tân.\n\nChúng tôi có rất nhiều kiểu dáng, màu sắc và vật liệu với mức giá thuộc hàng tốt nhất thành phố:\n\n- Laminate: từ 80 đô la/m².\n- Gạch: từ 90 đô la/m².\n- Đá granite: từ 130 đô la/m².\n- Đá cẩm thạch: từ 150 đô la/m².\n\nCó thể yêu cầu tùy chỉnh tất cả các loại trên với giá cao hơn nếu đặt trước ít nhất 15 ngày. Trong trường hợp đó, Carlson Counters tính 120 đô la/m² cho laminate và gạch tùy chỉnh, 190 đô la/m² cho đơn hàng chuyên biệt bằng granite hoặc cẩm thạch. Mỗi đơn tùy chỉnh cần đặt cọc 50%.\n\nChỉ cần gọi 555-4933 hoặc gửi e-mail đến rogcar@carlsoncounters.com để yêu cầu khảo sát tại chỗ. Chủ doanh nghiệp Roger Carlson sẽ đến đo đạc sơ bộ và bàn về phương án lắp đặt. **Ông cũng mô tả các vật liệu chúng tôi bán và cung cấp dự toán chi phí cho từng loại mặt bàn**. Sau khi bạn lựa chọn, ông Carlson sẽ lập tức sắp xếp thi công và thông báo thời gian hoàn tất.\n\n---\n\n**Tài liệu 2 — E-mail của Blaire Thomson, ngày 29 tháng 5**\n\nKính gửi ông Carlson,\n\nCảm ơn ông đã ghé nhà tôi chiều nay để xem nhà bếp. Tôi đánh giá cao thông tin ông cung cấp vì chúng xác nhận những gì tờ giới thiệu đã nêu.\n\nTôi đã bàn về các vật liệu ông đề xuất với chồng. Cả hai đều hấp dẫn, nhưng sau khi trao đổi, chúng tôi quyết định chọn **đá cẩm thạch cho mặt bàn**. Xin gửi tổng dự toán cho dự án khi ông có thời gian.\n\nÔng cũng nói trong chuyến thăm rằng mặt bàn tùy chỉnh như loại chúng tôi yêu cầu cần đặt riêng và có thể cần thêm thời gian giao hàng. Xin cho biết dự kiến bao lâu hàng sẽ đến.\n\nMong nhận được phản hồi và cảm ơn dịch vụ tuyệt vời của ông.\n\nTrân trọng,  \nBlaire Thomson","translationStatus":"reviewed"},{"id":"h3/test04/186_CBBAC.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 186–190","questions":{"186":"C","187":"B","188":"B","189":"A","190":"C"},"image":"data/h3/test04/186_CBBAC.png","markedImage":"marked/h3/test04/186_CBBAC.png","translation":"**Tài liệu 1 — Trường Thiết kế Regency Scotia tổ chức triển lãm trang phục hoàng gia lịch sử**\n\n*Threads of Royal History*, khai mạc vào thứ Sáu, là triển lãm mới nhất của Trường Thiết kế Regency Scotia (RSSD) tại Glasgow và là món quà dành cho người yêu trang phục cổ. Nhà trường mượn 52 bộ trang phục của các vị vua, hoàng hậu trong lịch sử lẫn hiện tại từ các bảo tàng trên thế giới. Đặc biệt đáng chú ý là những món trang sức và phụ kiện đội đầu 4.000 năm tuổi mượn từ Bảo tàng Cairo ở Ai Cập cùng nhiều áo choàng lộng lẫy từ Bảo tàng Tử Cấm Thành tại Bắc Kinh. Ngoài ra, sinh viên thời trang của trường đã tạo 38 bộ trang phục mô phỏng. Tất cả được trưng bày đẹp mắt trên ma-nơ-canh thiết kế riêng.\n\nTriển lãm kéo dài một tháng và kết thúc ngày 30 tháng 4. Vé thường là 6,50 bảng, nhưng **sinh viên và giảng viên RSSD được vào miễn phí**. Người cao tuổi trả 5 bảng, trẻ từ 10 tuổi trở xuống trả 3,50 bảng. Có thể hỏi giá vé nhóm học sinh qua số 555-3400. Không gian triển lãm nằm tại Leighton Hall của trường, mở cửa **10:00 sáng–8:00 tối, từ thứ Hai đến thứ Năm**.\n\n---\n\n**Tài liệu 2 — E-mail của Rhoda Augustine, ngày 20 tháng 4**\n\nChào Larry,\n\nTôi đọc một bài báo về triển lãm hiện tại của RSSD và đang nghĩ đến việc đưa học sinh hai lớp mỹ thuật buổi sáng đi tham quan thực tế. Tôi đã gọi hỏi giá vé nhóm học sinh; nếu có từ 30 học sinh trở lên, phí vào cửa giảm đáng kể còn 4 bảng. Tuy nhiên, cả hai lớp của tôi chỉ có tổng cộng 24 em, nên tôi muốn hỏi **anh và học sinh của anh có muốn tham gia cùng không**. Xe buýt của trung tâm cộng đồng chở được 55 người nên đủ chỗ. Triển lãm có vẻ rất thú vị và tôi nghĩ học sinh sẽ học được nhiều điều. Không gấp, nhưng xin cho biết trước thứ Sáu để tôi đặt lịch tham quan.\n\nCảm ơn!  \nRhoda\n\n---\n\n**Tài liệu 3 — Vé nhóm đã thanh toán bằng tiền mặt**\n\n- Triển lãm: *Threads of Royal History*.\n- Ngày: 28 tháng 4; vé chỉ dùng trong ngày ghi trên vé.\n- Trường: Terrington Secondary School.\n- Giá: vé nhóm học sinh.\n- Số người: 48.\n- Trưởng đoàn: Rhoda Augustine, Larry Dent.\n\n**Mọi khách tham quan phải qua chốt an ninh trước khi vào. Nghiêm cấm chụp ảnh và không được chạm vào bất kỳ vật trưng bày nào.**","translationStatus":"reviewed"},{"id":"h3/test04/191_ACDDB.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 191–195","questions":{"191":"A","192":"C","193":"D","194":"D","195":"B"},"image":"data/h3/test04/191_ACDDB.png","markedImage":"marked/h3/test04/191_ACDDB.png","translation":"**Tài liệu 1 — Người dân Auckland giờ có thể tiết kiệm với Wheel-Pals!**\n\nWheel-Pals, ứng dụng đi chung xe phổ biến nhất thế giới, đã có mặt tại Auckland! Hãy tải ứng dụng ngay trên điện thoại, thiết bị hoặc máy tính và khám phá việc tiết kiệm chi phí đi lại dễ dàng đến mức nào. Ứng dụng kết nối bạn với những người dùng khác trong khu vực muốn đi chung xe vào những thời điểm cụ thể. Tất cả thành viên đều trải qua quy trình sàng lọc và có thể đăng nhận xét về hành khách, tài xế khác. Với gói cơ bản chỉ từ 6 đô la mỗi tháng, Wheel-Pals chắc chắn sẽ phổ biến tại Auckland như ở Brisbane, Sydney và Melbourne. Truy cập www.wheelpals.com để biết thêm chi tiết.\n\n---\n\n**Tài liệu 2 — Đánh giá của Jason Diaz**\n\nWheel-Pals mới ra mắt dịch vụ ở Auckland, và vì từng dùng ứng dụng khi sống tại Brisbane nên tôi là một trong những người đăng ký đầu tiên. Trước đây tôi mua gói cơ bản vì có đủ dịch vụ để ghép nhóm đi chung xe với tài xế hoặc người đi gần đó. Tuy nhiên, **tôi không nghĩ Wheel-Pals đã quảng bá đủ cho đợt ra mắt tại khu vực này; đôi khi tôi khó tìm được người đi chung xe**. Ở Brisbane, tôi chỉ phải tự lái xe đi làm một hoặc hai lần mỗi tuần, nhưng giờ phải làm vậy thường xuyên hơn. Ngoài ra, rất ít người tôi quen tại địa phương biết đến ứng dụng.\n\n---\n\n**Tài liệu 3 — E-mail từ Adele Simmonds, ngày 29 tháng 5**\n\nKính gửi ông Diaz,\n\nTôi là Adele Simmonds, đại diện quan hệ công chúng của Wheel-Pals. Gần đây tôi đọc được bài đánh giá trực tuyến của ông về ứng dụng. Thay mặt công ty, cảm ơn ông đã dành thời gian **để lại nhận xét**. Chúng tôi ghi nhận những lo ngại của ông và đã quyết định thực hiện các bước để quảng bá chương trình sâu rộng hơn trong khu vực.\n\nĐể cảm ơn bài đánh giá, ông sẽ nhận được điểm có thể dùng như tiền mặt để thanh toán phí đăng ký hoặc bất kỳ dịch vụ nào khác của chúng tôi. Điểm sẽ hiển thị trong ứng dụng vào lần đăng nhập tiếp theo.\n\nMột lần nữa xin cảm ơn và hy vọng ông tiếp tục thấy Wheel-Pals hữu ích.\n\nTrân trọng,  \nAdele Simmonds  \nNhân viên quan hệ công chúng khu vực, Wheel-Pals Inc.","translationStatus":"reviewed"},{"id":"h3/test04/196_CBACB.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 196–200","questions":{"196":"C","197":"B","198":"A","199":"C","200":"B"},"image":"data/h3/test04/196_CBACB.png","markedImage":"marked/h3/test04/196_CBACB.png","translation":"**Tài liệu 1 — Dịch vụ của Coriander Fine Dining**\n\nCoriander Fine Dining cung cấp nhiều dịch vụ cho các nhóm:\n\n**Giao hàng:** Miễn phí với đơn trên 80 đô la. Đơn dưới mức này chịu phí giao 5 đô la. **Chỉ giao trong phạm vi thành phố Washington, D.C.**\n\n**Phục vụ tiệc:** Chúng tôi có thể phục vụ đám cưới, tiệc và sự kiện doanh nghiệp hoặc cá nhân tại bất kỳ địa điểm nào. Chúng tôi sẽ cùng bạn xây dựng thực đơn cho nhóm tối đa 800 người. Đĩa, dụng cụ ăn và đồ thủy tinh cũng có thể được cung cấp với phụ phí. Liên hệ quản lý dịch vụ tiệc Cecilia Shiraz tại ceshiraz@corianderfinedining.com để đặt chỗ.\n\n**Thuê địa điểm:** Hãy để chúng tôi tổ chức buổi gặp mặt tại phòng chức năng riêng. Phòng phục vụ nhóm ở mọi quy mô, tối đa 80 thực khách. Liên hệ Raj Kapoor tại rajkapoor@corianderfinedining.com để hỏi ngày trống và đặt sự kiện.\n\n---\n\n**Tài liệu 2 — E-mail của Steven Potter, ngày 12 tháng 6**\n\nKính gửi cô Shiraz,\n\nTôi là Steven Potter, làm việc cho Spartan Tires. Tôi từng dự bữa tiệc do cô phục vụ nhân lễ khai trương trụ sở Lucas Industries. Gần đây chúng tôi đạt thỏa thuận hợp tác với một nhà sản xuất tại Ấn Độ và một đoàn đại diện của họ sẽ đến vào tuần tới để hoàn tất thỏa thuận. Chúng tôi muốn tổ chức một bữa ăn sau khi hợp đồng được ký vào thứ Sáu, ngày 18 tháng 6, tại trụ sở công ty.\n\nMọi người sẽ sẵn sàng ăn tối lúc 6:30 tối. Tính cả đại diện bên chúng tôi, tổng cộng có 30 người. Tôi muốn thực đơn buffet gồm thịt gà, cá, rau, món tráng miệng và salad. Chúng tôi có thể tự thu xếp đồ uống. **Chúng tôi không có đĩa hoặc dụng cụ ăn nên cũng cần những vật dụng này.** Xin cho biết cô có thể phục vụ ngày đó không và chi phí là bao nhiêu.\n\nTrân trọng,  \nSteven Potter\n\n---\n\n**Tài liệu 3 — Spartan Tires hợp tác với Maha-Rubber**\n\n*Tác giả: Endi Wendall*\n\nSpartan Tires hôm qua thông báo sẽ hoàn tất thỏa thuận với nhà sản xuất Maha-Rubber có trụ sở tại Ấn Độ vào ngày 18 tháng 6. Công ty sẽ sản xuất lốp xe dưới thương hiệu Spartan Tires. Spartan Tires có 38 chi nhánh trên toàn quốc, trung bình mở thêm bốn cơ sở mới mỗi năm. Tuy nhiên, công ty không tự sản xuất phụ kiện hoặc linh kiện mà chỉ **kinh doanh những mặt hàng do các công ty khác sản xuất**.\n\nTổng giám đốc Carlos Gregario cho biết: “Chúng tôi không có cơ sở để tự sản xuất lốp. Việc hợp tác với Maha-Rubber sẽ giúp chúng tôi làm điều đó với chi phí hợp lý.” Những sản phẩm mới đầu tiên sẽ có mặt tại các cửa hàng Spartan Tires trên toàn quốc vào ngày 1 tháng 8 năm tới.","translationStatus":"reviewed"},{"id":"h3/test05/131_BADC.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 131–134","questions":{"131":"B","132":"A","133":"D","134":"C"},"image":"data/h3/test05/131_BADC.png","markedImage":"marked/h3/test05/131_BADC.png","translation":"**Chủ đề: Tiếp thị sản phẩm dầu gội**\n\nJennifer thân mến,\n\nTôi vừa gặp Robert Pierson, trưởng bộ phận PPJ Marketing mới. Ông ấy rất **tận tâm** hỗ trợ chúng ta cập nhật diện mạo sản phẩm. Giống tôi, ông cho rằng các dòng dầu gội đã đến lúc cần xây dựng lại thương hiệu và việc tiếp thị cho nhóm người trẻ, sống tự do là một ý tưởng tuyệt vời. **Hiện tại chưa có quảng cáo dầu gội nào của chúng ta nhắm đến nhóm khách hàng này.**\n\nVì thế, ông cho rằng nghiên cứu nhu cầu của người tiêu dùng từ 18 đến 24 tuổi sẽ hữu ích cho việc phát triển quảng cáo truyền hình. Thông tin này giúp chúng ta **nhắm mục tiêu** hiệu quả vào nhóm đó. Trong vài tuần tới, ông và đội ngũ sẽ xây dựng ý tưởng cho các quảng cáo dài 30 giây rồi **trình** chúng cho chúng ta xem xét.\n\nRick","translationStatus":"reviewed"},{"id":"h3/test05/135_DCCB.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 135–138","questions":{"135":"D","136":"C","137":"C","138":"B"},"image":"data/h3/test05/135_DCCB.png","markedImage":"marked/h3/test05/135_DCCB.png","translation":"**Chủ đề: Đặt chỗ số JHK2105**\n\nKính gửi bộ phận Chăm sóc khách hàng,\n\n**Tôi muốn hủy chuyến bay và được hoàn lại tiền vé.** Tôi xin lỗi vì sự bất tiện, nhưng một việc cá nhân phát sinh đang **ngăn cản** tôi bay đến Budapest theo kế hoạch. Nếu có thể, xin quý vị **xử lý nhanh** yêu cầu hoàn tiền giúp tôi.\n\nTôi hy vọng sẽ đặt một chuyến bay khác đến Sydney trong chưa đầy năm ngày nữa. Tôi hiểu rằng mình sẽ phải trả một **khoản phí** cho thay đổi này; quý vị có thể khấu trừ phí vào số tiền được hoàn lại.\n\nXin cho biết nếu cần thêm thông tin.\n\nTrân trọng,  \nAlex Hogan","translationStatus":"reviewed"},{"id":"h3/test05/139_BCDA.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 139–142","questions":{"139":"B","140":"C","141":"D","142":"A"},"image":"data/h3/test05/139_BCDA.png","markedImage":"marked/h3/test05/139_BCDA.png","translation":"**Dịch vụ kế toán Johnson and Eversham**\n\nNếu bạn sở hữu doanh nghiệp nhỏ hoặc vừa và đang tìm dịch vụ kế toán chuyên nghiệp, Johnson and Eversham Accounting có thể giúp đỡ.\n\nChúng tôi **cung cấp** chuyên môn cho nhiều loại hình doanh nghiệp. Thành lập cách đây ba thập niên với việc hỗ trợ các công ty nhỏ tại Manchester, New Hampshire, công ty đã liên tục mở rộng phạm vi hoạt động. **Hiện chúng tôi có 60 văn phòng tại các thành phố trên toàn quốc.**\n\nTất cả kế toán viên đều được Tổ chức Kế toán viên Công chứng **chứng nhận**, bảo đảm khách hàng luôn nhận dịch vụ chất lượng cao. Mỗi nhân viên **chuyên về** một lĩnh vực kế toán doanh nghiệp riêng, nên chúng tôi có thể xử lý mọi vấn đề tài chính của bạn.\n\nĐể biết thêm thông tin, gọi 555-6277 hoặc truy cập www.jeaccounting.com.","translationStatus":"reviewed"},{"id":"h3/test05/143_BDCB.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 143–146","questions":{"143":"B","144":"D","145":"C","146":"B"},"image":"data/h3/test05/143_BDCB.png","markedImage":"marked/h3/test05/143_BDCB.png","translation":"**Thông báo về đề xuất tăng phí Hiệp hội Chủ nhà**\n\nTại cuộc họp gần nhất, hội đồng được yêu cầu xem xét tăng nhẹ mức phí. **Sau khi** thảo luận, hội đồng đề xuất tăng 25 đô la mỗi tháng, từ 375 lên 400 đô la, áp dụng từ ngày 1 tháng 7.\n\nHội đồng cho rằng việc này hợp lý vì nhiều nguyên nhân. Thứ nhất, khoản tiền bổ sung sẽ đóng góp cho các **chi phí** quan trọng, chẳng hạn lắp đặt hệ thống an ninh mới trong nhà để xe vào năm tới. Thứ hai, tiền sẽ bù cho giá khí đốt tự nhiên đang tăng. **Mùa đông năm ngoái, chúng ta phải trả nhiều hơn bình thường vì giá khí đốt tăng mạnh.**\n\nThời điểm tăng phí cũng có vẻ hợp lý **vì** đã bốn năm chưa có lần tăng nào. Người thuê nhà được mời bỏ phiếu về đề xuất tại cuộc họp Hiệp hội Chủ nhà vào tháng 6.\n\nJordan Roper  \nQuản lý Kế toán","translationStatus":"reviewed"},{"id":"h3/test05/147_BA.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 147–148","questions":{"147":"B","148":"A"},"image":"data/h3/test05/147_BA.png","markedImage":"marked/h3/test05/147_BA.png","translation":"**Green Wave Consulting Services – Tiết kiệm cho hành tinh và cho chính bạn**\n\nChúng ta đều biết cần giảm lượng khí nhà kính thải vào khí quyển, nhưng ít người nhận ra **nhà ở cũng là một trong những nguồn phát thải lớn nhất**. Green Wave cung cấp các giải pháp đơn giản vừa giảm tác động môi trường vừa tiết kiệm tiền.\n\nCác thay đổi gồm:\n\n- Lắp vật liệu cách nhiệt cho tường.\n- Trang bị bình nước nóng mới, hiệu suất cao.\n- Chuyển sang bóng đèn tiết kiệm năng lượng.\n- Lắp rèm cửa giúp giữ nhiệt.\n\nHãy gọi 555-9974 để **sắp xếp buổi gặp với một chuyên viên tư vấn** tại nhà. Buổi tư vấn hoàn toàn miễn phí; trong vòng ba ngày làm việc, khách hàng sẽ nhận kế hoạch cá nhân hóa giúp ngôi nhà tiết kiệm năng lượng hơn.","translationStatus":"reviewed"},{"id":"h3/test05/149_BD.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 149–150","questions":{"149":"B","150":"D"},"image":"data/h3/test05/149_BD.png","markedImage":"marked/h3/test05/149_BD.png","translation":"**Tin nhắn giữa các nhân viên môi giới bất động sản**\n\n**Marge Bledsoe – 11:05:** Tôi có khách muốn xem căn nhà đăng bán ở 78 Crescent Lane nhưng hôm nay kín lịch. Chiều nay ai rảnh không?\n\n**Evan Clark – 11:08:** Tôi có thể đưa khách đến lúc 2 giờ 30. Sau đó tôi còn một buổi xem nhà gần đó.\n\n**Julia Anderson – 11:14:** Có phải Eva Teal không? Cô ấy gọi và nói muốn tìm căn hai phòng ngủ ở trung tâm.\n\n**Marge Bledsoe – 11:15:** Đúng rồi. Evan có thể lo việc đó. Tôi cần cô giúp với một khách khác.\n\n**Evan Clark – 11:17:** Sao tôi không giới thiệu luôn căn nhà gần đó? Chỉ cách vài dãy phố và cũng có hai phòng ngủ.\n\n**Marge Bledsoe – 11:18:** **Ý hay đấy.** **Tôi sẽ hỏi xem cô ấy có quan tâm không.**","translationStatus":"reviewed"},{"id":"h3/test05/151_DB.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 151–152","questions":{"151":"D","152":"B"},"image":"data/h3/test05/151_DB.png","markedImage":"marked/h3/test05/151_DB.png","translation":"**Chủ đề: Thông báo về chuyến du lịch Đông Nam Á**\n\nKính gửi ông Fletcher,\n\nTropical Tours buộc phải **hủy chuyến đi Đông Nam Á** mà ông đặt từ ngày 3 đến ngày 10 tháng 3. Một cơn bão lớn vừa gây thiệt hại nghiêm trọng trong khu vực; sân bay tại Jakarta, Singapore và Kuala Lumpur đang đóng cửa, dự kiến cần bốn ngày để hàng không trở lại bình thường.\n\nChúng tôi có thể hoàn lại toàn bộ tiền vào thẻ tín dụng đã dùng để đặt chuyến đi. Hoặc, chúng tôi có thể đặt lại chuyến đi vào ngày khác; nếu chọn phương án này, nên chờ ít nhất đến tháng 5. Khi đi vào thời điểm sau, ông và vợ sẽ được **nâng hạng phòng khách sạn tại tất cả điểm dừng**.\n\nChúng tôi chân thành xin lỗi vì việc hủy vào phút chót.\n\nBộ phận Chăm sóc khách hàng  \nTropical Tours","translationStatus":"reviewed"},{"id":"h3/test05/153_AD.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 153–154","questions":{"153":"A","154":"D"},"image":"data/h3/test05/153_AD.png","markedImage":"marked/h3/test05/153_AD.png","translation":"**Hướng dẫn an toàn đối với sản phẩm thịt**\n\nSản phẩm này được làm từ thịt đã được Ban An toàn Thực phẩm Quốc gia kiểm tra và thông qua. Tuy nhiên, thực phẩm vẫn có thể nhiễm vi khuẩn gây bệnh nếu xử lý hoặc nấu không đúng cách.\n\nĐể bảo đảm an toàn:\n\n- Bảo quản thịt lạnh ngay sau khi mua: tủ đông tối thiểu âm 18°C và tủ lạnh 4°C.\n- **Không rã đông thịt ở môi trường trên 20°C**.\n- Để thịt sống tách biệt với thực phẩm khác.\n- Rửa mọi bề mặt tiếp xúc với thịt, cùng tay và dụng cụ nấu.\n- Nấu kỹ và giữ ấm trước khi dùng.","translationStatus":"reviewed"},{"id":"h3/test05/155_ADB.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 155–157","questions":{"155":"A","156":"D","157":"B"},"image":"data/h3/test05/155_ADB.png","markedImage":"marked/h3/test05/155_ADB.png","translation":"**Stretch lên kế hoạch mở rộng**\n\nStretch Corporation thông báo kế hoạch mở rộng tại một địa điểm lớn hơn ở ngoại ô thành phố. Trụ sở của công ty trang phục thể thao vẫn ở góc đường Dupont và Beverly, nhưng cơ sở sản xuất sẽ chuyển đến Haverford, cách trung tâm khoảng 15 km.\n\nGiám đốc Alex Cruz cho biết số người yêu thích tập thể dục đã tăng đáng kể trong vài năm qua. Việc chuyển địa điểm giúp công ty đáp ứng nhu cầu và tiếp tục cung cấp trang phục, thiết bị chất lượng cho **những người đam mê thể dục**.\n\nViệc chuyển đi cũng là tin tốt cho kinh tế địa phương. **Địa điểm mới dự kiến tạo thêm 150 việc làm cho cư dân Haverford.** Dù sản phẩm nội địa có giá cao hơn hàng sản xuất ở nước ngoài, khách hàng vẫn sẵn sàng trả thêm. Vì vậy, công ty sẽ giữ sản xuất trong khu vực và không thuê gia công ở nơi khác.","translationStatus":"reviewed"},{"id":"h3/test05/158_CBD.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 158–160","questions":{"158":"C","159":"B","160":"D"},"image":"data/h3/test05/158_CBD.png","markedImage":"marked/h3/test05/158_CBD.png","translation":"**Fashion-It tuyển dụng tại trụ sở mới**\n\nFashion-It đang nhận hồ sơ cho các vị trí tại trụ sở mới. Đây là một trong những chuỗi bán lẻ quần áo nổi tiếng nhất cả nước, cung cấp mức lương và phúc lợi tương đương hoặc tốt hơn đối thủ, môi trường làm việc hiện đại và đội ngũ hỗ trợ.\n\nCác vị trí gồm 5 kỹ thuật viên bảo trì tòa nhà, 1 chuyên viên phân tích tồn kho, 6 nhân viên nhận hàng, vận chuyển và kho, 1 quản lý sản phẩm và 2 nhân viên an ninh.\n\nỨng viên đăng nhập www.fashionit.com/jobs, chọn vị trí và điền đơn. Sau khi nộp, ứng viên nhận email xác nhận; người được chọn phỏng vấn sẽ được liên hệ trong vòng 14 ngày. Hồ sơ được lưu trong 12 tháng.","translationStatus":"reviewed"},{"id":"h3/test05/161_BDC.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 161–163","questions":{"161":"B","162":"D","163":"C"},"image":"data/h3/test05/161_BDC.png","markedImage":"marked/h3/test05/161_BDC.png","translation":"**Chủ đề: Sắp xếp chuyến đi dự hội nghị**\n\nJason thân mến,\n\nTôi được mời phát biểu tại Hội nghị Bất động sản Great Lakes từ ngày 18 đến 21 tháng 6 tại Milwaukee. Hãy đặt chuyến bay khởi hành một ngày trước hội nghị; vé hạng phổ thông là được vì chuyến bay từ Chicago khá ngắn.\n\nTrong thời gian ở vùng Trung Tây, tôi muốn ghé chi nhánh Minneapolis để xem quản lý khu vực mới Beryl Twispe thích nghi ra sao. Hãy **liên hệ và hỏi xem bà ấy có thời gian tiếp tôi không**. Nếu có, tôi thích đi tàu đến Minneapolis; nếu hành trình quá dài, hãy đặt chuyến bay rời Milwaukee.\n\nTôi muốn rời Milwaukee vào ngày hội nghị kết thúc và sẽ cần chỗ ở tại Minneapolis. Ban tổ chức Brenda Orson sẽ lo khách sạn, phương tiện địa phương và bữa ăn của tôi tại Milwaukee. Tôi dự định rời Milwaukee **ngày 21 tháng 6**, đến Minneapolis và rời nơi đó vào ngày hôm sau, 22 tháng 6.\n\nAngela Johnstone","translationStatus":"reviewed"},{"id":"h3/test05/164_CDAD.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 164–167","questions":{"164":"C","165":"D","166":"A","167":"D"},"image":"data/h3/test05/164_CDAD.png","markedImage":"marked/h3/test05/164_CDAD.png","translation":"**Trò chuyện với Apex Cable TV**\n\n**Alyssa Munro – 18:43:** Tôi cần trợ giúp để truy cập phim qua Movies On Demand.\n\n**Tom Estrada – 18:45:** Có vẻ cô chưa đăng ký dịch vụ đó.\n\n**Alyssa – 18:45:** Tôi tưởng nó nằm trong gói thuê bao hiện tại.\n\n**Tom – 18:46:** Cô đang dùng gói tiêu chuẩn; gói này **chỉ cho quyền truy cập hạn chế vào các kênh phim**.\n\n**Alyssa – 18:47:** Tôi có cần đổi gói nếu muốn Movies On Demand không?\n\n**Tom – 18:47:** Có thể thêm dịch vụ vào gói hiện tại với phí 8,99 đô la mỗi tháng.\n\n**Alyssa – 18:48:** Anh có cần số thẻ tín dụng không? Tôi không mang theo.\n\n**Tom – 18:49:** Không sao, phí sẽ được cộng vào hóa đơn từ tháng tới.\n\n**Alyssa – 18:50:** Được, hãy tiến hành.","translationStatus":"reviewed"},{"id":"h3/test05/168_ABBB.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 168–171","questions":{"168":"A","169":"B","170":"B","171":"B"},"image":"data/h3/test05/168_ABBB.png","markedImage":"marked/h3/test05/168_ABBB.png","translation":"**Thỏa mãn sở thích đồ ngọt tại Katie’s Cupcakes**\n\nKatie’s Cupcakes tại 637 Elm Street, trung tâm Livingston, có hơn 50 cách kết hợp hương vị bánh, nhân và kem phủ. Cửa hàng phục vụ cả vị truyền thống lẫn hương vị lạ như chanh và bí ngô. Gần một nửa sản phẩm ít đường và ít béo; theo yêu cầu, bánh có thể không chứa đường, gluten, lactose hoặc hạt, hay làm riêng cho người tiểu đường.\n\nCửa hàng có thể tùy chỉnh khay bánh cupcake cho đám cưới, sinh nhật và các dịp khác theo bất kỳ màu sắc, hương vị nào. Khách đặt khay bánh trong tháng 6 được **giảm 10%**.\n\nKatie’s Cupcakes mở cửa từ thứ Hai đến thứ Bảy, 8 giờ sáng đến 4 giờ chiều. **Luôn có bánh mẫu miễn phí để khách nếm thử.**","translationStatus":"reviewed"},{"id":"h3/test05/172_CBAD.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 172–175","questions":{"172":"C","173":"B","174":"A","175":"D"},"image":"data/h3/test05/172_CBAD.png","markedImage":"marked/h3/test05/172_CBAD.png","translation":"**Everything Video mở cửa hàng mới**\n\nEverything Video, đơn vị tiên phong trên thị trường đồ điện tử đã qua sử dụng, vừa mở cửa hàng thứ tư tại San Diego, sau các chi nhánh Anaheim, Los Angeles và San Bernardino.\n\nCửa hàng mới lớn nhất hệ thống, cung cấp hàng nghìn trò chơi cho nhiều nền tảng từ thập niên 1980, máy chơi game nhỏ, máy cầm tay, thiết bị cổ điển, phim cũ trên băng và DVD.\n\nNhà sáng lập Kendra Brown cho rằng dù nhiều người chuyển sang chơi và xem trực tuyến, nhu cầu sở hữu đồ vật thật lại tăng vì giá trị kỷ niệm. Công ty cũng mua lại trò chơi, phim và thiết bị từ khách, trả bằng tiền mặt hoặc tín dụng dùng tại mọi chi nhánh.\n\nĐến ngày 1 tháng 8, khách mua từ ba trò chơi trở lên tại chi nhánh San Diego được giảm 20%.","translationStatus":"reviewed"},{"id":"h3/test05/176_BCABB.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 176–180","questions":{"176":"B","177":"C","178":"A","179":"B","180":"B"},"image":"data/h3/test05/176_BCABB.png","markedImage":"marked/h3/test05/176_BCABB.png","translation":"**Tài liệu 1 — Biểu mẫu liên hệ trực tuyến của Cyprus Software**\n\nNếu gặp bất kỳ khó khăn nào với sản phẩm của chúng tôi, xin hãy cho chúng tôi biết. Chỉ cần điền thông tin liên hệ bên dưới, viết một tin nhắn ngắn rồi nhấn “Gửi”. Nhân viên sẽ phản hồi sớm nhất có thể. Quý khách cũng có thể truy cập www.cyprussoftware.com/help để trò chuyện trực tuyến hoặc xem diễn đàn khắc phục sự cố, nơi có câu trả lời từ nhân viên và những người dùng khác.\n\n**Tên:** Amos Polson  \n**E-mail:** ampol@digimail.com  \n**Điện thoại:** (509) 555-3984\n\nGần đây tôi đã mua và tải từ trang web của quý công ty một chương trình chỉnh sửa ảnh có tên Picto-Master. Tôi đã thử cài đặt, nhưng **ở cuối quá trình, một cửa sổ bật lên thông báo có lỗi**. Khi mua phần mềm, tôi không được báo rằng điều này có thể xảy ra nên không biết phải tiếp tục cài đặt thế nào.\n\nTôi đã kiểm tra diễn đàn trực tuyến để tìm giải pháp nhưng không thấy bài đăng nào về đúng vấn đề này.\n\nXin hãy liên hệ với tôi sớm nhất có thể vì tôi cần chương trình cho một dự án nhiếp ảnh đang thực hiện.\n\nXin cảm ơn.\n\n---\n\n**Tài liệu 2 — E-mail từ bộ phận dịch vụ khách hàng**\n\n**Đến:** Amos Polson <ampol@digimail.com>  \n**Từ:** Bộ phận Dịch vụ khách hàng <clientserv@cyprussoftware.com>  \n**Chủ đề:** Thắc mắc của quý khách  \n**Ngày:** 17 tháng 9\n\nKính gửi ông Polson,\n\nCảm ơn ông đã gửi tin nhắn và mua một sản phẩm của Cyprus Software. Trước hết, tôi xin lỗi vì sự bất tiện này.\n\nNhìn chung, sự cố ông mô tả chỉ xảy ra khi **hệ điều hành của người dùng không tương thích với phần mềm**. Xin hãy kiểm tra danh sách hệ điều hành được hỗ trợ trên trang web. Nếu hệ điều hành của ông không có trong danh sách, ông cần chạy một chương trình sửa lỗi riêng để cài Picto-Master. Sau khi chạy chương trình này, ông có thể thử tải Picto-Master lại. Chương trình sửa lỗi cũng có thể được tải từ trang web của chúng tôi.\n\nNếu tiếp tục gặp cùng lỗi, hãy bảo đảm rằng ông đã tải đúng tệp từ trang web, không phải phiên bản dùng cho thử nghiệm của phần mềm chỉnh sửa ảnh.\n\nNếu cần hỗ trợ thêm, xin đừng ngần ngại trả lời e-mail này hoặc gọi đường dây nóng hoạt động 24 giờ theo số 1-800-555-3300.","translationStatus":"reviewed"},{"id":"h3/test05/181_DACBB.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 181–185","questions":{"181":"D","182":"A","183":"C","184":"B","185":"B"},"image":"data/h3/test05/181_DACBB.png","markedImage":"marked/h3/test05/181_DACBB.png","translation":"**Tài liệu 1 — Lịch học bơi**\n\nBắt đầu từ ngày 16 tháng 7, Hiệp hội Chủ nhà Chung cư Cornwood phối hợp với Irwindale Athletics Club (IAC) tổ chức một loạt lớp học bơi trong mùa hè.\n\n| Độ tuổi và trình độ | Huấn luyện viên | Lịch học | Học phí 10 buổi |\n| --- | --- | --- | ---: |\n| Mới bắt đầu, 6–12 tuổi | Eric Moss | Thứ Hai và thứ Năm, 2–6 giờ chiều | 100 đô la |\n| Nâng cao, 6–12 tuổi | **Ty Warren** | Thứ Tư và thứ Sáu, 8–10 giờ sáng | 150 đô la |\n| Mới bắt đầu, 12–17 tuổi | Eric Moss | Thứ Tư và thứ Sáu, 2–6 giờ chiều | 150 đô la |\n| Nâng cao, 12–17 tuổi | Kay Sanders | Thứ Bảy, 2–6 giờ chiều | 200 đô la |\n| Người lớn, từ 18 tuổi | Liza Simmons | Thứ Bảy, 9–11 giờ sáng | 250 đô la |\n\nPhí sử dụng hồ bơi hằng tháng 20 đô la đã được tính trong học phí.\n\nĐể tham gia, vui lòng điền phiếu đăng ký tại văn phòng hành chính và thanh toán khoản phí tương ứng. Thành viên IAC hoặc nhóm từ bốn người trở lên được giảm 15% học phí. Nếu muốn hỏi về lớp bơi hoặc các hoạt động khác dành cho cư dân trong mùa này, hãy liên hệ Stan Macaulay tại s.macaulay@cornwoodhoa.org.\n\n---\n\n**Tài liệu 2 — E-mail của Allan Carpenter**\n\n**Đến:** Stan Macaulay <s.macaulay@cornwoodhoa.org>  \n**Từ:** Allan Carpenter <alcarp@diamondmail.com>  \n**Chủ đề:** Các lớp học bơi  \n**Ngày:** 9 tháng 7\n\nKính gửi ông Macaulay,\n\nTôi là Allan Carpenter và vừa chuyển đến Chung cư Cornwood. Tôi có hai con gái tuổi thiếu niên, Tamara và Kristin, đều muốn đăng ký các lớp bơi mùa hè. **Tamara 13 tuổi và bơi khá giỏi; cháu từng là thành viên đội tuyển bơi của trường cũ trong hai năm.** Kristin, 11 tuổi, ít kinh nghiệm hơn nhưng chắc chắn không phải người mới bắt đầu.\n\nTôi dự định trong tuần này sẽ cùng các cháu đến văn phòng hành chính để đăng ký, nhưng muốn hỏi trước **văn phòng có chấp nhận thanh toán bằng thẻ tín dụng hay không**. Xin trả lời khi thuận tiện.\n\nXin cảm ơn!  \nAllan Carpenter","translationStatus":"reviewed"},{"id":"h3/test05/186_DBBAB.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 186–190","questions":{"186":"D","187":"B","188":"B","189":"A","190":"B"},"image":"data/h3/test05/186_DBBAB.png","markedImage":"marked/h3/test05/186_DBBAB.png","translation":"**Tài liệu 1 — Thư mời đêm khai mạc**\n\nTrân trọng kính mời quý khách đến dự đêm khai mạc vở *Dance of the Daffodils*, một vở ba-lê nguyên bản do Michelle Adams sáng tác, Lucas Pasdar biên đạo, Amy Lin phụ trách âm nhạc và Đoàn múa Fraulein Danza ở Thành phố New York biểu diễn.\n\nNhà hát Gladstone tại 473 Broadway Avenue sẽ mở cửa lúc 7 giờ 30 tối thứ Sáu, ngày 9 tháng 5. Biên đạo sẽ phát biểu đôi lời về tác phẩm trước khi màn sân khấu mở lúc 8 giờ. Sau buổi diễn, hai vũ công chính Sofia Pinsky và Igor Petrovich sẽ chào đón khách và ký tặng tại một buổi tiếp tân đặc biệt có cocktail và món khai vị.\n\nKhuyến nghị mặc trang phục trang trọng. Vui lòng xác nhận tham dự qua e-mail events@frauleindanza.com. Thư mời dành cho người nhận cùng một khách đi kèm và phải được xuất trình khi vào nhà hát.\n\n---\n\n**Tài liệu 2 — E-mail của Shonda Dixon**\n\n**Đến:** Lena Reid <lenareid@genericamail.com>  \n**Từ:** Shonda Dixon <shodi@minepost.com>  \n**Chủ đề:** Trả lời: Ba-lê  \n**Ngày:** 2 tháng 5\n\nChào Lena,\n\nCảm ơn bạn rất nhiều về lời mời! Tôi rất muốn đi xem đêm công diễn cùng bạn. Đoàn Fraulein Danza đã thực hiện những tác phẩm tuyệt vời tại các buổi diễn tôi từng xem, nên tôi tin lần này cũng sẽ rất xuất sắc. Ngoài ra, tôi thực sự hâm mộ Sofia Pinsky. Chắc bạn đã rất vui khi **phỏng vấn cô ấy và Igor Petrovich tại phòng tập của họ hôm qua**.\n\nTôi có thể gặp bạn tại nhà hát lúc 7 giờ 30 tối ngày 9 tháng 5, hoặc chúng ta có thể gặp sớm hơn để ăn tối. Ngay cạnh Nhà hát Gladstone có một nơi rất ổn tên là **Carlotta’s Bistro**. Hãy cho tôi biết bạn muốn làm thế nào.\n\nCảm ơn lần nữa. Tôi rất mong đến ngày hôm đó!\n\nShonda\n\n---\n\n**Tài liệu 3 — Nghệ sĩ ba-lê chính Sofia Pinsky**\n\nVũ công chính của đêm công diễn *Dance of the Daffodils* là nghệ sĩ ba-lê Sofia Pinsky đến từ Ukraine. Cô đảm nhiệm vai chính Công chúa Daffodil và dẫn dắt một đoàn gồm 30 vũ công chuyên nghiệp.\n\nCô được đào tạo tại Học viện Múa Cổ điển Kiev danh tiếng, sau đó theo học vũ công nổi tiếng Alexi Petrov tại Moscow. Dưới sự hướng dẫn của ông, cô tham dự Cuộc thi Ba-lê Quốc gia châu Âu tại **St. Petersburg và giành giải nhì — chiếc cúp đầu tiên trong sự nghiệp**. Cô đã giữ vai trò vũ công chính tại nhiều buổi diễn ở các thành phố trên thế giới, gồm London, New York và Tokyo. Cô gia nhập Đoàn Fraulein Danza hai năm trước và biểu diễn cùng đoàn từ đó đến nay.","translationStatus":"reviewed"},{"id":"h3/test05/191_CCDAC.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 191–195","questions":{"191":"C","192":"C","193":"D","194":"A","195":"C"},"image":"data/h3/test05/191_CCDAC.png","markedImage":"marked/h3/test05/191_CCDAC.png","translation":"**Tài liệu 1 — Thông báo khóa học của Dynamic Performance**\n\nHãy nâng cao kỹ năng diễn xuất tại trường đào tạo diễn xuất hàng đầu khu vực bằng cách đăng ký một trong các khóa mùa xuân hoặc mùa hè. Chúng tôi có chương trình cho cả học viên đang theo học thường xuyên và bất kỳ ai quan tâm đến nghề diễn.\n\n**Spring Intensive — 2.250 đô la**  \nKhóa học toàn diện về những kiến thức diễn xuất nền tảng: đọc kịch bản, sử dụng kỹ thuật thanh nhạc và chuyển động linh hoạt. Từ ngày 1 tháng 5 đến ngày 1 tháng 7, có tại mọi cơ sở.\n\n**Summer Intensive — 3.495 đô la**  \nTương tự Spring Intensive nhưng có thêm lớp kỹ thuật ứng biến. Học viên sẽ học cách phản ứng với bạn diễn mà không cần kịch bản. Từ ngày 5 tháng 7 đến ngày 13 tháng 8, có tại mọi cơ sở.\n\n**Summer Youth Ensemble — 2.500 đô la**  \nKhám phá nghệ thuật diễn xuất kịch theo cách thú vị. Chỉ dành cho học viên từ 15 đến 18 tuổi. Từ ngày 10 đến 30 tháng 6, chỉ có tại cơ sở Stamford và Brookline.\n\n**Summer Bridge Program — 1.800 đô la**  \nKhóa ba tuần dành riêng cho học viên nâng cao đang theo chương trình diễn xuất toàn thời gian, giúp đào sâu hiểu biết về diễn xuất. Chỉ có tại cơ sở Charleston, từ ngày 10 đến 31 tháng 7.\n\nĐể đăng ký, hãy gửi e-mail mẫu đăng ký cho **Giám đốc tuyển sinh Floyd Mink** tại f.mink@dynamicperformance.com.\n\n---\n\n**Tài liệu 2 — Các bài đánh giá trên uspeak.com**\n\n**“Chương trình tuyệt vời!” — 5/5 sao, Cody Norris**  \nTôi đã có tháng 6 tuyệt vời nhất với chương trình ba tuần này! Tôi nhận các lớp học như một món quà sinh nhật và không thể vui hơn. Tôi đã học rất nhiều về diễn xuất và kết bạn với nhiều người mới. Mong được đăng ký lại chương trình toàn thời gian.\n\n**“Trải nghiệm không tệ” — 3/5 sao, Liz Hershowitz**  \nTôi đặt kỳ vọng cao vào Spring Intensive vì có quá nhiều nhận xét tích cực trên trang này. Nhìn chung, trải nghiệm khá tốt nhưng tôi không hoàn toàn hài lòng với giảng viên.\n\n**“Khá ổn” — 4/5 sao, Mandy Berger**  \nNhìn chung tôi khá thích và vui vì đã đăng ký. Tôi nghĩ mình được lợi từ một số nội dung khóa học và thích mọi người trong lớp, nhưng tôi cảm thấy **lớp ứng biến hơi lỗi thời**.\n\n---\n\n**Tài liệu 3 — Phiếu đăng ký Dynamic Performance**\n\n**Ngày:** 4 tháng 7  \n**Tên:** Hannah Boyle  \n**Điện thoại:** 555-2092  \n**Địa chỉ:** 410 Fayette Street, Savannah, GA 31405  \n**E-mail:** hannabee@mailhaul.com\n\n**Chương trình đăng ký:** Summer Bridge Program  \n**Biết đến chương trình qua:** Thư gửi qua bưu điện  \n**Mục tiêu:** Tôi muốn nhận lời khuyên diễn xuất chuyên nghiệp.","translationStatus":"reviewed"},{"id":"h3/test05/196_ABADD.png","folder":"h3/test05","book":"h3","bookLabel":"Hacker 3","test":"test05","testLabel":"Test 05","title":"Hacker 3 · Test 05 · Câu 196–200","questions":{"196":"A","197":"B","198":"A","199":"D","200":"D"},"image":"data/h3/test05/196_ABADD.png","markedImage":"marked/h3/test05/196_ABADD.png","translation":"**Tài liệu 1 — Rao bán thiết bị nhà bếp**\n\nTôi sắp chuyển đến một căn hộ đã có sẵn thiết bị nhà bếp nên muốn bán những món sau:\n\n**Bếp/lò nướng Cucina — mẫu CS4095834**  \nThiết bị thép không gỉ này được mua cách đây ba năm nhưng vẫn còn tốt. Có bếp bốn vòng và lò nướng cỡ lớn, hoạt động dễ dàng. Giá 300 đô la, **có thể thương lượng**.\n\n**Máy rửa bát Lava-Sud — mẫu 4095837485D**  \nMua cách đây hai năm và vẫn hoạt động tốt. Có hai giá để bát đĩa cùng các ngăn đựng dao kéo. Giá 250 đô la, **có thể thương lượng**.\n\n**Tủ lạnh Preserve-Mate — mẫu R-2343209**  \nMua cách đây **một năm rưỡi**, còn trong tình trạng tuyệt vời. Vẫn được bảo hành thêm chín tháng và không bị hư hỏng. Thiết bị bằng thép không gỉ, có ngăn đông, ngăn mát cùng bộ lấy nước và đá. Giá 1.500 đô la, **có thể thương lượng**.\n\nCác thiết bị phải được chuyển khỏi căn hộ hiện tại của tôi trước ngày 1 tháng 7. Gửi e-mail cho Laurie Henner tại lauriehen@mostmail.com để biết chi tiết.\n\n---\n\n**Tài liệu 2 — E-mail của Laurie Henner**\n\n**Đến:** Lance Volstead <lancev@postaway.com>  \n**Từ:** Laurie Henner <lauriehen@mostmail.com>  \n**Chủ đề:** Trả lời: Thắc mắc về quảng cáo  \n**Ngày:** 29 tháng 5\n\nÔng Volstead,\n\nCảm ơn ông đã phản hồi quảng cáo. Tủ lạnh vẫn còn. Về kích thước ông hỏi, ông có thể xem **kích thước chính xác của mẫu này trên trang web Preserve-Mate**. Tuy nhiên, theo cách ông mô tả nhà bếp, tôi nghĩ sẽ có đủ chỗ cho tủ lạnh.\n\nCuối cùng, tôi sẽ chấp nhận đề nghị 1.300 đô la của ông với một điều kiện: ông phải lấy thiết bị khỏi căn hộ trong hai ngày tới vì tôi sắp chuyển đi. Xin cho biết ông có muốn tiếp tục giao dịch không.\n\nTrân trọng,  \nLaurie Henner\n\n---\n\n**Tài liệu 3 — E-mail của Lance Volstead**\n\n**Đến:** Laurie Henner <lauriehen@mostmail.com>  \n**Từ:** Lance Volstead <lancev@postaway.com>  \n**Chủ đề:** Trả lời: Thắc mắc về quảng cáo  \n**Ngày:** 29 tháng 5\n\nCô Henner,\n\nCảm ơn cô đã phản hồi nhanh chóng. Kích thước hoàn toàn phù hợp với tôi. Ngày mai tôi đã kín lịch, nhưng có thể đến vào ngày hôm sau. Tôi có thể đến tòa nhà của cô trước 4 giờ chiều. Nếu thời gian đó không phù hợp, xin cho biết khi nào cô rảnh.\n\nNgoài ra, cô có thể gửi số điện thoại cho tôi không? Nhờ vậy tôi có thể gọi nếu bị chậm hoặc có việc phát sinh. Số của tôi là (402) 555-3049. Xin cho biết số căn hộ của cô. Tôi sẽ mang xe đẩy để di chuyển tủ lạnh và một người bạn sẽ đi cùng để giúp. Nếu có vị trí cụ thể nên đỗ xe tải, cô cũng có thể báo cho tôi.\n\n**Tôi sẽ mang tiền mặt và thanh toán ngay 1.300 đô la.** Mong sớm nhận được phản hồi.\n\nLance Volstead","translationStatus":"reviewed"},{"id":"h3/test06/131_DCBA.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 131–134","questions":{"131":"D","132":"C","133":"B","134":"A"},"image":"data/h3/test06/131_DCBA.png","markedImage":"marked/h3/test06/131_DCBA.png","translation":"### Thư cảm ơn từ Quỹ NewEd\n\nKính gửi cô Clark,\n\nCảm ơn cô rất nhiều vì **khoản đóng góp** dành cho Quỹ NewEd. Theo nguyện vọng của cô, khoản đóng góp này sẽ hỗ trợ việc học tập của trẻ em đang theo học tại các trường công lập trong khu vực.\n\nTại NewEd, chúng tôi cấp kinh phí cho các cơ sở giáo dục để tổ chức chương trình sau giờ học, mua tài liệu và đào tạo giảng viên. Chúng tôi cũng tích cực **vận động tăng lương** cho giáo viên và các chuyên gia làm việc tại các cơ sở giáo dục.\n\n**Để** cảm ơn cô đã ủng hộ sứ mệnh của chúng tôi, Quỹ NewEd trân trọng mời cô tham dự hội nghị thường niên về giáo dục khoa học. Tôi đã gửi kèm thư mời dành cho cô và một vị khách. **Cô chỉ cần xuất trình thư mời tại lối vào trong ngày diễn ra sự kiện.**\n\nMột lần nữa, xin cảm ơn cô vì sự hỗ trợ tài chính liên tục dành cho tổ chức.\n\nTrân trọng,\nMarianne Lexington\nĐiều phối viên chương trình, Quỹ NewEd","translationStatus":"reviewed"},{"id":"h3/test06/135_CDCB.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 135–138","questions":{"135":"C","136":"D","137":"C","138":"B"},"image":"data/h3/test06/135_CDCB.png","markedImage":"marked/h3/test06/135_CDCB.png","translation":"### E-mail về việc giao nội thất\n\n**Đến:** Andrea Gershon\n**Từ:** Takeshi Miyagi\n**Ngày:** Thứ Sáu, ngày 10 tháng 10\n**Chủ đề:** Giao nội thất\n\nChào Andrea,\n\nTôi đã đặt một chiếc ghế và bàn làm việc mới vào ngày 5 tháng 10 để thay cho những món tôi dùng từ khi vào công ty. Vài ngày trước, nhà sản xuất gửi e-mail thông báo rằng các món đồ **sẽ được giao đến**. Họ cho biết hàng đã được chuyển đi và dự kiến giao trong tuần này.\n\n**Vì** tôi vẫn chưa nhận được cuộc gọi từ nhân viên giao hàng nên có lẽ đồ nội thất phải sang tuần sau mới tới. **Rất tiếc, tuần tới tôi sẽ vắng mặt tại văn phòng để dự hội nghị.** Khi hàng đến, bạn vui lòng ký nhận giúp tôi rồi gọi cho Mike Harrison ở bộ phận bảo trì nhé. Anh ấy phụ trách lắp ráp nội thất và dọn bỏ những món **không còn cần thiết**, nên sẽ sắp xếp mọi thứ trong khu vực làm việc của tôi.\n\nCảm ơn bạn rất nhiều.\nTakeshi","translationStatus":"reviewed"},{"id":"h3/test06/139_BDCC.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 139–142","questions":{"139":"B","140":"D","141":"C","142":"C"},"image":"data/h3/test06/139_BDCC.png","markedImage":"marked/h3/test06/139_BDCC.png","translation":"### BẢN GHI NHỚ\n\n**Ngày:** 31 tháng 3\n**Đến:** Toàn thể nhân viên vận hành\n**Từ:** Robin Evans, Giám đốc vận hành\n**Chủ đề:** Xem xét báo cáo\n\nTuần trước, tôi đã gửi báo cáo chi tiết về kết quả hoạt động của bộ phận trong quý I. Có một số nội dung trong báo cáo mà tôi cho rằng cần được giải quyết.\n\nTrước hết, chi phí của bộ phận bảo trì dường như **đã tăng** so với quý trước. Tôi đã yêu cầu nhóm của Terrence Howard cung cấp thông tin chi tiết về từng khoản tăng trong chi phí bảo trì. Ngoài ra, tôi khá ngạc nhiên khi một số **mục tiêu** của dự án vẫn chưa đạt được. **Các quản lý dự án cần xử lý những mục tiêu này càng sớm càng tốt.** Cuối cùng, lượng hàng tồn kho hiện thấp hơn dự kiến. Tôi muốn sắp xếp một cuộc họp với nhóm của Carmine Gosfora để thảo luận về **quy trình** quản lý hàng tồn kho trong thời gian tới.\n\nChúng ta sẽ tiếp tục đánh giá hiệu suất trong suốt năm, và tôi hy vọng việc này sẽ giúp bộ phận hoạt động hiệu quả và năng suất hơn.","translationStatus":"reviewed"},{"id":"h3/test06/143_BABA.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 143–146","questions":{"143":"B","144":"A","145":"B","146":"A"},"image":"data/h3/test06/143_BABA.png","markedImage":"marked/h3/test06/143_BABA.png","translation":"### E-mail về đơn ứng tuyển\n\n**Đến:** Marilyn Farris\n**Từ:** Lara Smith\n**Ngày:** 22 tháng 9\n**Chủ đề:** Đơn ứng tuyển\n\nKính gửi cô Farris,\n\nCảm ơn cô đã quan tâm đến vị trí cố vấn công nghệ. Chúng tôi muốn sắp xếp một **buổi phỏng vấn** trong khoảng từ 2 giờ đến 4 giờ chiều thứ Năm tuần tới. Chúng tôi mong được tìm hiểu thêm về trình độ và kinh nghiệm của cô liên quan đến vị trí đã ứng tuyển.\n\nNgoài bản sao các chứng chỉ **còn hiệu lực**, chúng tôi đề nghị cô thu xếp gửi ba thư giới thiệu trong phong bì niêm phong. **Cô cũng vui lòng chuẩn bị một bài thuyết trình ngắn về quá trình nghề nghiệp của mình.** Chúng tôi muốn nghe về những kinh nghiệm trước đây có liên quan đến vị trí này. **Sau đó**, chúng tôi sẽ trao đổi về các trách nhiệm của cô nếu được tuyển dụng.\n\nVui lòng trả lời e-mail này để xác nhận cô có thể tham dự. Chúng tôi mong sớm được gặp cô.\n\nTrân trọng,\nLara Smith\nQuản lý tuyển dụng, LPR Analytics","translationStatus":"reviewed"},{"id":"h3/test06/147_CA.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 147–148","questions":{"147":"C","148":"A"},"image":"data/h3/test06/147_CA.png","markedImage":"marked/h3/test06/147_CA.png","translation":"### Các lớp phần mềm tại Thư viện Bramble\n\nBạn muốn thành thạo công nghệ hơn? Bạn muốn học cách tạo bảng tính, bài thuyết trình và các tài liệu thông dụng khác? Hãy đến Phòng 303 của Thư viện Bramble vào **8 giờ tối thứ Ba, từ ngày 2 tháng 3 đến ngày 15 tháng 4**.\n\nRichard Hernandez, một chuyên viên CNTT được đào tạo bài bản, sẽ hướng dẫn cách tạo **bảng tính, biểu đồ và bài thuyết trình bằng các ứng dụng phần mềm phổ biến**. Học phí là 20 đô la mỗi buổi. Đăng ký tại bramblelib.org/programming/software. Lịch học đầy đủ sẽ sớm được đăng tải.\n\nĐể tìm hiểu thêm về các chương trình giáo dục khác, từ lớp văn học đến các buổi học nói trước công chúng, vui lòng truy cập www.bramblelib.org/programming.","translationStatus":"reviewed"},{"id":"h3/test06/149_DC.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 149–150","questions":{"149":"D","150":"C"},"image":"data/h3/test06/149_DC.png","markedImage":"marked/h3/test06/149_DC.png","translation":"### Chuỗi tin nhắn\n\n**Dean Strivers (10:31):** Sylvia, cô có bận không? Ban lãnh đạo vừa yêu cầu một cuộc họp khẩn với bộ phận nghiên cứu trong khoảng một giờ nữa.\n\n**Sylvia Flores (10:33):** Tôi có thể tham dự, nhưng nhóm của tôi đang ở một chi nhánh lớn trong trung tâm thành phố. Ít nhất 2 giờ họ mới quay lại.\n\n**Dean Strivers (10:35):** Cô có thể tự xử lý được chứ? Tôi nghĩ cuộc họp vẫn ổn dù các thành viên trong nhóm cô không có mặt.\n\n**Sylvia Flores (10:36):** **Không thành vấn đề.** Tôi có cần chuẩn bị gì không?\n\n**Dean Strivers (10:38):** Họ muốn hỏi về đợt ra mắt sản phẩm sắp tới, vì vậy hãy mang theo **bản phân tích thị trường, dự toán tài chính và các báo cáo khác mà cô cùng nhóm đã thực hiện**. Cuộc họp sẽ diễn ra tại Phòng họp 510.\n\n**Sylvia Flores (10:41):** Tôi sẽ có mặt.","translationStatus":"reviewed"},{"id":"h3/test06/151_CB.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 151–152","questions":{"151":"C","152":"B"},"image":"data/h3/test06/151_CB.png","markedImage":"marked/h3/test06/151_CB.png","translation":"### Hóa đơn của Harwood Services\n\n**Địa chỉ:** 3372 South High Street, Bloomington, Indiana 47404\n**Người nhận:** Johnathan Mackay, Midwest Consulting Group\n**Ngày:** 15 tháng 3\n**Mã tham chiếu:** MCG104\n\nCác dịch vụ được cung cấp tại Hội thảo Trợ cấp Nông nghiệp Indiana ngày 10 tháng 3:\n\n- Bữa trưa gồm súp và bánh mì kẹp, kèm nước ngọt/nước trái cây: 350 đô la cho 27 khách.\n- **Hai giờ giải lao** phục vụ trà, cà phê, bánh ngọt và đồ ăn nhẹ: 280 đô la cho 27 khách.\n- Dịch vụ quầy bar/cocktail buổi tối và các khay món khai vị: 220 đô la cho **35 khách**.\n- Ba nhân viên phục vụ và chuẩn bị trong suốt sự kiện: 240 đô la.\n\n**Tổng chi phí:** 1.090 đô la\n**Đã đặt cọc:** 500 đô la\n**Còn phải thanh toán:** 590 đô la\n\nLưu ý: Buổi tối có thêm tám người tham dự sau khi hội thảo kết thúc. Do trước đó quý khách đã báo có thể có thêm một số khách là lãnh đạo, mức giá đã được điều chỉnh theo thỏa thuận. Mọi mức giá đều bao gồm thuế. Khoản còn lại phải được thanh toán trong vòng một tuần kể từ khi nhận hóa đơn; thanh toán trễ có thể bị phạt theo hợp đồng.","translationStatus":"reviewed"},{"id":"h3/test06/153_ABD.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 153–155","questions":{"153":"A","154":"B","155":"D"},"image":"data/h3/test06/153_ABD.png","markedImage":"marked/h3/test06/153_ABD.png","translation":"### BẢN GHI NHỚ\n\n**Ngày:** 27 tháng 1\n**Đến:** Toàn thể nhân viên tiếp thị và truyền thông\n**Từ:** Charles Mikkola, Trưởng bộ phận Tiếp thị và Truyền thông\n**Chủ đề:** Thay đổi tổ chức\n\nNhư nhiều người đã biết, tôi sắp rời vị trí trưởng bộ phận tiếp thị và truyền thông tại Thurston International. Trong thời gian tôi đảm nhiệm vị trí này, chúng ta đã cải thiện trải nghiệm khách hàng, mở rộng dịch vụ, **thắt chặt quan hệ với các đối tác mới trên toàn cầu**, tăng doanh thu và chuẩn hóa hơn nữa các phương thức kinh doanh.\n\nTôi vui mừng thông báo cô Hannah Orburg sẽ tiếp quản vị trí của tôi từ ngày 1 tháng 2. Hannah có hơn 15 năm kinh nghiệm bán hàng và tiếp thị trong lĩnh vực tư vấn doanh nghiệp. Trước khi gia nhập Thurston International, cô là Giám đốc Tiếp thị và Vận hành tại Diskledge, một công ty lớn cung cấp **dịch vụ tư vấn công nghệ cho hơn 500 khách hàng doanh nghiệp trên toàn thế giới**. Với những thành tích phù hợp trực tiếp với hoạt động cốt lõi của Thurston, tôi tin Hannah là người lý tưởng để thay thế mình.\n\nMột lần nữa, được làm việc cùng mọi người là một trải nghiệm tuyệt vời. Chúc tất cả các bạn thành công trong sự nghiệp.","translationStatus":"reviewed"},{"id":"h3/test06/156_BB.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 156–157","questions":{"156":"B","157":"B"},"image":"data/h3/test06/156_BB.png","markedImage":"marked/h3/test06/156_BB.png","translation":"### Hội đồng Nghệ thuật tổ chức lễ hội đường phố mùa hè\n\nTheo nguyện vọng của đông đảo công chúng, Hội đồng Nghệ thuật Los Ramos (LRAC) sẽ tiếp tục tổ chức lễ hội Wine, Dine, and Design vào ngày 12 và 13 tháng 7 tại khu Franklin Avenue nổi tiếng ở trung tâm Los Ramos. Năm nay, hơn 120 nghệ sĩ và nghệ nhân địa phương đăng ký trưng bày tác phẩm.\n\nLễ hội không chỉ dành cho người yêu nghệ thuật mà còn hấp dẫn những người đam mê ẩm thực và rượu vang. Mười hai vườn nho địa phương sẽ tổ chức nếm rượu, còn nhiều đầu bếp nổi tiếng trong thành phố sẽ phục vụ đặc sản vùng miền.\n\nNgười phát ngôn LRAC Rosita Santiago cho biết **ban nhạc dân gian nổi tiếng Bella Vista Band sẽ biểu diễn vào đêm cuối của lễ hội**, cùng nhiều nghệ sĩ khác. Các nhóm múa từ trường học địa phương cũng biểu diễn trong cả hai ngày.\n\nLịch đầy đủ về hoạt động, nhà cung cấp và sự kiện có tại văn phòng LRAC hoặc trang web của hội đồng. Lễ hội mở cửa lúc 11 giờ sáng mỗi ngày và kết thúc lúc nửa đêm. Bãi đỗ xe bổ sung được bố trí tại Trường Trung học Los Ramos.","translationStatus":"reviewed"},{"id":"h3/test06/158_CCA.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 158–160","questions":{"158":"C","159":"C","160":"A"},"image":"data/h3/test06/158_CCA.png","markedImage":"marked/h3/test06/158_CCA.png","translation":"### Lịch làm việc của Melissa Traynor\n\n**Chức vụ:** Tổng biên tập, The Green Bay News\n**Ngày:** Thứ Năm, ngày 19 tháng 4\n\n- Gặp Harold về doanh thu quảng cáo tháng trước.\n- Trao đổi với Ray về loạt bài sắp tới về tài chính bang.\n- Đào tạo ngắn cho một biên tập viên mới.\n- **Xem lại các bài dự kiến đăng ngày mai trước buổi ăn trưa hôm nay tại Mariano's.**\n- **Ăn trưa với Sarah để trao đổi về ý tưởng dàn trang mới của cô ấy.**\n- Trao đổi với Greg về nguồn tư liệu cho bài chuyên đề mới.\n- Kiểm tra e-mail và gọi lại các cuộc gọi nhỡ.\n- **4 giờ chiều: Gọi Peter để sắp xếp địa điểm gặp mặt.**\n- Họp với toàn bộ biên tập viên về số báo ngày mai.\n- Gặp Tim về việc biên tập bản thảo.\n- Gửi báo đi in.\n\nBan quản lý đã duyệt làm thêm từ 6 giờ đến 9 giờ tối. Nếu không thể tham dự cuộc hẹn nào, cô Traynor phải báo cho trợ lý Joel Heartley để sắp xếp lại. Ngày mai không có lịch làm việc vì cô sẽ đi công tác tại New Delhi.","translationStatus":"reviewed"},{"id":"h3/test06/161_CCA.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 161–163","questions":{"161":"C","162":"C","163":"A"},"image":"data/h3/test06/161_CCA.png","markedImage":"marked/h3/test06/161_CCA.png","translation":"### E-mail về chuyến thăm nhà máy\n\nKính gửi cô Sukarno,\n\nCảm ơn cô đã nhanh chóng phản hồi đề nghị tham quan nhà máy sản xuất tại Jakarta. Tôi sẽ nhờ trợ lý Theresa Montovani thu xếp để tôi và đồng nghiệp Sheryl Stein bay từ New York đến đó vào ngày 24 tháng 2.\n\nVì Vert-Bleu Beauty muốn tiến tới ký hợp đồng sản xuất với công ty cô, tôi cho rằng chúng ta cần gặp trực tiếp và tham quan cơ sở. **Điều này cũng sẽ giúp hai bên hiểu rõ hơn nhu cầu của nhau.**\n\nMỹ phẩm của chúng tôi được bảo đảm hoàn toàn tự nhiên và thân thiện với môi trường, nên **các tiêu chuẩn sản xuất sẽ khá nghiêm ngặt**. Tôi đính kèm danh sách thông số kỹ thuật cho quy trình sản xuất để cô và ban điều hành xem xét.\n\nSau khi đặt vé, cô Montovani sẽ gửi lịch trình cuối cùng cho cô hoặc thư ký của cô. Chúng tôi chân thành cảm ơn và xin nhận lời đề nghị cung cấp chỗ ở khách sạn cùng xe đưa đón trong thời gian lưu trú. Trợ lý hai bên có thể phối hợp các chi tiết.\n\nTôi mong được gặp cô và hy vọng hai công ty có thể hợp tác trong dự án này.\n\nTrân trọng,\nVinnie Deniro\nGiám đốc phát triển sản phẩm, Vert-Bleu Beauty","translationStatus":"reviewed"},{"id":"h3/test06/164_ACDA.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 164–167","questions":{"164":"A","165":"C","166":"D","167":"A"},"image":"data/h3/test06/164_ACDA.png","markedImage":"marked/h3/test06/164_ACDA.png","translation":"### Cuộc trò chuyện trực tuyến về việc sáp nhập\n\n**Helen Gatineau (3:35):** Chắc mọi người đã biết chúng ta sẽ sáp nhập với Fresh Food Wholesalers vào cuối tháng tới. Tuần sau sẽ có cuộc họp về kế hoạch chuyển tiếp; trong lúc này tôi sẽ giải đáp các câu hỏi.\n\n**Leo Kinghorn (3:36):** Bộ phận thu mua đang thắc mắc thay đổi này sẽ ảnh hưởng thế nào. Đã có thông tin chắc chắn nào chưa?\n\n**Mimi Hanway (3:38):** Theo tôi hiểu, để tăng hiệu quả, các chức năng hành chính sẽ chỉ được thực hiện tại một tòa nhà. Vì vậy, **nhân viên hành chính, trong đó có tôi, sẽ chuyển đến tòa nhà của Fresh Food Wholesalers trong vài tuần tới**.\n\n**Helen Gatineau (3:39):** Đúng vậy. Tuy nhiên, hai kho vẫn được giữ riêng tại vị trí hiện tại.\n\n**Jude Mason (3:41):** Công việc thường ngày của tôi sẽ thay đổi thế nào?\n\n**Helen Gatineau (3:42):** Trước khi giao hàng cho cửa hàng bán lẻ, Jude sẽ ghé cả hai cơ sở. Chúng ta sẽ tuyển thêm nhân viên kho để việc bốc hàng nhanh hơn, giúp Jude có thời gian đến cả hai nơi.\n\n**Leo Kinghorn (3:45):** Nhân viên Fresh Food Wholesalers có lẽ phải tham gia khóa an toàn và sức khỏe trước khi xử lý thịt, vì trước đây công ty đó chưa kinh doanh sản phẩm thịt.\n\n**Helen Gatineau (3:47):** **Ý kiến đó hợp lý. Tôi sẽ sắp xếp để giảng viên đến sớm nhất có thể.**","translationStatus":"reviewed"},{"id":"h3/test06/168_CDCB.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 168–171","questions":{"168":"C","169":"D","170":"C","171":"B"},"image":"data/h3/test06/168_CDCB.png","markedImage":"marked/h3/test06/168_CDCB.png","translation":"### *Starting Up*\n#### Lời tựa của Michael Lawman\n\n*Starting Up* là tác phẩm phi hư cấu đầu tiên của Anne Schubert, thuật lại những sự kiện đưa bà trở thành một doanh nhân thành đạt. Qua câu chuyện đời hấp dẫn, Schubert nhắc chúng ta rằng thành lập công ty khởi nghiệp không thể thiếu kế hoạch. Cần dành đủ thời gian và công sức để doanh nghiệp có lãi, và cuốn sách trình bày chi tiết quá trình này.\n\nSchubert kể rằng ngay từ nhỏ bà đã xem mình như một nhà phát minh. Việc cố gắng tạo ra các sản phẩm độc đáo, hữu ích trong đời sống hằng ngày đã truyền cảm hứng cho bà. **Tuy nhiên, bà nhanh chóng nhận ra rằng chỉ có ý tưởng thôi thì chưa đủ để đưa sản phẩm ra thị trường.** Bà còn phải vượt qua nhiều thử thách trong việc quảng bá sản phẩm mới, rồi cuối cùng giành được hợp đồng cung cấp hàng cho Venus Footwear và Constant Sports Equipment.\n\nKhông lâu sau, Schubert thành lập công ty Swift World tại Seattle, tiền thân của Swift Enterprises International. **Hiện công ty có hơn 280 cửa hàng giày tại sáu quốc gia**, và cuốn sách kể lại cách bà đi lên gần như từ con số không để xây dựng một trong những nhà bán lẻ sinh lợi nhất cả nước.\n\n*Starting Up* vừa giàu kiến thức cho các doanh nhân, vừa hấp dẫn nhờ những câu chuyện cá nhân về thế giới phát triển sản phẩm và bán lẻ đầy cạnh tranh. Tôi đã may mắn là đồng nghiệp của Schubert nhiều năm và học hỏi rất nhiều từ sự sáng suốt, trực giác của bà. Giờ đây, qua cuốn sách này, độc giả cũng có thể khám phá thế giới khởi nghiệp thành công của Schubert.","translationStatus":"reviewed"},{"id":"h3/test06/172_CCBB.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 172–175","questions":{"172":"C","173":"C","174":"B","175":"B"},"image":"data/h3/test06/172_CCBB.png","markedImage":"marked/h3/test06/172_CCBB.png","translation":"### Một điểm đến mới nổi cho chuyến công tác\n\nThành Đô ở miền tây Trung Quốc từ lâu bị các thành phố miền đông nổi tiếng hơn như Thượng Hải và Bắc Kinh **lấn át**. Nhưng khi Trung Quốc ngày càng trở thành cường quốc kinh tế, những thành phố như Thành Đô đang trở thành điểm đến quan trọng cho khách công tác. Ngoài phòng hội nghị và phòng khách sạn, đô thị hấp dẫn này còn có nhiều thắng cảnh đáng khám phá.\n\n- **Khu bảo tồn gấu trúc** là điểm thu hút lớn nhất, với khoảng 60 cá thể, kể cả gấu mới sinh. Có hướng dẫn viên nói tiếng Anh. Vì gấu thường ngủ từ trưa đến 2 giờ chiều và địa điểm rất đông khách, du khách nên mua vé, đặt chỗ trước.\n- **Phố cổ Luodai** còn lưu giữ nhiều ngôi nhà truyền thống và các quầy món ăn đường phố Tứ Xuyên. Có thể đi xe buýt hoặc tàu hỏa; xe buýt chậm hơn do giao thông.\n- **Núi Nga Mi** nằm ngay ngoài Thành Đô. Du khách có thể đi cáp treo lên đỉnh rồi thong thả đi bộ xuống.\n- Nếu có vài ngày, khách sạn có thể giúp sắp xếp chuyến đi tới các thị trấn Tây Tạng nhỏ quanh thành phố. Tại đó, du khách có thể cưỡi ngựa, ở nhà truyền thống và thăm đền chùa, thư viện.\n\nNgoại trừ các làng Tây Tạng và núi Nga Mi, mọi địa điểm trên đều dễ dàng đến bằng taxi từ trung tâm thành phố với giá không quá 50 nhân dân tệ.","translationStatus":"reviewed"},{"id":"h3/test06/176_BACAD.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 176–180","questions":{"176":"B","177":"A","178":"C","179":"A","180":"D"},"image":"data/h3/test06/176_BACAD.png","markedImage":"marked/h3/test06/176_BACAD.png","translation":"### Quảng cáo của Sunfield Limousines\n\nSunfield Limousines cung cấp dịch vụ xe có tài xế trên toàn khu vực đô thị San Diego. Khách có thể đặt xe 24 giờ mỗi ngày, quanh năm, bằng cách đến trực tiếp, gọi điện hoặc truy cập trang web. Công ty phục vụ hơn 50 khu vực, cung cấp xe đưa đón sân bay, xe cho đám cưới và sự kiện, với **nhiều loại xe gồm sedan, SUV, limousine kéo dài và xe buýt tiệc tùng**.\n\n**Ưu đãi cho khách hàng lần đầu:** nhập mã BN23X5 trên www.sunfieldlimo.com để được giảm 15% cho lần đặt limousine đầu tiên. Công ty cũng có **ứng dụng di động SunfieldApp**.\n\n---\n\n### E-mail yêu cầu hoàn tiền\n\n**Đến:** Henry Karrington\n**Từ:** Fred Puccini\n**Ngày:** 14 tháng 12\n**Chủ đề:** Yêu cầu hoàn tiền\n\nKính gửi ông Karrington,\n\nTôi viết thư để bày tỏ sự thất vọng về dịch vụ limousine. Là khách hàng lần đầu muốn sử dụng ưu đãi giảm giá, tôi đã gặp nhiều vấn đề.\n\nTôi đã yêu cầu tài xế và limousine kéo dài đón các vị khách quan trọng tại sân bay vào **thứ Bảy, ngày 10 tháng 12**. Sau gần một giờ chờ ở khu đến mà không có ai đón, họ phải gọi cho công ty và được báo xe đang chờ nhầm ở nhà ga nội địa thay vì quốc tế, dù tôi đã ghi rõ chuyến bay đến Nhà ga 1 lúc 6 giờ 30 tối. Sau đó tài xế còn đưa họ đến khách sạn Crown Diamond Airport thay vì chi nhánh trung tâm thành phố, làm chuyến đi kéo dài thêm 30 phút. **Những vị khách này là các nhà đầu tư tiềm năng vào công ty tôi**, nên tôi vô cùng xấu hổ về ấn tượng ban đầu của họ.\n\nTôi đã đặt và thanh toán chuyến khứ hồi từ khách sạn Crown Diamond đến sân bay vào ngày 16 tháng 12 lúc 10 giờ 45 sáng, nhưng nay muốn hủy chuyến về và đề nghị hoàn tiền vào thẻ tín dụng công ty đã dùng để thanh toán. Vui lòng gửi e-mail xác nhận ngay khi xử lý xong.\n\nTrân trọng,\nFred Puccini","translationStatus":"reviewed"},{"id":"h3/test06/181_CBCDB.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 181–185","questions":{"181":"C","182":"B","183":"C","184":"D","185":"B"},"image":"data/h3/test06/181_CBCDB.png","markedImage":"marked/h3/test06/181_CBCDB.png","translation":"### Thông báo bảo trì sắp tới\n\n**Đăng ngày:** 2 tháng 5\n\nCounty Line Bank cam kết giành được sự tin tưởng và tôn trọng của khách hàng, kể cả đối với dịch vụ trực tuyến. Vì phải thường xuyên nâng cấp hệ thống máy tính và phần mềm, đôi khi ngân hàng cần tạm ngừng một phần dịch vụ trực tuyến.\n\nTừ **5 giờ đến 10 giờ tối ngày 22 tháng 5**, khách hàng sẽ không thể kiểm tra số dư, thanh toán hóa đơn, chuyển tiền, dừng thanh toán hoặc gửi tiền vào tài khoản thanh toán và tiết kiệm qua hệ thống trực tuyến. Tuy nhiên, **máy ATM vẫn hoạt động**, và khách cũng có thể gọi đường dây dịch vụ 24 giờ hoặc đến bất kỳ chi nhánh nào để giao dịch trực tiếp.\n\n---\n\n### Thư giới thiệu dịch vụ của Datup Solutions\n\nKính gửi ông Roger Black,\n\nTôi là kỹ sư phụ trách khách hàng của Datup Solutions, chuyên về hệ thống trực tuyến. Tôi muốn trao đổi về cách công ty chúng tôi giúp các khách hàng như County Line Bank giảm thời gian hệ thống ngừng hoạt động.\n\nDatup hiểu hậu quả tài chính khi doanh nghiệp phải thường xuyên đưa hệ thống ngoại tuyến để bảo trì. Vì vậy, trọng tâm của chúng tôi là **giữ cho hệ thống tiếp tục hoạt động trong quá trình nâng cấp và bảo dưỡng**. Trong bốn năm qua, chúng tôi đã hỗ trợ thành công các tổ chức tài chính, công ty bảo hiểm và **doanh nghiệp bán lẻ trực tuyến**.\n\nTôi muốn gặp ông cùng các nhân sự chủ chốt khoảng một tuần trước đợt nâng cấp. Đồng nghiệp Michaela Owens và tôi có thể trực tiếp đánh giá hệ thống hiện tại và giải thích giải pháp của Datup. Chúng tôi rảnh mọi ngày trong tuần này trừ thứ Năm, từ 8 giờ sáng đến 7 giờ tối. Vui lòng gọi 555-6420 để sắp xếp.\n\nTrân trọng,\nJason Richards\nKỹ sư phụ trách khách hàng, Datup","translationStatus":"reviewed"},{"id":"h3/test06/186_CCBAB.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 186–190","questions":{"186":"C","187":"C","188":"B","189":"A","190":"B"},"image":"data/h3/test06/186_CCBAB.png","markedImage":"marked/h3/test06/186_CCBAB.png","translation":"### Tờ rơi khuyến mãi của Segovia Paint\n\nMột số sản phẩm đang được giảm giá đến hết ngày 30 tháng 4:\n\n- **Vibra chống thấm:** giá thường 24 đô la/gallon; giữ màu lâu trong điều kiện khắc nghiệt; giảm giá khi mua từ 5 gallon.\n- **Densen ánh kim:** giá thường 34 đô la/gallon; tạo độ bóng sâu, sang trọng, chỉ dùng trong nhà; giảm 25% cho một số màu.\n- **Fulmax pha trộn:** giá thường 30 đô la/gallon; pha bằng máy vi tính; giảm 25% cho hỗn hợp từ ba màu trở lên.\n- **Alpha cơ bản:** giá thường 18 đô la/gallon; thân thiện môi trường, bám được trên hầu hết bề mặt; giảm 30% cho một số màu xám.\n\n---\n\n### Phiếu phản hồi đơn hàng số 12798-130524\n\n**Khách hàng:** Samantha Eggers\n**Ngày:** 24 tháng 4\n\nTôi đã đặt một loại sơn đang khuyến mãi nhưng nhận sai màu: **cobalt blue thay vì warm gray**. Có lẽ nhân viên đã nhầm vì bao bì của hai loại khá giống nhau. Xin hãy kiểm tra và xử lý; nếu có thể, tôi muốn trả lại hàng sai và nhận đúng sản phẩm mà không phải trả thêm phí vận chuyển.\n\n---\n\n### Đừng mua hàng tại cửa hàng này!\n#### Bài đánh giá đăng ngày 9 tháng 5 bởi S. Eggers\n\nSegovia Paints đã nhầm đơn và gửi sai sản phẩm. Khi tôi liên hệ, **một tuần sau họ mới phản hồi**. Vì cần sơn ngay, tôi đề nghị gửi đúng loại bằng dịch vụ chuyển phát nhanh nhưng họ từ chối chịu phí. Sau khi tranh cãi mất thêm thời gian, tôi phải tự lái xe đến cửa hàng vào cuối tuần để gặp quản lý. Cuối cùng tôi nhận được loại sơn cần mua và được hoàn lại một phần tiền, nhưng trải nghiệm này khiến tôi hoàn toàn thất vọng. Tôi không khuyên mọi người mua hàng tại đây!","translationStatus":"reviewed"},{"id":"h3/test06/191_CBACD.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 191–195","questions":{"191":"C","192":"B","193":"A","194":"C","195":"D"},"image":"data/h3/test06/191_CBACD.png","markedImage":"marked/h3/test06/191_CBACD.png","translation":"### Chương trình đào tạo nghề của Cao đẳng Cộng đồng Desmond-Hilbert\n\nNhà trường cung cấp các khóa học cho người đang có việc làm và thất nghiệp muốn lấy chứng chỉ hoặc nâng cao kỹ năng. Chương trình gồm môi giới bất động sản, an toàn ô tô, máy tính; học kỳ này có thêm **hai khóa mới là điều dưỡng cơ bản và thanh tra xây dựng**.\n\nThông tin và mẫu đăng ký trực tuyến có tại www.desmond-hilbert.edu/vocation. Nhà trường phản hồi trong vòng 48 giờ. Hạn đăng ký là ngày 12 tháng 8; việc đăng ký trễ tùy quyết định của giảng viên.\n\n---\n\n### Lịch học kỳ mùa thu, từ 24 tháng 8 đến 21 tháng 12\n\n- Môi giới bất động sản: thứ Hai và thứ Tư, 9 giờ sáng–4 giờ chiều; Wendy Dufresne.\n- An toàn ô tô: thứ Ba và thứ Năm, 9 giờ sáng–12 giờ trưa; Harold Singh.\n- **Thanh tra xây dựng: thứ Hai và thứ Sáu, 9–11 giờ sáng; Ted Angelotti.**\n- Máy tính và máy tính bảng: thứ Ba và thứ Năm, 2–4 giờ chiều; Sandy Packard.\n- Điều dưỡng cơ bản: thứ Hai đến thứ Sáu, 8 giờ sáng–5 giờ chiều; Paul Leong.\n\n---\n\n### E-mail xác nhận đăng ký\n\n**Đến:** Joey Partido\n**Từ:** Gail Bowe, Phòng đăng ký\n**Ngày:** 9 tháng 8\n\nKính gửi ông Partido,\n\nChúng tôi xác nhận đã nhận được mẫu đăng ký của ông. Tổng học phí và lệ phí là 2.200 đô la; thủ tục nhập học hoàn tất sau khi thanh toán. Ông cho biết **chủ lao động sẽ chi trả khóa đào tạo**, nên khoản tiền có thể được chuyển từ tài khoản của họ hoặc thanh toán bằng thẻ tín dụng.\n\nSau khi nhận tiền, chúng tôi sẽ gửi biên lai qua e-mail. Vui lòng in và mang theo vào ngày học đầu tiên. Xin lưu ý khóa ông đăng ký **học cả ngày, hằng ngày trừ thứ Bảy**.\n\nTrân trọng,\nGail Bowe\nPhụ trách đăng ký","translationStatus":"reviewed"},{"id":"h3/test06/196_BDDDA.png","folder":"h3/test06","book":"h3","bookLabel":"Hacker 3","test":"test06","testLabel":"Test 06","title":"Hacker 3 · Test 06 · Câu 196–200","questions":{"196":"B","197":"D","198":"D","199":"D","200":"A"},"image":"data/h3/test06/196_BDDDA.png","markedImage":"marked/h3/test06/196_BDDDA.png","translation":"### Khu liên hợp giải trí Lakeshore\n\nCơ sở vật chất phù hợp với nhiều hoạt động và sự kiện. Để thuê, khách hàng điền phiếu yêu cầu và gửi đến booking@lakeshorerec.com. Từ tháng 4 đến tháng 9, khu liên hợp mở cửa hằng ngày từ 7 giờ sáng đến 9 giờ tối; từ tháng 10 đến tháng 3, mở từ thứ Ba đến Chủ Nhật, 8 giờ sáng–7 giờ tối.\n\nKhu liên hợp có nhiều khu thể thao, cùng **nhà ăn và máy bán hàng tự động trong sảnh giải trí**. Phí nhân sự, thiết bị và dịch vụ khác được tính riêng. Khi đặt chỗ phải cọc 50%, phần còn lại thanh toán vào ngày thuê. Khách hàng doanh nghiệp từng sử dụng dịch vụ có thể được giảm 20% khi đặt vào giờ thấp điểm.\n\n---\n\n### Phiếu yêu cầu thuê cơ sở\n\n**Tổ chức:** Markovich Insurance\n**Người liên hệ:** Lois Butler\n**Ngày thuê:** Thứ Bảy, ngày 29 tháng 8\n**Thời gian:** 10 giờ sáng–4 giờ chiều\n\nCơ sở yêu cầu gồm sân bóng mềm và sảnh giải trí. Một nhóm nhỏ sẽ đến sớm một giờ để treo biển, sắp xếp bàn ghế. Bà Butler cũng hỏi **có thể dành riêng khoảng 15 chỗ đỗ xe cho đoàn hay không**.\n\n---\n\n### BẢN GHI NHỚ: Ngày hội thể thao Markovich Insurance lần thứ 5\n\n**Ngày:** 2 tháng 8\n**Từ:** Lois Butler\n\nHãy chuẩn bị cho các trò chơi và giải thưởng! Mọi người hẳn đã nhận được phân công vào một trong bốn đội; nhớ mặc màu được chỉ định. Sự kiện đầu tiên là trận bóng mềm, vì vậy chúng ta sẽ **gặp nhau tại sân bóng mềm lúc 10 giờ sáng**. Nếu cần hỗ trợ đi lại, vui lòng liên hệ Dave Begley.","translationStatus":"reviewed"},{"id":"h3/test07/131_CBCD.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 131–134","questions":{"131":"C","132":"B","133":"C","134":"D"},"image":"data/h3/test07/131_CBCD.png","markedImage":"marked/h3/test07/131_CBCD.png","translation":"**E-mail từ Trung tâm Super Wash**\n\nKính gửi cô O’Hare,\n\nChúng tôi đã nhận được tin nhắn cho biết cô **đã làm mất** thẻ trả trước có thể nạp tiền. Cô cho biết chiếc thẻ bị mất còn số dư 50 đô la và mong muốn lấy lại số tiền đó.\n\nRất tiếc, chúng tôi không thể đáp ứng yêu cầu này vì hồ sơ cho thấy cô chưa **đăng ký** dịch vụ bảo vệ số dư, dịch vụ cho phép chúng tôi theo dõi số dư trên thẻ.\n\n**Chúng tôi khuyên cô nên đăng ký dịch vụ này để tránh gặp lại vấn đề tương tự.** Đây là dịch vụ giúp khôi phục **bất kỳ** khoản tiền nào còn lại trên thẻ trong trường hợp thẻ bị thất lạc hoặc bị đánh cắp. Nếu đăng ký, trong tương lai chúng tôi sẽ có thể bảo toàn số dư và gửi thẻ thay thế cho cô ngay lập tức.\n\nChúng tôi rất tiếc vì không thể hỗ trợ cô nhiều hơn.\n\nMac Benson  \nTrung tâm Super Wash","translationStatus":"reviewed"},{"id":"h3/test07/135_CBCA.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 135–138","questions":{"135":"C","136":"B","137":"C","138":"A"},"image":"data/h3/test07/135_CBCA.png","markedImage":"marked/h3/test07/135_CBCA.png","translation":"**Thời gian nhận hồ sơ của Quỹ Tín thác Khối Thịnh vượng chung KYR bắt đầu từ ngày 1 tháng 8**\n\nCác tổ chức **đang tìm kiếm** nguồn tài trợ có thể sắp gặp may. Quỹ Tín thác Khối Thịnh vượng chung KYR thông báo rằng các doanh nghiệp địa phương sẽ sớm có thể nộp đơn xin tài trợ. Theo người phát ngôn Meryl Pond, các đề xuất sẽ được tiếp nhận từ ngày 1 tháng 8 đến ngày 30 tháng 9. **Hồ sơ có thể được gửi qua trang web của quỹ.**\n\nCác ứng viên cần lưu ý rằng một phương diện của chương trình đã thay đổi. Trước đây, doanh nghiệp thường dùng khoản tài trợ để bổ sung cho các chương trình hiện có. **Tuy nhiên**, giờ đây họ sẽ phải dùng số tiền này để phát triển các dịch vụ mới cho cộng đồng.\n\n“Chúng tôi sẵn sàng dành cho bên nhận tài trợ nhiều **sự hỗ trợ** hơn trước. Nhưng đổi lại, chúng tôi cũng kỳ vọng nhiều hơn từ khoản kinh phí bổ sung này. Chúng tôi muốn khuyến khích việc xây dựng những chương trình tốt hơn, hiệu quả hơn và có thể tạo ra tác động lớn hơn cho nhiều người hơn,” bà nói.","translationStatus":"reviewed"},{"id":"h3/test07/139_DBCC.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 139–142","questions":{"139":"D","140":"B","141":"C","142":"C"},"image":"data/h3/test07/139_DBCC.png","markedImage":"marked/h3/test07/139_DBCC.png","translation":"**Thông báo của Phòng Quản lý Chất thải thành phố**\n\nTừ trước đến nay, Phòng Quản lý Chất thải thành phố vẫn vệ sinh các đường phố ở Brentridge hai lần mỗi tháng. Tuy nhiên, do rác thải tích tụ nhanh tại một số khu vực, chúng tôi đã quyết định tăng tần suất dịch vụ lên một lần mỗi tuần, bắt đầu từ ngày 1 tháng 5. **Bằng cách này**, chúng tôi hy vọng vừa cải thiện diện mạo của các khu vực công cộng, vừa loại bỏ những chất có thể gây ô nhiễm môi trường.\n\nCó một vài điều quý vị cần lưu ý. Trước hết, mỗi khu phố đã được ấn định một ngày trong tuần để vệ sinh đường phố. **Vui lòng truy cập trang web của chúng tôi để biết lịch vệ sinh tại khu vực của quý vị.** Ngoài ra, cư dân phải bảo đảm lề đường luôn **thông thoáng, dễ tiếp cận** vào những thời điểm này. Điều đó rất quan trọng vì nếu không, xe vệ sinh của chúng tôi sẽ không thể tiếp cận lề đường. Chúng tôi chân thành cảm ơn sự **hợp tác** của quý vị đối với những thay đổi này.","translationStatus":"reviewed"},{"id":"h3/test07/143_BACB.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 143–146","questions":{"143":"B","144":"A","145":"C","146":"B"},"image":"data/h3/test07/143_BACB.png","markedImage":"marked/h3/test07/143_BACB.png","translation":"**Balter Food đạt thỏa thuận với Lexi’s**\n\nNgày 21 tháng 7 — Chuỗi cửa hàng tạp hóa toàn quốc Balter Food **đã mua lại** công ty nông sản hữu cơ Lexi’s. Các cuộc đàm phán bắt đầu từ tháng 10 năm ngoái và thương vụ được hoàn tất vào thứ Hai tuần trước.\n\nLexi’s được thành lập cách đây gần sáu thập kỷ nhưng đã chật vật phục hồi sau thua lỗ trong một thời gian dài. Nỗ lực tiến vào thị trường California bằng cách mở các địa điểm mới đã **không thành công**. Điều này khiến Lexi’s tụt lại sau các đối thủ.\n\nĐại diện Balter Food cho biết 15 trong số 29 cửa hàng Lexi’s hiện đang được đổi tên thành “Balter”. **Tên của tất cả các chi nhánh còn lại sẽ được thay đổi dần trong vòng một năm.** Hoạt động của các cửa hàng này sẽ được theo dõi sát sao để xác định xem có cần điều chỉnh thêm hay không. Theo các chuyên gia tư vấn, đây là chiến lược tốt nhất vì những khách hàng trung thành của Lexi’s có thể cần thời gian để **thích nghi** trong giai đoạn chuyển đổi.","translationStatus":"reviewed"},{"id":"h3/test07/147_DB.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 147–148","questions":{"147":"D","148":"B"},"image":"data/h3/test07/147_DB.png","markedImage":"marked/h3/test07/147_DB.png","translation":"**Sân bay Walters Memorial — Thông báo ngày 12 tháng 3**\n\n**Nhà để xe B của Sân bay Walters Memorial đóng cửa để sửa chữa kết cấu trong khoảng sáu tháng.** Hành khách có thể đỗ xe tại nhà để xe A hoặc tại một trong các bãi đỗ bên ngoài sân bay.\n\nBan quản lý sân bay đã tăng gấp đôi số xe đưa đón từ mỗi bãi đỗ bên ngoài, gồm Bãi đỗ xe Well’s và Bãi đỗ xe Aviation Road. Xe đưa đón sẽ đón hành khách gần quầy dịch vụ khách hàng của từng bãi. Tại sân bay, điểm trả và đón khách nằm trước cửa chính của Nhà ga A. **Tất cả xe đưa đón đều miễn phí và hoạt động liên tục suốt cả ngày.**\n\nChúng tôi xin lỗi vì mọi bất tiện mà tình trạng này có thể gây ra cho hành khách.","translationStatus":"reviewed"},{"id":"h3/test07/149_CD.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 149–150","questions":{"149":"C","150":"D"},"image":"data/h3/test07/149_CD.png","markedImage":"marked/h3/test07/149_CD.png","translation":"**Chuỗi tin nhắn**\n\n**Riya Shankar — 9:10 sáng**\nHôm qua tôi nhận được một khiếu nại của khách hàng về trang web. Không biết bây giờ bạn có thời gian kiểm tra không?\n\n**Noel Mitchell — 9:13 sáng**\nKhiếu nại có liên quan đến trang Câu hỏi thường gặp không? Tối qua chúng tôi vừa sửa xong trang đó. **Mọi thứ hẳn đã hoạt động bình thường.**\n\n**Riya Shankar — 9:14 sáng**\nNghe vậy thì tốt, nhưng vấn đề thực ra nằm ở trang nội dung cửa hàng. Khách hàng nói rằng **một số hình ảnh về các sản phẩm mới nhất của chúng ta không tải được.**\n\n**Noel Mitchell — 9:18 sáng**\nNếu sự cố xảy ra vào tối qua thì có lẽ là vì chúng tôi đang cập nhật hình ảnh. Nhưng tôi sẽ kiểm tra lại trang đó và phản hồi cho bạn ngay.\n\n**Riya Shankar — 9:20 sáng**\nTuyệt vời. Cảm ơn bạn đã giúp!","translationStatus":"reviewed"},{"id":"h3/test07/151_DA.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 151–152","questions":{"151":"D","152":"A"},"image":"data/h3/test07/151_DA.png","markedImage":"marked/h3/test07/151_DA.png","translation":"**Tidy Up Time!**\n\nTuyết đang tan, và điều đó chỉ có thể mang một ý nghĩa: mùa xuân đã đến! Đã đến lúc dọn sạch bụi bẩn tích tụ suốt mùa đông và vứt bỏ những món đồ cũ bạn không còn cần nữa. Đây có thể là những công việc vất vả, vậy tại sao không để đội ngũ vệ sinh Tidy Up Time làm thay bạn?\n\nChúng tôi tính phí theo giờ hoặc theo ngày (7 giờ) đối với dịch vụ vệ sinh một lần và **giảm giá 10% cho khách hàng đăng ký vệ sinh định kỳ hằng tuần hoặc hằng tháng**. Gói tiêu chuẩn bao gồm khử khuẩn toàn bộ ngôi nhà, phủi bụi mọi bề mặt và lau tất cả cửa sổ. Ngoài ra, chúng tôi có thể giúp gom những món đồ không cần dùng rồi cho vào túi hoặc hộp mà không thu thêm phí.\n\nVới một khoản phụ phí, chúng tôi còn cung cấp các dịch vụ khác như giặt sâu thảm, nệm và đồ nội thất bọc vải, cũng như **giặt và ủi quần áo, khăn tắm và ga trải giường**.\n\nĐể biết thêm thông tin về giá cả và dịch vụ, vui lòng truy cập www.tidyuptime.com.","translationStatus":"reviewed"},{"id":"h3/test07/153_BDB.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 153–155","questions":{"153":"B","154":"D","155":"B"},"image":"data/h3/test07/153_BDB.png","markedImage":"marked/h3/test07/153_BDB.png","translation":"**Hướng dẫn sử dụng bảng điều khiển RoadRunner Sedan 12**\n\nViệc sử dụng bảng điều khiển của RoadRunner Sedan 12 chưa bao giờ dễ dàng đến thế. Giống như mẫu xe năm ngoái, xe được trang bị giao diện màn hình cảm ứng tiên tiến cho phép bạn điều khiển nhiều chức năng khác nhau. Các chức năng này gồm phát nhạc, **tìm đường bằng Hệ thống Định vị Toàn cầu (GPS)**, gọi điện qua loa ngoài, điều chỉnh nhiệt độ và nhiều tiện ích khác. Lần đầu cắm chìa khóa vào ổ điện, giao diện sẽ xuất hiện và yêu cầu bạn chọn ngôn ngữ. Sau đó, bạn có thể sử dụng hệ thống.\n\nMỗi chức năng được thể hiện bằng một biểu tượng. Chẳng hạn, để mở GPS, chỉ cần nhấn biểu tượng bản đồ. Một bản đồ kỹ thuật số cùng một số nút sẽ hiện ra. Hãy nhập hoặc đọc to điểm đến, hệ thống sẽ đề xuất một vài tuyến đường. **Chọn tuyến đường bạn muốn trong số các phương án được đưa ra.** Để mở chức năng kh
