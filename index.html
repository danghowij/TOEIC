òng hội nghị ở tầng ba. Lịch thuyết trình tại đó sẽ được chuyển sang các khu vực khác trong tòa nhà.\n\nMười hai nhân viên thường làm việc cố định ở tầng ba sẽ được bố trí chỗ tại những nơi khác. Những nhân viên này cần **chờ hướng dẫn tiếp theo từ trưởng nhóm**.\n\nChúng tôi xin lỗi vì sự bất tiện và tin rằng mọi người có thể phối hợp để quá trình diễn ra thuận lợi. Nếu có câu hỏi, hãy liên hệ trưởng nhóm.","translationStatus":"reviewed"},{"id":"h2/test03/165_BBC.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 165–167","questions":{"165":"B","166":"B","167":"C"},"image":"data/h2/test03/165_BBC.png","markedImage":"marked/h2/test03/165_BBC.png","translation":"**Lunch on Demand — Đặt bữa trưa trực tuyến**\n\nTừ ngày 8 tháng 8, khách hàng không cần xếp hàng dài. Chỉ cần xem thực đơn, đặt món và thanh toán trên trang web. Chúng tôi sẽ cung cấp **mã xác nhận và thời gian món ăn sẵn sàng**. Hãy đến đúng giờ, đọc mã và nhận hộp thức ăn ngon, lành mạnh.\n\nThực đơn thay đổi hằng tuần nhưng luôn có:\n\n- **Súp:** rau tươi, đậu hoặc đậu lăng, mì gạo; phù hợp với người ăn chay.\n- **Panini:** bánh mì nguyên cám nướng, dùng kèm khoai lang chiên.\n- **Món hầm và cà ri:** dùng kèm cơm hoặc bánh mì.\n- **Salad:** rau xanh giòn cùng nước xốt ít béo.\n\nTrong tháng 8, khách hàng đã đăng ký sẽ nhận phiếu 10 đô la cho mỗi người mới họ giới thiệu đăng ký trang web.\n\nTrang không nói rằng **mọi món đều có thể tùy chỉnh**.","translationStatus":"reviewed"},{"id":"h2/test03/168_DCAC.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 168–171","questions":{"168":"D","169":"C","170":"A","171":"C"},"image":"data/h2/test03/168_DCAC.png","markedImage":"marked/h2/test03/168_DCAC.png","translation":"**Chuỗi tin nhắn của đội cung cấp suất ăn Kitchen Belle**\n\n**Michele Coulter — 10:00**  \nNhà sản xuất *Timelight* muốn gia hạn hợp đồng cung cấp suất ăn thêm hai năm vì phim đã được gia hạn. Lịch có giữ như năm ngoái không?\n\n**Jane Painter — 10:00**  \nTin tuyệt vời! Henry thường phụ trách bữa sáng, nhưng nếu anh ấy đồng ý, tôi muốn chuyển sang ca sáng thay vì ca trưa.\n\n**Graham Fulton — 10:04**  \nHenry đang ở cùng tôi và nói **anh ấy chấp nhận đề nghị đổi ca của Jane**. Anh ấy thích ca giữa ngày hơn. Tôi vẫn muốn ca 11 giờ. Năm nay có quay buổi tối không?\n\n**Michele Coulter — 10:05**  \nJane và Graham làm 7:30–11:00; Henry và tôi làm 11:30–3:30. Sẽ có một số **ca tối để được trả thêm**, nhưng không ca nào kết thúc sau nửa đêm. Mùa này phim còn quay ngoài trường quay nên cần điều chỉnh. Chúng ta sẽ bàn khi trở lại sau kỳ nghỉ tuần tới.\n\n**Jane Painter và Graham Fulton — 10:07**  \nSố diễn viên và đoàn phim có giữ nguyên không? Có vẻ công việc nhiều hơn năm ngoái.\n\n**Michele Coulter — 10:08**  \nTổng số người cần phục vụ tăng từ 67 lên 88. Công việc nhiều hơn nhưng thù lao cũng tăng, nên có thể thuê thêm vài trợ lý chuẩn bị thức ăn.","translationStatus":"reviewed"},{"id":"h2/test03/172_CBCD.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 172–175","questions":{"172":"C","173":"B","174":"C","175":"D"},"image":"data/h2/test03/172_CBCD.png","markedImage":"marked/h2/test03/172_CBCD.png","translation":"**Thông báo chuyển chỗ làm cho nhân viên quảng cáo**\n\nGửi: Toàn thể nhân viên  \nTừ: Eleanor Danes, Giám đốc Quảng cáo\n\nTừ đầu tháng tới, bộ phận sẽ chia thành hai. Nhân viên phụ trách quảng cáo trực tuyến chuyển đến tầng hai và thuộc “Bộ phận Quảng bá Trực tuyến”. Nhân viên còn lại tiếp tục ở tầng ba dưới tên “Bộ phận Quảng cáo”. **Hai bộ phận sẽ có quản lý riêng.**\n\nNgày 27 và 28 tháng 2, đơn vị vận chuyển sẽ di dời nội thất và thiết bị. Nhân viên quảng bá trực tuyến phải dọn bàn và cho đồ cá nhân vào **thùng nhựa được phát ngày 26 tháng 2**. Khi đến văn phòng ngày 1 tháng 3, biển ghi **vị trí làm việc được phân công** sẽ được đặt cạnh cửa chính của bộ phận.\n\nViệc chia tách cũng ảnh hưởng một số nhân viên vẫn ở tầng ba. Thành viên thuộc các nhóm của Timothy Wendel, Sinead Barry và Gina Jong sẽ chuyển sang bàn khác; họ cũng phải đóng gói đồ trước ngày 26 tháng 2.","translationStatus":"reviewed"},{"id":"h2/test03/176_BBACA.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 176–180","questions":{"176":"B","177":"B","178":"A","179":"C","180":"A"},"image":"data/h2/test03/176_BBACA.png","markedImage":"marked/h2/test03/176_BBACA.png","translation":"**Tài liệu 1 — Email giới thiệu họa sĩ tự do**\n\nSimon Soranes hỏi Rebecca Katrinsky liệu dự án sách điện tử thiếu nhi tại Turnip Books còn cần họa sĩ tự do hay không. Ông giới thiệu bạn mình là Carl Deluth, người có hơn tám năm vẽ minh họa cho văn học và truyện tranh thiếu nhi. Tác phẩm của Carl từng được trưng bày tại Bảo tàng Nghệ thuật Hiện đại Corander; Simon đính kèm một bài báo về các tác phẩm gần đây.\n\nCarl muốn biết lịch dự án. Nếu phù hợp, Rebecca có thể liên hệ trực tiếp để nhận hồ sơ và mẫu tác phẩm. Simon mời cô hỏi nếu có bất kỳ **ý kiến hoặc mối quan tâm** nào.\n\n---\n\n**Tài liệu 2 — Phản hồi của Rebecca Katrinsky**\n\nRebecca và đồng nghiệp rất ấn tượng với hồ sơ, tác phẩm và bài báo đính kèm. Dự án gồm 12 sách truyện, mỗi cuốn khoảng 25 trang, thường có một hình minh họa mỗi trang nhưng đôi khi **hình ảnh trải rộng trên hai trang**. Hình cũng được dùng trong sách điện tử và trò chơi giáo dục nên phải cung cấp đúng định dạng.\n\nQuy trình: năm ngày làm việc để nộp bản phác thảo; phản hồi trong hai ngày; chín ngày để chỉnh sửa, hoàn thiện nét và màu; đánh giá cuối trong hai ngày; và **một ngày làm việc để thực hiện chỉnh sửa cuối cùng**.\n\nNếu Carl quan tâm, Rebecca sẽ sắp xếp phỏng vấn rồi trao đổi thù lao và hợp đồng.","translationStatus":"reviewed"},{"id":"h2/test03/181_BBACD.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 181–185","questions":{"181":"B","182":"B","183":"A","184":"C","185":"D"},"image":"data/h2/test03/181_BBACD.png","markedImage":"marked/h2/test03/181_BBACD.png","translation":"**Tài liệu 1 — Thay đổi chương trình lương hưu tại Dakota Logistics**\n\nTheo chính sách hiện tại, nhân viên dưới năm năm đóng 1,8% lương vào quỹ hưu trí; người làm từ năm năm trở lên đóng 2,7%.\n\nTừ ngày 1 tháng 1, mọi nhân viên được tự chọn mức đóng. Ngoài hai mức hiện tại, họ có thể đóng tối đa **3,5% lương**. Trong tháng 12 — tức khoảng một tháng để hành động — mọi người cần thông báo lựa chọn. Nhân viên có thể đặt lịch với trưởng phòng nhân sự để được tư vấn.\n\n---\n\n**Tài liệu 2 — Email của Adam Cartwright**\n\nAdam hiện đóng 1,8%. Sau khi hợp đồng được gia hạn vào tháng 9, ông được tăng lương và muốn **nâng mức đóng lên tối đa 3,5%**. Ông rảnh cả ngày thứ Ba, thứ Năm và trước 2 giờ chiều thứ Sáu để trao đổi với Sarah Chang.\n\nSarah Chang là **người đứng đầu một bộ phận tại Dakota Logistics**, cụ thể là phòng nhân sự.","translationStatus":"reviewed"},{"id":"h2/test03/186_CCDBD.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 186–190","questions":{"186":"C","187":"C","188":"D","189":"B","190":"D"},"image":"data/h2/test03/186_CCDBD.png","markedImage":"marked/h2/test03/186_CCDBD.png","translation":"**Tài liệu 1 — Hội nghị Khu vực Miền Đông lần thứ 8 của AME**\n\nHội nghị diễn ra ngày 10–11 tháng 3 tại Clifton, New Jersey, do chi hội New Jersey tổ chức và Trường Khoa học Vật liệu, Đại học Clifton đăng cai. Kỹ sư và nhà khoa học được tìm hiểu công nghệ mới, kết nối, tham gia bài thuyết trình, hội thảo, hoạt động và **tham quan cơ sở vật chất**. Chương trình không đề cập bữa trưa cùng học sinh.\n\nAME tiếp tục hỗ trợ chương trình tiếp cận kỹ thuật cho học sinh trung học. Doanh nghiệp có thể quảng cáo trong cẩm nang hoặc trưng bày tài liệu tại khu vực triển lãm.\n\n---\n\n**Tài liệu 2 — Email của Paula Vance**\n\nHiller Engineering đã đăng ký làm **nhà tài trợ hội nghị**. Paula gửi kèm quảng cáo toàn trang; các tài liệu tiếp thị khác sẽ được gửi trong email riêng khi hoàn tất. Công ty nhận bốn vé trong gói quyền lợi.\n\nMột đồng nghiệp châu Âu không phải thành viên AME muốn mua vé toàn hội nghị tại chỗ. Theo bảng phí, vé toàn hội nghị tại chỗ cho người không phải thành viên là **460 đô la**.\n\n---\n\n**Tài liệu 3 — Phí đăng ký**\n\nHọc sinh trung học tham gia chương trình tiếp cận được **miễn phí**. Sinh viên đại học và sau đại học trả phí theo bảng. Vé đã thanh toán không được hoàn lại.","translationStatus":"reviewed"},{"id":"h2/test03/191_BCCDC.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 191–195","questions":{"191":"B","192":"C","193":"C","194":"D","195":"C"},"image":"data/h2/test03/191_BCCDC.png","markedImage":"marked/h2/test03/191_BCCDC.png","translation":"**Tài liệu 1 — Khách sạn Grand Deville Vancouver**\n\nKhách sạn 10 tầng mới sẽ **khai trương tại trung tâm Vancouver cuối tháng 8**. Tiện nghi gồm hồ bơi trong nhà, phòng tập miễn phí, nhà hàng La Vie Boheme phục vụ món quốc tế, phòng hội nghị 100 người, salon 60 người, phòng họp 60 người và phòng khiêu vũ 200 người. Mỗi phòng có bồn tắm nước nóng, minibar, truyền hình cáp và cabin tắm nhiều vòi.\n\n---\n\n**Tài liệu 2 — Email của Derek Raymond**\n\nBCTI muốn tổ chức tiệc cho khoảng 150 khách để mừng một số thành viên vừa nhận giải khoa học danh giá, đồng thời đặt tám phòng đơn cho đêm 27 tháng 9.\n\n---\n\n**Tài liệu 3 — Chương trình tiệc vinh danh**\n\nSự kiện dành cho nhóm nghiên cứu bọ thông, tổ chức ngày 27 tháng 9. Với khoảng 150 khách, địa điểm phù hợp là **phòng khiêu vũ sức chứa 200 người**.\n\nChương trình gồm phát biểu khai mạc, bữa tối do La Vie Boheme chuẩn bị, trao giải, bài nói chuyện của trưởng nhóm Edwina Paige và nhạc jazz trực tiếp. Khách ở lại qua đêm được dùng **bữa sáng buffet miễn phí sáng 28 tháng 9**; điều này cho thấy Derek Raymond có thể nhận bữa sáng miễn phí.","translationStatus":"reviewed"},{"id":"h2/test03/196_CBDDB.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 196–200","questions":{"196":"C","197":"B","198":"D","199":"D","200":"B"},"image":"data/h2/test03/196_CBDDB.png","markedImage":"marked/h2/test03/196_CBDDB.png","translation":"**Tài liệu 1 — Thông báo bảo trì ga tàu điện ngầm**\n\nViệc bảo trì các ga Ratner, Sofner và Hambrick bắt đầu ngày 15 tháng 8, kéo dài hai tuần đến ngày 28. Đội thi công làm việc từ 7 giờ sáng đến 6 giờ tối nên **sẽ có tiếng ồn trong giờ làm việc**. Dịch vụ tàu tại ba ga tạm ngừng; thành phố cung cấp phương tiện thay thế.\n\n---\n\n**Tài liệu 2 — Dịch vụ xe buýt tạm thời**\n\nXe chạy 5:30 sáng–nửa đêm:\n\n- Bus 23: Ratner ↔ Sofner\n- Bus 24: Ratner ↔ Hambrick\n- Bus 25: Sofner ↔ Hambrick\n- **Bus 26: Ratner ↔ Grand Central**\n\nDịch vụ hoạt động đến **ngày sau khi bảo trì hoàn tất — ngày 29 tháng 8**. Trang web cung cấp bản đồ vị trí chính xác của các điểm xe buýt.\n\n---\n\n**Tài liệu 3 — Tin nhắn của Jill Addis**\n\nJill đặt bàn trưa lúc 1 giờ tại nhà hàng Ý Di Paolo’s để **gặp Nick Lieb trong bữa trưa và trao đổi hợp đồng Cross Media**. Nhà hàng đối diện ga Grand Central. Vì ga Ratner gần Nick nhất đang đóng cửa, Jill đề nghị dùng phương tiện công cộng.\n\nNick nhiều khả năng đi **Bus 26 từ Ratner đến Grand Central**.","translationStatus":"reviewed"},{"id":"h2/test04/131_BADA.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 131–134","questions":{"131":"B","132":"A","133":"D","134":"A"},"image":"data/h2/test04/131_BADA.png","markedImage":"marked/h2/test04/131_BADA.png","translation":"**Thông báo đỗ xe tại trung tâm Frederickton**\n\nViệc đỗ xe dọc các đường phố tại khu trung tâm Frederickton bị cấm vào thứ Ba thứ hai và thứ tư hằng tháng, từ 8 giờ sáng đến 12 giờ trưa, để phục vụ công tác vệ sinh. **Trong thời gian này, xe và đội vệ sinh của thành phố sẽ làm việc trên đường.**\n\nNgười vi phạm sẽ nhận vé phạt 15 đô la cho ba lần đầu. Khoản tiền phải được thanh toán trong vòng 30 ngày kể từ khi **nhận** vé.\n\nQuy định thành phố cho phép chủ xe phản đối tính hợp lệ của vé trong cùng thời hạn 30 ngày và kháng nghị nếu không đồng ý với kết quả.\n\nĐối với những lần vi phạm **tiếp theo**, xe sẽ bị kéo đi và chủ xe phải chịu chi phí. Việc liên tục bất cẩn cũng có thể **dẫn đến** những hình phạt bổ sung.","translationStatus":"reviewed"},{"id":"h2/test04/135_CCBD.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 135–138","questions":{"135":"C","136":"C","137":"B","138":"D"},"image":"data/h2/test04/135_CCBD.png","markedImage":"marked/h2/test04/135_CCBD.png","translation":"**Chủ đề: Hỏi về máy in Cambridge XD**\n\nNgày 8 tháng 7\n\nKính gửi cô Barton,\n\nTôi viết thư về một trong những **sản phẩm** được quảng cáo trong tờ rơi giảm giá tuần trước. Máy in đa chức năng Cambridge XD được niêm yết với giá ưu đãi chỉ 449 đô la. Vì chưa từng thấy sản phẩm này được giảm nhiều đến vậy, tôi rất **mong muốn** mua một chiếc.\n\nTuy nhiên, tôi nhận thấy quảng cáo ghi số lượng có thể hạn chế. Điều này không có gì ngạc nhiên vì đây là một mẫu máy rất **phổ biến**. **Vui lòng báo cho tôi sớm nhất có thể nếu vẫn còn hàng.**\n\nTôi mong nhận được phản hồi.\n\nCảm ơn cô,  \nElmer Wittson","translationStatus":"reviewed"},{"id":"h2/test04/139_BDBC.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 139–142","questions":{"139":"B","140":"D","141":"B","142":"C"},"image":"data/h2/test04/139_BDBC.png","markedImage":"marked/h2/test04/139_BDBC.png","translation":"**Sân bay Tulsa sẽ được cải tạo quy mô lớn**\n\nTheo thông báo của Sở Hàng không, sân bay Tulsa sẽ có diện mạo mới trong năm nay. Người phát ngôn Oliver Conway cho biết: “Để đáp ứng sự tăng trưởng **liên tục** của ngành hàng không trong khu vực, chính quyền thành phố và ban quản lý sân bay quyết định đây là thời điểm thích hợp để cải tạo.”\n\nNgoài đường băng bổ sung và các cổng mới, phần nội thất sân bay **sẽ trải qua** một cuộc chuyển đổi đáng kể nhằm tăng cường an ninh và giúp hành khách di chuyển thuận tiện hơn.\n\nSân bay được xây dựng hơn bốn thập kỷ trước với chi phí 11 triệu đô la, nhưng dự án hiện tại dự kiến vượt một tỷ đô la. **Con số này là hợp lý xét đến quy mô đáng kể của dự án.**\n\nNếu mọi việc đúng kế hoạch, sân bay Tulsa mới sẽ hoàn thành vào năm sau và **có** các thiết bị cùng cơ sở vật chất hiện đại nhất.","translationStatus":"reviewed"},{"id":"h2/test04/143_DBBC.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 143–146","questions":{"143":"D","144":"B","145":"B","146":"C"},"image":"data/h2/test04/143_DBBC.png","markedImage":"marked/h2/test04/143_DBBC.png","translation":"**Thư giới thiệu sản phẩm ca cao Eucacao**\n\nKính gửi cô Lewis,\n\nTôi viết thư liên quan đến cuộc trò chuyện của chúng ta tại Food Expo ở Bắc Kinh năm ngoái. Như cô có thể nhớ, tôi đang trong quá trình **thành lập** một trang trại và nhà máy chế biến ca cao tên Eucacao.\n\nTôi bắt đầu dự án sau khi **thu được** một số hạt ca cao chất lượng cao từ Nam Mỹ. Ban đầu việc trồng khá khó khăn, nhưng tôi đã sản xuất thành công một lượng hạt đáng kể như trong danh mục gửi kèm.\n\nTrong kiện hàng đi cùng thư này có một số **mẫu sản phẩm**. Sau khi dùng thử, vui lòng cho tôi biết đánh giá của cô về chất lượng. **Tôi hy vọng cô sẽ cân nhắc đặt mua một nguồn hàng cho công ty mình.** Tôi tin sản phẩm của chúng tôi sẽ giúp tăng doanh thu của cô.\n\nCảm ơn cô và mong sớm nhận được phản hồi.\n\nDaniel Gerber","translationStatus":"reviewed"},{"id":"h2/test04/147_CB.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 147–148","questions":{"147":"C","148":"B"},"image":"data/h2/test04/147_CB.png","markedImage":"marked/h2/test04/147_CB.png","translation":"**Thư giới thiệu ứng viên Alice Glover**\n\nKính gửi ông Sawyer,\n\nTôi viết thư thay mặt cô Alice Glover, người gần đây đã ứng tuyển vị trí chuyên viên phân tích nghiên cứu tại TLA Financial Services. Cô Glover từng làm công việc tương tự tại công ty chúng tôi hơn năm năm. Là quản lý trực tiếp của cô trong suốt thời gian đó, tôi nhận thấy cô là một nhân viên mẫu mực và đồng nghiệp đáng quý. Vì vậy, tôi **trân trọng giới thiệu cô cho vị trí tại công ty ông**.\n\nNhiệm vụ của cô Glover gồm thu thập dữ liệu nghiên cứu, phân tích bằng phần mềm và trình bày kết quả với lãnh đạo cấp cao. Cô giao tiếp xuất sắc với các giám đốc thuộc nhiều cấp tại công ty khách hàng và luôn hoàn thành công việc dù làm độc lập hay theo nhóm.\n\nThư **không nói cô từng được thăng chức lên cấp quản lý**.\n\nNếu cần thêm thông tin, vui lòng liên hệ Lpearson@ambroseconsult.com.\n\nLeslie Pearson  \nAmbrose Consulting","translationStatus":"reviewed"},{"id":"h2/test04/149_BC.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 149–150","questions":{"149":"B","150":"C"},"image":"data/h2/test04/149_BC.png","markedImage":"marked/h2/test04/149_BC.png","translation":"**Chuỗi tin nhắn về chiếc xe minivan đang bán**\n\n**Sharon Van Deist — 9:38**  \nTôi thấy quảng cáo bán xe minivan của anh trên báo sáng nay. Tôi đang tìm xe cỡ đó. Xe còn không?\n\n**Enrico Lopez — 9:40**  \nCòn. Cô có muốn đến xem và **lái thử chiếc xe đang bán** không? Tôi ở 2230 Sawyer Avenue, gần Broad Street.\n\n**Sharon Van Deist — 9:47**  \nCăn hộ của tôi ở gần đó, tại Madison Heights trên Finn Street. Anh đang ở nhà chứ? Tôi có thể đi bộ đến trong khoảng 15 phút.\n\n**Enrico Lopez — 9:51**  \nHiện tôi đang ở siêu thị trên Baird Avenue nhưng sẽ về nhà trong vòng 30 phút.\n\n**Sharon Van Deist — 9:53**  \nĐược, tôi sẽ đến lúc 10 giờ 30 nếu phù hợp với anh.\n\n**Enrico Lopez — 9:54**  \n**Thời gian đó phù hợp; tôi có thể gặp cô lúc 10 giờ 30.**","translationStatus":"reviewed"},{"id":"h2/test04/151_BC.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 151–152","questions":{"151":"B","152":"C"},"image":"data/h2/test04/151_BC.png","markedImage":"marked/h2/test04/151_BC.png","translation":"**Thông báo dành cho khách hàng Herstel**\n\nHerstel thay đổi giờ hoạt động của các trung tâm dịch vụ sau bán hàng để phù hợp hơn với nhu cầu khách hàng. Từ ngày 1 tháng 10, trung tâm sửa chữa không cần hẹn trước mở cửa:\n\n- Thứ Hai–thứ Sáu: 7 giờ sáng–8 giờ tối\n- Thứ Bảy: 8 giờ sáng–6 giờ tối\n- Chủ nhật và ngày lễ: đóng cửa; khách vẫn có thể hỏi thông tin tại cửa hàng\n\nKhách hàng nên đặt lịch trước khi mang **thiết bị gia dụng** đến sửa. Với thiết bị lớn như máy giặt và máy sấy, một số địa điểm cho phép đặt dịch vụ sửa tại nhà 24 giờ mỗi ngày, bảy ngày mỗi tuần.\n\nCác chuyến sửa tại nhà được lên lịch **sau giờ đóng cửa thông thường lúc 8 giờ tối** sẽ chịu thêm phí.\n\nDanh sách địa điểm: 555-3030. Giá và điều khoản: www.herstel.com/service.","translationStatus":"reviewed"},{"id":"h2/test04/153_CD.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 153–154","questions":{"153":"C","154":"D"},"image":"data/h2/test04/153_CD.png","markedImage":"marked/h2/test04/153_CD.png","translation":"**Hexagon Plastics Manufacturing — Chính sách môi trường**\n\nTừ tuần tới, chính quyền Wharton sẽ triển khai chương trình môi trường do Green World Environmental Group xây dựng và công ty chúng ta quyết định tham gia. Theo thỏa thuận, công ty sẽ giảm tiêu thụ tài nguyên thiên nhiên để hạn chế tác động đến môi trường.\n\nThông báo này dành cho **nhân viên công ty** và đưa ra các thay đổi sau:\n\n- Nhân viên tự mang cốc uống cà phê vì công ty không còn cung cấp cốc giấy.\n- Khi có thể, dùng cả hai mặt giấy để in bản nháp, nhằm giảm lượng giấy sử dụng.\n- Tắt máy tính và thiết bị trước khi rời văn phòng buổi tối để tiết kiệm điện.\n\nCác biện pháp vừa giảm tác động môi trường vừa tiết kiệm chi phí. Thông báo **không đề cập việc mua vật tư từ các nhà sản xuất bền vững**.\n\nCảm ơn sự hợp tác đầy đủ của mọi người.","translationStatus":"reviewed"},{"id":"h2/test04/155_CBB.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 155–157","questions":{"155":"C","156":"B","157":"B"},"image":"data/h2/test04/155_CBB.png","markedImage":"marked/h2/test04/155_CBB.png","translation":"**Uplift Airlines được phép hoạt động trở lại**\n\nCơ quan Hàng không Quốc gia (NAA) đã cho phép hãng hàng không địa phương Uplift Airlines khôi phục dịch vụ. Một năm trước, hãng bị yêu cầu ngừng bay sau hàng loạt tai nạn. Điều tra cho thấy Uplift cắt giảm chi phí bằng cách bỏ qua các đợt kiểm tra an toàn quan trọng; hãng phải nộp phạt lớn và thay đổi cách vận hành.\n\nBan giám đốc đã mua máy bay mới, **thay thế các giám đốc chủ chốt**, triển khai chương trình đào tạo và sửa đổi chính sách. Họ **không hợp tác hoặc sáp nhập với một hãng khác**.\n\nNhà đầu tư tin rằng Uplift có thể cạnh tranh trở lại, thậm chí vượt Jetspeed trong nhóm khách hàng chú trọng giá rẻ.\n\nChủ tịch NAA Anthony Hovis hy vọng đây là lời cảnh báo cho các hãng giá rẻ khác: một số hãng **quá tập trung vào tiết kiệm chi phí**, nhưng chi phí vận hành không được phép ảnh hưởng đến an toàn hành khách.","translationStatus":"reviewed"},{"id":"h2/test04/158_CBB.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 158–160","questions":{"158":"C","159":"B","160":"B"},"image":"data/h2/test04/158_CBB.png","markedImage":"marked/h2/test04/158_CBB.png","translation":"**Chủ đề: Sản phẩm kỷ niệm Ngày Trái Đất**\n\nKính gửi cô Clark,\n\nBưu điện Quốc gia vừa phát hành **tem và phong bì mới kỷ niệm Ngày Trái Đất**. Cả hai đều in tranh động vật của họa sĩ động vật hoang dã Carla Anderson và là những món bổ sung đáng giá cho bộ sưu tập.\n\nSố lượng giới hạn: chỉ 4.000 sản phẩm mỗi loại. Hiện chúng được bán tại các chi nhánh bưu điện và một số hiệu sách, bảo tàng trên toàn quốc.\n\nVì Flame Stamp Club là tổ chức đăng ký dành cho **người sưu tập tem**, câu lạc bộ có thể đặt trực tiếp từ Bưu điện Quốc gia nếu trả lời email trước thứ Sáu, ngày 6 tháng 6.\n\nSau ngày 6 tháng 6, thành viên vẫn có thể mua phong bì bằng cách **đến một chi nhánh bưu điện**.\n\nTrân trọng,  \nGeorge Adachi  \nGiám đốc Bán lẻ, Bưu điện Quốc gia","translationStatus":"reviewed"},{"id":"h2/test04/161_DAC.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 161–163","questions":{"161":"D","162":"A","163":"C"},"image":"data/h2/test04/161_DAC.png","markedImage":"marked/h2/test04/161_DAC.png","translation":"**Olympex giới thiệu máy tập toàn thân EM-900**\n\nKính gửi cô Connor,\n\nCảm ơn cô đã quan tâm đến máy tập elip EM-900. Thiết bị mang lại bài tập toàn thân tại nhà. Bàn đạp điều chỉnh được thiết kế để giảm chấn thương đầu gối, mắt cá và giảm khả năng đau quanh ngón chân.\n\nMáy có 15 mức độ khó và 8 chương trình tập, lựa chọn qua bảng điều khiển. Sản phẩm được bảo hành linh kiện bốn năm và có dịch vụ sau bán hàng năm năm. Các tính năng gồm màn hình LCD, quạt làm mát, giá đựng chai nước, máy đo nhịp tim và hệ thống âm thanh.\n\nThông báo **không nói máy đi kèm linh kiện dự phòng**.\n\nSản phẩm còn hàng nhưng chưa bán tại cửa hàng. Hiện tại, khách chỉ có thể mua bằng cách **đặt hàng trực tuyến tại www.olympex.com** với giá giới thiệu 1.500 đô la. Đơn hàng trong tháng này được giao miễn phí.\n\nBridget Larson  \nQuản lý Kinh doanh, Olympex","translationStatus":"reviewed"},{"id":"h2/test04/164_CDDC.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 164–167","questions":{"164":"C","165":"D","166":"D","167":"C"},"image":"data/h2/test04/164_CDDC.png","markedImage":"marked/h2/test04/164_CDDC.png","translation":"**Thư giới thiệu tổ chức cho vay Yatna**\n\nKính gửi cô Bradley,\n\nCảm ơn cô đã đăng ký làm thành viên ủng hộ sứ mệnh giảm nghèo toàn cầu của Yatna. Đến nay, chúng tôi đã cho người vay tại 78 quốc gia vay hơn 500 triệu đô la, giúp hàng nghìn người có cơ hội thực hiện mục tiêu và ước mơ.\n\nKhi sẵn sàng cho khoản vay đầu tiên, hãy vào www.yatna.com/lend. Số tiền tối thiểu là 25 đô la. Hồ sơ người vay cho biết số tiền cần, mục đích vay và thời gian dự kiến hoàn trả. Sau khi chọn người muốn giúp, cô có thể quyết định số tiền cho vay.\n\nMột trăm phần trăm khoản vay được chuyển trực tiếp cho người vay và hơn 98% khoản vay cuối cùng được hoàn trả. **Cô cũng có thể quyên góp trực tiếp cho Yatna để hỗ trợ chi phí vận hành.**\n\nNgoài cho vay tiền, cô có thể tình nguyện. Chúng tôi đang tìm **biên dịch viên**, biên tập viên tiếng Anh và người tổ chức cộng đồng giúp người vay quản lý khoản vay.\n\nThư này nhằm **cung cấp thông tin về Yatna**, một tổ chức giúp đỡ những người có hoàn cảnh khó khăn.\n\nTrân trọng,  \nHarriet Bell  \nYatna","translationStatus":"reviewed"},{"id":"h2/test04/168_BDCC.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 168–171","questions":{"168":"B","169":"D","170":"C","171":"C"},"image":"data/h2/test04/168_BDCC.png","markedImage":"marked/h2/test04/168_BDCC.png","translation":"**Thông báo về cuộc họp và tiệc thường niên**\n\nCuộc họp và tiệc nhân viên thường niên sẽ diễn ra tại Khách sạn Palatial, 3316 Geary Boulevard, San Francisco, ngày 27 tháng 10. Cuộc họp bắt đầu lúc 9 giờ sáng, nghỉ trưa ngắn lúc 12 giờ và kết thúc khoảng 6 giờ tối. Sau đó có 30 phút nghỉ trước bữa tối lúc 6 giờ 30, vì vậy **có một khoảng nghỉ ngắn trước bữa tối**.\n\nNhân viên đã mời khách có thể đưa khách đến chỗ ngồi trong thời gian nghỉ.\n\nVui lòng báo lựa chọn thực đơn trước cuối tuần tới. Món chính gồm cá hồi nướng với rau tươi hoặc thịt cừu quay với khoai tây tẩm gia vị. **Ngoài ra còn có súp trong ngày làm món khai vị và một lát bánh bí ngô theo mùa làm món tráng miệng.** Cà phê, trà và các thức uống khác cũng được cung cấp.\n\nNhân viên có dị ứng hoặc hạn chế ăn uống cần **thông báo cho Jean Walters** càng sớm càng tốt để khách sạn sắp xếp.\n\nJean Walters  \nTrợ lý Giám đốc Điều hành","translationStatus":"reviewed"},{"id":"h2/test04/172_CCAD.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 172–175","questions":{"172":"C","173":"C","174":"A","175":"D"},"image":"data/h2/test04/172_CCAD.png","markedImage":"marked/h2/test04/172_CCAD.png","translation":"**Cuộc trò chuyện về hội nghị khu vực tại Vancouver**\n\n**Georgette Lindsey — 3:45 chiều**  \nHội nghị khu vực tổ chức tại Vancouver ngày 5 tháng 7. Tôi cần số người tham dự từ các chi nhánh trước cuối ngày.\n\n**Alison Bell — 3:47**  \nChi nhánh Winnipeg có tôi và 15 người khác.\n\n**Maxine Newton — 3:47**  \nPhía tôi có chín người, gồm cả tôi.\n\n**Lars Nordstrom — 3:48**  \nTôi **chưa thể xác nhận mình có đi Vancouver hay không** vì phải chốt một thương vụ máy móc nông nghiệp lớn tại Calgary. Tôi sẽ xem một trợ lý quản lý có thể đi thay. Ngoài ra còn 12 người tham dự.\n\n**Sanjay Kumar — 3:49**  \nEdmonton có mười người. Cô có lo khách sạn và chuyến bay không?\n\n**Georgette Lindsey — 3:52**  \nCó, giống năm ngoái, tôi sẽ **phụ trách việc đi lại và chỗ ở**. Hãy gửi danh sách tên người tham dự khi có thể. Khoảng 20 người từ trụ sở Regina sẽ tham dự, nên tôi sẽ đặt địa điểm cho khoảng 70 người.\n\n**Lars Nordstrom — 4:11**  \nTôi đã sắp xếp để **Travis Rembrandt đại diện chi nhánh thay mình** và sẽ nhờ anh ấy gửi danh sách cùng nhu cầu ăn uống.","translationStatus":"reviewed"},{"id":"h2/test04/176_BADBC.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 176–180","questions":{"176":"B","177":"A","178":"D","179":"B","180":"C"},"image":"data/h2/test04/176_BADBC.png","markedImage":"marked/h2/test04/176_BADBC.png","translation":"**Tài liệu 1 — Email và hóa đơn của Rainbow Printers**\n\nKim-Li Pham cảm ơn Sondheim Enterprises đã dùng dịch vụ in tờ giới thiệu sản phẩm. Cô gửi kèm bảng sao kê cần thanh toán trước ngày 1 tháng 11 và phiếu phản hồi. Rainbow Printers dùng phản hồi để cải thiện việc thiết kế, in danh mục, danh thiếp, tờ rơi, biểu ngữ và tờ giới thiệu.\n\nTrong email, “found” có nghĩa là khách hàng **đánh giá/cảm thấy** sản phẩm và dịch vụ có đạt yêu cầu hay không.\n\n---\n\n**Tài liệu 2 — Phản hồi của Stephan Faubert**\n\nÔng Faubert đã dùng các sản phẩm in tại **một hội chợ thương mại đồ chơi ở Los Angeles**, nơi chúng được đón nhận tích cực. Ông muốn Rainbow Printers phát triển danh mục 50 trang và in thêm 500 bản các sản phẩm trước đây — tức **tờ giới thiệu**.\n\nÔng đang đi công tác và trở lại sáng thứ Ba. Ông gửi kèm phiếu phản hồi và muốn đặt lịch trao đổi dự án.","translationStatus":"reviewed"},{"id":"h2/test04/181_DDCCB.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 181–185","questions":{"181":"D","182":"D","183":"C","184":"C","185":"B"},"image":"data/h2/test04/181_DDCCB.png","markedImage":"marked/h2/test04/181_DDCCB.png","translation":"**Tài liệu 1 — Thông tin thuê cơ sở tại Cleveland Lakewood Sports Center**\n\nTrung tâm có ba sân cầu lông, sân bóng đá trong nhà dùng cỏ nhân tạo, sân bóng rổ yêu cầu giày không để lại vết, tường leo núi chia khu cho người mới và trình độ trung cấp, cùng hồ bơi chuẩn Olympic.\n\nTường leo núi **không chỉ dành cho chuyên gia**. Trung tâm cung cấp miễn phí bóng, dây, móc và vợt; khách tự mang đồ bơi và giày. Nhóm trường học địa phương được **giảm 20% phí thuê**.\n\n---\n\n**Tài liệu 2 — Phiếu thuê của Hillard High School**\n\nNgày 17 tháng 10 — sân bóng rổ và sân bóng đá  \nNgày 18 tháng 10 — **ba sân cầu lông**, rồi hồ bơi từ 9:30 đến 10:30 sáng\n\nHồ bơi được thuê vào **giờ thấp điểm**, giá 100 đô la. Tổng sau giảm giá là 208 đô la.\n\nTrường phải đưa học sinh đến trung tâm vì **cơ sở thể thao của trường đang được cải tạo**, không phải vì trường không có hồ bơi.","translationStatus":"reviewed"},{"id":"h2/test04/186_BBCBD.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 186–190","questions":{"186":"B","187":"B","188":"C","189":"B","190":"D"},"image":"data/h2/test04/186_BBCBD.png","markedImage":"marked/h2/test04/186_BBCBD.png","translation":"**Tài liệu 1 — Khuyến mãi giấy tại Office World**\n\nTừ ngày 10 đến 15 tháng 7, mọi loại giấy được giảm 15%, gồm giấy dập nổi, giấy da và giấy màu. Khách có thể **xem/tìm kiếm** lựa chọn trên www.officeworld.com. Dịch vụ in tiêu đề thư cũng thuộc khuyến mãi. Giao nhanh miễn phí trong California và có tính phí ở nơi khác.\n\n---\n\n**Tài liệu 2 — Đơn đặt hàng của Clarkson Trading**\n\nTed Neilson muốn **mua số lượng lớn** tiêu đề thư trên giấy màu kem, giấy trắng, hộp nhựa đựng giấy, hộp lưu trữ và giấy ghi chú có keo.\n\n---\n\n**Tài liệu 3 — Hóa đơn**\n\nHóa đơn gồm giấy màu kem, in tiêu đề thư, giấy trắng, hộp lưu trữ và hộp nhựa. Office World **bỏ sót giấy ghi chú có keo** khỏi hóa đơn.\n\nClarkson Trading bị tính thêm 160 đô la giao nhanh vì **nằm ngoài California**. Công ty sẽ thanh toán bằng **chuyển khoản ngân hàng** đến số tài khoản được gửi qua tin nhắn.","translationStatus":"reviewed"},{"id":"h2/test04/191_CBABB.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 191–195","questions":{"191":"C","192":"B","193":"A","194":"B","195":"B"},"image":"data/h2/test04/191_CBABB.png","markedImage":"marked/h2/test04/191_CBABB.png","translation":"**Tài liệu 1 — Túi thiết bị di động Porta Bello**\n\nTúi làm từ polyester bền với viền da thật, có dây điều chỉnh, ngăn chính rộng và các túi nhỏ bên trong. Sản phẩm có màu đen, xám, nâu, đỏ và be, có thể đặt trực tuyến. Trang web **không đề cập nhiều kích cỡ khác nhau**.\n\n---\n\n**Tài liệu 2 — Yêu cầu của Bench Business Training Center**\n\nAmy Baron muốn đặt ban đầu 1.000 túi để tặng người hoàn thành khóa học nhằm **quảng bá trung tâm**. Cô hỏi mức giảm giá đơn lớn, yêu cầu túi màu xanh hải quân và tên/logo được hiển thị **nổi bật** ở mặt trước.\n\n---\n\n**Tài liệu 3 — Đánh giá của Amy Baron**\n\nPortami Bags đã **tùy chỉnh đơn hàng thành màu xanh** và giới thiệu một công ty đối tác để in riêng. Giá rất hợp lý so với chất lượng; điều này cho thấy Bench Business Training Center **nhận được mức giảm giá cho đơn hàng**.","translationStatus":"reviewed"},{"id":"h2/test04/196_CBBBD.png","folder":"h2/test04","book":"h2","bookLabel":"Hacker 2","test":"test04","testLabel":"Test 04","title":"Hacker 2 · Test 04 · Câu 196–200","questions":{"196":"C","197":"B","198":"B","199":"B","200":"D"},"image":"data/h2/test04/196_CBBBD.png","markedImage":"marked/h2/test04/196_CBBBD.png","translation":"**Tài liệu 1 — Quảng cáo Elite Wireless**\n\nGói Elite Regular cung cấp cuộc gọi và tin nhắn quốc tế không giới hạn đến các quốc gia áp dụng, với phí từ 50 đô la/tháng cho hợp đồng một năm. Đăng ký 12 tháng trước ngày 1 tháng 4 được miễn phí tháng đầu. Do không áp dụng cho mọi quốc gia, không đúng khi nói **nhắn tin không giới hạn đến bất kỳ nơi nào**.\n\n---\n\n**Tài liệu 2 — Đề xuất đổi gói cho Joann Majors**\n\nTrong sáu tháng, cô Majors gọi quốc tế vài lần và dùng trung bình 8 GB dữ liệu mỗi tháng. Elite đề xuất gói một năm có gọi, nhắn tin và 8 GB dữ liệu, gồm dịch vụ quốc tế. Nếu đồng ý, cô sẽ **được miễn phí một tháng dịch vụ** và có thể đăng ký bằng **mã đặc biệt** trên trang web.\n\n---\n\n**Tài liệu 3 — Email trả lời của Brady Farmer**\n\nElite có nhiều loại gói: trả trước, thường kỳ và doanh nghiệp. Khách có thể hủy sớm nhưng phải trả phí tối thiểu tùy thời hạn hợp đồng.\n\nÔng Farmer gửi thông tin về một số điện thoại có thể nâng cấp, vì cô Majors đã yêu cầu **thông tin về những điện thoại miễn phí hoặc ưu đãi dành cho người đăng ký**. Elite không bắt buộc khách phải mua điện thoại của công ty.","translationStatus":"reviewed"},{"id":"h2/test05/131_CCDA.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 131–134","questions":{"131":"C","132":"C","133":"D","134":"A"},"image":"data/h2/test05/131_CCDA.png","markedImage":"marked/h2/test05/131_CCDA.png","translation":"**THÔNG BÁO QUAN TRỌNG**\n\nBan **quản lý** tòa nhà sẽ tiến hành kiểm tra bảo trì các mạch điện và hộp công tắc của khu căn hộ vào thứ Hai, từ 10 giờ sáng đến 1 giờ chiều. Trong thời gian này, nguồn điện sẽ bị **tạm ngắt**. Chúng tôi xin lỗi vì bất kỳ sự bất tiện nào có thể xảy ra.\n\n**Chúng tôi dự định khôi phục điện ngay sau khi việc kiểm tra hoàn tất.** Tuy nhiên, nếu phát hiện vấn đề cần sửa chữa thì công việc có thể phải được tiến hành. **Trong trường hợp đó**, thời gian mất điện có thể kéo dài để phục vụ việc sửa chữa.\n\nĐể biết thêm chi tiết về việc này và các vấn đề liên quan, vui lòng liên hệ quản lý tòa nhà, cô Jena Gordon, theo số 555-2124. Cảm ơn sự kiên nhẫn và thông cảm của quý cư dân.\n\nĐáp án: **131 C, 132 C, 133 D, 134 A**.","translationStatus":"reviewed"},{"id":"h2/test05/135_ACBD.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 135–138","questions":{"135":"A","136":"C","137":"B","138":"D"},"image":"data/h2/test05/135_ACBD.png","markedImage":"marked/h2/test05/135_ACBD.png","translation":"**BẢO TÀNG PARNOPIUS MỞ CỬA TRỞ LẠI VÀO THÁNG CHÍN!**\n\nBảo tàng Nghệ thuật Parnopius vừa được cải tạo sẽ chính thức mở cửa trở lại cho công chúng vào lúc 10 giờ sáng ngày 1 tháng 9. Thị trưởng Adam Warren sẽ chủ trì lễ cắt băng khánh thành, và nhiều quan chức **cấp cao** khác dự kiến cũng sẽ tham dự.\n\nTrưởng ban giám tuyển Minerva Hughes cho biết dự án cải tạo tập trung vào việc xây dựng một cánh phía nam có diện tích trưng bày 25.000 feet vuông. Không gian này có thể bố trí 20 phòng triển lãm và sẽ **trưng bày** các tác phẩm của nghệ sĩ châu Âu và châu Á. Ngoài ra, nơi đây còn có những tiện ích không có ở các khu vực khác của tòa nhà. **Các tiện ích này gồm một giảng đường, cửa hàng lưu niệm và quán cà phê ở tầng trệt.**\n\nTriển lãm đầu tiên tại cánh mới sẽ **giới thiệu** nghệ thuật điêu khắc Hy Lạp đương đại. Triển lãm diễn ra từ ngày 15 tháng 9 đến ngày 31 tháng 10. Để biết thêm thông tin, vui lòng truy cập www.parnopiusmuseum.org.\n\nĐáp án: **135 A, 136 C, 137 B, 138 D**.","translationStatus":"reviewed"},{"id":"h2/test05/139_ADCB.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 139–142","questions":{"139":"A","140":"D","141":"C","142":"B"},"image":"data/h2/test05/139_ADCB.png","markedImage":"marked/h2/test05/139_ADCB.png","translation":"Charles Nave\n3739 Đại lộ Dale\nSeattle, WA 98161\n\nKính gửi ông Nave,\n\nThư này nhằm trả lời câu hỏi của ông về chương trình giảm giá dành cho khách hàng thường xuyên. Công ty chúng tôi **thường** có áp dụng chương trình này, nhưng không phải trường hợp nào cũng đủ điều kiện. **Do có sai sót, mức giảm giá đã không được áp dụng vào báo giá mà chúng tôi gửi cho ông.** Chỉ trụ sở chính mới có quyền giảm thêm giá trị đơn hàng. Vì vậy, chúng tôi đã **chuyển tiếp** yêu cầu của ông đến nhân viên tại đó và đang chờ phản hồi.\n\nNếu họ cung cấp một mức giá ước tính, chúng tôi sẽ gửi cho ông và chờ ông chấp thuận. Sau khi nhận được **xác nhận** cho phép tiến hành, chúng tôi sẽ cần khoảng ba ngày làm việc để hoàn tất đơn hàng. Hóa đơn sẽ được gửi riêng qua đường bưu điện. Rất mong ông thông cảm.\n\nTrân trọng,\nEdie Harris\n\nĐáp án: **139 A, 140 B, 141 C, 142 B**.","translationStatus":"reviewed"},{"id":"h2/test05/143_BDBC.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 143–146","questions":{"143":"B","144":"D","145":"B","146":"C"},"image":"data/h2/test05/143_BDBC.png","markedImage":"marked/h2/test05/143_BDBC.png","translation":"Thư viện Robinson cung cấp miễn phí dịch vụ nhắc hạn cho những thành viên đã đăng ký địa chỉ email hoặc số điện thoại di động. Các thông báo này nhắc người dùng khi sách, tài liệu nghe nhìn và ấn phẩm định kỳ **gần đến** hạn trả. Tuy nhiên, việc không nhận được thông báo nhắc hạn không miễn trừ trách nhiệm trả tài liệu đúng hạn của người mượn.\n\n**Vì vậy**, người mượn phải luôn lưu ý ngày đến hạn. Ngày này được đóng dấu trên phiếu trả sách gắn với cuốn sách hoặc **tài liệu** khác. Nếu bất kỳ tài liệu nào mượn từ thư viện bị trả muộn, thư viện sẽ gửi thông báo sau ngày đến hạn. **Khi trả tài liệu, người mượn sẽ phải nộp phí trả muộn.** Vui lòng tuân thủ quy định để những người dùng khác có thể tiếp cận các tài liệu này trong khoảng thời gian phù hợp.\n\nĐáp án: **143 B, 144 D, 145 B, 146 C**.","translationStatus":"reviewed"},{"id":"h2/test05/147_AC.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 147–148","questions":{"147":"A","148":"C"},"image":"data/h2/test05/147_AC.png","markedImage":"marked/h2/test05/147_AC.png","translation":"**THƯ MỜI THAM DỰ HỘI THẢO**\n\nBạn được mời tham dự hội thảo **“Tăng cường quan hệ khu vực”** cùng Giáo sư Bernardo Almeida, từ 6 giờ đến 9 giờ tối ngày 13 tháng 10 tại Đại học Hoàng gia Thái Lan.\n\nGiáo sư Almeida là **giảng viên kinh tế** tại Đại học Caracas và là thành viên của Centro Social Latino. Ông từng giữ vai trò quan trọng trong việc xây dựng chính sách thương mại giữa chính phủ của nhiều quốc gia Mỹ Latinh và đã đồng ý chia sẻ những hiểu biết từ kinh nghiệm của mình. Chương trình gồm một bài thuyết trình kéo dài một giờ, sau đó là bữa tối và hoạt động giao lưu kết nối.\n\nNếu dự định tham dự, vui lòng báo cho chúng tôi bằng cách liên hệ Sinee Aromdee qua địa chỉ s_aromdee@tru.edu.th hoặc số 555-2409.\n\nĐáp án: **147 A, 148 C**.","translationStatus":"reviewed"},{"id":"h2/test05/149_CB.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 149–150","questions":{"149":"C","150":"B"},"image":"data/h2/test05/149_CB.png","markedImage":"marked/h2/test05/149_CB.png","translation":"**HIGHTOWER ELECTRONICS**\n\n**Bản ghi nhớ**\n\nNgười nhận: Toàn thể nhân viên kinh doanh  \nNgười gửi: Lisa McDaniel, Giám đốc nhân sự  \nChủ đề: Chương trình tiền thưởng  \nNgày: 4 tháng 5\n\nTrước hết, tôi xin cảm ơn mọi người đã đóng góp ý kiến về chính sách lương thưởng của công ty. Sau khi thảo luận các đề xuất trong nhiều cuộc họp quản lý, tuần trước công ty đã thống nhất **thay đổi chính sách hoa hồng**.\n\nNhân viên bán được từ 100 đến 250 sản phẩm sẽ nhận hoa hồng 3% ngoài lương cơ bản. Người bán từ 250 đến 500 sản phẩm sẽ nhận 8%, còn người bán trên 500 sản phẩm sẽ nhận 11%. Ngoài ra, nhân viên liên tục đạt doanh số trên 500 sản phẩm mỗi tháng sẽ được tăng lương cố định sau mỗi sáu tháng. Những thay đổi này có hiệu lực từ ngày 1 tháng 6.\n\nXin lưu ý, người không đạt mức tối thiểu **100 sản phẩm sẽ không nhận được hoa hồng**.\n\nĐáp án: **149 C, 150 B**.","translationStatus":"reviewed"},{"id":"h2/test05/151_AC.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 151–152","questions":{"151":"A","152":"C"},"image":"data/h2/test05/151_AC.png","markedImage":"marked/h2/test05/151_AC.png","translation":"**Chuỗi tin nhắn**\n\n**Melinda Carmichael – 9:52**  \nTôi có một khách hàng muốn xem căn hộ của anh vào chiều nay. Anh có thể sắp xếp được không?\n\n**Charles Fredericks – 9:54**  \nHôm nay tôi chỉ rảnh vào buổi tối. Nếu không được thì tối mai cũng có thể. Hoặc chị cứ dẫn khách đến khi tôi vắng nhà.\n\n**Melinda Carmichael – 9:56**  \nTôi biết anh ấy bận sau 5 giờ, nhưng để tôi xem ngày mai anh ấy có rảnh không. Anh ấy có vẻ rất muốn thuê căn hộ sau khi xem sơ đồ mặt bằng chi tiết.\n\n**Charles Fredericks – 9:59**  \nThật sao? Mừng quá. Tôi hy vọng anh ấy muốn thuê. Tôi cần chuyển đến chỗ ở mới vào đầu tháng sau.\n\n**Melinda Carmichael – 10:05**  \nTôi vừa nói chuyện với anh ấy qua điện thoại. Cuộc hẹn được ấn định vào **10 giờ sáng mai**. Anh ấy cũng muốn xem quanh tòa nhà.\n\n**Charles Fredericks – 10:06**  \nĐược đấy. Tôi sẽ để thẻ ra vào ở quầy lễ tân vào lần tới. Chị có thể gọi cho tôi vào chiều mai để cho tôi biết tình hình không?\n\n**Melinda Carmichael – 10:07**  \nTất nhiên. Nếu anh ấy đồng ý ký hợp đồng, tôi sẽ nhắn ngay cho anh.\n\nĐáp án: **151 A, 152 C**.","translationStatus":"reviewed"},{"id":"h2/test05/153_CBD.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 153–155","questions":{"153":"C","154":"B","155":"D"},"image":"data/h2/test05/153_CBD.png","markedImage":"marked/h2/test05/153_CBD.png","translation":"**PHIÊN ĐẤU GIÁ NGHỆ THUẬT LANDMARK TRỞ LẠI NĂM THỨ 25**\n\nNhững nhà sưu tập địa phương muốn sở hữu tác phẩm nghệ thuật có giá trị lịch sử sẽ có nhiều cơ hội tại Phiên đấu giá Nghệ thuật Hartford thường niên năm nay. Nhân dịp kỷ niệm 25 năm, ban tổ chức đã tập hợp một bộ sưu tập đặc sắc, trong đó có **tác phẩm quan trọng** của các cư dân trong vùng là Patricia Irwin, Robert Walcott và Dorothy Stone.\n\nBa họa sĩ này hoạt động rất năng suất trong suốt sự nghiệp và nổi tiếng vào cuối tuổi ba mươi. Họ từng sống cùng nhau trong một căn hộ tại Paris và hòa mình vào cộng đồng nghệ thuật địa phương. Tuy nhiên, người Mỹ yêu thích nhất những bức tranh thời kỳ đầu của nhóm, khắc họa phong cảnh vùng đông bắc Hoa Kỳ. George Luckett, người phụ trách phiên đấu giá năm nay, đã tìm được 18 tác phẩm của họ và dự kiến tổng giá trị thu về vượt 1 triệu đô la.\n\nCác tác phẩm được yêu thích gồm “Fisher's Island Sound” của Walcott và “Sebago Lake” của Irwin. Tuy nhiên, bức tranh sơn dầu “White Mountain” của Stone có giá ước tính cao nhất, khoảng 120.000 đô la.\n\nPhiên đấu giá bắt đầu lúc 2 giờ chiều thứ Bảy, ngày 14 tháng 7, tại Phòng trưng bày Farmington vừa được tân trang. Như trước đây, **một phần tiền thu được sẽ được quyên góp cho Quỹ Nghệ thuật Sáng tạo**, nhằm khuyến khích hoạt động nghệ thuật trong giới trẻ cả nước. Để biết thêm thông tin, vui lòng liên hệ ban tổ chức theo số 555-2092.\n\nĐáp án: **153 C, 154 B, 155 D**.","translationStatus":"reviewed"},{"id":"h2/test05/156_DC.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 156–157","questions":{"156":"D","157":"C"},"image":"data/h2/test05/156_DC.png","markedImage":"marked/h2/test05/156_DC.png","translation":"**Email nhắc lịch ra mắt sản phẩm**\n\nNgười nhận: Barry Maddocks  \nNgười gửi: Wilma Haynes  \nChủ đề: Nhắc lịch ra mắt  \nNgày: 28 tháng 3\n\nTôi muốn nhắc lại về đợt ra mắt sản phẩm vào tuần tới. Tất cả nhân viên **phòng quảng cáo** phải tham dự một trong các sự kiện sau và hỗ trợ khi cần:\n\n- Ngày 4 tháng 4, 10:30 sáng: Giới thiệu dòng đồ uống Jui-C-Ness tại siêu thị Cole.\n- Ngày 4 tháng 4, 7:30 tối: Tiệc cocktail ra mắt chính thức tại khách sạn Newcroft.\n- Ngày 5 tháng 4, 10 giờ sáng: Trình bày chiến dịch quảng bá tại **trụ sở chính của Appleton Manufacturers**.\n- Ngày 5 tháng 4, 7 giờ tối: Tiệc dành cho nhà đầu tư và trình bày chiến dịch quảng bá tại khách sạn Newcroft.\n\nVui lòng báo cho trưởng nhóm hai lựa chọn ưu tiên trước cuối ngày mai. Chúng tôi sẽ cố gắng sắp xếp theo nguyện vọng nhưng không thể bảo đảm lựa chọn nào cũng còn chỗ. Cảm ơn sự hợp tác của bạn.\n\nWilma Haynes  \nGiám đốc bộ phận\n\nĐáp án: **156 D, 157 C**.","translationStatus":"reviewed"},{"id":"h2/test05/158_CDD.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 158–160","questions":{"158":"C","159":"D","160":"D"},"image":"data/h2/test05/158_CDD.png","markedImage":"marked/h2/test05/158_CDD.png","translation":"**Email giới thiệu ứng viên**\n\nNgười nhận: Robert Crowley  \nNgười gửi: Kimberley Phillips  \nChủ đề: Thư giới thiệu  \nNgày: 16 tháng 10\n\nChào Robert,\n\nThật tuyệt khi gặp anh tại hội nghị du lịch ở Miami tuần trước. Chắc anh cũng đồng ý rằng sự kiện rất bận rộn nhưng vô cùng hiệu quả và bổ ích. **Tôi đã làm quen được với một số người mới có thể giúp quảng bá cơ sở của mình.**\n\nTôi nhớ anh có nói rằng anh đang tìm một quản lý sự kiện cho khu nghỉ dưỡng mới sắp mở tại Orlando. **Quản lý tiếp thị hiện làm việc cho tôi ở New Orleans sắp chuyển đến Orlando vào mùa hè tới và sẽ tìm việc ở đó.**\n\nCô ấy tên là Anna Harwood, và tôi đã quen cô ấy được sáu năm. Hiện cô ấy quản lý khoảng 30 nhân viên và chủ trì phần lớn các cuộc họp khách hàng của chúng tôi. **Tôi tin rằng vị trí anh đang tuyển cũng đòi hỏi kỹ năng giám sát nhân viên và giao tiếp với khách hàng.** Cô ấy làm việc tại Oleandor rất xuất sắc, vì vậy tôi bảo đảm anh sẽ không thất vọng.\n\nNếu anh quan tâm và cô ấy vẫn còn ứng tuyển được, tôi có thể cung cấp địa chỉ email hợp lệ để cô ấy gửi hồ sơ và có thể sắp xếp một cuộc phỏng vấn qua điện thoại.\n\nThân mến,\nKimberley Phillips\n\nĐáp án: **158 C, 159 D, 160 D**.","translationStatus":"reviewed"},{"id":"h2/test05/161_ADC.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 161–163","questions":{"161":"A","162":"D","163":"C"},"image":"data/h2/test05/161_ADC.png","markedImage":"marked/h2/test05/161_ADC.png","translation":"**DOANH NGHIỆP CỦA BẠN VÀ TÍNH BỀN VỮNG**\n\nTác giả: Jonathan Demarco  \nNgày 14 tháng 11\n\nNhận thức ngày càng rõ về tầm quan trọng của phát triển bền vững môi trường, nhiều doanh nghiệp đang áp dụng các phương thức sản xuất có đạo đức. Tuy nhiên, một số người vẫn băn khoăn liệu những thay đổi này có đáng thực hiện hay không.\n\nChuyên gia tư vấn kinh doanh và phát triển bền vững Andrea McGibbon khẳng định là có. Theo bà, khách hàng của ít nhất 10 tập đoàn lớn đã có phản hồi rất tích cực về các hoạt động có trách nhiệm với môi trường và xã hội. Hơn 75% người tiêu dùng của những tập đoàn này cho biết họ có xu hướng mua sản phẩm từ các thương hiệu quan tâm đến môi trường hơn. Bà cũng lưu ý rằng các tập đoàn áp dụng những phương thức này **không ghi nhận sự khác biệt đáng kể về biên lợi nhuận**.\n\nTuy nhiên, các chuyên gia khác cho rằng chi phí là yếu tố quan trọng. Chẳng hạn, thay thiết bị nhà máy bằng thiết bị thân thiện với môi trường có thể rất tốn kém. Vì vậy, công ty có thể phải bù chi phí bằng cách tăng giá bán. Cuối cùng, người tiêu dùng có xu hướng mua hàng dựa vào giá chứ không dựa vào cách sản phẩm được tạo ra.\n\nStyle Be With You, một thương hiệu thời trang thường ngày cỡ trung, vừa thử nghiệm vấn đề này. Sau khi tung ra dòng trang phục sản xuất có đạo đức từ vật liệu hữu cơ, ban quản lý nhận thấy tổng doanh số quý tăng. Hình ảnh có trách nhiệm mới thu hút thêm khách hàng, nhưng doanh số của những sản phẩm áo len lại thấp hơn dự báo. Khi vào cửa hàng, khách hàng chọn mua sản phẩm rẻ hơn thay vì loại thân thiện với môi trường. Qua đó, họ cho thấy **giá cả vẫn là yếu tố chi phối lựa chọn**.\n\nĐáp án: **161 A, 162 D, 163 C**.","translationStatus":"reviewed"},{"id":"h2/test05/164_BCCC.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 164–167","questions":{"164":"B","165":"C","166":"C","167":"C"},"image":"data/h2/test05/164_BCCC.png","markedImage":"marked/h2/test05/164_BCCC.png","translation":"**Thảo luận trực tuyến về buổi ra mắt sản phẩm**\n\n**Gail Royce – 7:32 tối**  \nMọi người đã sẵn sàng cho buổi ra mắt sản phẩm ngày mai chưa? Nếu còn việc gì cần làm thì báo cho tôi. Chúng ta không còn nhiều thời gian vì sự kiện bắt đầu lúc 11 giờ sáng.\n\n**Reena Singh – 7:36 tối**  \nĐội của tôi và tôi đã chuẩn bị gần xong địa điểm. Còn vài biểu ngữ lớn cần treo vào sáng mai, ngoài ra mọi thứ đều đã được bố trí.\n\n**Roger Bryce – 7:37 tối**  \nSáng mai chúng ta phải điều chỉnh một chút hệ thống chiếu sáng cuối cùng, nhưng màn hình video đã hoạt động và hệ thống âm thanh đã sẵn sàng.\n\n**Olga Russovich – 7:38 tối**  \nKhoảng 500 khách đã xác nhận tham dự, nhưng có thể sẽ có thêm một số người. Sáu phóng viên báo chí cũng sẽ đến. Đơn vị phục vụ ăn uống đã chuẩn bị bàn thức ăn và quầy giải khát.\n\n**Gail Royce – 7:41 tối**  \nCảm ơn mọi người. Có vẻ mọi việc đang diễn ra đúng kế hoạch. Olga, sao số phóng viên tham dự lại ít thế?\n\n**Olga Russovich – 7:43 tối**  \nCùng thời điểm đó có một cuộc họp quan trọng tại Tòa thị chính. Nhiều phóng viên địa phương phải tham dự cuộc họp ấy.\n\n**Gail Royce – 7:46 tối**  \n**Thật đáng tiếc. Tôi nghĩ khu vực dành riêng cho báo chí sẽ quá rộng.** Reena, nếu cần, cô có thể dùng tối đa một nửa khu vực báo chí cho các quầy trưng bày sản phẩm.\n\n**Reena Singh – 7:48 tối**  \nNhư vậy thì tuyệt. Có vài quầy trưng bày trang sức trông khá chật, nên tôi sẽ chuyển một số sang đó vào sáng mai. Chúng tôi muốn giới thiệu sản phẩm mới theo cách tốt nhất có thể. Quản lý địa điểm mở cửa lúc mấy giờ?\n\n**Roger Bryce – 7:49 tối**  \nTôi đã hỏi quản lý địa điểm hôm nay; ông ấy có thể đến sớm hơn thường lệ, lúc **7 giờ sáng**, để cho chúng ta vào.\n\nĐáp án: **164 B, 165 C, 166 C, 167 C**.","translationStatus":"reviewed"},{"id":"h2/test05/168_CDAC.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 168–171","questions":{"168":"C","169":"D","170":"A","171":"C"},"image":"data/h2/test05/168_CDAC.png","markedImage":"marked/h2/test05/168_CDAC.png","translation":"**BAXTER COMMUNICATIONS**\n87 đường Hollowbrook, Bloomington, IL 61704\n\nKính gửi bà Melinda Armin,\n\nCảm ơn bà đã đăng ký gói Cable Plus của Baxter, gồm tất cả kênh truyền hình cơ bản cùng các kênh phim ảnh và giáo dục. Thư này nhằm nhắc lại các điều khoản dịch vụ nêu trong hợp đồng tiêu chuẩn.\n\nTrước hết, chủ tài khoản chỉ được sử dụng dịch vụ truyền hình cáp cho mục đích hợp pháp. Nghiêm cấm sao chép chương trình để phát tán trên Internet nếu không có sự cho phép rõ ràng của nhà sản xuất chương trình hoặc Baxter Communications. Tương tự, việc thu lợi từ toàn bộ hoặc một phần bản sao chương trình thông qua bán hoặc cho thuê cũng bị cấm. **Vi phạm bất kỳ quy định nào có thể khiến dịch vụ bị chấm dứt mà không cần thông báo trước, thậm chí dẫn đến hình phạt pháp lý.**\n\nBaxter cam kết duy trì dịch vụ miễn là khách hàng tuân thủ các điều khoản và thanh toán đúng hạn. Dịch vụ gồm cung cấp chương trình truyền hình cáp liên tục, sửa chữa và bảo trì chung hộp cáp. Tuy nhiên, việc sửa chữa hoặc thay thế thiết bị bị hư hỏng hay thất lạc do người dùng gây ra thuộc trách nhiệm tài chính của khách hàng.\n\nBaxter Communications là nhà cung cấp dịch vụ truyền hình cáp, Internet và điện thoại hàng đầu trong thành phố. Vì vậy, chúng tôi mong được đồng hành cùng bà trong nhiều năm tới.\n\nTrân trọng,\nOtto Weed  \nQuản lý khách hàng, Baxter Communications\n\nĐáp án: **168 C, 169 D, 170 A, 171 C**.","translationStatus":"reviewed"},{"id":"h2/test05/172_DBBD.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 172–175","questions":{"172":"D","173":"B","174":"B","175":"D"},"image":"data/h2/test05/172_DBBD.png","markedImage":"marked/h2/test05/172_DBBD.png","translation":"**OUTER REACHES KỶ NIỆM 40 NĂM BẰNG BUỔI CHIẾU PHIM TẠI LUÂN ĐÔN**\n\nBộ phim khoa học viễn tưởng nổi tiếng *Outer Reaches* của đạo diễn Francis Templeton sẽ được chiếu ngày 12 tháng 10 tại Nhà hát Empire ở Luân Đôn, trong khuôn khổ chương trình tôn vinh phim kinh điển của thành phố. Buổi chiếu diễn ra đúng dịp kỷ niệm 40 năm công chiếu bộ phim. Phần nhạc phim sẽ được biểu diễn trực tiếp bởi Dàn nhạc Giao hưởng Sydney và Dàn hợp xướng Thính phòng Sydney dưới sự chỉ huy của Luigi Ludovico.\n\nKhi mới ra mắt, *Outer Reaches* chỉ nhận được sự đón nhận khiêm tốn tại phòng vé và gần như không đạt điểm hòa vốn. Tuy nhiên, bộ phim đã để lại dấu ấn với một số khán giả rồi **thu hút được lượng người hâm mộ trung thành trong nhiều năm sau đó**. Mười năm sau buổi công chiếu, phim đạt vị thế tác phẩm kinh điển và thậm chí được chiếu lại tại nhiều rạp trên cả nước.\n\nNhiều nhà sáng tạo nổi tiếng hiện nay cho rằng *Outer Reaches*, đặc biệt là các tác phẩm của Templeton, đã ảnh hưởng đến phong cách làm phim của họ. Đạo diễn từng đoạt nhiều giải thưởng Everett Walsh nhiều lần nói bộ phim *Dry Run* của ông lấy cảm hứng từ nhân vật chính trong *Outer Reaches*. Nhà quay phim Gail Ferguson phát triển phong cách nhiếp ảnh của mình từ hình ảnh của bộ phim. Nhiều người khác cho rằng *Outer Reaches* đã mở ra hướng đi mới trong nghệ thuật và khoa học làm phim, thúc đẩy việc sử dụng hiệu ứng đặc biệt và vượt qua giới hạn của thể loại khoa học viễn tưởng.\n\nDù có yêu thích khoa học viễn tưởng hay không, *Outer Reaches* vẫn rất đáng xem. Phim có câu chuyện đẹp và cuốn hút; nhiều khán giả sẽ thấy chủ đề của phim mang tính phổ quát. Với phần nhạc sống, sức sống và vẻ rực rỡ của bộ phim sẽ càng được làm nổi bật.\n\nĐáp án: **172 D, 173 B, 174 B, 175 D**.","translationStatus":"reviewed"},{"id":"h2/test05/176_BBCAC.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 176–180","questions":{"176":"B","177":"B","178":"C","179":"A","180":"C"},"image":"data/h2/test05/176_BBCAC.png","markedImage":"marked/h2/test05/176_BBCAC.png","translation":"**Tài liệu 1 – Email xác nhận đơn hàng**\n\nNgười nhận: Austin Wright  \nNgười gửi: Furry Friends  \nChủ đề: Đơn hàng của quý khách đã được gửi  \nNgày: 29 tháng 8\n\nXin chào từ Furry Friends!\n\nCảm ơn quý khách đã mua hàng. Đơn dự kiến được giao trong vòng **2–10 ngày**, tùy phương thức vận chuyển. Dưới đây là các mặt hàng và thông tin theo dõi đơn:\n\n- 1 áo thể thao Doggie Trend, cỡ nhỏ\n- 1 giường chó Creature Comforts, màu nâu\n- 1 bộ dụng cụ chải lông Woof Master, gồm 7 món\n- 2 túi thức ăn chó Dr. Do-a-Lot High Nutrition, mỗi túi 2 pound\n\nĐơn hàng do **Excel Freight** vận chuyển. Quý khách có thể theo dõi tại www.excelfreight.com bằng mã XHFG36CIF92. Thông tin theo dõi trên trang web có thể chưa cập nhật đầy đủ cho đến khi hàng tới bưu điện địa phương.\n\nĐây là email tự động, vui lòng không trả lời. Để liên hệ dịch vụ khách hàng, gửi email tới customer_service@furryfriends.com hoặc gọi 555-3083 trong giờ làm việc, từ thứ Hai đến thứ Bảy, 7 giờ sáng–7 giờ tối theo giờ miền Đông.\n\n---\n\n**Tài liệu 2 – Khảo sát mức độ hài lòng**\n\nAustin Wright cho biết ông **không tìm thấy bộ dụng cụ chải lông Barkus 7 món** trên trang web nên phải mua sản phẩm khác. Đây là lần đầu ông mua sắm trên trang Furry Friends và ông biết đến cửa hàng qua lời giới thiệu của một cửa hàng khác.\n\nÔng hài lòng với sự đa dạng sản phẩm nhưng **không hài lòng vì trang web khó sử dụng**. Dù sản phẩm tương đối phong phú, ông đã bỏ cuộc khi tìm món cần mua và phải chọn một món khác. Trong tương lai, ông có thể quay lại cửa hàng trực tiếp để nhờ nhân viên hỗ trợ.\n\nĐáp án: **176 B, 177 B, 178 C, 179 A, 180 C**.","translationStatus":"reviewed"},{"id":"h2/test05/181_BAABD.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 181–185","questions":{"181":"B","182":"A","183":"A","184":"B","185":"D"},"image":"data/h2/test05/181_BAABD.png","markedImage":"marked/h2/test05/181_BAABD.png","translation":"**Tài liệu 1 – Thông báo phí bảo trì**\n\nĐịa chỉ: Burlington Towers, 584 Denver Ave., Larchmont, WA 99487  \nNgười thuê: Plum Legal Firm  \nCăn: 401A, 401C  \nKỳ thanh toán: Quý 4\n\nPhí bảo trì chung phải trả:\n- Tháng 10: 400 đô la cho hai căn\n- Tháng 11: 400 đô la cho hai căn\n- Tháng 12: 400 đô la cho hai căn\n\nPhí bảo trì bãi đỗ xe:\n- Mỗi tháng từ tháng 10 đến tháng 12: 100 đô la cho 10 chỗ\n\nTổng số tiền: 1.500 đô la. Hạn thanh toán: ngày 15 tháng 1. Nếu không thanh toán đúng hạn, người thuê có thể chịu phạt.\n\nDo chi phí lao động tăng, từ năm sau phí bảo trì hằng tháng tăng từ 200 lên 230 đô la cho căn đơn và từ 400 lên 450 đô la cho căn đôi. **Mỗi căn bổ sung chịu phí quản lý 150 đô la.** Phí bảo trì bao gồm duy tu cơ sở vật chất, sảnh và khuôn viên; thu gom rác và nước. Các tiện ích khác như ga, điện hoặc Internet thuộc trách nhiệm của người thuê.\n\n---\n\n**Tài liệu 2 – Email khiếu nại về phí bảo trì**\n\nNgười nhận: Elizabeth Mackie  \nNgười gửi: Tom Rousseau, Trưởng phòng kế toán của Plum Legal Firm  \nNgày: 6 tháng 1\n\nKính gửi cô Mackie,\n\nTôi đã nhận được bảng phí bảo trì ba tháng vừa qua. Trước khi thanh toán, tôi cần nêu một số điểm không khớp.\n\nCông ty chúng tôi mở rộng và tiếp quản căn trống bên cạnh, nhưng **chỉ chuyển sang căn mới từ tháng 11**. Ngoài ra, sau khi mở rộng, chúng tôi thuê năm nhân viên mới và tất cả đều được cấp chỗ đỗ xe ngoài 10 chỗ đang sử dụng. Cuối cùng, căn mới thực tế là **401B chứ không phải 401A** như ghi trên thông báo. Xin vui lòng điều chỉnh hồ sơ.\n\nTôi sẽ thanh toán sau khi nhận được thông báo đã sửa.\n\nTom Rousseau\n\nĐáp án: **181 B, 182 A, 183 A, 184 B, 185 D**.","translationStatus":"reviewed"},{"id":"h2/test05/186_BBDCB.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 186–190","questions":{"186":"B","187":"B","188":"D","189":"C","190":"B"},"image":"data/h2/test05/186_BBDCB.png","markedImage":"marked/h2/test05/186_BBDCB.png","translation":"**Tài liệu 1 – Email cập nhật khẩn về sự kiện**\n\nNgười nhận: Adam Johansson  \nNgười gửi: Kristina Hausmann  \nChủ đề: Cập nhật khẩn về sự kiện  \nNgày: 17 tháng 2\n\nThưa ông Johansson,\n\nLịch gây quỹ tối nay có một số thay đổi. Chuyến bay của Giáo sư Trevelyan từ San Francisco bị hoãn nên ông ấy không thể đến kịp giờ phát biểu ban đầu. Vì vậy, chúng tôi sẽ phục vụ bữa tối sớm hơn 20 phút và ông Trevelyan có thể phát biểu ngay sau đó. Lịch đã được gửi đi nên không thể in lại. Khi phát biểu, xin ông nhắc ngắn gọn về những thay đổi này.\n\nTôi sẽ có mặt tại địa điểm sau khoảng 15 phút để bảo đảm công tác chuẩn bị diễn ra suôn sẻ và gặp đơn vị phục vụ ăn uống. Nếu có câu hỏi, hãy gọi 555-7246.\n\n---\n\n**Tài liệu 2 – Lịch gây quỹ của Mái ấm Người vô gia cư Helping Houses**\n\n- 7:15 tối: **Adam Johansson, giám đốc Helping Houses, phát biểu khai mạc.**\n- 7:30 tối: Dàn hợp xướng Trường Công lập Denver biểu diễn.\n- 8 giờ tối: Giáo sư John Trevelyan nói về tác động của tình trạng vô gia cư.\n- 8:20 tối: Bữa tối và món tráng miệng.\n- 9:30 tối: Đấu giá từ thiện, gồm kỳ nghỉ hai đêm tại **khách sạn Carruthers**, máy tính bảng mới và áo đấu có chữ ký.\n- 10:15 tối: Nghệ sĩ hài Darren Benedict biểu diễn.\n- 10:40 tối: Ca sĩ kiêm nhạc sĩ Kate Barton biểu diễn.\n- 11 giờ tối: Thị trưởng Denver Tania Groot phát biểu bế mạc.\n\n---\n\n**Tài liệu 3 – Sự kiện gây quỹ vì một mục đích tốt đẹp**\n\nTrong buổi gây quỹ tại khách sạn Carruthers cuối tuần qua, khách mời đã quyên góp gần 25.000 đô la để duy trì hoạt động của Helping Houses. Tổ chức này được thành lập 24 năm trước và giúp người vô gia cư trong vùng tìm thức ăn, chỗ ở, tư vấn và việc làm.\n\nKhách tham dự được thưởng thức các bài phát biểu, tiết mục biểu diễn và bữa tối. Thị trưởng Tania Groot nói rằng cộng đồng có **trách nhiệm** chăm lo cho những người kém may mắn. Bà cũng trao cho giám đốc Helping Houses một tấm séc bổ sung 15.000 đô la từ thành phố. Các khoản đóng góp vẫn tiếp tục được tiếp nhận tại www.helpinghousesshelter.org/donate.\n\nĐáp án: **186 B, 187 B, 188 D, 189 C, 190 B**.","translationStatus":"reviewed"},{"id":"h2/test05/191_CABCC.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 191–195","questions":{"191":"C","192":"A","193":"B","194":"C","195":"C"},"image":"data/h2/test05/191_CABCC.png","markedImage":"marked/h2/test05/191_CABCC.png","translation":"**Tài liệu 1 – Hội chợ việc làm đầu tiên của Aurora**\n\nPhòng Thương mại Aurora sẽ tổ chức Hội chợ Việc làm Aurora đầu tiên vào ngày 29 tháng 3, từ 7 giờ sáng đến 7 giờ tối tại Aurora City Arena. Điều phối viên Alex McDade cho biết hội chợ được tổ chức theo lời kêu gọi của Thị trưởng Owen Brownstein, người đề nghị cộng đồng doanh nghiệp hỗ trợ giải quyết tình trạng thất nghiệp. Dự kiến có 50 công ty tham gia.\n\nDoanh nghiệp cần bàn cỡ thường trả 150 đô la, bàn đôi trả 250 đô la. Người đăng ký trước ngày 28 tháng 2 được đặt bàn thường với giá **130 đô la**. Người tìm việc không cần đăng ký trước và được vào cửa miễn phí.\n\n---\n\n**Tài liệu 2 – Email của Kenneth Collins**\n\nÔng Collins cho biết công ty Star Mortgage muốn tham gia hội chợ cùng công ty Bingham Title. Hai công ty đều là công ty con của Moore Investments. Ông hỏi liệu họ có thể bố trí hai gian hàng cạnh nhau để dễ phối hợp hay không. Nếu được chấp thuận, ông sẽ đăng ký, thanh toán bàn và thông báo cho đồng nghiệp tại Bingham Title.\n\n---\n\n**Tài liệu 3 – Phiếu xác nhận doanh nghiệp tham gia**\n\nCông ty: Bingham Title  \nĐại diện: Cora Jacobs  \nSố lượng thẻ cần dùng: **Ba**  \nLoại bàn: Một bàn thường  \nHình thức thanh toán: Séc  \nSố bàn: C-14, gần lối vào chính của địa điểm  \nNgày ký: **16 tháng 2**\n\nĐáp án: **191 C, 192 A, 193 B, 194 C, 195 C**.","translationStatus":"reviewed"},{"id":"h2/test05/196_DACCA.png","folder":"h2/test05","book":"h2","bookLabel":"Hacker 2","test":"test05","testLabel":"Test 05","title":"Hacker 2 · Test 05 · Câu 196–200","questions":{"196":"D","197":"A","198":"C","199":"C","200":"A"},"image":"data/h2/test05/196_DACCA.png","markedImage":"marked/h2/test05/196_DACCA.png","translation":"**Tài liệu 1 – Email cập nhật trang web**\n\nNgười nhận: Joel Steinbrenner  \nNgười gửi: Maria Longoria  \nChủ đề: Cập nhật tiến độ trang web  \nNgày: 20 tháng 3\n\nChào Joel,\n\nCảm ơn anh đã cập nhật trang web. Tôi hài lòng với bố cục, hình ảnh phòng và cơ sở vật chất, cũng như trình chiếu trực tuyến. Tuy nhiên, tôi muốn thêm vào trình chiếu những bức ảnh thể hiện cảnh quan thiên nhiên xung quanh, chẳng hạn như khách chèo xuồng từ bến tại Grand Lake và đi bộ trên các con đường quanh Lake Granby. Tôi đã đính kèm một số ảnh để anh sử dụng.\n\nĐồng nghiệp Alfredo Cantone muốn thêm một thẻ trên trang web để đăng thực đơn hằng tuần và danh sách món phục vụ tại phòng. Khi hoàn tất, chúng ta có thể ra mắt trang web và tôi sẽ gửi phần tiền còn lại cho anh.\n\n---\n\n**Tài liệu 2 – Thông tin Morning Glory Guest Cottages**\n\nKhu nhà nghỉ mở cửa từ 8:30 sáng đến 9 giờ tối và nằm cạnh tòa nhà lễ tân của khu nghỉ dưỡng, nơi có nhà hàng Lucky Lucy do đầu bếp Alfredo Cantone phụ trách.\n\nKhách có thể xem thực đơn mới cho bữa sáng, trưa và tối trên trang web. Thời gian phục vụ và các cập nhật được đăng vào 7:30 sáng Chủ nhật hằng tuần. Nhà hàng cũng cung cấp một thực đơn giới hạn để giao món đến phòng. Dịch vụ phòng hoạt động từ 7 giờ sáng đến 10 giờ tối các ngày trong tuần và từ 8 giờ sáng đến 11 giờ tối cuối tuần.\n\n---\n\n**Tài liệu 3 – Bài đánh giá của Jamie Wilder**\n\nMorning Glory Guest Cottages là nơi lý tưởng để hòa mình vào thiên nhiên. Khu nghỉ dưỡng chỉ cách Denver hai giờ lái xe và nằm cạnh một hồ trên núi tuyệt đẹp. Vợ chồng tôi ở đây ba đêm và hằng ngày đi bộ quanh các hồ gần đó và dọc sông Colorado. Chúng tôi ấn tượng nhất với chuyến đi bộ trên Shadow Mountain Lake. Các căn nhà gỗ nhỏ mộc mạc nhưng thoải mái.\n\nKeith thích chèo xuồng, còn tôi thích giao lưu với những vị khách khác tại **buổi đốt lửa trại hằng tuần**. Tôi cũng muốn khen nhà hàng Lucky Lucy vì các bữa ăn tuyệt vời, đặc biệt là những món Hy Lạp sở trường của đầu bếp. Điểm chưa hài lòng duy nhất là thực đơn phục vụ tại phòng chỉ có vài món đơn giản.\n\nĐáp án: **196 D, 197 A, 198 C, 199 C, 200 A**.","translationStatus":"reviewed"},{"id":"h2/test06/131_CBBC.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 131–134","questions":{"131":"C","132":"B","133":"B","134":"C"},"image":"data/h2/test06/131_CBBC.png","markedImage":"marked/h2/test06/131_CBBC.png","translation":"**Trân trọng kính mời**\n\nDogorail trân trọng mời các đối tác kinh doanh tham dự Triển lãm Vận tải và Hậu cần Dogorail lần thứ 25, dự kiến diễn ra từ ngày 9 đến ngày 11 tháng 11 tại Praha. Dogorail sẽ trưng bày các sản phẩm và dịch vụ của mình tại tầng chính của Trung tâm Hội nghị Zidenic **trong suốt** sự kiện kéo dài ba ngày. Vào đêm cuối cùng, Tổng giám đốc Dogorail Miroslav Sergeyev sẽ có một bài thuyết trình đặc biệt. **Ông sẽ trình bày chi tiết về các dự án đường sắt gần đây tại Moldova, Bulgaria và Hy Lạp.**\n\nĐại diện Dogorail sẽ có mặt để giải đáp thắc mắc của khách tham quan. Quý vị cũng có thể đăng ký các buổi **tư vấn** riêng về bất kỳ sản phẩm hoặc dịch vụ nào của chúng tôi nếu muốn được tư vấn theo nhu cầu cụ thể.\n\nĐể xác nhận tham dự sự kiện, vui lòng gửi lại biểu mẫu đính kèm, đã được điền **đầy đủ** và ký tên, chậm nhất vào ngày 30 tháng 4.\n\nĐáp án: **131 C, 132 B, 133 B, 134 C**.","translationStatus":"reviewed"},{"id":"h2/test06/135_ADBC.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 135–138","questions":{"135":"A","136":"D","137":"B","138":"C"},"image":"data/h2/test06/135_ADBC.png","markedImage":"marked/h2/test06/135_ADBC.png","translation":"**Ngày 28 tháng 4**\n\n*Tòa soạn The Missourian*  \n438 East St. Louis Street  \nSpringfield, MO 65806\n\n**Kính gửi Ban biên tập,**\n\nTôi muốn chỉ ra một sai sót trong bài báo gần đây của quý báo. Tuần trước, **có thông tin cho rằng** hơn một nghìn lao động có thể mất việc nếu Liberty Medical Group sáp nhập với Midland Health Services. Điều này không đúng sự thật.\n\nTôi xin nhấn mạnh rằng các cuộc **đàm phán** vẫn chưa kết thúc. Tôi có thể khẳng định điều này vì đang thay mặt Liberty Medical Group tham gia các cuộc thương lượng. Hơn nữa, nếu hai tổ chức sáp nhập, họ sẽ có điều kiện tốt hơn để tạo thêm cơ hội việc làm. Một công ty hợp nhất có thể **tạo ra** những vị trí mà từng công ty riêng lẻ không thể tự cung cấp.\n\nChúng tôi mong quý báo đăng bài đính chính. **Việc này sẽ sửa lại những hiểu lầm do bài báo trước gây ra.** Tôi mong sớm nhận được phản hồi của quý báo.\n\nTrân trọng,  \nAndrew Sweet  \nNgười phát ngôn của công ty\n\nĐáp án: **135 A, 136 D, 137 B, 138 C**.","translationStatus":"reviewed"},{"id":"h2/test06/139_DDAD.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 139–142","questions":{"139":"D","140":"D","141":"A","142":"D"},"image":"data/h2/test06/139_DDAD.png","markedImage":"marked/h2/test06/139_DDAD.png","translation":"**Đến:** Margo Sloane  \n**Từ:** Jan Fitch  \n**Chủ đề:** Giao thiết bị  \n**Ngày:** 11 tháng 10\n\nÔng Jurgens tại chi nhánh mới vừa gọi điện báo rằng số thiết bị văn phòng chúng ta đặt từ Filepros đã đến vào ngày 9 tháng 10. Hiện ông ấy cùng các kỹ thuật viên đang bận lắp đặt máy móc.\n\nRất tiếc, tôi được biết lô hàng còn lại từ Draper **sẽ mất** nhiều thời gian hơn. Thời điểm sớm nhất họ có thể đảm bảo giao hàng là sau ngày 16 tháng 10, vì vậy chúng ta có thể phải lùi ngày khai trương đến 25 tháng 10. Nếu ban quản lý muốn, chúng ta có thể **hủy** đơn hàng. Tôi đã nhờ ông Sampson, một trong các nhà cung cấp của chúng ta, **kiểm tra** xem liệu ông ấy có thể cung cấp gấp những mặt hàng cần thiết hay không. Ông ấy hiểu tình hình và xác nhận có thể lấy hàng ngay.\n\n**Nói cách khác, chúng ta sẽ có được những thứ cần thiết đúng hạn.** Tôi sẽ chờ quyết định của bạn về đơn hàng Draper và tiếp tục cập nhật tình hình.\n\nĐáp án: **139 D, 140 D, 141 A, 142 D**.","translationStatus":"reviewed"},{"id":"h2/test06/143_ADAC.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 143–146","questions":{"143":"A","144":"D","145":"A","146":"C"},"image":"data/h2/test06/143_ADAC.png","markedImage":"marked/h2/test06/143_ADAC.png","translation":"**Goldline Staffing tuyển nhân viên phụ trách tiền lương**\n\nGoldline Staffing đang tìm nhân viên phụ trách tiền lương cho trụ sở chính đang phát triển nhanh tại Minneapolis.\n\nỨng viên sẽ chịu trách nhiệm quản lý dữ liệu tiền lương của tối đa 2.000 nhân viên. Vì vậy, họ phải có khả năng tổ chức công việc tốt và thực hiện thành thạo các nhiệm vụ được **giao phó**. Ngoài ra, ứng viên phải có kiến thức thực tế về **cả phần mềm xử lý văn bản lẫn phần mềm kế toán**.\n\nNhân viên mới sẽ được bố trí vào vị trí phù hợp nhất với trình độ học vấn và kinh nghiệm. Chúng tôi nhận thấy phần lớn ứng viên đều hỏi liệu có cơ hội học thêm kỹ năng mới hay không. **Chúng tôi đánh giá cao tinh thần này và cam kết cung cấp sự hỗ trợ cần thiết.** Trên thực tế, phát triển nhân viên là một trong những chương trình trọng tâm của chúng tôi. **Vì vậy**, mọi ứng viên trúng tuyển đều sẽ được đào tạo phù hợp.\n\nĐể ứng tuyển, vui lòng gửi sơ yếu lý lịch và các tài liệu cần thiết khác đến jobs@goldline.com.\n\nĐáp án: **143 A, 144 D, 145 A, 146 C**.","translationStatus":"reviewed"},{"id":"h2/test06/147_DC.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 147–148","questions":{"147":"D","148":"C"},"image":"data/h2/test06/147_DC.png","markedImage":"marked/h2/test06/147_DC.png","translation":"**BẢN GHI NHỚ**\n\n**Đến:** Toàn thể nhân viên  \n**Từ:** Amanda Robinson  \n**Chủ đề:** Bổ nhiệm mới  \n**Ngày:** 20 tháng 5\n\nXin thông báo rằng kể từ ngày 1 tháng 6, **ông Matthew Webb sẽ thay ông Daniel Rodgers giữ chức quản lý thu mua của Longview Holdings**. Kể từ ngày đó, vui lòng gửi mọi yêu cầu mua văn phòng phẩm và thiết bị đến ông Webb.\n\nNhư trước đây, tất cả phiếu yêu cầu phải được **quản lý bộ phận phê duyệt và ký tên trước khi nộp**. Nếu có thắc mắc, nhân viên có thể liên hệ ông Webb qua số máy lẻ 82.\n\nĐáp án: **147 D, 148 C**.","translationStatus":"reviewed"},{"id":"h2/test06/149_DB.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 149–150","questions":{"149":"D","150":"B"},"image":"data/h2/test06/149_DB.png","markedImage":"marked/h2/test06/149_DB.png","translation":"**Trung tâm Viết văn Đại học West**\n\nTrung tâm Viết văn của Đại học West hỗ trợ **tất cả sinh viên đang theo học** chỉnh sửa các bài viết được giao trên lớp. Dịch vụ hiệu đính bài tập hoạt động từ thứ Hai đến thứ Bảy, từ 8 giờ 30 sáng đến 8 giờ tối.\n\nNgoài ra, những sinh viên muốn nâng cao kỹ năng viết có thể đặt lịch học kèm tại quầy chính. Các gia sư viết hiện là học viên cao học của khoa Giáo dục và khoa Nghệ thuật Khai phóng; họ tận tâm hướng dẫn bạn trong suốt quá trình viết bất kỳ bài tập nào trên lớp.\n\nVì vậy, đừng mất thêm thời gian lo lắng về bài luận cuối kỳ! Hãy ghé Trung tâm Viết văn Đại học West tại phòng 450, tòa Ernestine Hall để biết thêm thông tin.\n\nTrung tâm quảng bá **nhiều dịch vụ hỗ trợ viết khác nhau** và mở cửa **sáu ngày mỗi tuần, không phải bảy ngày**.\n\nĐáp án: **149 D, 150 B**.","translationStatus":"reviewed"},{"id":"h2/test06/151_CD.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 151–152","questions":{"151":"C","152":"D"},"image":"data/h2/test06/151_CD.png","markedImage":"marked/h2/test06/151_CD.png","translation":"**Công viên Hạt Lafayette**\n\nChúng tôi chúc mọi người có một chuyến tham quan an toàn và vui vẻ tại Công viên Hạt Lafayette. Để công viên luôn thú vị và thân thiện với tất cả du khách, vui lòng tuân thủ các quy định sau:\n\n- Cổng công viên đóng lúc 10 giờ tối và mở lại lúc 6 giờ sáng mỗi ngày. Không vào công viên trong thời gian đóng cửa.\n- Trẻ em phải luôn có người giám sát. Công viên không chịu trách nhiệm về tai nạn xảy ra tại khu vui chơi hoặc những nơi khác.\n- Chó phải được xích, ngoại trừ tại khu vực thả rông được chỉ định ở phía bắc công viên.\n- Sân bóng rổ và sân bóng đá nằm ở phía tây công viên. Chỉ chơi bóng tại các khu vực này để tránh làm hư hại **vườn hoa hồng ở phía đông**.\n- Tốc độ tối đa của mọi phương tiện là 20 dặm/giờ. Người đi xe đạp trên đường dùng chung không nên chạy nhanh để bảo đảm an toàn cho người đi bộ.\n- Tất cả du khách được khuyến cáo **chỉ sang đường tại những vị trí quy định và chú ý xe cộ**.\n\nNếu có vấn đề, hãy liên hệ ban quản lý công viên theo số 555-6103. Văn phòng nằm ở góc đông bắc công viên, gần đường Greenwood Drive.\n\nTrong các cơ sở được nêu có vườn hoa hồng, khu thả chó và khu chơi bóng; **không có quầy cho thuê xe đạp**.\n\nĐáp án: **151 C, 152 D**.","translationStatus":"reviewed"},{"id":"h2/test06/153_CDCC.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 153–156","questions":{"153":"C","154":"D","155":"C","156":"C"},"image":"data/h2/test06/153_CDCC.png","markedImage":"marked/h2/test06/153_CDCC.png","translation":"**Chuỗi tin nhắn**\n\n**Hilda Jacobsen — 9:37 sáng:** Larry, lịch làm việc tuần này của anh thế nào? Có việc gì quan trọng không?\n\n**Larry Boyd — 9:39 sáng:** Không hẳn. Tôi định dành phần lớn thời gian cho dự án Hanifan, nhưng không gấp. Họ chưa cần bản thiết kế nội thất văn phòng trong hai tuần nữa.\n\n**Larry Boyd — 9:40 sáng:** Tôi có thể giúp gì cho cô không?\n\n**Hilda Jacobsen — 9:42 sáng:** Tôi muốn hỏi liệu thứ Tư anh có rảnh đi cùng tôi vào thành phố để gặp một số đại diện của Digitek không. Tôi sẽ trình bày ý tưởng cải tạo sảnh cho họ. Tôi rất muốn có được công ty họ làm khách hàng, nên sẽ rất tốt nếu anh có mặt để hỗ trợ. Anh có thể giúp hướng cuộc trò chuyện về các điểm bán hàng trong đề xuất của tôi nếu tôi quên điều gì đó.\n\n**Larry Boyd — 9:42 sáng:** Tôi hiểu rồi. Cuộc họp thứ Tư diễn ra lúc mấy giờ?\n\n**Hilda Jacobsen — 9:43 sáng:** Lúc 10 giờ 30 sáng. Chúng ta có thể đi xe của tôi từ đây. Khi xong việc, tôi sẽ mời anh ăn trưa.\n\n**Larry Boyd — 9:44 sáng:** **Được thôi.** Hẹn gặp cô vào thứ Tư. Sau đó chúng ta sẽ quay lại văn phòng, đúng không?\n\n**Hilda Jacobsen — 9:45 sáng:** Đúng vậy. Tôi sẽ gửi email cho anh thêm thông tin về dự án ngay bây giờ. Cảm ơn anh!\n\nLarry đang **làm bản thiết kế nội thất**, còn Hilda hy vọng **giành được Digitek làm khách hàng mới**. Sau bữa trưa thứ Tư, Larry sẽ **trở lại nơi làm việc**.\n\nĐáp án: **153 C, 154 D, 155 C, 156 C**.","translationStatus":"reviewed"},{"id":"h2/test06/157_CAB.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 157–159","questions":{"157":"C","158":"A","159":"B"},"image":"data/h2/test06/157_CAB.png","markedImage":"marked/h2/test06/157_CAB.png","translation":"**MyPost.com — Trợ giúp**\n\n**MyPost là gì và hoạt động như thế nào?**\n\nMyPost cung cấp địa chỉ nhận hàng tại Hoa Kỳ cho khách hàng sống ở nước ngoài. Vì không phải mọi nhà bán lẻ trực tuyến tại Mỹ đều giao hàng quốc tế, bạn có thể dùng địa chỉ của MyPost tại Hoa Kỳ làm điểm trung chuyển để tạm thời lưu giữ hàng đã đặt. Khi mua sắm tại một trang web bán lẻ của Mỹ, chỉ cần nhập địa chỉ MyPost vào biểu mẫu giao hàng; chúng tôi sẽ lo phần còn lại. MyPost dùng hệ thống theo dõi tiên tiến và còn cung cấp các dịch vụ như lưu kho tạm thời và đóng gói lại hàng. Hiện chúng tôi giao đến hơn 64 quốc gia.\n\n**Đăng ký MyPost như thế nào?**\n\nHãy nhấp vào liên kết để đăng ký tài khoản trực tuyến. Không có phí đăng ký hay phí thuê bao; bạn chỉ trả tiền cho các dịch vụ mình sử dụng.\n\n**Chi phí gửi hàng là bao nhiêu?**\n\nCước phí được tính theo **trọng lượng và kích thước** của kiện hàng.\n\n**Có giới hạn về trọng lượng và kích thước không?**\n\nTrọng lượng tối thiểu tính cước là **500 gram**. Trọng lượng tối đa là 30 kg. Kích thước tối đa của kiện hàng là 3 mét (dài × rộng).\n\n**Mất bao lâu để nhận hàng?**\n\nSau khi kiện hàng rời kho ở nước ngoài, thời gian giao đến địa chỉ bạn chỉ định dự kiến khoảng 7–10 ngày làm việc.\n\nDịch vụ này phù hợp nhất với **khách hàng sống ngoài Hoa Kỳ và đặt hàng từ các trang web của Mỹ**.\n\nĐáp án: **157 C, 158 A, 159 B**.","translationStatus":"reviewed"},{"id":"h2/test06/160_CB.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 160–161","questions":{"160":"C","161":"B"},"image":"data/h2/test06/160_CB.png","markedImage":"marked/h2/test06/160_CB.png","translation":"**Cuộc trò chuyện trực tuyến về việc trả lương**\n\n**Jessica Jang — 9:27:** Tôi vừa nhận được tin nhắn từ một nhân viên phòng kinh doanh nói rằng lương của phòng cô ấy vẫn chưa được chuyển. Đáng lẽ tiền phải vào từ chiều hôm qua.\n\n**Jessica Jang — 9:28:** Có ai nhận được khiếu nại tương tự từ các phòng ban khác không?\n\n**William Stuttgart — 9:34:** Tôi vừa kiểm tra: phòng sản xuất đã nhận được, nhưng phòng thu mua thì chưa. Phòng tài chính cũng chưa nhận, và lương của tôi cũng chưa vào.\n\n**Jessica Jang — 9:35:** Tôi cũng vậy. Thật lạ. Tôi đã hỏi phòng nghiên cứu và phát triển, họ đã nhận được rồi. Không biết Erin có nghe tin gì không.\n\n**Erin Hinkle — 9:37:** Xin lỗi, tôi vừa gọi điện. Có vẻ như không ai ở phòng nhân sự nhận được lương. Tôi phát hiện vấn đề này từ sáng sớm và vừa liên hệ Beacon Bank để tìm nguyên nhân. Họ hứa sẽ phản hồi trong vòng mười phút tới.\n\n**Erin Hinkle — 9:44:** Ngân hàng cho biết hệ thống phần mềm thanh toán mới mà họ vừa đưa vào sử dụng gặp sự cố kỹ thuật. Vấn đề đã được khắc phục; n
