<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOEIC Study Deck</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17243a;
      --muted: #68758a;
      --paper: #ffffff;
      --line: #dfe5ee;
      --blue: #1769e0;
      --blue-soft: #eaf2ff;
      --green: #15805d;
      --green-soft: #e5f7f0;
      --red: #c83c4d;
      --red-soft: #ffebee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #f3f6fa;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, select { font: inherit; }
    .shell { max-width: 1500px; margin: 0 auto; padding: 16px 24px 24px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 14px;
      margin-bottom: 18px;
      padding: 16px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    label.small { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    select, .button {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
      color: var(--ink);
      cursor: pointer;
    }
    .button.primary { border-color: var(--blue); color: white; background: var(--blue); font-weight: 700; }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .counter { align-self: center; color: var(--muted); font-size: 14px; }
    .score {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .score span {
      min-width: 66px;
      padding: 6px 9px;
      text-align: center;
      color: var(--muted);
      border-radius: 9px;
      background: #f2f6fa;
      font-size: 11px;
      font-weight: 700;
    }
    .score strong { display: block; color: var(--ink); font-size: 16px; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 18px;
      align-items: start;
    }
    .image-card, .answer-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(23, 36, 58, .06);
    }
    .image-card { padding: 16px; text-align: center; overflow: auto; }
    .image-card img { display: block; max-width: 100%; height: auto; margin: auto; }
    .translation-actions { display: flex; justify-content: center; margin-top: 16px; }
    .translation-panel {
      margin-top: 12px;
      padding: clamp(18px, 3vw, 28px);
      text-align: left;
      border: 1px solid #cfe3df;
      border-radius: 12px;
      background: linear-gradient(145deg, #f4fbf8, #f8fbff);
    }
    .translation-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .translation-title { margin: 0; font-size: 18px; }
    .translation-note { color: var(--muted); font-size: 12px; }
    .translation-text { white-space: pre-wrap; line-height: 1.7; }
    .translation-text strong { color: #0b5e55; font-weight: 800; }
    .translation-answers {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #cfe3df;
      line-height: 1.6;
    }
    .translation-answers strong { color: var(--blue); }
    .answer-card { padding: 16px; position: sticky; top: 18px; }
    h1 { margin: 0 0 5px; font-size: 19px; }
    .question { padding: 12px 0; border-top: 1px solid var(--line); }
    .question:first-of-type { border-top: 0; }
    /* Each image contains at most five questions, so keep the actions aligned. */
    .quiz-form { height: 420px; }
    .question-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .question-title { font-weight: 800; }
    .question-status { font-size: 12px; font-weight: 800; text-align: right; }
    .question-status.correct { color: var(--green); }
    .question-status.wrong { color: var(--red); }
    .question-status.ungraded { color: var(--muted); }
    .choices {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: 100%;
      gap: 6px;
    }
    .choice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 32px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }
    .choice input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--blue);
      cursor: pointer;
    }
    .choice.correct { color: var(--green); }
    .choice.correct input { accent-color: var(--green); }
    .choice.wrong { color: var(--red); }
    .choice.wrong input { accent-color: var(--red); }
    .question.ungraded { opacity: .72; }
    .result { min-height: 22px; margin: 12px 0; font-size: 14px; font-weight: 700; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .actions .primary { grid-column: 1 / -1; }
    .empty { padding: 50px 20px; text-align: center; color: var(--muted); }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .answer-card { position: static; }
      .counter { width: 100%; margin-left: 0; }
      .score { width: 100%; margin-left: 0; }
      .score span { flex: 1; }
      .shell { padding: 10px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="controls">
      <label class="small">Chế độ
        <select id="mode">
          <option value="ordered">Theo thứ tự</option>
          <option value="random">Ngẫu nhiên</option>
          <option value="wrong">Ôn câu sai</option>
          <option value="answers">Hiện đáp án ngay</option>
        </select>
      </label>
      <label class="small">Sách
        <select id="book"></select>
      </label>
      <label class="small">Test
        <select id="test"></select>
      </label>
      <button class="button primary" id="startButton">Bắt đầu lượt mới</button>
      <button class="button" id="resetButton">Xóa điểm</button>
      <div class="score" aria-label="Kết quả hiện tại">
        <span>Đúng<strong id="correctScore">0</strong></span>
        <span>Sai<strong id="wrongScore">0</strong></span>
        <span>Điểm<strong id="percentScore">0%</strong></span>
      </div>
      <span class="counter" id="counter"></span>
    </section>
    <section class="workspace">
      <div class="image-card" id="imagePanel"></div>
      <aside class="answer-card" id="answerPanel"></aside>
    </section>
  </main>
  <script>
    const DATA = {"items":[{"id":"h2/test01/131_CBDD.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 131–134","questions":{"131":"C","132":"B","133":"D","134":"D"},"image":"data/h2/test01/131_CBDD.png","markedImage":"marked/h2/test01/131_CBDD.png","translation":"**THÔNG BÁO ĐẾN TOÀN THỂ NGƯỜI THUÊ NHÀ**\n\nTập đoàn Wimberley sẽ **chuyển đổi** hệ thống thu tiền thuê nhà sang hình thức điện tử. Thay đổi này sẽ áp dụng cho tất cả các căn hộ kể từ ngày 1 tháng 2. **Kể từ ngày đó, người thuê nhà phải thanh toán tiền thuê trực tuyến.** Tiền mặt và séc cá nhân sẽ không còn được chấp nhận.\n\nMỗi người thuê nhà cần tạo một hồ sơ người dùng tại www.wimberlygroup.com. Sau khi đăng nhập, người thuê có thể **thực hiện thanh toán**. Bạn có thể làm việc này bằng cách chọn hóa đơn chưa thanh toán, sau đó nhấp vào nút ở cuối màn hình. **Ngay khi** bạn nhấn “Thanh toán”, số tiền bạn chỉ định sẽ được trừ từ thẻ tín dụng hoặc tài khoản ngân hàng đã đăng ký. Nếu muốn thiết lập thanh toán tự động, vui lòng nhấp vào nút có nhãn “Thanh toán số tiền này mỗi tháng”.\n\nCảm ơn sự hợp tác của bạn. Nếu có bất kỳ câu hỏi nào, vui lòng gửi email cho chúng tôi theo địa chỉ help@wimberlygroup.com.","translationStatus":"reviewed"},{"id":"h2/test01/135_CBDB.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 135–138","questions":{"135":"C","136":"B","137":"D","138":"B"},"image":"data/h2/test01/135_CBDB.png","markedImage":"marked/h2/test01/135_CBDB.png","translation":"**CHỦ ĐỀ: MÁY TÍNH XÁCH TAY CỦA BẠN**\n\nKính gửi cô Thornberry,\n\nTôi viết thư này về chiếc máy tính xách tay Trax 2700 mà cô đã mang đến cửa hàng của chúng tôi vào ngày 15 tháng 6 do màn hình gặp sự cố. Sau khi gửi máy đến cho **các kỹ thuật viên** kiểm tra, chúng tôi phát hiện máy có một linh kiện bị lỗi. Hiện tại, máy tính của cô **đang được sửa chữa**. Theo yêu cầu, chúng tôi cũng đang kiểm tra kỹ thiết bị để xem còn vấn đề nào khác hay không.\n\nVì sự cố này dường như hoàn toàn là lỗi của chúng tôi, chúng tôi sẽ tặng cô một phiếu mua hàng trị giá 50 đô la để sử dụng tại cửa hàng. **Ngoài ra**, chúng tôi cũng có phiếu giảm giá điện tử dành cho trang web. Cô chỉ cần cho chúng tôi biết mình muốn nhận loại nào.\n\n**Chúng tôi sẽ gửi lại máy tính cho cô trong vòng ba ngày.** Nếu đến lúc đó cô vẫn chưa nhận được, vui lòng gọi cho bộ phận chăm sóc khách hàng.\n\nTrân trọng,\nVincent Nakamura\nBộ phận Chăm sóc khách hàng","translationStatus":"reviewed"},{"id":"h2/test01/139_DCBA.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 139–142","questions":{"139":"D","140":"C","141":"B","142":"A"},"image":"data/h2/test01/139_DCBA.png","markedImage":"marked/h2/test01/139_DCBA.png","translation":"**THÔNG BÁO DÀNH CHO TOÀN THỂ NHÂN VIÊN**\n\nTrung tâm mua sắm nơi cửa hàng của chúng ta tọa lạc sẽ đóng cửa từ ngày 24 đến ngày 26 tháng 12. **Tuy nhiên**, một số người trong các bạn sẽ đến làm việc vào ngày 24 tháng 12 để chuẩn bị cho đợt giảm giá sau kỳ nghỉ lễ.\n\nNhân viên bảo vệ thường mở cửa trung tâm mua sắm vào buổi sáng sẽ nghỉ trong thời gian này. **Một nhân viên bảo vệ khác sẽ phải có mặt để vào tòa nhà.** Daniel Monahan là nhân viên cấp cao nhất, vì vậy tôi sẽ giao chìa khóa cho anh ấy và anh ấy sẽ cho mọi người vào trong.\n\nĐiều vô cùng quan trọng là các bạn **gặp** Daniel tại lối vào đúng 10 giờ sáng. Chúng ta không muốn mất thời gian bắt anh ấy phải đi đi lại lại để mở cửa, vì vậy xin hãy chu đáo và đến **đúng giờ nhất có thể**.\n\nCảm ơn sự thông cảm của các bạn.\n\nAlison Culpepper\nQuản lý cửa hàng","translationStatus":"reviewed"},{"id":"h2/test01/143_DCAB.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 143–146","questions":{"143":"D","144":"C","145":"A","146":"B"},"image":"data/h2/test01/143_DCAB.png","markedImage":"marked/h2/test01/143_DCAB.png","translation":"**CHỦ ĐỀ: LỊCH KIỂM TRA**\n\nKính gửi ông Singh,\n\nVào ngày 17 tháng 10, nhà máy may mặc của ông sẽ trải qua đợt thanh tra định kỳ hằng năm của chính phủ. Đợt **đánh giá** thường niên này nhằm xác minh rằng tất cả các luật lao động đều đang được tuân thủ. Nhà máy của ông đã vượt qua đợt đánh giá **trước đó** mà không gặp vấn đề nghiêm trọng nào, vì vậy các thanh tra viên hy vọng lần này cũng sẽ thấy mức độ tuân thủ tương tự.\n\n**Theo quy định pháp luật**, ông có nghĩa vụ cho phép các thanh tra viên tiếp cận bất kỳ khu vực nào trong nhà máy mà họ muốn kiểm tra. Việc không tuân thủ yêu cầu này có thể dẫn đến tiền phạt và các cuộc điều tra bổ sung. Ngoài ra, các thanh tra viên cần xác nhận rằng người lao động đang được trả lương thỏa đáng. **Bộ phận nhân sự sẽ cần chuẩn bị các tài liệu liên quan.**\n\nCảm ơn ông đã quan tâm đến vấn đề này.\n\nFaria Deveraj\nTrưởng nhóm thanh tra\nChính quyền Thành phố Mumbai","translationStatus":"reviewed"},{"id":"h2/test01/147_CA.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 147–148","questions":{"147":"C","148":"A"},"image":"data/h2/test01/147_CA.png","markedImage":"marked/h2/test01/147_CA.png","translation":"**Bữa tối gây quỹ cho Bệnh viện Đa khoa Cardigan Bay**\n\nBạn được trân trọng mời tham dự bữa tối gây quỹ hỗ trợ Bệnh viện Đa khoa Cardigan Bay vào lúc 7 giờ 30 tối ngày 25 tháng 4 tại Phòng Iris của Khách sạn Beaufort.\n\nBệnh viện được xây dựng lần đầu vào năm 1960. Mặc dù phần lớn bệnh viện đã được cải tạo hoàn toàn, **khu nhà phía đông hầu như không thay đổi kể từ ngày khánh thành**. Để cải thiện khu vực này, bệnh viện cần khoảng 300.000 bảng Anh và bữa tối sẽ góp phần gây quỹ cho dự án.\n\nVé được bán với giá 100 bảng tại quầy lễ tân chính của bệnh viện. Những người **mua từ bốn vé trở lên trong một lần** sẽ được tặng một cuốn sách về dinh dưỡng của Bác sĩ Dianne Larson, *Food Fit*, trị giá 25 bảng.\n\nChúng tôi chân thành hy vọng bạn sẽ tham dự để bệnh viện có thể thực hiện những nâng cấp cần thiết và nâng cao chất lượng chăm sóc mà chúng tôi cung cấp.","translationStatus":"reviewed"},{"id":"h2/test01/149_DD.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 149–150","questions":{"149":"D","150":"D"},"image":"data/h2/test01/149_DD.png","markedImage":"marked/h2/test01/149_DD.png","translation":"**WALLACE TRANSPORTATION — VÉ XE**\n\nHành khách: William Singer  \nSố điện thoại: (212) 555-3201  \nĐịa chỉ nhà: **21 West 74th Street, New York, NY 10023**  \nSố vé: 41249101ABKQA  \nHạng vé: Thường  \nGiá vé: 52 đô la  \nNgày khởi hành: 11 tháng 8\n\n**Lịch trình**\n\nKhởi hành từ Thành phố New York: 5:10 chiều  \nĐến Pittsburgh: 12:12 sáng  \nKhởi hành từ Pittsburgh: 1:20 sáng  \nĐến Columbus: 4:50 sáng  \nKhởi hành từ Columbus: 5:30 sáng  \nĐến Chicago: 10:05 sáng\n\nXe buýt sẽ rời Bến xe Park Avenue ở Thành phố New York lúc 5:10 chiều. Vui lòng chuẩn bị sẵn vé để xuất trình cho tài xế khi đến. Hành khách được phép mang hai kiện hành lý lên xe: một kiện xách tay và một kiện gửi trong khoang hành lý.\n\nHành khách bị lỡ chuyến sẽ không được hoàn tiền. Nếu muốn hủy vé, vui lòng gọi số (212) 585-8843.","translationStatus":"reviewed"},{"id":"h2/test01/151_BC.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 151–152","questions":{"151":"B","152":"C"},"image":"data/h2/test01/151_BC.png","markedImage":"marked/h2/test01/151_BC.png","translation":"**Thư giới thiệu các gói phúc lợi bảo hiểm**\n\nNgày 12 tháng 8\n\nKính gửi cô Miskin,\n\nTôi là đại diện của Well Time Benefits và rất mong được gặp cô để trao đổi về những dịch vụ chúng tôi có thể cung cấp cho công ty cô. Tại Well Time Benefits, chúng tôi hiểu vai trò của cô với tư cách quản lý phúc lợi của công ty và có thể cung cấp **các gói bảo hiểm giúp công việc của cô thuận tiện hơn, đồng thời phù hợp với nhu cầu của công ty**. Đó là lý do các gói phúc lợi dành cho nhân viên của chúng tôi được nhiều doanh nghiệp và tổ chức lựa chọn.\n\nWell Time Benefits cung cấp nhiều gói bảo hiểm thuộc mọi loại, chẳng hạn như y tế, sức khỏe tinh thần, nha khoa, nhân thọ và nhiều loại khác. Các gói phổ biến gồm “Health Plus” và gói toàn diện “Choice Care”. Cô có thể điều chỉnh một trong hai gói này cho phù hợp với nhu cầu của tổ chức. **Quyền lợi bảo hiểm khuyết tật và nghỉ phép chăm con đều có trong gói Choice Care.**\n\nTôi sẽ liên hệ với văn phòng cô trong hai tuần tới để sắp xếp một cuộc hẹn. Nếu muốn trao đổi sớm hơn, vui lòng gọi số 555-4433.\n\nTrân trọng,\n\nLucas Moreland  \nBộ phận Dịch vụ Khách hàng, Well Time Benefits","translationStatus":"reviewed"},{"id":"h2/test01/153_CD.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 153–154","questions":{"153":"C","154":"D"},"image":"data/h2/test01/153_CD.png","markedImage":"marked/h2/test01/153_CD.png","translation":"**Chuỗi tin nhắn**\n\n**Sonya Meadows — 1:37 chiều**  \nBrian, xin lỗi đã làm phiền anh, nhưng tôi cần nhờ anh một việc. Tôi phải giao bản hợp đồng thuê cuối cùng cho một văn phòng, nhưng cuộc hẹn vừa rồi kéo dài nên tôi không nghĩ mình có thể đến đó đúng giờ.\n\n**Brian Hall — 1:40 chiều**  \nTôi có thể giao giúp cô. Hãy gửi thông tin chi tiết cho tôi.\n\n**Sonya Meadows — 1:43 chiều**  \nCảm ơn anh! Khách hàng là Covent Financial và họ đang thuê một văn phòng tại State Tower trên Market Street. Đó là phòng 1804.\n\n**Brian Hall — 1:45 chiều**  \nĐược. Cuộc hẹn lúc mấy giờ?\n\n**Sonya Meadows — 1:48 chiều**  \n2 giờ 40. Anh sẽ kịp nếu rời đi trong vòng 10–15 phút tới.\n\n**Brian Hall — 1:50 chiều**  \nTôi sẽ đi taxi để đến đó nhanh hơn. Lái xe đến khu vực đó mất khoảng 30 phút, chưa kể **thời gian tìm chỗ đậu xe**. Còn người liên hệ thì sao?\n\n**Sonya Meadows — 1:51 chiều**  \nThông tin đó **chắc đang nằm trên bàn làm việc của tôi**. Tôi đã nhờ lễ tân sao chép mọi thứ và để lại trong văn phòng.","translationStatus":"reviewed"},{"id":"h2/test01/155_CCD.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 155–157","questions":{"155":"C","156":"C","157":"D"},"image":"data/h2/test01/155_CCD.png","markedImage":"marked/h2/test01/155_CCD.png","translation":"**Chủ đề: Thông tin về Ngày Cửa hàng Đĩa nhạc**\n\nKính gửi ông Joyce,\n\nHằng năm, vào thứ Bảy thứ ba của tháng 5, Ngày Cửa hàng Đĩa nhạc được tổ chức để tôn vinh tinh thần độc lập của các cửa hàng đĩa nhạc. Điều đó có nghĩa Fast Track Records sẽ một lần nữa phối hợp với các cửa hàng lớn khác trong thành phố để tổ chức một ngày hội âm nhạc. Vì ông là thành viên Câu lạc bộ Người hâm mộ Âm nhạc, chúng tôi gửi ông một số hoạt động nổi bật trong ngày:\n\n**10:00 sáng–12:00 trưa:** John Kher, Sarah Feinstein, Ernest Yates và các nhà phê bình âm nhạc địa phương khác sẽ đọc những đoạn trích từ tác phẩm của họ tại Gold Sounds Records.\n\n**12:00 trưa–2:00 chiều:** Marshalltown Records sẽ giảm giá đặc biệt cho toàn bộ đĩa nhạc jazz và blues. Khách hàng có thể được giảm tới 50% cho các album yêu thích.\n\n**1:00–3:00 chiều:** Duke Records sẽ tổ chức chương trình bốc thăm trúng nhiều loại hàng hóa, gồm hộp đựng đĩa vinyl và các vật phẩm lưu niệm khác.\n\n**2:30–3:30 chiều:** Ban nhạc rock địa phương The Chimney Sweeps sẽ biểu diễn tại Desert Island Records.\n\n**4:00–5:00 chiều:** Gold Sounds Records sẽ tổ chức cuộc thi kiến thức về âm nhạc. Người thắng cuộc sẽ nhận các giải thưởng đặc biệt, gồm CD và áp phích có chữ ký.\n\n**5:00 chiều:** Một bữa tiệc nhỏ sau sự kiện sẽ được tổ chức tại **Marshalltown Records**.\n\nNếu có câu hỏi, vui lòng gọi Fast Track Records theo số 555-3009 hoặc trả lời email này. Lịch trình chi tiết có tại www.fasttrackrecords.com/recordstoreday.","translationStatus":"reviewed"},{"id":"h2/test01/158_DBDD.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 158–161","questions":{"158":"D","159":"B","160":"D","161":"D"},"image":"data/h2/test01/158_DBDD.png","markedImage":"marked/h2/test01/158_DBDD.png","translation":"**Thông báo của Công viên Thành phố Eagle Canyon**\n\nTrong tháng qua, số trường hợp nhìn thấy gấu mèo tại các khu vực trống trong công viên đã tăng mạnh. Kiểm lâm nghi ngờ chúng bị thu hút bởi thức ăn thừa mà khách tham quan cố ý hoặc vô tình để lại. **Những người thường xuyên đến công viên đã bày tỏ lo ngại về vấn đề này.**\n\nSở Y tế Công cộng thành phố không muốn khuyến khích gấu mèo rời khỏi khu vực nhiều cây cối vì chúng có thể mang mầm bệnh và gây nguy hiểm cho khách tham quan cùng thú cưng. **Vì vậy, chúng tôi đang thực hiện một số biện pháp để giải quyết tình trạng này.**\n\n- Không để lại rác trong công viên. Hãy mang rác theo khi rời đi hoặc bỏ vào các thùng rác có nắp được bố trí khắp công viên.\n- Nếu nhìn thấy gấu mèo, không đến gần hoặc cho chúng ăn. Chúng là động vật hoang dã có móng vuốt sắc và có thể nguy hiểm khi hoảng sợ.\n\n**Chúng tôi cũng sẽ tăng số lượng thùng rác trong công viên.** Ngoài ra, hoạt động dọn dẹp công viên dành cho tình nguyện viên sẽ được tổ chức vào thứ Bảy cuối cùng mỗi tháng. Đợt tiếp theo diễn ra ngày 27 tháng 6. Người muốn tham gia cần đăng ký tại trung tâm khách tham quan của công viên. **Chúng tôi nhận phiếu đăng ký muộn nhất là hai ngày trước sự kiện.**\n\nTất cả người tham gia sẽ được cung cấp **găng tay và áo bảo hộ**, nước uống cùng một bữa trưa nhẹ.","translationStatus":"reviewed"},{"id":"h2/test01/162_BCBC.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 162–165","questions":{"162":"B","163":"C","164":"B","165":"C"},"image":"data/h2/test01/162_BCBC.png","markedImage":"marked/h2/test01/162_BCBC.png","translation":"**Cuộc trò chuyện trực tuyến về dự án quảng bá N-Genz**\n\n**Michele Hanson — 11:40**  \nMọi người có thể cập nhật tiến độ dự án quảng bá N-Genz không? Cuộc họp với khách hàng đã được chuyển sang thứ Ba, ngày 10 tháng 8.\n\n**Barry Carr — 11:42**  \nCác chỉnh sửa kịch bản quảng cáo truyền hình sẽ hoàn tất chiều nay. Ngoài ra, tôi vẫn đang chờ bộ phận sản xuất cho phép tiến hành.\n\n**Dustin Rodriguez — 11:45**  \nBarry, lựa chọn diễn viên chính của chúng ta đã rút lui nên tôi đang chờ phản hồi từ công ty quản lý người mẫu về người thay thế. Nếu không, chúng ta có thể tiếp tục.\n\n**Michele Hanson — 11:47**  \nCảm ơn hai anh. Còn chiến dịch trực tuyến thì sao? Người liên hệ của tôi là Wil Hopkins.\n\n**Wil Hopkins — 11:50**  \nChúng tôi đang ở giai đoạn cuối phát triển trang web. Tôi cần khoảng một tuần nữa để hoàn thiện, nhưng chắc chắn sẽ xong.\n\n**Dustin Rodriguez — 11:54**  \nTin tốt: công ty quản lý vừa báo rằng lựa chọn thứ hai của tôi cho vai diễn có thể nhận việc.\n\n**Barry Carr — 11:55**  \nTuyệt. Dustin, tôi sẽ gửi anh kịch bản hoàn chỉnh tối nay. Nhân tiện, cuộc họp ngày 10 trùng với một cuộc họp khách hàng khác nên tôi sẽ cử Brianna Johns đi thay.\n\n**Dustin Rodriguez — 11:57**  \nKhông vấn đề gì. Tôi sẽ liên hệ với cô ấy để sắp xếp.\n\n**Michele Hanson — 11:58**  \nCó vẻ mọi việc **đang diễn ra đúng kế hoạch**. Dustin, hãy tiếp tục cập nhật tình hình. Wil, anh gửi cho tôi đường dẫn bản thử nghiệm để tôi xem được không?\n\n**Wil Hopkins — 11:59**  \nĐược, Michele. Tôi vừa nghĩ đến vài ý tưởng và đây là một số liên kết.","translationStatus":"reviewed"},{"id":"h2/test01/166_DBD.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 166–168","questions":{"166":"D","167":"B","168":"D"},"image":"data/h2/test01/166_DBD.png","markedImage":"marked/h2/test01/166_DBD.png","translation":"**Công ty Cà phê Hanlan — Chính sách thu mua có đạo đức**\n\nTại Hanlan, chúng tôi biết khách hàng muốn thưởng thức cà phê hảo hạng nhất từ khắp thế giới. Chúng tôi cũng hiểu rằng họ muốn chắc chắn những người trồng cà phê được đối xử công bằng. Nhiều nhà sản xuất cung cấp điều kiện làm việc tồi tệ và trả lương thấp cho nhân viên — những cách làm mà Hanlan không ủng hộ. **Vì vậy, chúng tôi chỉ hợp tác với những trang trại đáp ứng các tiêu chuẩn đạo đức nghiêm ngặt.**\n\nCác công ty mua cà phê trên thị trường mở thường không biết chính xác sản phẩm đến từ đâu. Hanlan chọn cách khác: chúng tôi ký hợp đồng độc quyền với các trang trại tại **Guatemala, Ethiopia và Việt Nam**. **Chúng tôi thường xuyên đến thăm các trang trại này để trực tiếp kiểm tra hoạt động của họ.** Nhờ vậy, chúng tôi biết chính xác ai sản xuất cà phê và cà phê được trồng trong điều kiện nào.\n\nChúng tôi trân trọng công sức của nông dân và bảo đảm họ có điều kiện làm việc cùng mức lương phù hợp. Cam kết của chúng tôi chưa dừng ở đó. **Ngoài việc trả mức giá công bằng, Hanlan còn trả thêm 10% so với giá thị trường hiện hành như một lời cảm ơn.**\n\nĐể đóng góp nhiều hơn cho cộng đồng, chúng tôi thành lập Quỹ Phát triển Hanlan. Mỗi năm, thông qua tổ chức này, chúng tôi đầu tư 5% tổng lợi nhuận doanh nghiệp vào việc xây trường học, máy bơm nước, nhà máy lọc nước và cơ sở y tế gần các vùng trồng cà phê. Mục tiêu chính là bảo đảm con em người lao động được an toàn, khỏe mạnh và có cơ hội học tập đầy đủ. **Khi đạt được mục tiêu đáng quý này, chúng tôi sẽ có thể tiếp tục những nỗ lực của mình.**","translationStatus":"reviewed"},{"id":"h2/test01/169_DBC.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 169–171","questions":{"169":"D","170":"B","171":"C"},"image":"data/h2/test01/169_DBC.png","markedImage":"marked/h2/test01/169_DBC.png","translation":"**Người đứng đầu Ping Software được vinh danh là “Nữ nhân vật công nghệ của năm”**\n\n*Bài viết của Carmen Marshall*\n\nRebecca Curtis, Tổng giám đốc điều hành của công ty phần mềm Ping, đã được tạp chí *Gadget Lover* bình chọn là người phụ nữ thành công nhất trong giới công nghệ. Bà Curtis tiếp quản công ty cách đây năm năm và biến công ty thành một doanh nghiệp đa nền tảng phát triển mạnh. Bà dự kiến sẽ phát biểu nhận giải tại hội nghị thường niên của *Gadget Lover* vào ngày 2 tháng 12.\n\nTrước khi bà Curtis thay thế người tiền nhiệm Mark Spalding, Ping **chủ yếu được biết đến với phần mềm xử lý văn bản**. Do có nhiều sản phẩm xử lý văn bản mới xuất hiện, phần mềm của Ping không còn bán chạy như trước. Bà Curtis nhanh chóng đảo ngược tình hình bằng cách phát triển nhiều phần mềm chất lượng cao, gồm chương trình chỉnh sửa ảnh và bảng tính. Hiện nay, Ping nổi tiếng với công nghệ tiên tiến và đáng tin cậy.\n\nTrong vài năm tới, Ping sẽ xây dựng chương trình thành viên dành cho người dùng thường xuyên. Người đăng ký sẽ có thể **tải các sản phẩm mới của Ping với mức giá ưu đãi**. Công ty cũng có kế hoạch thiết kế lại trang web. Với những kế hoạch này, Ping được kỳ vọng sẽ tiếp tục phát triển. Hầu hết chuyên gia đều đồng ý rằng bà Curtis là nguyên nhân chính dẫn đến thành công của công ty.","translationStatus":"reviewed"},{"id":"h2/test01/172_DBCC.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 172–175","questions":{"172":"D","173":"B","174":"C","175":"C"},"image":"data/h2/test01/172_DBCC.png","markedImage":"marked/h2/test01/172_DBCC.png","translation":"**Báo cáo Xu hướng Thành phố — Valencia**\n\nLượng khách du lịch đến Valencia đã tăng trong ba năm liên tiếp. Valencia là thành phố lớn thứ ba Tây Ban Nha và nằm trên bờ biển phía đông của quốc gia. Khi cuộc khảo sát bắt đầu, thành phố chỉ đón gần một triệu lượt khách mỗi năm; kết quả mới nhất cho thấy con số này đã tăng lên hơn bốn triệu.\n\nCó nhiều yếu tố tạo nên thay đổi này. Bảo tàng Nghệ thuật Iberia Sanchez mới và trung tâm hội nghị gần đó đã thu hút đông đảo du khách kể từ khi mở cửa năm ngoái. Việc nâng cấp dịch vụ đường sắt từ Valencia đến Madrid và Barcelona cũng **rút ngắn đáng kể thời gian di chuyển**. Một dự án mở rộng sân bay lớn dự kiến hoàn tất trước cuối năm, vì vậy tình hình được kỳ vọng còn thuận lợi hơn.\n\nNgoài ra, chiến dịch quảng bá quốc tế do chính quyền thành phố phát động ba năm trước đã mang lại hiệu quả. Valencia được quảng bá trên truyền hình, báo in và mạng xã hội như một điểm đến du lịch; phản ứng đối với chiến dịch vẫn rất tích cực.\n\nCuối cùng, ngoài sức hút đối với khách du lịch và khách công tác, Valencia ngày càng được công nhận là một nơi đáng sống. Công ty tư vấn Apa and Company gần đây **xếp Valencia ở vị trí cao trong báo cáo đánh giá chất lượng sống tại các thành phố nhỏ của châu Âu**, nhờ vị trí ven biển đẹp, chi phí nhà ở thấp và cơ sở hạ tầng hiện đại.","translationStatus":"reviewed"},{"id":"h2/test01/176_BCCDD.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 176–180","questions":{"176":"B","177":"C","178":"C","179":"D","180":"D"},"image":"data/h2/test01/176_BCCDD.png","markedImage":"marked/h2/test01/176_BCCDD.png","translation":"**Tài liệu 1 — Thư từ Maxfield Financial Group**\n\nNgày 10 tháng 5\n\nKính gửi cô Aldridge,\n\nLá thư này phản hồi yêu cầu đăng ký nhận sao kê điện tử của cô. Từ nay, sao kê sẽ được gửi qua email kèm một liên kết. Mỗi tháng, cô có thể truy cập liên kết từ tài khoản trực tuyến và **in sao kê khi thuận tiện**. Sao kê điện tử chứa đầy đủ thông tin như bản giấy. Để bảo vệ thông tin tài khoản, hãy bảo đảm thiết bị dùng để tải và lưu sao kê được an toàn.\n\nNếu muốn nhận thêm một bản giấy qua đường bưu điện, hãy đăng nhập và chọn “Mail my Statement” trong mục “Delivery Preferences”. Xin lưu ý Maxfield Financial Group thu phí thường niên 25 đô la đối với khách hàng chọn nhận sao kê giấy. Nếu muốn ngừng nhận sao kê điện tử và quay lại chỉ nhận bản giấy, hãy bỏ chọn “Email my Statement”.\n\nTrân trọng,  \nBộ phận Chăm sóc Khách hàng  \nMaxfield Financial Group\n\n---\n\n**Tài liệu 2 — Email gửi cô Aldridge**\n\n**Chủ đề: Sao kê tháng 5 của cô**\n\nKính gửi cô Aldridge,\n\nĐính kèm là sao kê tài khoản điện tử tháng 5 của cô. Vì đây là **sao kê điện tử đầu tiên** được gửi, vui lòng xem kỹ và liên hệ trung tâm dịch vụ nếu có câu hỏi hoặc lo ngại. Chúng tôi đã nhận khoản thanh toán của cô và bản sao sẽ đến qua đường bưu điện trong vòng 5–7 ngày.\n\nĐể luôn nhận được thông báo sao kê hằng tháng, hãy bảo đảm email và địa chỉ bưu điện trong hồ sơ luôn được cập nhật. Nếu thay đổi, cô chỉ cần sửa trong mục “Personal Information” trên trang web. Nếu dùng email công ty, lưu ý một số doanh nghiệp có thể chặn email cá nhân của nhân viên.\n\nTrân trọng,  \nBộ phận Chăm sóc Khách hàng  \nMaxfield Financial Group","translationStatus":"reviewed"},{"id":"h2/test01/181_DBCAD.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 181–185","questions":{"181":"D","182":"B","183":"C","184":"A","185":"D"},"image":"data/h2/test01/181_DBCAD.png","markedImage":"marked/h2/test01/181_DBCAD.png","translation":"**Tài liệu 1 — Thông báo dành cho chủ doanh nghiệp tại Woodlands**\n\nHiệp hội Thương nhân Woodlands dự định tổ chức chuỗi hòa nhạc tối thứ Năm tại Center Square từ ngày 28 tháng 5 đến ngày 2 tháng 7, từ 6 giờ đến 9 giờ tối. Các chương trình trong vài năm qua luôn thu hút đông người, nhưng hiệp hội phải chịu chi phí đáng kể để trả cho nghệ sĩ. Vì vậy, chúng tôi tạo cơ hội cho doanh nghiệp địa phương **tài trợ một buổi hòa nhạc**, vừa giúp hiệp hội kiểm soát chi phí vừa quảng bá cửa hàng đến công chúng.\n\nGói tài trợ gồm một biểu ngữ mang tên doanh nghiệp được treo trên sân khấu. Nhà tài trợ có thể dựng quầy quảng bá tại địa điểm biểu diễn, phát tờ rơi hoặc phiếu giảm giá và tặng mẫu sản phẩm. Doanh nghiệp tài trợ từ 500 đô la trở lên còn được đăng tên, logo và thông tin liên hệ cùng thông tin sự kiện trên báo địa phương.\n\nHiệp hội mong muốn gắn kết cộng đồng doanh nghiệp với cư dân địa phương. Nếu muốn tham gia, hãy liên hệ điều phối viên Dan Perry tại DanPerry@woodlandsmerchantsassn.com để hoàn tất thỏa thuận.\n\n---\n\n**Tài liệu 2 — Lịch hòa nhạc mùa hè**\n\nMỗi gói tài trợ gồm một biểu ngữ và một quầy quảng bá nếu có nhu cầu. Hai công ty có thể đồng tài trợ. **Mọi vật phẩm được phát không nằm trong chi phí niêm yết và nhà tài trợ phải tự chi trả.** Nhà tài trợ phải là thành viên hiện tại của Hiệp hội Thương nhân Woodlands.\n\nNgày 28 tháng 5 — Pearson Trio — Jazz — 400 đô la  \nNgày 4 tháng 6 — Tim Robinson — Nhạc đồng quê — 450 đô la  \nNgày 11 tháng 6 — Throwback — Nhạc pop thập niên 1950 — 500 đô la  \nNgày 18 tháng 6 — University Chorus* — Nhạc Broadway — 800 đô la  \nNgày 25 tháng 6 — Treble Trouble — Nhạc dance và pop — 550 đô la  \nNgày 2 tháng 7 — Blues Brothers — Blues — 500 đô la\n\n*Hợp đồng chưa được ký; nghệ sĩ có thể thay đổi.*","translationStatus":"reviewed"},{"id":"h2/test01/186_BABBC.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 186–190","questions":{"186":"B","187":"A","188":"B","189":"B","190":"C"},"image":"data/h2/test01/186_BABBC.png","markedImage":"marked/h2/test01/186_BABBC.png","translation":"**Tài liệu 1 — Hội đồng Thành phố Gunton xem xét đề xuất của Blandfolk Superstore**\n\nHội đồng Thành phố Gunton đã nghe đại diện Blandfolk Superstore trình bày kế hoạch xây một chi nhánh tại địa phương. Tập đoàn bán lẻ đề xuất xây cửa hàng rộng 9.500 mét vuông ngay trong **ranh giới thành phố** trên Đại lộ Medford. Tuy nhiên, khu đất chưa được phép sử dụng cho mục đích thương mại nên Blandfolk đề nghị điều chỉnh quy hoạch. Thị trưởng Claire O’Rourke cho biết hội đồng sẽ thảo luận đề xuất trong tháng này và giải quyết tại cuộc họp tháng 6. Blandfolk nhấn mạnh dự án có thể tạo ra tới 190 việc làm.\n\n---\n\n**Tài liệu 2 — Bình luận của Ronald Pinero trên Gunton Herald**\n\nTôi viết về bài báo ngày 3 tháng 5 liên quan đến đề xuất xây dựng của Blandfolk Superstore. Là một chủ doanh nghiệp lâu năm tại Gunton, tôi rất lo ngại. Tôi quản lý Ballas Boutique, một cửa hàng quần áo ở trung tâm, và nhiều bạn bè cùng đối tác của tôi cũng điều hành cửa hàng tư nhân trong thành phố.\n\nCác tập đoàn bán lẻ lớn từng khiến nhiều cửa hàng nhỏ ở những nơi khác phải đóng cửa, ngay cả khi nằm ngoài thị trấn. Tôi không chắc các doanh nghiệp như của mình có thể cạnh tranh nếu không giảm mạnh giá bán và kéo theo chất lượng hàng hóa. Gunton hiện là một thành phố sôi động, đa dạng; tôi hy vọng **thị trưởng và hội đồng sẽ bác bỏ đề xuất** để giữ thành phố như vậy.\n\n---\n\n**Tài liệu 3 — Email từ Phòng Thương mại Gunton**\n\nKính gửi ông Pinero,\n\nTôi đã đọc bình luận của ông trên trang Gunton Herald. Mối lo của ông cũng là vấn đề ban quản trị Phòng Thương mại Gunton đang thảo luận và chúng tôi đồng ý cần bảo vệ các cửa hàng trung tâm.\n\nNgày 3 tháng 6, hội đồng thành phố sẽ tổ chức **một cuộc họp công khai mà một số thành viên Phòng Thương mại sẽ tham dự**. Sẽ rất hữu ích nếu ông tham gia và trình bày ngắn về những lo ngại đã nêu. Ông có thể dùng tài liệu trực quan, mang theo giấy tờ hỗ trợ và mời những người có cùng mối quan tâm.\n\nTrân trọng,  \nAdeline Morris  \nThư ký, Phòng Thương mại Gunton","translationStatus":"reviewed"},{"id":"h2/test01/191_BDBCD.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 191–195","questions":{"191":"B","192":"D","193":"B","194":"C","195":"D"},"image":"data/h2/test01/191_BDBCD.png","markedImage":"marked/h2/test01/191_BDBCD.png","translation":"**Tài liệu 1 — Hóa đơn của Oresund Graphics and Design**\n\nNgày lập hóa đơn: 4 tháng 10\n\nThiết kế, dàn trang và chụp ảnh báo cáo cổ đông thường niên: 745 euro  \nThiết kế và dàn trang sách giới thiệu *Investing with Kaiser*: 545 euro  \nThiết kế và dàn trang tập điều khoản và điều kiện: 300 euro  \nIn ấn: 650 euro\n\n**Tổng cộng: 2.240 euro**\n\nThanh toán trong vòng 15 ngày. Yêu cầu chỉnh sửa thêm chịu phụ phí 100 euro cho mỗi tài liệu; in gấp phụ thu 250 euro. Công ty không còn nhận séc, chỉ nhận chuyển khoản ngân hàng trực tiếp hoặc thanh toán điện tử.\n\n---\n\n**Tài liệu 2 — Email yêu cầu thay đổi ấn phẩm**\n\nKính gửi ông Svensson,\n\nChúng tôi đã nhận hóa đơn cùng các bản in thử hôm qua. Giám đốc điều hành nhìn chung hài lòng, nhưng yêu cầu **thay bức ảnh trên trang bìa** vì nó chưa thể hiện đúng không khí mong muốn. Chúng tôi đã thuê một nhiếp ảnh gia chụp ảnh mới và tôi sẽ gửi trước thứ Sáu.\n\nRất tiếc, hạn ban đầu không thể thay đổi vì tài liệu phải được gửi kịp cho sự kiện ra mắt chiến dịch vào tháng 11. Nếu yêu cầu này gây khó khăn, hãy báo ngay; nếu không, tôi sẽ chờ hóa đơn đã sửa.\n\nChristine Kaufmann  \nQuản lý Xuất bản, Kaiser Investment Services\n\n---\n\n**Tài liệu 3 — Thông điệp cuối năm từ Tổng giám đốc**\n\nKhi năm sắp kết thúc, tôi muốn cảm ơn mọi người vì sự tận tâm và nỗ lực. Kaiser Investment Services một lần nữa **đạt kết quả tốt hơn dự đoán của các nhà phân tích**, tạo ra lợi nhuận đáng kể cho khách hàng và cổ đông, đồng thời tiếp tục dẫn đầu các khảo sát hài lòng của khách hàng về công ty dịch vụ tài chính tại Đức.\n\nTrong bản tin tháng 12, hãy tìm hiểu về việc mở rộng sang Bắc Mỹ và xem ảnh từ buổi ra mắt chiến dịch tiếp thị tại Hoa Kỳ tháng trước — sự kiện có nhiều khách hàng tiềm năng tham dự. Ngoài ra, tôi sẽ gặp tất cả mọi người tại bữa tiệc cuối năm thường niên.\n\nMatthias Furst","translationStatus":"reviewed"},{"id":"h2/test01/196_BCCAB.png","folder":"h2/test01","book":"h2","bookLabel":"Hacker 2","test":"test01","testLabel":"Test 01","title":"Hacker 2 · Test 01 · Câu 196–200","questions":{"196":"B","197":"C","198":"C","199":"A","200":"B"},"image":"data/h2/test01/196_BCCAB.png","markedImage":"marked/h2/test01/196_BCCAB.png","translation":"**Tài liệu 1 — Email của Raymond Hardy**\n\nKính gửi Trung tâm Nghệ thuật Kỹ thuật số El Paso,\n\nTôi là chủ tịch một câu lạc bộ nhiếp ảnh nghiệp dư tại El Paso. Chúng tôi nghe nói trung tâm sẽ tổ chức các lớp nhiếp ảnh mùa hè và có mức giá đặc biệt cho nhóm. Bốn thành viên, gồm tôi, muốn đăng ký **lớp nhiếp ảnh phong cảnh trình độ cơ bản**. Ba thành viên khác muốn học lớp nâng cao. Xin gửi thông tin về địa điểm và học phí để tôi chuyển cho mọi người.\n\nTrân trọng,  \nRaymond Hardy  \nChủ tịch, Homestead Photo Club\n\n---\n\n**Tài liệu 2 — Các lớp học một ngày, ngày 7–12 tháng 5**\n\nNgày 8 tháng 5 — Nhiếp ảnh chuyên nghiệp — 50 đô la  \nNgày 9 tháng 5 — Tiếp thị ảnh — 48 đô la  \nNgày 10 tháng 5 — Chụp ảnh bằng ánh sáng tự nhiên — 52 đô la  \nNgày 11 tháng 5 — **Nhiếp ảnh phong cảnh — 54 đô la**  \nNgày 12 tháng 5 — Nhiếp ảnh cưới — 47 đô la\n\n*Lớp thứ Sáu chỉ dành cho học viên nâng cao.*\n\n---\n\n**Tài liệu 3 — Thông tin đăng ký**\n\nTrung tâm là tổ chức phi lợi nhuận chuyên nâng cao kiến thức về điện ảnh, nhiếp ảnh và thiết kế đồ họa. Trung tâm không cung cấp máy ảnh hoặc phụ kiện; **học viên phải tự mang thiết bị**.\n\nNhóm từ ba người trở lên được giảm 20 đô la mỗi người, trừ các lớp cuối tuần. Việc đăng ký được xác nhận trong vòng 24 giờ sau khi nhận thanh toán. Học phí không được hoàn lại và phải thanh toán trước ngày khai giảng một tuần.\n\n**Biểu mẫu của Raymond Hardy**\n\nTên: Raymond Hardy  \nĐịa chỉ: 2094 Firebird Drive, El Paso, TX 79901  \nCó kinh nghiệm nhiếp ảnh chuyên nghiệp: **Không**","translationStatus":"reviewed"},{"id":"h2/test02/131_ACCB.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 131–134","questions":{"131":"A","132":"C","133":"C","134":"B"},"image":"data/h2/test02/131_ACCB.png","markedImage":"marked/h2/test02/131_ACCB.png","translation":"**Nhà hàng Sensasia — Hương vị châu Á giữa trung tâm Houston**\n\nLần tới khi bạn đến trung tâm Houston và muốn thưởng thức hương vị châu Á, hãy ghé Sensasia tại tầng hai của Cheviston Center. Sensasia phục vụ những **món ăn** chính thống đến từ Trung Quốc, Nhật Bản, Ấn Độ, Thái Lan, Hàn Quốc và Việt Nam. **Mỗi ngày, chúng tôi đều phục vụ nhiều món ăn châu Á được yêu thích.**\n\nTừ thứ Hai đến thứ Sáu, thực khách có thể thưởng thức sushi làm thủ công từ hải sản tươi sống, cơm trộn bibimbap thơm ngon của Hàn Quốc và phở Việt Nam đậm đà. Vào cuối tuần, dim sum kiểu Hồng Kông — gồm nhiều món ăn nhỏ vừa miệng — **được phục vụ** cùng các món trong thực đơn thông thường. Mỗi tháng một lần, các đầu bếp còn giới thiệu một món mới để thực khách dùng thử.\n\n**Tóm lại**, chỉ Sensasia mới có thể mang đến cho bạn nhiều món ăn đa dạng đến vậy tại cùng một địa điểm.\n\nĐể đặt chỗ cho nhóm, vui lòng gọi số 555-4272. Xem thực đơn tại www.sensasia.com.","translationStatus":"reviewed"},{"id":"h2/test02/135_BDBA.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 135–138","questions":{"135":"B","136":"D","137":"B","138":"A"},"image":"data/h2/test02/135_BDBA.png","markedImage":"marked/h2/test02/135_BDBA.png","translation":"**Chủ đề: Điều chỉnh tờ giới thiệu**\n\nNgày 8 tháng 5\n\nKính gửi ông Douglas,\n\nĐính kèm là bản tờ giới thiệu do ông thiết kế, cùng các nhận xét của chúng tôi. Nhóm đã xem xét bản nháp và cho đến thời điểm này chúng tôi **hài lòng** với chất lượng của ấn phẩm. Tuy vậy, vẫn có một vài thay đổi cần thực hiện.\n\nCụ thể, bản nháp có một số lỗi nhỏ về bố cục và màu sắc, đồng thời **thiếu** một vài thông tin quan trọng. Chúng tôi đã ghi chú trực tiếp trên tờ giới thiệu để chỉ rõ vị trí cần bổ sung các chi tiết bị bỏ sót. **Mỗi nội dung chỉnh sửa cần được thể hiện chính xác.**\n\nVui lòng gửi cho chúng tôi bản nháp đã sửa khi hoàn tất. Dĩ nhiên, chúng tôi sẵn sàng **chi trả** phần chi phí phát sinh.\n\nTrân trọng,\n\nEdward Kovac  \nCollins Consulting","translationStatus":"reviewed"},{"id":"h2/test02/139_BCDB.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 139–142","questions":{"139":"B","140":"C","141":"D","142":"B"},"image":"data/h2/test02/139_BCDB.png","markedImage":"marked/h2/test02/139_BCDB.png","translation":"**Thư xác nhận yêu cầu bồi thường bảo hiểm**\n\nNgày 21 tháng 6\n\nKính gửi ông Clayburn,\n\nThư này nhằm thông báo rằng chúng tôi đã nhận được yêu cầu bồi thường bảo hiểm của ông về thiệt hại do mưa đá gây ra cho ngôi nhà và hiện **đang** xử lý hồ sơ. Như ông đã biết, cơn bão mạnh tuần trước ảnh hưởng đến toàn thành phố. Vì vậy, rất nhiều chủ nhà **đã yêu cầu** được hỗ trợ. Dù vậy, chúng tôi đang làm việc nhanh nhất có thể để giải quyết các hồ sơ này.\n\nMột chuyên viên giám định có thể đến kiểm tra tài sản của ông trong vài ngày tới. **Nếu có thể, hãy bắt đầu chụp ảnh những khu vực bị hư hại trong nhà.** Ông cũng có thể đẩy nhanh quy trình bằng cách cung cấp trước các bằng chứng, tài liệu liên quan.\n\nTuy nhiên, việc hoàn tất tất cả biểu mẫu cần thiết và chuẩn bị **bản ước tính** mức bồi thường có thể mất vài tuần. Mong ông thông cảm. Khoản tiền cần thiết để tiến hành sửa chữa sẽ được chuyển cho ông sớm nhất có thể.\n\nCảm ơn sự hợp tác của ông.\n\nJudith Underwood  \nĐiều phối viên Bồi thường","translationStatus":"reviewed"},{"id":"h2/test02/143_CABB.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 143–146","questions":{"143":"C","144":"A","145":"B","146":"B"},"image":"data/h2/test02/143_CABB.png","markedImage":"marked/h2/test02/143_CABB.png","translation":"**Thông báo nội bộ — Sổ tay nhân viên**\n\nGửi: Toàn thể nhân viên  \nTừ: Susan Ward  \nNgày: 15 tháng 4\n\nCảm ơn tất cả mọi người đã tham gia các buổi thảo luận với ban quản lý công ty. Chúng tôi đã ghi nhận ý kiến rằng một số nhân viên chưa nắm rõ quy trình vận hành hằng ngày. Hiện tại, chúng tôi đang tiến hành **giải quyết** tình trạng này.\n\nTrước hết, công ty sẽ sớm công bố các quy trình vận hành tiêu chuẩn. Một cuốn hướng dẫn in sẽ cung cấp cho ban quản lý và nhân viên nguồn tham khảo chính thức về cách thực hiện công việc hằng ngày. **Bản tạm thời của sổ tay này sẽ được phát tại cuộc họp tiếp theo.** Hy vọng tài liệu sẽ giúp chúng ta tiến gần hơn đến mục tiêu xây dựng các chính sách được **thiết lập** rõ ràng và vững chắc.\n\nNếu cần sửa đổi, các nội dung đó sẽ được đưa vào phiên bản sổ tay sau. Phiên bản cuối cùng cũng sẽ **có thể truy cập được** thông qua mạng nội bộ của công ty.\n\nNếu có câu hỏi, vui lòng liên hệ quản lý bộ phận của bạn.","translationStatus":"reviewed"},{"id":"h2/test02/147_DB.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 147–148","questions":{"147":"D","148":"B"},"image":"data/h2/test02/147_DB.png","markedImage":"marked/h2/test02/147_DB.png","translation":"**Fit Body Monthly — Phiếu hủy đăng ký**\n\nChúng tôi rất tiếc khi biết bạn muốn hủy đăng ký. Để hoàn tất thủ tục, vui lòng điền các thông tin bắt buộc bên dưới và **gửi lại phiếu này qua đường bưu điện**.\n\nTên: Frederick Davis  \nĐịa chỉ: 321 Oak Hill Avenue, Fremont, California 94536  \nEmail: fdavis@urmail.com  \nĐiện thoại: (650) 555-0646\n\nLý do hủy: **Nội dung**\n\nÝ kiến khác: Tôi được tặng gói đăng ký tạp chí của quý vị cách đây một năm. **Tôi đã đăng ký một ấn phẩm tương tự**, vì vậy không muốn gia hạn.\n\nNếu quyết định gia hạn, bạn có thể đủ điều kiện nhận mức giảm giá 20% bằng cách gọi số 555-4276.","translationStatus":"reviewed"},{"id":"h2/test02/149_CB.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 149–150","questions":{"149":"C","150":"B"},"image":"data/h2/test02/149_CB.png","markedImage":"marked/h2/test02/149_CB.png","translation":"**Thông báo nội bộ — Buổi gặp mặt cuối năm của công ty**\n\nGửi: Toàn thể nhân viên\n\nChúng ta đã kết thúc thêm một năm thành công và xin cảm ơn tất cả nhân viên vì sự nỗ lực trong công việc. Như thường lệ, công ty sẽ tổ chức **buổi tiệc đặc biệt dịp cuối năm** dành cho mọi người.\n\nNăm nay, sự kiện diễn ra lúc 7 giờ tối ngày 22 tháng 12 tại Khách sạn Cranfield trên Đại lộ Lakeview. Nhân viên có thể đưa chồng, vợ hoặc người yêu đi cùng.\n\nDo cần đặt chỗ trước, vui lòng **gửi email cho Lionel Grimm thuộc phòng nhân sự** tại ligrimm@austel.com để xác nhận bạn có tham dự hay không và có đưa theo khách hay không.\n\nCảm ơn mọi người!","translationStatus":"reviewed"},{"id":"h2/test02/151_CB.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 151–152","questions":{"151":"C","152":"B"},"image":"data/h2/test02/151_CB.png","markedImage":"marked/h2/test02/151_CB.png","translation":"**Chuỗi tin nhắn về công việc sơn tại Dandridge & Associates**\n\n**Drake Hartford — 10:38**  \nTôi đang ở khu vực lễ tân của Dandridge & Associates để kiểm tra tiến độ đội sơn. Tôi không chắc về màu đang dùng cho bức tường phía sau. Đó là tông xanh đậm cô Bryant yêu cầu, nhưng nó không hợp với sàn hoặc quầy lễ tân.\n\n**Dolly O’Hare — 10:42**  \nTôi đã lo rằng **màu sơn có thể không phù hợp** vì trông nó quá tối. Anh ghé văn phòng cô ấy và nhờ cô ấy đến xem được không? Có lẽ anh có thể đề xuất vài màu phù hợp hơn.\n\n**Drake Hartford — 10:45**  \nTôi sẽ xem cô ấy có rảnh không và báo cho cô biết cô ấy muốn làm gì. Tôi cũng sẽ đề xuất vài màu. Theo tôi, nâu nhạt, màu ngà hoặc màu be đều đẹp.\n\n**Drake Hartford — 10:58**  \nCô ấy đã đến xem và hoàn toàn đồng ý với chúng ta. Tôi bảo đội sơn ngừng sơn bức tường đó hôm nay. Cô ấy chọn **phương án đầu tiên được đề xuất — màu nâu nhạt**.\n\n**Dolly O’Hare — 11:00**  \nTuyệt. Hãy nhờ Triple A Hardware pha lượng sơn đội thi công cần. Cửa hàng có thể giao đến công trình và ghi hóa đơn vào tài khoản của tôi.\n\n**Drake Hartford — 11:09**  \nTôi vừa hỏi Triple A, nhưng họ đang tồn đọng nhiều đơn hàng và lịch giao. Sớm nhất sơn mới có thể đến là 1 giờ chiều thứ Tư.\n\n**Dolly O’Hare — 11:12**  \nKhông sao. Đội thi công đang đi trước tiến độ nên trong lúc chờ họ có thể làm các công việc khác.","translationStatus":"reviewed"},{"id":"h2/test02/153_BBA.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 153–155","questions":{"153":"B","154":"B","155":"A"},"image":"data/h2/test02/153_BBA.png","markedImage":"marked/h2/test02/153_BBA.png","translation":"**Hội nghị Điện toán Không gian lần thứ năm**\n\nKính chào quý đại biểu,\n\nSau khi đăng ký, nhận thẻ tên và chương trình, vui lòng xuống Phòng Granville để dùng cà phê, trà và bữa sáng nhẹ.\n\n**9:30 sáng — Tiệc chào mừng, Phòng Granville**  \nGặp gỡ các đại biểu khác và trao đổi về xu hướng điện toán, đổi mới trong ngành cùng kỳ vọng đối với hội nghị. Vui lòng ngồi tại bàn có số ghi trên thẻ tên. Ban tổ chức sẽ xếp khách thuộc các chuyên ngành khác nhau ngồi cùng nhau để tạo cơ hội giao lưu với người làm việc trong nhiều lĩnh vực. **Sự kiện không bắt đầu bằng một bài phát biểu giới thiệu.**\n\n**11:00 sáng — Thảo luận khai mạc, Phòng Gladstone**  \nTham gia cùng Patrizio Vincente, Michelle Beaulieu và Mark Blackwell để thảo luận những bước phát triển của điện toán không gian kể từ hội nghị năm ngoái.\n\n**12:30 trưa — Nghỉ trưa, Phòng Granville**\n\n**1:30 chiều — Các hội thảo**  \nCông nghệ cơ sở dữ liệu, xử lý hình ảnh và ứng dụng di động tại các phòng Gladstone, Halifax và Johnstone.\n\n**3:30 chiều — Các hội thảo**  \nDữ liệu vị trí, lập bản đồ rừng và phân tích không gian tại các phòng Gladstone, Halifax và Johnstone.\n\n**5:30 chiều — Kết thúc chương trình trong ngày**  \nNhững người muốn ở lại thêm một giờ để trao đổi với đại biểu và điều phối viên có thể đến **Phòng Granville**, nơi đồ ăn nhẹ và thức uống tiếp tục được phục vụ.","translationStatus":"reviewed"},{"id":"h2/test02/156_BB.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 156–157","questions":{"156":"B","157":"B"},"image":"data/h2/test02/156_BB.png","markedImage":"marked/h2/test02/156_BB.png","translation":"**Thông báo về biểu phí mới của Dịch vụ Bưu chính Quốc gia**\n\nKể từ ngày 2 tháng 9, Dịch vụ Bưu chính Quốc gia (NPS) sẽ áp dụng cơ cấu giá mới phản ánh chính xác hơn chi phí phục vụ từng nhóm khách hàng.\n\nNPS luôn cố gắng vận hành hiệu quả nhất có thể. Tuy nhiên, những thay đổi gần đây theo yêu cầu của chính phủ đã **xóa bỏ các khoản trợ cấp trước đây**. Vì vậy, chúng tôi phải huy động toàn bộ kinh phí từ việc bán sản phẩm và dịch vụ. Hệ thống giá mới là cần thiết để chúng tôi tiếp tục cung cấp các dịch vụ thiết yếu.\n\nMọi điều chỉnh giá trong tương lai sẽ dựa trên **tỷ lệ lạm phát quốc gia**.\n\n**Biểu phí mới — thư có trọng lượng tối đa 30 gram**\n\nThư nội địa: từ 1,00 đô la lên 1,20 đô la — tăng 20%  \nThư thương mại*: từ 0,70 đô la lên 0,85 đô la — tăng 21%  \nThư tính cước bằng máy: từ 0,50 đô la lên 0,75 đô la — tăng 50%\n\n*Chỉ áp dụng theo thỏa thuận đặc biệt với NPS.*","translationStatus":"reviewed"},{"id":"h2/test02/158_ABC.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 158–160","questions":{"158":"A","159":"B","160":"C"},"image":"data/h2/test02/158_ABC.png","markedImage":"marked/h2/test02/158_ABC.png","translation":"**Khu nghỉ dưỡng Ocean Breeze — Các hoạt động tại Quần đảo Kostiak**\n\nQuần đảo Kostiak nổi tiếng với hệ sinh vật biển phong phú và các điểm tham quan độc đáo. Để tận hưởng trọn vẹn kỳ nghỉ, chúng tôi đề xuất các hoạt động sau:\n\n**Tham quan các đảo**  \nLên thuyền tham gia chuyến đi trong ngày, dừng tại những bãi biển, đầm phá và rừng nhiệt đới nổi tiếng của Kostiak. Du khách muốn khám phá các rạn san hô rộng lớn — nơi sinh sống của hàng nghìn sinh vật dưới nước — sẽ được cung cấp thiết bị lặn với ống thở. Chuyến đi này **không ghé một khu bảo tồn hay công viên động vật**.\n\n**Chuyến tham quan Miligan**  \nNằm về phía nam Kostiak, Miligan là khu bảo tồn động vật hoang dã, nơi bạn có thể tương tác với khỉ và các loài chim quý hiếm trong môi trường tự nhiên. Miligan cách khu nghỉ dưỡng 30 phút đi thuyền.\n\n**Đi bộ đường dài**  \nTham gia chuyến đi có hướng dẫn viên lên Núi Amitan và ngắm toàn cảnh Vịnh Engle tuyệt đẹp.\n\nĐể đặt các hoạt động trên, vui lòng liên hệ lễ tân. Nhóm từ 10 người trở lên được giảm giá.","translationStatus":"reviewed"},{"id":"h2/test02/161_CBBC.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 161–164","questions":{"161":"C","162":"B","163":"B","164":"C"},"image":"data/h2/test02/161_CBBC.png","markedImage":"marked/h2/test02/161_CBBC.png","translation":"**Cuộc trò chuyện về dự án khu vườn trong nhà cho Osment Industrial**\n\n**Corrine Dealba — 4:32 chiều**  \nChào mọi người. Có vẻ Osment Industrial muốn nghe công ty chúng ta trình bày về một khu vườn trong nhà. Chúng ta cần đến văn phòng họ để khảo sát lúc 3 giờ chiều thứ Ba tới. Công việc không quá hai giờ. Đây có thể là dự án quy mô lớn nên tôi nghĩ ba người cùng đi là tốt nhất.\n\n**Jan Yates — 4:34**  \nThứ Ba tôi phải đến Yeltsin Enterprises giám sát một nhóm lắp đặt vườn trên mái. Nhưng nếu cần, tôi có thể nhờ Ellen Pearson làm thay.\n\n**Avery Wong — 4:35**  \nTôi rảnh. Chúng tôi có cần chuẩn bị gì cho bài thuyết trình không?\n\n**Kip Villegas — 4:35**  \nTôi cũng có thể đi.\n\n**Corrine Dealba — 4:36**  \nJan, hãy nhờ Ellen làm thay vì tôi thực sự cần chuyên môn của anh. Avery, tôi sẽ phụ trách phần thuyết trình. Anh và Kip cần **đo đạc không gian**, tìm hiểu các nhu cầu cụ thể, ngân sách và những chi tiết khác.\n\n**Kip Villegas — 4:36**  \nChúng ta cùng rời văn phòng nhé?\n\n**Corrine Dealba — 4:37**  \nĐược. Hãy gặp nhau tại gara lúc 2 giờ 30 rồi cùng đi bằng xe của tôi. Mọi người thấy ổn chứ?\n\n**Avery Wong — 4:38**  \n**Tôi đồng ý đi nhờ xe đến văn phòng đó.** Hẹn gặp mọi người.\n\n**Corrine Dealba — 4:40**  \nCảm ơn mọi người. Hẹn gặp vào thứ Ba.","translationStatus":"reviewed"},{"id":"h2/test02/165_DDA.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 165–167","questions":{"165":"D","166":"D","167":"A"},"image":"data/h2/test02/165_DDA.png","markedImage":"marked/h2/test02/165_DDA.png","translation":"**Thư giới thiệu dịch vụ của Sampat Labs**\n\nKính gửi cô Fulton,\n\nTrong hơn 30 năm, Sampat Labs đã giúp các nhà sản xuất lớn nhỏ thu thập dữ liệu kiểm nghiệm đáng tin cậy cho mỹ phẩm, sản phẩm làm đẹp và chăm sóc cá nhân. Các phòng thí nghiệm đầy đủ thiết bị của chúng tôi có đội ngũ kỹ thuật viên và nhà nghiên cứu giàu kinh nghiệm, hiểu rõ những vấn đề người tiêu dùng, giới nghiên cứu và **các công ty sản xuất như Lite Mist Makeup** quan tâm. **Vì vậy, cô có thể yên tâm rằng họ sẽ cung cấp dịch vụ chuyên môn cao.**\n\nNgoài kiểm tra tác động của sản phẩm lên da, chúng tôi còn hướng dẫn phương pháp thích hợp để pha trộn thành phần hóa học, bảo quản và vận chuyển thành phẩm. Chúng tôi cũng kiểm tra thời hạn sử dụng của sản phẩm trong nhiều điều kiện môi trường.\n\nHơn nữa, quyền truy cập cơ sở dữ liệu lớn về kết quả kiểm nghiệm của các đơn vị khác giúp chúng tôi **hoàn toàn tránh thử nghiệm trên động vật**.\n\nVui lòng xem tài liệu đính kèm để biết mô tả đầy đủ từng dịch vụ và cách gửi mẫu sản phẩm. Để nhận báo giá và thời gian xử lý cụ thể, hãy gọi 555-9476 hoặc email jwest@sampatlabs.com.\n\nTrân trọng,  \nJacob West  \nQuan hệ khách hàng, Sampat Labs","translationStatus":"reviewed"},{"id":"h2/test02/168_DDDB.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 168–171","questions":{"168":"D","169":"D","170":"D","171":"B"},"image":"data/h2/test02/168_DDDB.png","markedImage":"marked/h2/test02/168_DDDB.png","translation":"**Mua sắm miễn phí? — Trò chơi Virtual Mall**\n\nVirtual Mall là sản phẩm của lập trình viên Pat Gustin, người phát hành trò chơi di động miễn phí này chỉ chín tháng trước. Đến nay, hơn 300.000 người đã tải ứng dụng và khoảng 60% trong số đó hoạt động tại một thời điểm bất kỳ. Những con số này rất hấp dẫn với các công ty quảng cáo qua ứng dụng di động.\n\nGustin giải thích: “Ý tưởng rất đơn giản. Người chơi thuê không gian trong một trung tâm mua sắm ảo và chọn sản phẩm từ danh mục để bán.” Nếu quản lý cửa hàng tốt, người bán ảo sẽ kiếm được lợi nhuận bằng tiền trong trò chơi. **Họ có thể dùng khoản tiền này để cải thiện cửa hàng hoặc mua đồ từ người bán khác.**\n\nTrò chơi cung cấp nhiều chi tiết và tùy chọn cá nhân hóa được người dùng yêu thích. Nó thậm chí phổ biến với phụ nữ — nhóm đối tượng vốn khó tiếp cận trong lĩnh vực trò chơi di động. Tuy nhiên, bài viết **không nói người chơi có thể tạo nhiều nhân vật**.\n\nGustin cũng đang phát triển **một trò chơi mới tên Virtual Farm**, áp dụng những ý tưởng tương tự trong bối cảnh nông nghiệp. Ông hy vọng phát hành trò chơi vào đầu năm sau.\n\nNgười quan tâm có thể tải Virtual Mall miễn phí. Thông tin về các trò chơi khác có tại www.virtualgamesco.com.","translationStatus":"reviewed"},{"id":"h2/test02/172_CBCD.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 172–175","questions":{"172":"C","173":"B","174":"C","175":"D"},"image":"data/h2/test02/172_CBCD.png","markedImage":"marked/h2/test02/172_CBCD.png","translation":"**Stop Avenue được vinh danh là Công ty của năm**\n\nChuỗi cửa hàng tiện lợi hoạt động 24 giờ Stop Avenue được Liên đoàn Nhà bán lẻ Trung Tây bình chọn là Công ty của năm. Chuỗi giành giải nhờ thành công khi đưa quầy bánh mì kẹp vào các chi nhánh — mô hình đầu tiên thuộc loại này trong các cửa hàng tiện lợi của khu vực. Công ty nhấn mạnh nguyên liệu hữu cơ, lành mạnh trong chiến dịch quảng cáo truyền hình một năm trước. Kể từ đó, quầy bánh mì ngày càng được yêu thích và doanh số tăng 40% so với năm trước.\n\nTổng giám đốc Aaron Patel cho biết người đứng sau thành công là Felix Richardson, con trai út của người sáng lập. Felix trở thành giám đốc tiếp thị hai năm trước, khi doanh số giảm 20% mỗi quý. Ông **thay đổi đáng kể cách kinh doanh để tăng doanh thu**: trang trí lại cửa hàng, áp dụng giảm giá có chọn lọc và đưa vào quầy bánh mì. Bài viết **không đề cập việc quảng cáo trên mạng xã hội** như một biện pháp riêng của Felix.\n\nCông ty hiện nhắm đến khách hàng nữ từ 20 đến 30 tuổi và sẽ ra mắt các loại sinh tố trái cây làm từ nguyên liệu tự nhiên vào tháng tới.\n\nSự cải thiện giúp số lượng cửa hàng nhượng quyền tăng nhanh. Chỉ tháng trước đã có 18 cửa hàng mới mở cửa. Với tốc độ hiện tại, Stop Avenue dự kiến **mở rộng lên 500 cửa hàng trong hai năm tới**.","translationStatus":"reviewed"},{"id":"h2/test02/176_DCDCA.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 176–180","questions":{"176":"D","177":"C","178":"D","179":"C","180":"A"},"image":"data/h2/test02/176_DCDCA.png","markedImage":"marked/h2/test02/176_DCDCA.png","translation":"**Tài liệu 1 — Email về lịch làm việc tháng 4**\n\nKính gửi cô Larson,\n\nQuản lý Dale Blackburn cho biết cô sẽ được phân công làm tài xế mới của cô Linda Atkins. Tôi là trợ lý riêng của cô Atkins nên sẽ gửi lịch các cuộc hẹn mà cô cần đưa đón. Đính kèm là lịch tháng 4. Lịch có thể thay đổi, nhưng tôi sẽ cố gắng thông báo trước ít nhất 24 giờ.\n\nLịch ghi tên người cô Atkins gặp, ngày giờ và địa chỉ. Người dự kiến gặp cô Atkins ngày 16 tháng 4 vẫn chưa phản hồi lời mời; tôi sẽ báo ngay khi biết khách hàng có tham dự hay không.\n\nTrân trọng,  \nEdwin Matthews\n\n---\n\n**Tài liệu 2 — Lịch của Linda Atkins**\n\nNgày 2 — 10:00 sáng: Cô Amundsen, 32 Tucson Avenue  \nNgày 3 — 9:00 sáng: Cô Harrow, 22-A North 391st Street  \nNgày 7 — 12:30 trưa: Ăn trưa với ông bà Robinson tại Prairie Café  \nNgày 8 — 9:00 sáng: Ông Abraham, 433 Murray Street — ký hợp đồng  \nNgày 9 — 9:30 sáng: Khai trương tòa nhà Blue Star, 285 Greenwich Street  \nNgày 14 — 2:00 chiều: Ông Mendez, 441 Poplar Avenue  \nNgày 16 — Cuộc hẹn với **ông Choi, chưa xác nhận**  \nNgày 17 — Nghỉ phép  \nNgày 18 — **Ngày nghỉ lễ, cô Larson nhiều khả năng không phải làm việc**  \nNgày 21 — 9:30 sáng: Hội thảo bán hàng cả ngày  \nNgày 23 — 9:00 sáng: Kiểm tra bất động sản, gặp lại **ông Abraham**  \nNgày 25 — 7:00 tối: Tiệc nghỉ hưu của Gordon tại Rebecca’s Grill  \nNgày 28 — 1:00 chiều: Bàn giao chìa khóa cho ông Abraham  \nNgày 29 — 10:00 sáng: Hội nghị thường niên của các nhà môi giới","translationStatus":"reviewed"},{"id":"h2/test02/181_CCBCC.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 181–185","questions":{"181":"C","182":"C","183":"B","184":"C","185":"C"},"image":"data/h2/test02/181_CCBCC.png","markedImage":"marked/h2/test02/181_CCBCC.png","translation":"**Tài liệu 1 — Lễ hội Edge đầu tiên tại Toronto, ngày 8–14 tháng 7**\n\nHãy tham gia một tuần biểu diễn tại hơn 100 địa điểm ở Toronto. Sau thành công lâu năm tại Edinburgh, Scotland, ban tổ chức đã thêm thành phố thứ hai vào lễ hội nghệ thuật và văn hóa thường niên.\n\nBạn có thể lấy cẩm nang chính thức tại các hiệu sách lớn, trên mạng hoặc qua ứng dụng di động miễn phí. Ngoài danh sách chương trình, ứng dụng có **bản đồ tương tác của Toronto** giúp tìm đường đến từng sự kiện.\n\nThông tin chỗ ở và phương tiện đi lại có tại www.edgefest.com/toronto. Tất cả sự kiện đều cần vé mua từ đại diện được ủy quyền. Lễ hội do Edge Society — một tổ chức phi lợi nhuận thúc đẩy văn hóa và nghệ thuật — tổ chức. Toàn bộ tiền thu được dùng phát triển các sự kiện tương lai.\n\n---\n\n**Tài liệu 2 — Bài đánh giá trên Toronto Tribune**\n\nTim Cosgrove khuyến khích mọi người đến Toronto khi lễ hội vẫn còn diễn ra. Sự kiện bắt đầu tại Scotland như một sân chơi nhỏ cho nghệ sĩ nghiệp dư nhưng nay thu hút hàng nghìn người hâm mộ khắp thế giới. Thành công đó khiến ban tổ chức đưa mô hình ra nước ngoài, bắt đầu tại Canada năm nay.\n\nNhững tiết mục yêu thích của tác giả gồm vở *Kalinda*, đoàn múa Danza Volar và màn song tấu violin–accordion. Nghệ sĩ hài Ireland Elsa Ball cũng đáng chú ý; **tác giả đã xem cô biểu diễn tại lễ hội năm trước ở Scotland**.\n\nNgoài **nhiều** chương trình nghệ thuật, lễ hội có các quầy ẩm thực và hoạt động gia đình. Ban tổ chức dự định đưa sự kiện đến **Dublin vào năm sau và Sydney vào năm kế tiếp**. Nghệ sĩ và người hâm mộ có thể để lại bình luận trên trang web để ủng hộ kế hoạch này.","translationStatus":"reviewed"},{"id":"h2/test02/186_DCCBA.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 186–190","questions":{"186":"D","187":"C","188":"C","189":"B","190":"A"},"image":"data/h2/test02/186_DCCBA.png","markedImage":"marked/h2/test02/186_DCCBA.png","translation":"**Tài liệu 1 — Piedmont Limousine Company**\n\nPiedmont đã phục vụ Manhattan hơn 20 năm, cung cấp xe hiện đại cùng tài xế chuyên nghiệp. Công ty có limousine 12 chỗ, xe minivan cao cấp 8 chỗ và sedan 4 chỗ cho các sự kiện như công việc, đám cưới hoặc đón khách tại ga và sân bay. Tuy nhiên, quảng cáo **không nói công ty có quầy dịch vụ tại ga hoặc sân bay**.\n\nTrong tháng 4, đặt dịch vụ từ ba ngày trở lên được tặng phiếu trị giá 50 đô la cho lần sử dụng sau.\n\n---\n\n**Tài liệu 2 — Yêu cầu đặt xe của Benjamin Lopez**\n\nÔng Lopez thuộc Neuro-Tech đặt một ô tô và tài xế từ ngày 18 đến 21 tháng 4 để phục vụ **vị khách William Ball** hằng ngày trong thời gian lưu trú.\n\n---\n\n**Tài liệu 3 — Phản hồi báo giá**\n\nPiedmont xác nhận có tài xế và loại xe yêu cầu. Chi phí gồm thuê xe 800 đô la, dịch vụ tài xế 840 đô la, nhiên liệu 520 đô la; được trừ phiếu 50 đô la, tổng cộng 2.110 đô la.\n\nĐể xác nhận, ông Lopez cần trả lời email. Có thể hủy trước thời điểm dịch vụ 24 giờ; nếu hủy muộn hơn, **tiền đặt cọc sẽ bị mất**.\n\nCông ty cũng yêu cầu thông tin chuyến tàu để tài xế **Solomon Nyongo chờ William Ball tại sân ga với bảng tên**.","translationStatus":"reviewed"},{"id":"h2/test02/191_CCDCD.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 191–195","questions":{"191":"C","192":"C","193":"D","194":"C","195":"D"},"image":"data/h2/test02/191_CCDCD.png","markedImage":"marked/h2/test02/191_CCDCD.png","translation":"**Tài liệu 1 — Hội thảo máy in 3D tại Thư viện Thành phố Warner**\n\nThư viện tổ chức hai hội thảo ngày 12 tháng 11 tại chi nhánh Lafayette. Phí 30 đô la gồm: trình diễn máy in 3D miễn phí; video về công nghệ; thảo luận do giám đốc thư viện Ryan Jefferson hướng dẫn; thực hành cùng chuyên gia kỹ thuật; và một móc khóa do người tham gia chọn mẫu, tự in rồi mang về.\n\nMỗi lớp giới hạn 12 người. Đăng ký tại quầy hoặc www.warnerlibrary.com/3-DPrinter.\n\n---\n\n**Tài liệu 2 — Email của Sam Jackson**\n\nÔng Jackson, chủ tịch Warner Art Community và là nhà điêu khắc, muốn nhóm tham gia nhưng tập trung vào ứng dụng máy in 3D trong nghệ thuật. Nhóm muốn giữ chương trình hiện có nhưng **tự thảo luận chuyên sâu**, do ông Jackson dẫn dắt, và có thể làm sản phẩm theo thiết kế riêng. Ông không yêu cầu thư viện bỏ phần trình diễn, video hay thực hành. Nhóm sẵn sàng trả thêm phí.\n\n---\n\n**Tài liệu 3 — Lịch sự kiện tháng 11**\n\nNgày 3 — Hội thảo viết sáng tạo, thư viện chính  \nNgày 9 — Tìm hiểu văn học đương đại, thư viện chính  \nNgày 16 — **In 3D trong nghệ thuật, chỉ dành cho người được mời**, chi nhánh Lafayette  \nNgày 23 — Ra mắt sách *A Lasting Legacy* của Meredith Brownsville, chi nhánh Concord Street\n\nThư viện Thành phố Warner **có nhiều chi nhánh trong cùng thành phố**.","translationStatus":"reviewed"},{"id":"h2/test02/196_BBDAD.png","folder":"h2/test02","book":"h2","bookLabel":"Hacker 2","test":"test02","testLabel":"Test 02","title":"Hacker 2 · Test 02 · Câu 196–200","questions":{"196":"B","197":"B","198":"D","199":"A","200":"D"},"image":"data/h2/test02/196_BBDAD.png","markedImage":"marked/h2/test02/196_BBDAD.png","translation":"**Tài liệu 1 — Email hỏi đặt hàng của Peakland Dairy**\n\nKính gửi cô Kentley,\n\nPeakland Dairy sẽ ra mắt dòng kem mới vào mùa hè và đang tìm nguyên liệu. Chúng tôi muốn đặt **250 kg dâu tây**. Xin cho biết trang trại có đủ **khả năng** đáp ứng đơn lớn và giá bán là bao nhiêu. Nếu doanh số tốt, chúng tôi sẽ đặt tiếp vào mùa sau.\n\nChúng tôi cũng cân nhắc dùng quả mâm xôi và muốn biết trang trại có trồng hay không; nếu có, chúng tôi muốn đặt 250 kg khi có hàng.\n\nTrân trọng,  \nBraydon Craig\n\n---\n\n**Tài liệu 2 — Phiếu đặt hàng của Kentley Farm**\n\nKhách hàng: Braydon Craig, Peakland Dairy  \nSản phẩm: Dâu tây theo mùa  \nSố lượng: 250 kg  \nĐơn giá: 12 đô la/kg  \nNgày giao: 10 tháng 5  \nYêu cầu: Rửa sạch  \nTổng cộng: 3.330,60 đô la — đã thanh toán đầy đủ\n\nĐịa chỉ giao hàng giống địa chỉ thanh toán: 449 Spruce Road, Surrey. Vì vậy, ông Craig nhiều khả năng đã yêu cầu **giao hàng đến Spruce Road**.\n\n---\n\n**Tài liệu 3 — Phiếu giảm giá kem hữu cơ Peakland Dairy**\n\nCảm ơn bạn đã ghé Kentley Farm. Dâu tây của trang trại hiện được dùng trong **dòng kem hữu cơ mới của Peakland Dairy**, gồm vani, sô-cô-la, dâu tây và cà phê, làm từ sữa không hormone.\n\nMang phiếu đến Softies Supermarkets, Wilton Groceries hoặc Day-and-Night Convenience Stores để được giảm 3 đô la. Phiếu hết hạn ngày 1 tháng 9.","translationStatus":"reviewed"},{"id":"h2/test03/131_BCBC.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 131–134","questions":{"131":"B","132":"C","133":"B","134":"C"},"image":"data/h2/test03/131_BCBC.png","markedImage":"marked/h2/test03/131_BCBC.png","translation":"**Thông báo dành cho chủ thẻ thành viên Eddington’s**\n\n**Eddington’s sắp thực hiện một thay đổi đối với chương trình thành viên.** Chúng tôi sẽ điều chỉnh tần suất gửi bảng sao kê điểm tích lũy. Kể từ ngày 1 tháng 1, sao kê sẽ được gửi qua đường bưu điện sáu tháng một lần thay vì mỗi quý.\n\n**Bất kể** thay đổi này, thành viên vẫn có thể đăng nhập tại www.eddingtons.com/member để xem thông tin hiện tại. Qua tài khoản trực tuyến, bạn có thể **theo dõi** số điểm đã tích lũy và xem các phần thưởng có thể đổi.\n\nBạn cũng có thể gọi số 555-4965 trong giờ làm việc để được cung cấp thông tin. **Ngoài ra**, bạn có thể đến quầy dịch vụ tại bất kỳ cửa hàng bách hóa Eddington’s nào; nhân viên sẽ thông báo tổng điểm hiện tại của bạn.","translationStatus":"reviewed"},{"id":"h2/test03/135_CBDB.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 135–138","questions":{"135":"C","136":"B","137":"D","138":"B"},"image":"data/h2/test03/135_CBDB.png","markedImage":"marked/h2/test03/135_CBDB.png","translation":"**Best Link Telecom — Dịch vụ Internet tốc độ cao mới**\n\nKính gửi cô Staley,\n\nBest Link Telecom gần đây đã nâng cấp mạng lưới và đang cung cấp Internet tốc độ cao **tại** khu vực của cô. Chúng tôi bắt đầu cung cấp dịch vụ từ ngày 17 tháng 7.\n\nBest Link **bảo đảm** dịch vụ nhanh chóng, đáng tin cậy với chi phí thấp nhất. Chúng tôi cam kết áp dụng mức giá ngang bằng với bất kỳ đối thủ nào có giá thấp hơn.\n\nKhách hàng được sử dụng miễn phí dịch vụ lưu trữ trực tuyến. Dù tải video và ảnh hay chia sẻ công việc, bạn đều có thể hoàn thành nhanh hơn trước. **Dịch vụ Internet tốc độ cao của chúng tôi có thể xử lý tất cả những nhu cầu đó.**\n\nKhách hàng đang sử dụng dịch vụ điện thoại của chúng tôi được giảm 20% khi nâng cấp lên gói Internet tốc độ cao. Mức giá giảm sẽ được thể hiện trên **bảng sao kê** của tháng tiếp theo.\n\nVui lòng gọi 555-1573 trong giờ làm việc để đặt lịch lắp đặt.\n\nTrân trọng,  \nGeorge Hyde  \nBộ phận Kinh doanh, Best Link Telecom","translationStatus":"reviewed"},{"id":"h2/test03/139_BCDD.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 139–142","questions":{"139":"B","140":"C","141":"D","142":"D"},"image":"data/h2/test03/139_BCDD.png","markedImage":"marked/h2/test03/139_BCDD.png","translation":"**Marinville sắp chọn nhà phát triển cho tòa nhà trung tâm**\n\nCác quan chức Marinville đã lập danh sách rút gọn những nhà phát triển được xem xét để cải tạo tòa nhà Halpern. Hiện chỉ còn ba **đơn vị** trong tổng số 25 ứng viên ban đầu.\n\nTheo yêu cầu đặt ra khi dự án bắt đầu, các công ty còn lại phải bổ sung chi tiết cho kế hoạch đã nộp đầu năm. Trong các buổi thuyết trình **sắp tới**, họ phải chứng minh có thể đáp ứng toàn bộ yêu cầu cải tạo của hội đồng. **Đề xuất cũng phải có ngân sách hoàn chỉnh và bản thiết kế chi tiết.**\n\nBrian Schmidt, giám đốc Cơ quan Quản lý Trung tâm Marinville, cho biết mọi việc đang tiến triển tốt. Cơ quan sẽ chọn ứng viên **ấn tượng** nhất, soạn thảo thỏa thuận và bắt đầu dự án trước cuối năm.","translationStatus":"reviewed"},{"id":"h2/test03/143_CDDC.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 143–146","questions":{"143":"C","144":"D","145":"D","146":"C"},"image":"data/h2/test03/143_CDDC.png","markedImage":"marked/h2/test03/143_CDDC.png","translation":"**Chủ đề: Thay đổi tên công ty**\n\nKính gửi ông Anthony Lilly,\n\nHồ sơ cho thấy ông hiện **có** hợp đồng bảo hiểm ô tô với chúng tôi. Chúng tôi luôn cập nhật thông tin hoạt động doanh nghiệp cho khách hàng, vì vậy email này nhằm **thông báo** rằng công ty sẽ đổi tên từ Comprehensive Auto Insurance thành Complete Auto and Life Insurance.\n\nKể từ tháng tới, mọi thông tin liên lạc sẽ sử dụng tên mới. Ông sẽ thấy tên này trên hóa đơn, email, thư từ, biểu mẫu yêu cầu bồi thường và trang web. **Chúng tôi cũng sẽ thay đổi tên công ty trên các tài liệu hợp đồng bảo hiểm.**\n\nNhân dịp này, ông có thể cân nhắc gia hạn bảo hiểm nhân thọ. **Để đặt lịch hẹn**, vui lòng trả lời email; một đại diện sẽ liên hệ với ông.\n\nTrân trọng,  \nBộ phận Chăm sóc Khách hàng  \nComprehensive Auto Insurance","translationStatus":"reviewed"},{"id":"h2/test03/147_BC.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 147–148","questions":{"147":"B","148":"C"},"image":"data/h2/test03/147_BC.png","markedImage":"marked/h2/test03/147_BC.png","translation":"**Shoe Gold — Chương trình giảm giá thường niên**\n\nMua một đôi giày, đôi thứ hai giảm 40%.  \nĐôi thứ ba giảm 50%.  \nĐôi thứ tư giảm 60%.\n\nShoe Gold bán những mẫu giày thiết kế mới nhất với giá ưu đãi, nhiều kiểu dáng, màu sắc và kích cỡ dành cho nam lẫn nữ. Chương trình kết thúc ngày 14 tháng 8.\n\nCửa hàng mở hằng ngày từ 10 giờ sáng đến 8 giờ tối. Chúng tôi nhận tiền mặt, séc, thẻ tín dụng và thẻ ghi nợ. Mở thẻ tín dụng Shoe Gold để được giảm thêm 10%.\n\nĐịa điểm:\n\n- 1223 Riverside Drive, Minneapolis, MN 55401\n- 807 Interstate 12, St. Paul, MN 55519\n\nQuảng cáo **không nói Shoe Gold sẽ áp dụng mức giá ngang bằng với đối thủ cạnh tranh**.","translationStatus":"reviewed"},{"id":"h2/test03/149_DD.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 149–150","questions":{"149":"D","150":"D"},"image":"data/h2/test03/149_DD.png","markedImage":"marked/h2/test03/149_DD.png","translation":"**Chuỗi tin nhắn về đơn hàng nội thất văn phòng**\n\n**Susan Learned — 4:39**  \nChào ông Wachtel. Tôi là Susan Learned từ Sigurdson Office Interiors. Tôi đã nhận đơn hàng ông gửi sáng nay nhưng có vài câu hỏi.\n\n**Justin Wachtel — 4:41**  \nChào Susan. Tôi hy vọng đơn hàng không có vấn đề gì.\n\n**Susan Learned — 4:43**  \n**Không có vấn đề nghiêm trọng với yêu cầu mua hàng.** Ông đã ghi nhãn hiệu ghế văn phòng muốn mua nhưng chưa ghi số lượng.\n\n**Justin Wachtel — 4:45 và 4:55**  \nXin lỗi! Để tôi kiểm tra số ghế cũ hiện có. Có vẻ chúng tôi cần 18 chiếc.\n\n**Susan Learned — 5:02**  \nNgoài ra, bàn hội nghị Bainbridge có các phiên bản gỗ thông, sồi và tuyết tùng với giá hơi khác nhau. Ông muốn loại nào?\n\n**Justin Wachtel — 5:04**  \nTôi muốn phiên bản gỗ tuyết tùng. Nó sẽ hợp với bàn và đồ nội thất khác trong văn phòng.\n\n**Susan Learned — 5:08**  \nTôi sẽ ghi lại. Chúng tôi có thể giao hầu hết mọi thứ vào sáng thứ Ba. Màn chiếu được làm riêng nên sẽ đến thứ Năm. Tôi sẽ gửi hóa đơn cuối cùng trong hôm nay.","translationStatus":"reviewed"},{"id":"h2/test03/151_CB.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 151–152","questions":{"151":"C","152":"B"},"image":"data/h2/test03/151_CB.png","markedImage":"marked/h2/test03/151_CB.png","translation":"**Bảng tin nhân viên Boardwalk Industries — Cần mua ô tô cũ**\n\nLiên hệ: Roy Long, máy lẻ 8113  \nThời gian đăng: 1–30 tháng 6\n\nTôi đang tìm một chiếc ô tô cũ còn tốt cho con trai sắp vào đại học vào mùa thu. Tôi muốn xe bốn cửa, tiết kiệm nhiên liệu. **Nhãn hiệu hoặc mẫu xe không quan trọng**, miễn xe không cần sửa chữa lớn.\n\nCác vết lõm và trầy xước nhỏ không thành vấn đề vì tôi có thể tự sửa. Vì sự an toàn của con trai, tôi ưu tiên xe có phanh chống bó cứng và túi khí.\n\nNếu bạn có chiếc xe từ 4 đến 8 năm tuổi đáp ứng các tiêu chí trên, vui lòng gọi số máy lẻ nêu trên.","translationStatus":"reviewed"},{"id":"h2/test03/153_CDC.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 153–155","questions":{"153":"C","154":"D","155":"C"},"image":"data/h2/test03/153_CDC.png","markedImage":"marked/h2/test03/153_CDC.png","translation":"**CCT News tuyển người dẫn bản tin mới**\n\nCCT News, kênh tin tức truyền hình cáp được xem nhiều nhất cả nước, vừa tuyển Greg O’Connell làm người dẫn bản tin mới. Ông thay Pauline Field, người nghỉ hưu tháng trước sau 20 năm làm việc.\n\nÔng O’Connell có nhiều kinh nghiệm trong ngành. Ông bắt đầu với vị trí phóng viên tin cộng đồng tại *Cork County Ledger*, rồi được thăng chức thành biên tập viên tin tức trong năm năm. Sau đó, ông làm trợ lý dẫn bản tin tại một đài truyền hình địa phương. Các chương trình của ông ngày càng được yêu thích và hai năm sau, ông trở thành người dẫn chính của **WQZ Nightly News**. Sau 10 năm, ông rời WQZ để nhận vị trí tại CCT News. Vì vậy, công việc gần nhất của ông là **người dẫn chương trình truyền hình**.\n\nGeorge McDonough, người đứng đầu CCT News, từng **làm việc cùng ông O’Connell tại WQZ** và đánh giá ông là một phát thanh viên xuất sắc, có sức hút cùng tinh thần điều tra thực thụ.\n\nĐêm lên sóng đầu tiên của ông O’Connell là ngày 7 tháng 5. Trong thời gian chờ, Richard Marshall sẽ tạm thời dẫn chương trình.","translationStatus":"reviewed"},{"id":"h2/test03/156_CC.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 156–157","questions":{"156":"C","157":"C"},"image":"data/h2/test03/156_CC.png","markedImage":"marked/h2/test03/156_CC.png","translation":"**Đăng ký Giải bán marathon Seaside**\n\nĐăng ký ngay để nhận áo thun miễn phí và các vật phẩm khác qua đường bưu điện. Sau khi thanh toán, tên và thông tin của bạn sẽ được nhập vào hệ thống; mã nhận dạng sẽ được gửi qua email. Hãy giữ mã này để cung cấp cho tình nguyện viên trước cuộc đua.\n\nNgười đăng ký: Robert Joyce  \nĐịa chỉ: 8322 Hanover Drive, Rockford, Illinois 61101  \nNhận áo thun, chai nước và băng đô miễn phí: Có  \nNhận email về các cuộc đua khác: Có\n\nHàng trăm vận động viên nghiệp dư và chuyên nghiệp **từ khắp cả nước** sẽ tham gia giải ngày 28 tháng 6 tại Erie Shore, Ohio. Nhân viên y tế sẽ có mặt để xử lý kiệt sức do nóng và các tình huống y tế khác.\n\nRobert Joyce sẽ nhận **một món đồ mặc — áo thun** tại địa chỉ nhà; mã nhận dạng được gửi qua email.","translationStatus":"reviewed"},{"id":"h2/test03/158_BBCD.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 158–161","questions":{"158":"B","159":"B","160":"C","161":"D"},"image":"data/h2/test03/158_BBCD.png","markedImage":"marked/h2/test03/158_BBCD.png","translation":"**Thông tin tham quan Bennett House**\n\nKhách lẻ và đoàn tham quan có thể đến từ thứ Ba đến thứ Bảy, 10 giờ sáng–5 giờ chiều. **Nhóm từ 10 người trở lên nên đặt trước một ngày**; nếu không có thể phải chờ lâu. Vé vào cửa miễn phí, nhưng khách có thể quyên góp tiền tại lối vào và cửa hàng quà tặng.\n\nBennett House cung cấp **chuyến tham quan có hướng dẫn với mức phí cố định 25 đô la** cho học sinh hoặc đoàn khách. Mọi người đều nhận tài liệu giới thiệu lịch sử ngôi nhà thời Victoria, các tác phẩm nghệ thuật, đồ nội thất, ảnh và tiểu sử ngắn của những người từng sống tại đây.\n\nGần lối ra có cửa hàng quà tặng và phòng trà, bán bưu thiếp, đồ lưu niệm, áo thun, trà Anh và tách trà. **Toàn bộ tiền thu từ việc bán hàng được dùng để bảo tồn tòa nhà lịch sử này.**\n\nCửa hàng quà tặng đóng cửa trong mùa thấp điểm từ tháng 1 đến tháng 3, nhưng **các cơ sở còn lại vẫn hoạt động**. Vì vậy, không đúng khi nói toàn bộ Bennett House đóng cửa trong mùa ít khách. Bennett House đóng cửa vào tất cả ngày lễ quốc gia.","translationStatus":"reviewed"},{"id":"h2/test03/162_CAC.png","folder":"h2/test03","book":"h2","bookLabel":"Hacker 2","test":"test03","testLabel":"Test 03","title":"Hacker 2 · Test 03 · Câu 162–164","questions":{"162":"C","163":"A","164":"C"},"image":"data/h2/test03/162_CAC.png","markedImage":"marked/h2/test03/162_CAC.png","translation":"**Thông báo nội bộ — Cải tạo trụ sở chính**\n\nGửi: Toàn thể nhân viên  \nTừ: Angela Romanov, Quản lý Văn phòng\n\nViệc cải tạo toàn bộ trụ sở sẽ bắt đầu sau hai tuần. Công việc được thực hiện từng tầng, **bắt đầu từ tầng năm rồi đi xuống**, mỗi tầng dự kiến mất một tuần. Điều này cho thấy tòa nhà có năm tầng.\n\nTrong thời gian tầng của bạn được cải tạo, bạn sẽ làm việc tại ph
