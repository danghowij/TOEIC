ác, nhấn “MENU” hoặc nhấn mũi tên quay lại để trở về trang chính.\n\nĐể kết nối điện thoại di động hoặc thiết bị khác với bảng điều khiển, **hãy cắm một đầu cáp USB vào thiết bị và đầu còn lại vào cổng USB của xe**. Khi kết nối xong, thông báo “ĐÃ TÌM THẤY THIẾT BỊ” sẽ xuất hiện. Nếu muốn phát nhạc, chỉ cần chọn bài hát trên thiết bị rồi nhấn “PLAY”.\n\nXin lưu ý: bảng điều khiển và mọi chức năng sẽ tự động tắt khi xe đã tắt máy. Việc này giúp tránh làm cạn ắc quy xe.","translationStatus":"reviewed"},{"id":"h3/test07/156_DCCC.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 156–159","questions":{"156":"D","157":"C","158":"C","159":"C"},"image":"data/h3/test07/156_DCCC.png","markedImage":"marked/h3/test07/156_DCCC.png","translation":"**Mạng lưới Phiên dịch viên Quốc tế**\n\n*Tìm phiên dịch viên phù hợp nhất với nhu cầu của bạn. Khám phá thêm nguồn lực dành cho việc dịch tài liệu và trang web. Chúng tôi cung cấp dịch vụ dịch thuật bằng hơn 30 ngôn ngữ.*\n\nChúng tôi đã xây dựng một mạng lưới rộng lớn gồm các chuyên gia được đào tạo bài bản, sử dụng tiếng Anh và ít nhất một ngôn ngữ khác. Tất cả chuyên gia đều có thể dịch các nội dung giao tiếp bằng lời nói từ và sang tiếng Anh. **Một số người còn có thể dịch tài liệu viết như sách, sách hướng dẫn và trang web.** Mỗi phiên dịch viên trong mạng lưới đều đã vượt qua bài kiểm tra ngôn ngữ nghiêm ngặt và hoàn thành khóa đào tạo kỹ năng phiên dịch.\n\n**Sau khi mỗi dự án kết thúc, chúng tôi thu thập đánh giá từ khách hàng** nhằm kiểm soát chất lượng và bảo đảm tiếp tục cung cấp những dịch vụ tốt nhất.\n\nToàn bộ quy trình đặt dịch vụ có thể thực hiện ngay trên trang web, giúp khách hàng dễ dàng tìm được biên dịch viên hoặc phiên dịch viên phù hợp nhất. **Để bắt đầu, hãy nhấp vào nút “Yêu cầu phiên dịch viên”.** Điền biểu mẫu trực tuyến và cho chúng tôi biết về dự án hoặc sự kiện của bạn. Sau đó, chúng tôi sẽ tìm người phù hợp nhất trong mạng lưới. Mức giá có thể thay đổi tùy theo người thực hiện và yêu cầu công việc.\n\nBạn muốn gia nhập mạng lưới của chúng tôi với vai trò biên dịch viên–phiên dịch viên? Hãy nhấp vào đây.","translationStatus":"reviewed"},{"id":"h3/test07/160_BCD.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 160–162","questions":{"160":"B","161":"C","162":"D"},"image":"data/h3/test07/160_BCD.png","markedImage":"marked/h3/test07/160_BCD.png","translation":"**Tái cơ cấu để chuẩn bị cho Ngân hàng Farnsworth Capital**\n\n**Chính phủ đã phê duyệt việc sáp nhập Capital Status Bank và Farnsworth Regional Bank.** Cả hai ngân hàng đều có mức lợi nhuận trung bình so với các tổ chức tài chính khác, và mỗi bên có những thế mạnh mà bên kia không có. Hội đồng quản trị chung của tổ chức mới mang tên Farnsworth Capital Bank kỳ vọng **khả năng sinh lời sẽ bắt đầu cải thiện trong khoảng năm năm nữa**.\n\nBob Altman của Capital Status Bank được chọn làm tổng giám đốc điều hành, còn Emily Carter của Farnsworth Regional Bank sẽ giữ chức giám đốc tài chính. Hội đồng quản trị chưa bổ nhiệm chủ tịch, nhưng người phát ngôn Ryan Salazar cho biết sẽ tuyển một người từ bên ngoài cả hai tổ chức.\n\nÔng Altman cho biết nhờ tốc độ tăng trưởng nhanh của khu vực, số nhân viên bị cho thôi việc sẽ được giữ ở mức tối thiểu. Thay vào đó, **một số nhân viên có thể được yêu cầu chuyển địa điểm làm việc hoặc đảm nhiệm vị trí khác**. Số lượng chi nhánh phục vụ khách hàng dự kiến không thay đổi. Trụ sở mới sẽ đặt ở đâu vẫn chưa được công bố.","translationStatus":"reviewed"},{"id":"h3/test07/163_ABDB.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 163–166","questions":{"163":"A","164":"B","165":"D","166":"B"},"image":"data/h3/test07/163_ABDB.png","markedImage":"marked/h3/test07/163_ABDB.png","translation":"**Cuộc trò chuyện trực tuyến**\n\n**John Mallet — 3:45 chiều**\nChào mọi người. Tin vui là ban quản lý đã đồng ý cho chúng ta cử một số nhân viên đến hội chợ việc làm tại Đại học Duluth vào tháng tới.\n\n**Janet Chan — 3:48 chiều**\nTuyệt quá. Chắc hẳn rất nhiều sinh viên đã nghe nói về công ty chúng ta vì **Go-C Tech chỉ cách khuôn viên trường một quãng ngắn**.\n\n**John Mallet — 3:52 chiều**\nĐúng vậy. Tuy nhiên, ngân sách có hạn nên chúng ta phải quyết định cử đại diện từ những phòng ban nào; không thể cử tất cả mọi người.\n\n**Melissa Kovac — 3:55 chiều**\n**Tháng trước đội tiếp thị của tôi vừa tuyển khá nhiều nhân viên mới nên có thể không cần tính chúng tôi.**\n\n**John Mallet — 4:00 chiều**\nTôi sẽ lưu ý. Tôi nghĩ phòng kế toán nên tham gia. **Ban quản lý cho rằng họ sẽ cần thêm hỗ trợ khi thương vụ mua lại Stanfield Incorporated được tiến hành. Tôi sẽ trao đổi với Susan Edwards.**\n\n**Peter Mercer — 4:01 chiều**\nTôi phải giám sát việc thử nghiệm sản phẩm ở phòng nghiên cứu và phát triển trong vài tháng tới. Tôi có thể cử người khác thay mình không?\n\n**John Mallet — 4:03 chiều**\nTất nhiên. Anh định chọn ai, Peter?\n\n**Peter Mercer — 4:05 chiều**\nAmy Lintan. Cô ấy chưa có nhiều kinh nghiệm nhưng hiểu khá rõ nhu cầu của phòng chúng tôi.\n\n**John Mallet — 4:08 chiều**\nĐược đấy. Có lẽ một người mới làm việc chưa lâu sẽ đem đến góc nhìn hữu ích về trải nghiệm gia nhập công ty.","translationStatus":"reviewed"},{"id":"h3/test07/167_BCC.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 167–169","questions":{"167":"B","168":"C","169":"C"},"image":"data/h3/test07/167_BCC.png","markedImage":"marked/h3/test07/167_BCC.png","translation":"**Hiệp hội Doanh nghiệp Nhỏ Lake Point (LPSBA)**\n\n**Hội thảo về đề xuất xin tài trợ cho doanh nghiệp nhỏ**  \nThứ Tư, ngày 11 tháng 8, 8:00 sáng–5:30 chiều  \nTrung tâm Lake Point\n\n**Lịch chương trình**\n\n8:00–8:30 — Đăng ký và dùng bữa sáng nhẹ.\n\n8:30–9:00 — Phát biểu chào mừng và giới thiệu của **Carol Summers, Chủ tịch LPSBA kiêm chủ cửa hàng sửa điện thoại thông minh**.\n\n**9:00–10:00 — “Nghiên cứu và lựa chọn các khoản tài trợ phù hợp cho doanh nghiệp”, do Tiến sĩ Brian Simon, Giáo sư Phát triển Kinh doanh tại Đại học Jefferson, trình bày; sau đó nghỉ 15 phút.**\n\n10:15–12:00 — “Kiến thức căn bản về viết đề xuất xin tài trợ: Cách viết một đề xuất thuyết phục”, do Lucy Haggerty thuộc Văn phòng Phát triển Doanh nghiệp Chính phủ trình bày.\n\n12:00–1:00 — Ăn trưa tại phòng Edward Gray.\n\n1:00–2:30 — **Đánh giá các đề xuất xin tài trợ của doanh nghiệp**, theo nhóm lớn được chia theo loại hình kinh doanh; sau đó nghỉ 15 phút. Buổi này do Carol Summers, Oliver Headley và Frances Connors hướng dẫn.\n\n2:45–5:00 — Tùy chọn đánh giá đề xuất trực tiếp từng người với tất cả diễn giả.\n\n5:00–5:30 — Phát biểu bế mạc của Carol Summers.\n\nLPSBA mong mọi người thu nhận được nhiều nhất có thể từ hội thảo mà không bị xao nhãng. Trong chương trình, vui lòng tắt điện thoại và các thiết bị phát ra âm thanh. Khi cần gọi điện hoặc trả lời tin nhắn ngoài giờ nghỉ, **hãy lặng lẽ ra khỏi phòng và xử lý công việc tại tiền sảnh**.","translationStatus":"reviewed"},{"id":"h3/test07/170_CADD.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 170–173","questions":{"170":"C","171":"A","172":"D","173":"D"},"image":"data/h3/test07/170_CADD.png","markedImage":"marked/h3/test07/170_CADD.png","translation":"**BẢN GHI NHỚ**\n\n**Gửi:** Toàn thể công nhân sản xuất Công ty Keenan  \n**Từ:** Karen Pollack, Giám đốc Sản xuất  \n**Ngày:** 27 tháng 5  \n**Chủ đề:** Cơ hội làm thêm giờ\n\nChúng tôi rất vui thông báo rằng công ty vừa nhận được một đơn hàng lớn từ Tập đoàn Saturn Moon. Saturn Moon đã bán được rất nhiều sản phẩm của chúng ta và dự đoán nhu cầu tiếp tục tăng, vì vậy họ yêu cầu chúng ta **sản xuất số lượng hàng lớn hơn nhiều so với thông thường**. Đơn hàng phải được giao vào cuối tháng 9.\n\nĐể hoàn thành đơn hàng, chúng ta buộc phải có một số thay đổi. Có hai phương án: kéo dài thời gian mở cửa từ ngày 1 tháng 7 đến ngày 30 tháng 9 và phân công nhân viên làm thêm ca hằng tuần; hoặc thuê nhân viên tạm thời, đào tạo họ làm một số công việc ít phức tạp hơn rồi cho họ nghỉ khi công việc hoàn tất. Chúng tôi cần ý kiến của từng nhân viên, vì vậy **hãy cân nhắc cả hai phương án**. Trong tuần này, mỗi người sẽ gặp riêng quản lý để cho biết lựa chọn của mình.\n\nNếu có đủ nhân viên đồng ý làm thêm giờ, chúng tôi sẽ điều chỉnh lịch làm việc. **Nếu không, công ty sẽ phải thuê nhân viên ngắn hạn.** Cảm ơn sự tham gia của mọi người trong quá trình này.","translationStatus":"reviewed"},{"id":"h3/test07/174_CD.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 174–175","questions":{"174":"C","175":"D"},"image":"data/h3/test07/174_CD.png","markedImage":"marked/h3/test07/174_CD.png","translation":"**Doorstep Delectable — Cách hoàn hảo để đặt những bữa ăn được chuẩn bị riêng cho bạn!**\n\nDoorstep Delectable giao các bữa ăn theo yêu cầu đến tận nhà **mỗi tuần một lần**, kèm hướng dẫn chế biến dễ thực hiện. Các món ăn lành mạnh, thơm ngon và không chứa hương liệu hay nguyên liệu nhân tạo. Ngoài việc cung cấp những món bạn yêu thích, chúng tôi còn điều chỉnh bữa ăn cho phù hợp với nhu cầu dinh dưỡng đặc biệt, dù bạn mắc bệnh tiểu đường, ăn chay, không dùng gluten hay theo chế độ ít carbohydrate.\n\nQuy trình đặt hàng rất đơn giản. Trước tiên, nhấp vào “ĐĂNG KÝ” và cung cấp thông tin liên hệ. Sau đó, bạn sẽ được hỏi về nhu cầu và sở thích ăn uống. Tiếp theo, hãy xem thực đơn, chọn món mình thích và số lượng muốn nhận mỗi tuần. **Chúng tôi sẽ yêu cầu thanh toán; sau khi khoản tiền được xử lý, một e-mail xác nhận sẽ được gửi đến bạn**, trong đó có ngày giao hàng dự kiến.\n\nChỉ đơn giản vậy thôi—còn chờ gì nữa? Hãy đặt đơn hàng đầu tiên ngay hôm nay! Nếu hài lòng với sản phẩm của chúng tôi, hãy để lại nhận xét trên diễn đàn phản hồi.","translationStatus":"reviewed"},{"id":"h3/test07/176_CCCDA.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 176–180","questions":{"176":"C","177":"C","178":"C","179":"D","180":"A"},"image":"data/h3/test07/176_CCCDA.png","markedImage":"marked/h3/test07/176_CCCDA.png","translation":"**Thông tin về Tribcott Manor House**\n\nTribcott Manor House được xây dựng cho gia đình Tribcott vào năm 1786 và hiện là dinh thự lớn nhất vùng tây nam nước Anh. Dù các tầng trên vẫn có người trong gia đình sinh sống và không mở cửa cho công chúng, nhiều phòng khác vẫn có thể tham quan, gồm phòng ngủ chính nguyên bản, khu ở của người hầu và đại sảnh. Vé người lớn là 8,50 bảng, vé trẻ em là 3 bảng. Từ thứ Ba đến thứ Bảy, giờ mở cửa là 10:00 sáng–5:00 chiều; thứ Hai mở cửa 9:00 sáng–12:00 trưa.\n\nCác tiện nghi ở tầng trệt vừa được cải tạo để phục vụ các cuộc họp nhỏ hoặc sự kiện riêng. Có thể thuê theo giờ với mức phí hợp lý:\n\n- Phòng Cornwall: tối đa 70 người, có sân khấu lớn phía trước.\n- Phòng Devonshire: tối đa 40 người, **có lối đi dành cho xe lăn**.\n- Phòng Somerset: tối đa 40 người, có bếp nhỏ.\n- Phòng Wiltshire: tối đa 25 người, có thiết bị nghe nhìn.\n\nVui lòng liên hệ queries@tribcottmanorhouse.co.uk để biết giá và thông tin chi tiết, bao gồm các lựa chọn phục vụ ăn uống.\n\n---\n\n**E-mail hỏi về địa điểm tổ chức**\n\n**Từ:** Angela Carter  \n**Chủ đề:** Hỏi về địa điểm  \n**Ngày:** 28 tháng 3\n\nKính gửi quý vị,\n\nCông ty tôi đang lên kế hoạch tổ chức một bữa tiệc mừng cho một nhân viên lâu năm sắp được thăng chức lên tổng giám đốc. Chúng tôi cần một căn phòng **đủ chỗ thoải mái cho 30 người và thuận tiện cho một người sử dụng xe lăn**. Chúng tôi muốn thuê khoảng ba giờ vào thứ Hai, ngày 30 tháng 4. Xin cho biết hôm đó có phòng như vậy hay không.\n\nNếu có, tôi và một đồng nghiệp muốn đến xem để **đánh giá mức độ phù hợp**. Xin cho biết thời gian thuận tiện. **Nếu cần thêm thông tin, vui lòng liên hệ Paul McGuire theo số 555-7263 hoặc p.mcguire@corsoindustries.**co.uk vì tôi sẽ bận tham dự hội thảo trong vài ngày tới. Anh ấy đã nắm đầy đủ kế hoạch và có thể thay mặt công ty thu xếp mọi việc cần thiết.\n\nTrân trọng,  \nAngela Carter  \nCorso Industries Bristol","translationStatus":"reviewed"},{"id":"h3/test07/181_CDCBB.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 181–185","questions":{"181":"C","182":"D","183":"C","184":"B","185":"B"},"image":"data/h3/test07/181_CDCBB.png","markedImage":"marked/h3/test07/181_CDCBB.png","translation":"**Trang cập nhật phần mềm BizzSpec 4.0**\n\nPhần mềm bán chạy nhất BizzSpec vừa được nâng cấp lên phiên bản 4.0! Tương tự BizzSpec 3.9, bạn có thể tạo các báo cáo và bài thuyết trình kinh doanh toàn diện. Phiên bản mới còn cho phép nhập dữ liệu, văn bản và hình ảnh từ nhiều nguồn vào một định dạng do bạn thiết kế. Bản nâng cấp cũng cải thiện chức năng, giao diện và tính năng, giúp chương trình khởi động, nhập tệp nhanh hơn và xử lý công việc hiệu quả hơn. Người dùng giờ đây có thể tùy chỉnh trang chủ và các menu chính để phản ánh những chức năng được sử dụng nhiều nhất.\n\n**Người dùng BizzSpec 3.**0–3.9 hiện tại có thể tải phiên bản cập nhật **miễn phí**. Chỉ cần nhấp vào liên kết để đến trang tải xuống, trả lời vài câu hỏi nhằm bảo đảm bản nâng cấp tương thích với hệ điều hành rồi tải về. Thời gian tải và cài đặt ước tính khoảng 30 phút.\n\nBizzSpec 4.0 cũng dành cho khách hàng mới; giá ưu đãi chỉ áp dụng trong thời gian giới hạn.\n\n---\n\n**Đánh giá của Johnny Nestor**\n\nGần đây tôi đã cài BizzSpec 4.0 và dùng được hai tuần. Tôi thích các tính năng của phiên bản 3.0 trước đây nhưng chỉ thỉnh thoảng sử dụng vì chương trình chậm và khó thao tác. Phiên bản mới khắc phục cả hai vấn đề. Khả năng tùy chỉnh menu cho phép loại bỏ những chức năng không dùng và sắp xếp biểu tượng theo cách phù hợp. Các chức năng đó không bị xóa khỏi chương trình nên vẫn có thể lấy lại khi cần. Dù có tùy chỉnh menu chính hay không, **chương trình đều khởi động nhanh và chuyển đổi mượt mà giữa các tác vụ**.\n\nTuy nhiên, tôi có hai phàn nàn nhỏ. Thứ nhất, **thời gian cài đặt ghi trên trang web không chính xác vì thực tế lâu hơn rất nhiều**. Thứ hai, phiên bản cập nhật không đọc được một số định dạng tệp cũ.\n\nNhìn chung, đây là một công cụ tuyệt vời và giờ dễ sử dụng hơn. Nếu thường xuyên tạo báo cáo và bài thuyết trình, tôi khuyên bạn nên nâng cấp.","translationStatus":"reviewed"},{"id":"h3/test07/186_BADCB.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 186–190","questions":{"186":"B","187":"A","188":"D","189":"C","190":"B"},"image":"data/h3/test07/186_BADCB.png","markedImage":"marked/h3/test07/186_BADCB.png","translation":"**Các album của Shawna Krall**\n\n**Midsummer Day’s Dream** — Album đầu tay của Krall trong thập niên 1980 gồm phần lớn các ca khúc do cô tự sáng tác, một số bài được viết cùng Ken Lewes. Album bán được 3,5 triệu bản và đưa Krall trở nên nổi tiếng.\n\n**Listen Here** — Krall tiếp tục hợp tác với Ken Lewes trong album thứ hai; hai ca khúc họ cùng viết đã đứng đầu bảng xếp hạng. Những bình luận xã hội mạnh mẽ trong album được đông đảo người hâm mộ yêu thích.\n\n**The Temptation** — **Nhiều người xem album thứ ba là tác phẩm xuất sắc nhất của Krall**, nhờ phần hòa âm thú vị và lời ca thông minh do Ken Lewes viết. Dù được giới phê bình khen ngợi nhiều nhất, album chỉ bán ở mức vừa phải; “Bright Days Ahead” là ca khúc duy nhất lọt vào tốp 10.\n\n**Little Thoughts** — Sau một thời gian tạm rời ngành âm nhạc, Krall trở lại với album giàu suy tư này. Đánh giá chuyên môn trái chiều, nhưng người hâm mộ thích nét tương đồng với các tác phẩm đầu tay. Album bán được 2,8 triệu bản và mọi ca khúc đều được viết cùng Ken Lewes.\n\n**On the Whole** — Trong album thứ năm, Krall thu âm lại mười ca khúc nổi tiếng nhất cùng dàn nhạc biểu diễn trực tiếp. Album còn có hai bài mới do Krall và Lewes sáng tác.\n\n---\n\n**Thông tin chương trình Music Talk with Melissa**\n\nHãy theo dõi chương trình phát trực tiếp vào 7:30 tối Chủ nhật hằng tuần hoặc xem lại chương trình cũ tại mục “Episodes”.\n\nChương trình tuần ngày 9 tháng 8 có cuộc phỏng vấn trực tiếp với Shawna Krall. Cô sẽ biểu diễn một trong hai bài mới thuộc album thứ năm, “The Beginning of the End”, **ca khúc hiện xếp thứ ba trên bảng xếp hạng âm nhạc thế giới**. Cô cũng sẽ nói về sự nghiệp trước đây và chuyến lưu diễn quốc tế bắt đầu ngày 28 tháng 8. Chương trình được phát lại cùng giờ vào ngày 10 và 11 tháng 8.\n\n---\n\n**E-mail mời làm việc — ngày 12 tháng 8**\n\nKính gửi cô Oliver,\n\nTôi sản xuất và đạo diễn các chương trình tài liệu cho The Music Network. Hiện tôi chuẩn bị một loạt chương trình về những nhạc sĩ nổi tiếng có ảnh hưởng văn hóa và hy vọng sẽ phỏng vấn nhiều nghệ sĩ như cô Krall. Tôi đã bỏ lỡ buổi phỏng vấn phát trực tiếp của cô với cô Krall nhưng **xem được chương trình trong lần phát lại tiếp theo** và rất thích. Tôi đặc biệt ấn tượng với sự ăn ý giữa cô và cô Krall.\n\nTôi đang tìm người phỏng vấn cho loạt chương trình và muốn biết **cô có quan tâm đảm nhiệm vai trò này không**. Nếu có, tôi có thể cung cấp thêm thông tin.\n\nTrân trọng,  \nBrian Rivers","translationStatus":"reviewed"},{"id":"h3/test07/191_ACDBC.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 191–195","questions":{"191":"A","192":"C","193":"D","194":"B","195":"C"},"image":"data/h3/test07/191_ACDBC.png","markedImage":"marked/h3/test07/191_ACDBC.png","translation":"**Quảng cáo đăng ký News Incorporated**\n\nAi nói mọi người không còn đọc báo? Họ vẫn đọc, chỉ là đã tìm thấy một phương tiện thuận tiện hơn: Internet. Với tin tức trực tuyến, độc giả thông thái chọn News Incorporated vì tin tức được cập nhật liên tục và dễ truy cập trên máy tính, điện thoại và máy tính bảng. Chúng tôi còn đăng hàng chục hình ảnh liên quan đến các sự kiện thời sự, cho phép truy cập kho bài viết hơn năm năm và cung cấp khu vực đăng cũng như đọc ý kiến.\n\nNews Incorporated đăng hàng trăm tin mỗi ngày, được nghiên cứu và viết bởi **một số nhà báo giỏi nhất trong ngành**. Chúng tôi bảo đảm mọi tin tức đều chính xác, kịp thời và bao quát nhiều chủ đề. Độc giả cũng có thể xem nội dung bổ sung như video **bằng cách đăng ký tạp chí web hằng tháng**.\n\n**Hãy đăng ký gói báo trực tuyến một tháng trước ngày 10 tháng 7 để được tặng thêm một tháng truy cập miễn phí.**\n\n---\n\n**Biểu mẫu đăng ký kỹ thuật số**\n\n- Chỉ dùng trên web: 2,75 đô la/tuần; 11 đô la/tháng; 110 đô la/năm.\n- Web và điện thoại di động: 3,85 đô la/tuần; **15 đô la/tháng**; 150 đô la/năm.\n- Tạp chí web: 8 đô la/tháng.\n\n---\n\n**E-mail gửi Dịch vụ Khách hàng — ngày 3 tháng 7**\n\nKính gửi bộ phận Dịch vụ Khách hàng,\n\nHôm qua tôi đã mua gói đăng ký một tháng trên trang web. Dù lập tức truy cập được nội dung trên máy tính, **tôi không thể xem nội dung trên điện thoại di động**. Tôi đã tải ứng dụng theo hướng dẫn nhưng mỗi lần đăng nhập, quyền truy cập vẫn bị hạn chế. Thông tin tài khoản cho thấy tôi cũng đã thanh toán quyền truy cập trên điện thoại. Xin vui lòng sửa lỗi hoặc gửi hướng dẫn để tôi biết cần làm gì.\n\nTrân trọng,  \nKatherine Andres","translationStatus":"reviewed"},{"id":"h3/test07/196_DABCD.png","folder":"h3/test07","book":"h3","bookLabel":"Hacker 3","test":"test07","testLabel":"Test 07","title":"Hacker 3 · Test 07 · Câu 196–200","questions":{"196":"D","197":"A","198":"B","199":"C","200":"D"},"image":"data/h3/test07/196_DABCD.png","markedImage":"marked/h3/test07/196_DABCD.png","translation":"**E-mail từ James Nichols — ngày 8 tháng 4**\n\nChào Gene,\n\n**Sáng nay tôi nhận được kịch bản đã chỉnh sửa cho quảng cáo truyền hình xe máy Tungsten.** Khách hàng hiểu rằng gửi phiên bản mới vào lúc này là khá gấp vì chúng ta dự kiến quay vào thứ Năm, nhưng các thay đổi có vẻ rất nhỏ. Dù vậy, tôi sẽ gửi kịch bản mới cho diễn viên vì một số lời thoại đã khác, đồng thời đính kèm một bản cho anh.\n\n**Tôi đã trao đổi với Noah Pierce tại địa điểm quay và hỏi liệu có thể kéo dài buổi quay đến 8 giờ tối không.** Anh ấy nói sau 6 giờ đã có đoàn khác nên hôm đó không thể kéo dài. Tuy nhiên, nếu đặt địa điểm vào ngày hôm sau, anh ấy có thể kéo dài thời gian quay. Tôi đồng ý hoãn quay một ngày. Nếu anh đồng ý, hãy báo để tôi xác nhận đổi lịch với Noah; như vậy anh sẽ có thêm thời gian quay như yêu cầu.\n\nJames Nichols  \nĐại diện khách hàng, Beetle Advertising Agency\n\n---\n\n**E-mail từ Malory Bateman — ngày 9 tháng 4**\n\nChào Noah,\n\nTôi đã nhận được tin về việc đổi lịch. Tôi hiểu James Nichols muốn lùi buổi quay một ngày. Tôi có thể làm tóc và trang điểm cho quảng cáo vào ngày 12 tháng 4 thay vì thứ Năm, nhưng phải rời đi trước 6:30 tối vì có **một sự kiện tại trường của con**. Điều đó hẳn không ảnh hưởng vì tôi đã xem kịch bản và ảnh diễn viên; phần tóc và trang điểm khá đơn giản. Dàn diễn viên cũng không đông, và **Juan Carlos sẽ có mặt để chỉnh sửa tóc và trang điểm khi cần**. Nếu cần người ở lại suốt buổi quay, có thể nhờ Diana Watson thay tôi vì tôi nghĩ cô ấy chưa có lịch vào thứ Sáu.\n\nMalory Bateman  \nNhân viên sản xuất, Hinterland Production Studios\n\n---\n\n**Hóa đơn của Hinterland Production Studios — ngày 12 tháng 4**\n\nGửi Beetle Advertising Agency, 289 W. 33rd Street, Los Angeles, CA 99328.\n\n- Thuê phim trường, ngày 12 tháng 4, 10:00 sáng–8:00 tối: 2.200 đô la.\n- Thuê thiết bị âm thanh: 280 đô la.\n- Thuê nhân viên vận hành ánh sáng và âm thanh: 800 đô la.\n**- Thuê chuyên viên trang điểm và làm tóc: 1.200 đô la.**\n- Tổng sau thuế: 4.960 đô la.\n\nThanh toán trong vòng bảy ngày kể từ ngày lập hóa đơn. Có thể chuyển khoản trực tiếp, thanh toán bằng thẻ tín dụng hoặc mang séc công ty đến văn phòng tại **303 South Van Ness Avenue, Los Angeles**.","translationStatus":"reviewed"},{"id":"h3/test08/131_BCDC.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 131–134","questions":{"131":"B","132":"C","133":"D","134":"C"},"image":"data/h3/test08/131_BCDC.png","markedImage":"marked/h3/test08/131_BCDC.png","translation":"**Tòa nhà Royal Exchange tái sinh thành khách sạn**\n\nTập đoàn khách sạn toàn quốc Verdant Group **sẽ chi hàng triệu bảng Anh trong ba năm** để chuyển đổi Tòa nhà Royal Exchange trên phố Quay, một địa danh lịch sử, thành khách sạn.\n\n“Chúng tôi muốn bảo tồn những yếu tố kiến trúc quan trọng của tòa nhà,” bà Gaile Edwards, Tổng giám đốc Verdant, cho biết. “Đó là lý do chúng tôi thuê một nhóm chuyên gia lịch sử làm việc cùng đội ngũ của mình.” **Xét từ kết quả, có vẻ họ đã thành công.**\n\nTòa nhà vẫn giữ được phần lớn nét quyến rũ nguyên bản, với kết cấu và phần đá xây từ thế kỷ 18 còn nguyên vẹn. Tuy nhiên, bên trong tòa nhà có đầy đủ **tiện nghi** như ở mọi khách sạn năm sao khác, chẳng hạn hồ bơi và spa.\n\nSự kết hợp giữa cơ sở vật chất hiện đại và vẻ ngoài cổ kính khiến nơi đây trở thành một **điểm thu hút** lớn đối với du khách. Các phòng suite cho cuối tuần khai trương đã được đặt kín; khách sạn dự kiến mở cửa vào cuối tháng tới.","translationStatus":"reviewed"},{"id":"h3/test08/135_BBAA.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 135–138","questions":{"135":"B","136":"B","137":"A","138":"A"},"image":"data/h3/test08/135_BBAA.png","markedImage":"marked/h3/test08/135_BBAA.png","translation":"**Ngày 15 tháng 7**\n\nAllison Morita\nCông ty Bảo hiểm Vestige\n4186 Maryland Avenue\nPinellas, FL 34624\n\nKính gửi cô Morita,\n\nTôi viết thư với hy vọng cô có thể **xử lý yêu cầu bồi thường bảo hiểm** của tôi. Tôi đã trao đổi với nhân viên phụ trách bồi thường Gary Fink vào ngày 6 tháng 7; **chính anh ấy** đã giải thích quy trình và khuyên tôi viết lá thư này.\n\nTháng trước, vào ngày 20 tháng 6, tôi bị thương do trượt chân ngã trong bếp. Cú ngã khiến tôi gãy cổ tay và phải phẫu thuật. Hợp đồng bảo hiểm của tôi có chi trả cho loại chấn thương này không? **Nếu có**, tôi mong được hoàn lại chi phí. Hiện tổng chi phí y tế của tôi vào khoảng 900 đô la. **Tôi đã gửi kèm các biên lai để làm căn cứ cho yêu cầu bồi thường này.**\n\nXin vui lòng phản hồi ngay sau khi xem xét hồ sơ của tôi.\n\nXin cảm ơn.\n\nTrân trọng,\nJune Miller","translationStatus":"reviewed"},{"id":"h3/test08/139_CCDB.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 139–142","questions":{"139":"C","140":"C","141":"D","142":"B"},"image":"data/h3/test08/139_CCDB.png","markedImage":"marked/h3/test08/139_CCDB.png","translation":"**Chào mừng đến với Vườn quốc gia Redstone**\n\nĐể bảo vệ công viên, tất cả du khách được yêu cầu tuân thủ một số **quy định** cơ bản.\n\nVườn quốc gia Redstone chính thức đóng cửa lúc 8 giờ tối. **Tuy nhiên**, trong công viên có nhiều khu cắm trại dành cho người muốn ở lại qua đêm. Xin lưu ý lựa chọn này chỉ dành cho người có giấy phép. **Giấy phép có thể được cấp tại trung tâm du khách hằng ngày trước 12 giờ trưa.**\n\nChúng tôi cũng đề nghị mọi du khách có ý thức giữ gìn khuôn viên. Khi rời đi, vui lòng mang theo mọi rác thải và vật dụng đã đem vào khu vực hoang dã, hoặc bỏ chúng vào đúng thùng quy định.\n\nViệc tuân thủ các quy tắc này sẽ góp phần **bảo tồn** vẻ đẹp của công viên cho những du khách trong tương lai.\n\nNếu có câu hỏi hoặc thắc mắc, vui lòng gọi 555-9092.","translationStatus":"reviewed"},{"id":"h3/test08/143_BADC.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 143–146","questions":{"143":"B","144":"A","145":"D","146":"C"},"image":"data/h3/test08/143_BADC.png","markedImage":"marked/h3/test08/143_BADC.png","translation":"**E-mail từ bộ phận chăm sóc khách hàng Lagoon Airlines**\n\n**Đến:** Janet Boyle <jboyle55@overmail.net>\n**Từ:** Bộ phận Chăm sóc khách hàng <service@lagoonair.com>\n**Chủ đề:** Giải đáp thắc mắc của quý khách\n**Ngày:** 29 tháng 7\n**Tệp đính kèm:** Mẫu yêu cầu bồi thường hành lý\n\nKính gửi cô Boyle,\n\nĐây là thư trả lời thắc mắc của cô về hành lý **bị hư hỏng**. Các vấn đề liên quan đến hành lý trên chuyến bay nội địa phải được báo cho nhân viên hãng hàng không tại sân bay trong vòng 48 giờ kể từ khi chuyến bay đến.\n\nTuy nhiên, nếu bay từ nước ngoài vào, cô có thể báo cáo mọi hư hại của hành lý đến claims@lagoonair.com bằng mẫu đính kèm. Yêu cầu bồi thường cũng có thể được **nộp** trực tiếp tại văn phòng hãng. **Xin lưu ý rằng việc yêu cầu hoàn tiền có thời hạn.** Hãng sẽ không chấp nhận yêu cầu nào được gửi quá 14 ngày sau chuyến bay.\n\nLagoon Airlines không chịu trách nhiệm đối với hư hại của hành lý kém chất lượng hoặc có khuyết tật vốn có. **Ngoài ra**, chúng tôi không hoàn trả chi phí sửa chữa đối với những hao mòn nhỏ thông thường.\n\nTrân trọng,\nBộ phận Chăm sóc khách hàng Lagoon Airlines","translationStatus":"reviewed"},{"id":"h3/test08/147_CD.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 147–148","questions":{"147":"C","148":"D"},"image":"data/h3/test08/147_CD.png","markedImage":"marked/h3/test08/147_CD.png","translation":"**BẢN GHI NHỚ — PHÒNG THÍ NGHIỆM KHOA HỌC ARGENTA**\n\n**Ngày:** 27 tháng 8\n**Đến:** Toàn thể nhân viên\n**Từ:** Thomas Sutton, Quản lý cơ sở vật chất\n**Chủ đề:** Khủng hoảng nước\n\nNhư mọi người đã biết, bang của chúng ta đang trải qua một cuộc khủng hoảng nước và đã yêu cầu toàn bộ người dân cùng doanh nghiệp thực hiện ngay các biện pháp tiết kiệm. Vì vậy, **chúng tôi đề nghị mọi người sử dụng nước có trách nhiệm và tránh những nhu cầu không cần thiết**, đặc biệt tại khu bếp nhỏ và nhà vệ sinh.\n\nTrong thời gian này, **tôi cũng đã cho ngừng sử dụng các vòi nước uống ở hành lang**, nhưng nước đóng chai sẽ được cung cấp tại phòng nghỉ của nhân viên. Cảm ơn sự hợp tác của mọi người. Nếu có bất kỳ thắc mắc hay vấn đề nào, xin hãy báo cho tôi.","translationStatus":"reviewed"},{"id":"h3/test08/149_AC.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 149–150","questions":{"149":"A","150":"C"},"image":"data/h3/test08/149_AC.png","markedImage":"marked/h3/test08/149_AC.png","translation":"**THÔNG BÁO CHUYỂN ĐỊA ĐIỂM**\n\nKể từ ngày 31 tháng 8, trung tâm đóng gói và vận chuyển Send It Right sẽ không còn hoạt động tại địa điểm hiện nay. Chúng tôi rất vui vì đã được phục vụ khách hàng tại Tòa nhà Tài chính Jovan, nhưng quy mô công ty nay đã vượt quá diện tích ở đây. **Ngày 1 tháng 9, Send It Right sẽ mở cửa tại phòng 112, Perkins Plaza, phía bên kia đường cao tốc Centerville.** Từ ngày đó, giờ làm việc thông thường từ 7 giờ sáng đến 10 giờ tối, thứ Hai đến thứ Sáu, sẽ được khôi phục.\n\nĐịa điểm mới rộng hơn nhiều và được thiết kế riêng theo nhu cầu của chúng tôi. Nơi đây có khu tự đóng gói dành cho khách mang vật phẩm cùng thùng hộp từ nhà đến và muốn tự đóng gói tại chỗ. Khách cũng có thể mua thùng của chúng tôi với nhiều kích cỡ, hình dáng khác nhau; băng keo, kéo và bàn làm việc sẽ được cung cấp.\n\nChúng tôi vẫn cung cấp đầy đủ các dịch vụ cũ, nhưng sẽ hỗ trợ khách nhanh hơn vì **diện tích bổ sung cho phép chúng tôi tuyển thêm nhân viên làm việc trong giờ cao điểm**. Các dịch vụ gồm đóng gói, vận chuyển, gửi thư, fax, công chứng và cho thuê thêm nhiều loại hộp thư cá nhân. Chúng tôi tiếp tục có dịch vụ chuyển phát trong nước, quốc tế và gửi bưu kiện hoặc tài liệu bằng các phương thức vận chuyển thông thường. Rất mong tiếp tục được phục vụ quý khách tại địa điểm mới.","translationStatus":"reviewed"},{"id":"h3/test08/151_CB.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 151–152","questions":{"151":"C","152":"B"},"image":"data/h3/test08/151_CB.png","markedImage":"marked/h3/test08/151_CB.png","translation":"**Tin nhắn giữa Sandra Fuller và Brent Cavanaugh**\n\n**Sandra Fuller — 2:23**\nCảm ơn anh một lần nữa vì đã tổ chức rất tốt chuyến thăm của các đại diện từ IPD Toy Incorporated. Tôi thực sự ấn tượng.\n\n**Brent Cavanaugh — 2:25**\nRất vui khi nghe chị nói vậy. Họ có vẻ quan tâm đến việc đặt mua một số dòng đồ chơi mà tôi giới thiệu trong phần thuyết trình.\n\n**Sandra Fuller — 2:27**\nỒ, anh chưa biết sao? **Sáng nay họ đã liên hệ để thông báo rằng họ quyết định bán dòng búp bê Happy Abbey của chúng ta tại tất cả cửa hàng trên toàn thế giới.**\n\n**Sandra Fuller — 2:28**\nHọ cho rằng loại búp bê này có tiềm năng thị trường và đồng ý đặt trước 500 sản phẩm.\n\n**Brent Cavanaugh — 2:29**\nTuyệt quá! Điều này thực sự có thể giúp chúng ta xây dựng thương hiệu.","translationStatus":"reviewed"},{"id":"h3/test08/153_DB.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 153–154","questions":{"153":"D","154":"B"},"image":"data/h3/test08/153_DB.png","markedImage":"marked/h3/test08/153_DB.png","translation":"**E-mail về việc thay đổi đặt chỗ**\n\n**Đến:** Kay Fine <kay.fine@beebonnethall.com>\n**Từ:** Joe Warner <joe.warner@sammonsproductions.com>\n**Ngày:** 17 tháng 11\n**Chủ đề:** Thay đổi đặt chỗ của Sammons Productions\n\nKính gửi cô Fine,\n\nTháng trước, tôi đã đặt cơ sở của cô để tổ chức cuộc họp nhân viên và tiệc trưa sắp tới của công ty vào ngày 30 tháng 1. Không may, **tôi vừa được biết chủ tịch công ty sẽ ở nước ngoài vào ngày đó**. Vì vậy, nếu có thể, tôi muốn chuyển lịch sang tuần kế tiếp. Ngày ưu tiên của tôi là 5 tháng 2, vẫn vào 12 giờ trưa như trước. Xin báo sớm nếu cô còn chỗ; nếu không, vui lòng cho tôi biết những ngày nào còn trống.\n\nCô cũng đã cung cấp một số thực đơn cho bữa trưa và tôi đã xem qua. Tôi chọn gà nướng kèm mì ống mùa xuân và salad trộn làm món chính, cùng bánh phô mai anh đào làm món tráng miệng. Ngoài ra, tôi quên hỏi **có những loại đồ uống nào**, và danh sách thực đơn cũng không nêu thông tin này. Cô có thể gửi cho tôi danh sách lựa chọn được không?\n\nCô có thể trả lời e-mail này hoặc gọi cho tôi theo số 555-6758. Mong sớm nhận được phản hồi.\n\nTrân trọng,\nJoe Warner","translationStatus":"reviewed"},{"id":"h3/test08/155_ACA.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 155–157","questions":{"155":"A","156":"C","157":"A"},"image":"data/h3/test08/155_ACA.png","markedImage":"marked/h3/test08/155_ACA.png","translation":"**THÔNG TIN QUAN TRỌNG VỀ FLEXTONE 900**\n\nVui lòng đọc sách hướng dẫn đi kèm trước khi lắp ráp sản phẩm và giữ lại để tham khảo sau này. Không sử dụng sản phẩm nếu thiếu bất kỳ bộ phận nào; hãy gọi đến số được cung cấp để chúng tôi gửi bổ sung.\n\nTrước mỗi lần sử dụng, hãy kiểm tra để chắc chắn mọi bộ phận đều được siết chặt. Nếu máy được lắp không đúng cách, người dùng có nguy cơ bị thương nghiêm trọng. Các chi tiết có thể lỏng ra sau thời gian dài sử dụng, vì vậy **cần thường xuyên kiểm tra mọi thứ và sửa chữa khi cần thiết**.\n\n**Cảnh báo**\n\n1. Luôn tham khảo ý kiến bác sĩ có chuyên môn trước khi bắt đầu bất kỳ chương trình tập luyện nào. Tập quá sức hoặc tập sai cách trên thiết bị này có thể gây chấn thương.\n2. Trước khi tập, bảo đảm thiết bị nằm trên bề mặt phẳng và mọi bu-lông, chốt cùng chi tiết cố định đều chắc chắn.\n3. Mặc trang phục phù hợp. Tránh quần áo rộng và mọi loại trang sức vì chúng có thể mắc vào thiết bị khi tập.\n4. Chừa đủ khoảng trống quanh máy để có thể sử dụng mà không bị cản trở.\n5. **Tuyệt đối không cho trẻ nhỏ tiếp cận máy, kể cả khi máy không được sử dụng.**\n\nĐể vệ sinh và bảo dưỡng thông thường, hãy lau các bề mặt bọc đệm bằng khăn ấm, ẩm. Không sử dụng Flextone 900 khi có dấu hiệu hư hỏng.","translationStatus":"reviewed"},{"id":"h3/test08/158_ABCB.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 158–161","questions":{"158":"A","159":"B","160":"C","161":"B"},"image":"data/h3/test08/158_ABCB.png","markedImage":"marked/h3/test08/158_ABCB.png","translation":"**Thảo luận trực tuyến về chi nhánh mới của Alstrop**\n\n**Blake Dunlap — 10:28**\nChào mọi người. Tôi vui mừng thông báo hội đồng quản trị Alstrop đã quyết định mở chi nhánh thứ sáu tại Cleveland. Họ muốn điều chuyển nhân viên hiện tại để chi nhánh có thể khai trương nhanh nhất. Tôi cần mỗi người đề xuất một số nhân sự.\n\n**Cathy Schultz — 10:30**\nViệc điều chuyển có tạm thời không? **Nhiều nhân viên đã sống ở Inglewood cả đời nên họ sẽ không vui khi phải chuyển đi.**\n\n**Blake Dunlap — 10:31**\nĐiều đó tùy vào nguyện vọng của từng nhân viên. Tất nhiên, hiệu suất làm việc cũng là một yếu tố.\n\n**Roy Reese — 10:31**\nNgày khai trương mục tiêu là khi nào?\n\n**Blake Dunlap — 10:32**\nChi nhánh phải hoạt động đầy đủ trước ngày 15 tháng 11 để tận dụng **đợt giảm giá lốp xe cuối năm**.\n\n**George Kesterson — 10:32**\nNếu cần quản trị viên văn phòng, tôi nghĩ Tammy Roselli sẽ làm rất tốt. Tuy nhiên, cô ấy có gia đình ở đây nên tôi không chắc cô ấy muốn chuyển đi.\n\n**Roy Reese — 10:34**\nCòn vị trí giám đốc kinh doanh thì Charles Kang là một lựa chọn tốt.\n\n**Blake Dunlap — 10:36**\nĐề xuất hay đấy! Có ý tưởng nào cho vị trí nhân viên thu mua không? Chúng ta cần người bắt đầu đặt hàng ngay.\n\n**Cathy Schultz — 10:38**\nCarson Drake thì sao? Anh ấy đã làm cùng một vị trí nhiều năm rồi và **cần một thử thách mới**.\n\n**Blake Dunlap — 10:40**\nÝ kiến hay. Chúng ta còn nhiều vị trí khác cần tuyển; **tôi sẽ gửi danh sách cho mọi người vào cuối hôm nay**. Nếu có thêm đề xuất, hãy nhắn cho tôi hoặc ghé phòng nhân sự.","translationStatus":"reviewed"},{"id":"h3/test08/162_BDB.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 162–164","questions":{"162":"B","163":"D","164":"B"},"image":"data/h3/test08/162_BDB.png","markedImage":"marked/h3/test08/162_BDB.png","translation":"**HÓA ĐƠN — CLEAN GENIE**\n\n**Địa chỉ:** 3102 Hamilton Boulevard, Allentown, PA 18103\n**Ngày lập hóa đơn:** 8 tháng 8\n**Mã công việc:** 08512-2\n**Khách hàng:** Vasco's Bistro, 501 Broad Street, Emmaus, PA 16049\n\n**Các dịch vụ**\n\n- Kiểm tra toàn bộ cơ sở và phát hành báo cáo đề ngày 24 tháng 7: 90 đô la.\n- Khử trùng mọi bề mặt bằng dung dịch Clean Genie Surface Wash.\n- Hút bụi thảm tại khu ăn uống chính và phủ Clean Genie Protecta: 285 đô la.\n- Khử khuẩn không khí tại khu ăn uống chính bằng Clean Genie Fresh Burst.\n- Di dời những vật phẩm được đánh dấu để vứt bỏ.\n- Tiến hành tái kiểm tra và vệ sinh vào ngày 8 tháng 8.\n- Phát hành báo cáo vệ sinh được phòng thí nghiệm chứng nhận, đề ngày 8 tháng 8.\n- Áp dụng ưu đãi thành viên Hiệp hội Nhà bán lẻ Thực phẩm Hạt Lehigh.\n\n**Ghi chú:** Khách hàng yêu cầu dịch vụ để **đáp ứng các tiêu chuẩn trong giấy phép của Cơ quan Vệ sinh Thực phẩm Khu Emmaus**. Các ưu đãi bổ sung được áp dụng khi sử dụng **những công thức độc quyền do Clean Genie phát triển**.\n\n**Phương thức thanh toán:** Séc số 201-98942-2\n\nChữ ký xác nhận công việc và mọi khoản phí: **Evelyn Moore, giám sát viên**.","translationStatus":"reviewed"},{"id":"h3/test08/165_CCA.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 165–167","questions":{"165":"C","166":"C","167":"A"},"image":"data/h3/test08/165_CCA.png","markedImage":"marked/h3/test08/165_CCA.png","translation":"**E-mail từ tạp chí Alive**\n\nKính gửi ông Morton,\n\nXin gửi lời chào từ tạp chí Alive. Tôi rất vui được thông báo rằng bài dự thi của ông trong Cuộc thi Viết về Du lịch dành cho Độc giả, mang tên *Ba ngày cuối tuần ở Thành phố Mexico*, đã được chọn đăng trong số báo tháng tới. **Bài viết sẽ xuất hiện cùng những bài được tuyển chọn khác trong chuyên mục du lịch thường kỳ của chúng tôi.**\n\nNhư ông có thể đã biết, **bà Josephine Tan, cây bút của cẩm nang du lịch *Pathways to the World*, được mời chấm toàn bộ bài dự thi**. Với tư cách tác giả bài đoạt giải, tên ông sẽ được công bố trong số tháng 9. Ông cũng nhận được phiếu quà tặng 500 đô la từ bookingpros.com, có thể sử dụng tại hơn 2.000 khách sạn và khu nghỉ dưỡng trên toàn thế giới. Bà Tan cũng sẽ chọn hai giải nhì; mỗi người nhận phiếu quà tặng 150 đô la từ Goliath Luggage.\n\nBiên tập viên Jason Carter còn nhờ tôi hỏi liệu ông có ảnh chụp chuyến đi hay không. Nếu có, vui lòng gửi qua e-mail vì chúng tôi có thể chọn đăng một vài tấm. Hình ảnh sẽ giúp câu chuyện của ông trở nên sinh động hơn.\n\nMột lần nữa xin chúc mừng. Mong ông tiếp tục là độc giả trung thành của tạp chí Alive trong nhiều năm tới.\n\nTrân trọng,\nAntonio Parrish\nNhân viên tiếp thị, tạp chí Alive","translationStatus":"reviewed"},{"id":"h3/test08/168_CABB.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 168–171","questions":{"168":"C","169":"A","170":"B","171":"B"},"image":"data/h3/test08/168_CABB.png","markedImage":"marked/h3/test08/168_CABB.png","translation":"**Sonorum đưa Vixo Mob tiến gần hơn đến ngày ra mắt**\n\n*Albert Lepke, phóng viên âm nhạc*\n\nGã khổng lồ âm nhạc Sonorum, đơn vị nắm bản quyền của hơn 80 hãng thu âm, đã ký thỏa thuận cấp phép toàn cầu với nhà cung cấp dịch vụ phát trực tuyến Vixo. Thỏa thuận mở đường cho việc ra mắt Vixo Mob, dịch vụ thuê bao âm nhạc trả phí. Vixo đã có quyền phát nội dung từ một số hãng thu âm lớn, nhưng trước đây chưa thể tiếp cận kho nhạc đương đại đồ sộ của Sonorum.\n\nThỏa thuận này sẽ làm tăng đáng kể lượng nội dung Vixo có thể cung cấp, khiến dịch vụ Vixo Mob được mong đợi từ lâu có nhiều khả năng chính thức ra mắt hơn. Dịch vụ cao cấp này đã được phát triển trong hai năm. **Sau khi ra mắt, người dùng có thể phát trực tuyến nhiều loại nhạc và video hơn với định dạng kỹ thuật số chất lượng cao.**\n\n“Chúng tôi rất hào hứng trước triển vọng tác phẩm của các nghệ sĩ được phân phối qua nền tảng Internet và di động của Vixo,” Tổng giám đốc Sonorum Sandra Scheine nói. “Dù coi trọng quan hệ hợp tác hiện có với một số đối thủ của Vixo, không đối thủ nào có độ phủ bằng Vixo.”\n\n**Vixo có hơn 180 triệu người dùng thường xuyên**, trong khi dịch vụ đứng thứ hai là SoundStorm chỉ có 20 triệu. Sự chênh lệch nằm ở cách các trang được sử dụng: đa số đến Vixo để xem video miễn phí thay vì nghe nhạc trực tuyến. Trong khi đó, **hơn 48% người dùng SoundStorm đăng ký thuê bao trả phí hằng tháng để nghe nhạc**. Chưa rõ người dùng Vixo Mob có sẵn lòng làm điều tương tự hay không.","translationStatus":"reviewed"},{"id":"h3/test08/172_DACB.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 172–175","questions":{"172":"D","173":"A","174":"C","175":"B"},"image":"data/h3/test08/172_DACB.png","markedImage":"marked/h3/test08/172_DACB.png","translation":"**CHÍNH SÁCH HỦY CHUYẾN CỦA OPEN WATERS CRUISES**\n\nDu lịch bằng du thuyền đòi hỏi cả hãng tàu lẫn hành khách phải lên kế hoạch và chuẩn bị từ lâu. Chúng tôi hiểu rằng đôi khi du khách cần thay đổi đặt chỗ, vì vậy đã xây dựng các chính sách hủy chuyến dưới đây. Những quy trình này cân bằng giữa chi phí mà Open Waters Cruises phải chịu và nhu cầu của hành khách.\n\nKhách hàng có thể hủy chuyến bằng một trong ba cách:\n\n- Gửi e-mail đến bookings@openwaters.com.\n- Viết thư cho bộ phận đặt chỗ tại 98 Capri Boulevard, Miami, FL 33124.\n- **Gọi số 1-800-555-2978.**\n\nTrong mọi trường hợp, **quý khách phải cung cấp số điện thoại có thể liên lạc được** cho đại diện của chúng tôi. Yêu cầu đổi sang ngày khởi hành khác được xem xét riêng theo từng trường hợp.\n\n**Mức hoàn tiền khi hủy**\n\n- Từ 61 ngày trở lên trước ngày khởi hành: hoàn 100% giá tour.\n- Từ 31 đến 60 ngày: hoàn 50% giá tour.\n- Từ 30 ngày trở xuống: phải thanh toán toàn bộ giá tour.\n\nNếu cần giải đáp, vui lòng gọi bộ phận đặt chỗ theo số miễn phí nêu trên.","translationStatus":"reviewed"},{"id":"h3/test08/176_ADDAB.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 176–180","questions":{"176":"A","177":"D","178":"D","179":"A","180":"B"},"image":"data/h3/test08/176_ADDAB.png","markedImage":"marked/h3/test08/176_ADDAB.png","translation":"**Tài liệu 1 — Quảng cáo San Francisco Custom T-Shirts**\n\nBạn muốn tạo một chiếc áo phông đẹp mắt theo cách nhanh chóng, đơn giản và tiết kiệm? Hãy đến San Francisco Custom T-Shirts trên đường 28th, từ 9 giờ sáng đến 5 giờ chiều các ngày trong tuần. Đội ngũ thiết kế sẽ giúp bạn tạo mọi mẫu áo có thể hình dung bằng hình minh họa có sẵn, nhiều phông chữ và hàng nghìn lựa chọn màu sắc. Chúng tôi cũng có thể in ảnh hoặc tệp hình ảnh khác do bạn mang đến, miễn là dung lượng dưới 50 MB.\n\nBạn có thể đặt bao nhiêu áo tùy thích. **Đơn hàng từ 200 chiếc trở lên được giảm 12%.** Phần lớn đơn hàng hoàn tất trong một đến ba ngày; đơn lớn thường sẵn sàng để nhận trong vòng một tuần.\n\nÁo được làm từ cotton Mỹ dệt mịn. Mẫu trắng cơ bản in bốn màu có giá từ 12 đô la một chiếc. Khách có thể chọn màu vải, tay dài hoặc tay ngắn, cổ thường hoặc cổ chữ V và mọi kích cỡ cần thiết.\n\nChúng tôi giao hàng miễn phí cho đơn từ 20 sản phẩm đến San Francisco, San Jose và Oakland. **Có thể giao đến mọi địa điểm khác với một khoản phụ phí.** Xem thêm tại sanfrantshirts.com.\n\n---\n\n**Tài liệu 2 — Phiếu đặt hàng**\n\n**Tên:** Harry Okata\n**Đơn vị:** Trường Tiểu học North Park\n**Ngày đặt:** 19 tháng 3\n**Ngày giao:** 25 tháng 3\n**Địa chỉ giao:** 1612 Telegraph Avenue, Berkeley, CA 94702\n**Thanh toán:** **Chuyển khoản ngân hàng**\n\n**Mô tả đơn hàng:**\n\n- 20 áo phông trắng cơ bản cỡ trẻ em, mặt sau in chữ xanh “NORTH PARK INTRAMURAL BASKETBALL TEAM” bằng phông Sportnik; mặt trước in **logo của trường** màu xanh lam, đen và vàng. Tệp hình ảnh đã được cung cấp. Kích cỡ: 5 lớn, 11 vừa, 4 nhỏ.\n- 4 áo trắng cơ bản cỡ người lớn dành cho huấn luyện viên, cùng thông số; 2 cỡ vừa và 2 cỡ lớn.\n\n**Tổng số:** 24 sản phẩm\n**Nhân viên nhận đơn:** Sam Boswell\n\nLưu ý: Không hoàn tiền đối với áo bị trả lại. Nếu muốn khiếu nại, **vui lòng gọi 555-5531 hoặc đến cửa hàng tại 2389 Tennant Boulevard**, trung tâm San Francisco.","translationStatus":"reviewed"},{"id":"h3/test08/181_CCBCA.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 181–185","questions":{"181":"C","182":"C","183":"B","184":"C","185":"A"},"image":"data/h3/test08/181_CCBCA.png","markedImage":"marked/h3/test08/181_CCBCA.png","translation":"**Tài liệu 1 — E-mail của Mark Summers**\n\n**Đến:** Martha Cale <mcale@speedmail.com>\n**Chủ đề:** Nội thất\n\nChào Martha,\n\nCảm ơn cô về e-mail hôm qua kèm ảnh và thông tin chi tiết của những món đồ có thể phù hợp với ngôi nhà mới của tôi. Cô đã nắm rất rõ phong cách tôi hướng đến. Tôi chọn một số món cô đề xuất vì chúng phù hợp với vẻ hiện đại của ngôi nhà và nội thất tôi đang có:\n\n- Phòng khách: ghế đôn Pendleton và một ghế bành.\n- Phòng ăn: ghế lưng cao và bàn ăn gỗ sồi của Regency International.\n- Nhà bếp: bộ hai ghế gỗ và bàn tròn nhỏ của Best-West.\n- Phòng nhạc: ghế dài da của Fulton Furnishings và sofa hai chỗ màu đen của Eversmith Interiors.\n\nTôi gửi kèm **ảnh một số món nội thất sẽ mang đến ngôi nhà mới**, hy vọng cô có thể đưa chúng vào thiết kế cuối cùng.\n\nTôi cũng đã đến Bards Hardware Supplies xem sơn theo gợi ý. Tôi thích màu cô đề xuất cho bếp và phòng ăn, nhưng muốn phòng khách và phòng nhạc có màu trung tính hơn như trắng, nâu hoặc xám.\n\nMong gặp cô vào tuần tới để xem các phương án thiết kế và trao đổi thêm.\n\nTrân trọng,\nMark\n\n---\n\n**Tài liệu 2 — E-mail phản hồi của Martha Cale, ngày 25 tháng 6**\n\nChào Mark,\n\nCảm ơn anh đã gửi ảnh. Anh có nhiều món đồ đẹp và tôi đã bắt đầu đưa chúng vào bản thiết kế nội thất.\n\nTôi không có vấn đề gì với những món anh chọn mua, nhưng **chiếc sofa hai chỗ có vẻ quá lớn so với không gian hiện có**. Anh nên cân nhắc ghế bành một chỗ cùng kiểu và cùng nhà sản xuất vì nó phù hợp với vị trí đó hơn.\n\nVề màu sơn, tôi sẽ đặt màu xanh lam cho bếp và màu vàng cho phòng ăn. Với hai phòng còn lại, màu be hoặc trắng ngà sẽ rất hợp với nội thất đã chọn; nếu anh thích nâu hoặc xám, tôi cũng có thể điều chỉnh.\n\nĐội ngũ của tôi đang tích cực làm dự án này. Tôi còn có **một số mẫu vải may rèm và đệm để cùng anh xem trong cuộc họp ngày 29 tháng 6**.\n\nNếu có thêm yêu cầu, xin cứ liên hệ với tôi.\n\nTrân trọng,\nMartha","translationStatus":"reviewed"},{"id":"h3/test08/186_DDCAC.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 186–190","questions":{"186":"D","187":"D","188":"C","189":"A","190":"C"},"image":"data/h3/test08/186_DDCAC.png","markedImage":"marked/h3/test08/186_DDCAC.png","translation":"**Tài liệu 1 — Thông báo của Dayton Bank**\n\nDayton Bank thường xuyên hỗ trợ chi phí cho nhân viên tham gia các khóa phát triển kỹ năng bên ngoài. Từ ngày 1 tháng 4, Pittman Training tiếp tục cung cấp các khóa sau tại cơ sở đào tạo hoặc trực tuyến. Người hoàn thành khóa học sẽ nhận chứng chỉ.\n\n- **Nghiệp vụ giao dịch viên hiệu quả:** 3 tuần, giảng viên Sam Penner; nâng cao kỹ năng nghiệp vụ và xử lý vấn đề của khách hàng; không có điều kiện tiên quyết; học sáng thứ Hai, Tư và Sáu.\n- **Phát triển nhân viên ngân hàng:** 2 tuần, giảng viên Lee Ching; tập trung vào các giao dịch ngân hàng phức tạp như chuyển tiền quốc tế. **Học viên phải hoàn thành khóa Nghiệp vụ giao dịch viên hiệu quả trước khi tham gia khóa này**; có lớp sáng thứ Hai, Tư, Sáu hoặc lớp chiều thứ Ba, Năm.\n- **Quản lý rủi ro tín dụng:** 1 tuần, giảng viên Jean Harker; hướng dẫn giảm thiểu rủi ro khi xét hồ sơ vay; chỉ dành cho người đã làm tại Dayton Bank ít nhất hai năm; học chiều từ thứ Hai đến thứ Sáu.\n\nĐăng ký tại pittmantraining.com.\n\n---\n\n**Tài liệu 2 — Phiếu đăng ký khóa học**\n\n**Tên:** Bernard Hinds\n**Địa chỉ:** 121 Rosemont Avenue, Chicago, Illinois 60615\n**E-mail:** bernardhinds@smail.com\n**Điện thoại:** 555-2143\n**Khóa học:** Phát triển nhân viên ngân hàng\n**Lịch ưu tiên:** Thứ Ba/Thứ Năm\n**Đáp ứng điều kiện tiên quyết:** **Có**\n\nCó thể thanh toán trực tuyến bằng thẻ tín dụng hoặc chuyển khoản đến First Standard Bank, tài khoản 3948-298. Séc được gửi đến Pittman Training, 9000 South Emerald Avenue, Chicago, IL 60620. Thanh toán bằng thẻ hoặc chuyển khoản được xử lý ngay; **nếu gửi séc, e-mail xác nhận sẽ được gửi trong vòng ba ngày làm việc sau khi nhận tiền**.\n\n---\n\n**Tài liệu 3 — E-mail của Bernard Hinds**\n\nKính gửi bộ phận phụ trách,\n\nTôi muốn hỏi về đăng ký khóa Phát triển nhân viên ngân hàng. **Tôi đã gửi khoản thanh toán một tuần trước và nhận được e-mail xác nhận ghi danh**, nhưng vẫn chưa nhận được đề cương. Xin gửi cho tôi sớm để tôi chuẩn bị cho lớp.\n\nNgoài ra, một đồng nghiệp của tôi cũng muốn học khóa này. Tôi hiểu hạn đăng ký có thể đã qua, nhưng muốn hỏi **liệu có thể cho anh ấy đăng ký ngoại lệ nếu lớp chưa đủ người hay không**.\n\nXin cảm ơn,\nBernard Hinds","translationStatus":"reviewed"},{"id":"h3/test08/191_BADCC.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 191–195","questions":{"191":"B","192":"A","193":"D","194":"C","195":"C"},"image":"data/h3/test08/191_BADCC.png","markedImage":"marked/h3/test08/191_BADCC.png","translation":"**Tài liệu 1 — Bản ghi nhớ của Vera Advertising**\n\n**Đến:** Toàn thể nhân viên\n**Từ:** Joseph Tran, Giám đốc Nhân sự\n**Chủ đề:** Chuyến nghỉ dưỡng nhân viên\n**Ngày:** 1 tháng 8\n\nChuyến nghỉ dưỡng thường niên sẽ diễn ra từ ngày 20 đến 22 tháng 8 tại River Ranch Resort ở Holbrook, cách đây ba giờ lái xe. Xe buýt công ty rời Phoenix lúc 8 giờ sáng ngày 20. Người không thể đi giờ đó sẽ được **Michelle Salazar đón khoảng 2 giờ chiều; vui lòng liên hệ trực tiếp với cô ấy để sắp xếp**.\n\n**Chương trình đã được gửi đến các phòng ban.** Mọi người được nghỉ thứ Hai ngay sau chuyến đi. Nếu có câu hỏi, hãy gọi máy lẻ 39.\n\n---\n\n**Tài liệu 2 — Lịch nghỉ dưỡng thường niên**\n\n**Thứ Sáu, ngày 20 tháng 8**\n\n- 11:00: Đến River Ranch\n- 12:00: Ăn trưa\n- **14:00: Cưỡi ngựa có hướng dẫn viên**\n- 17:00: Xây dựng đội nhóm — Cải thiện kỹ năng giao tiếp\n- 18:00: Xây dựng đội nhóm — Giải quyết vấn đề sáng tạo\n- 19:00: Ăn tối\n\n**Thứ Bảy, ngày 21 tháng 8**\n\n- 08:00: Ăn sáng\n- 10:00: Hội thảo “Đón nhận đổi mới”\n- 12:00: Ăn trưa\n- **14:00: Chèo bè vượt thác có hướng dẫn viên**\n- 19:00: Ăn tối\n- 20:30: Họp nhân viên — Triển vọng quý tới\n\n**Chủ Nhật, ngày 22 tháng 8**\n\n- 08:00: Ăn sáng\n- 09:00: Phát biểu bế mạc của Tổng giám đốc Kent Vera\n- 10:00: Chụp ảnh tập thể\n- 10:30: Khởi hành về Phoenix\n\n**Tất cả bữa ăn được phục vụ tại phòng ăn trong tòa nhà chính.** Hoạt động ngoài trời có thể thay đổi tùy thời tiết.\n\n---\n\n**Tài liệu 3 — E-mail của Steven Oliver gửi Joseph Tran, ngày 12 tháng 8**\n\nChào Joseph,\n\nTôi đã thực hiện mọi yêu cầu trong tin nhắn trước của anh: đặt ba phòng đôi cho ban lãnh đạo cấp cao và chín phòng tiêu chuẩn cho nhân viên; chuẩn bị thực đơn chay và không gluten; đồng thời yêu cầu bếp luôn bổ sung đồ uống nóng, lạnh và đồ ăn nhẹ trong suốt mỗi ngày.\n\nCó một vấn đề: **tòa nhà chính sẽ đóng cửa để sơn lại vào Chủ Nhật, ngày 22 tháng 8**. Vì vậy, **tôi đề nghị anh dùng khu nhà phụ cho các hoạt động hôm đó**. Nếu còn việc gì tôi có thể làm, xin hãy cho biết.\n\nCảm ơn!\nSteven Oliver","translationStatus":"reviewed"},{"id":"h3/test08/196_DBBCC.png","folder":"h3/test08","book":"h3","bookLabel":"Hacker 3","test":"test08","testLabel":"Test 08","title":"Hacker 3 · Test 08 · Câu 196–200","questions":{"196":"D","197":"B","198":"B","199":"C","200":"C"},"image":"data/h3/test08/196_DBBCC.png","markedImage":"marked/h3/test08/196_DBBCC.png","translation":"**Tài liệu 1 — Trang web của Cửa hàng Bách hóa Botwell**\n\n**Sắp khai trương: Khu mua sắm miễn thuế tại Botwell**\n\nCửa hàng Bách hóa Botwell ở trung tâm Cape Town vui mừng thông báo sẽ mở một cửa hàng miễn thuế mới vào ngày 12 tháng 4 dành cho hành khách quốc tế. Nằm tại tầng năm, cửa hàng cung cấp mỹ phẩm, nước hoa, rượu, trang sức và nhiều mặt hàng cao cấp khác.\n\nMừng khai trương, mọi sản phẩm của Moreno Luggage và Lydia Cosmetics được giảm 20% đến ngày 15 tháng 5. Khách mua hàng phải xuất trình hộ chiếu và vé cho chuyến bay quốc tế khởi hành trong vòng 28 ngày. Thành viên chương trình Khách hàng Thường xuyên Botwell được giảm thêm 10% cho mọi sản phẩm miễn thuế.\n\n---\n\n**Tài liệu 2 — Thông báo dành cho nhân viên Botwell**\n\nCảm ơn mọi người đã góp phần làm nên thành công của tuần đầu tiên. Nhìn chung, tôi hài lòng với nỗ lực của các bạn và cách cửa hàng vận hành, nhưng cần lưu ý hai vấn đề.\n\nThứ nhất, chúng tôi nhận được nhiều khiếu nại về chương trình phiếu ưu đãi. Chính sách của cửa hàng là **tặng phiếu ưu đãi cho khách có tổng giá trị mua hàng từ 500 đô la trở lên**. Phiếu này cho phép họ nhận giảm giá trên trang web của các đối tác. Hãy nhớ trao phiếu cho mọi khách đủ điều kiện.\n\nThứ hai, nếu thành viên chương trình khách hàng thường xuyên làm mất thẻ, chúng ta không thể áp dụng mức giá giảm. Tuy nhiên, họ có thể giữ biên lai và được hoàn phần chênh lệch sau khi tìm thấy hoặc được cấp thẻ mới.\n\n---\n\n**Tài liệu 3 — Quy định của Cơ quan Sân bay Cape Town**\n\nKhông được mang lên máy bay quá 100 ml chất lỏng và gel, trừ khi sản phẩm được mua tại cửa hàng miễn thuế và **được đặt kín trong túi nhựa có con dấu chính thức của CTAA**. Các mặt hàng này phải được lấy khỏi hành lý khi qua trạm kiểm tra an ninh.\n\n---\n\n**Tài liệu 4 — Biên lai Botwell, ngày 19 tháng 4**\n\n**Khách hàng:** Emilia Fortich — Quốc tịch Tây Ban Nha\n**Hộ chiếu:** XCV81324\n**Chuyến bay:** Vela Airways VI342\n**Khởi hành:** 21 tháng 4 đến Madrid, Tây Ban Nha\n\n- Túi xách lông vũ Lily màu mận, 1 chiếc: 160 đô la.\n- **Son môi Lydia Cosmetics, 4 thỏi: 46 đô la.**\n- Máy ảnh kỹ thuật số Lleganz, 1 chiếc: 258 đô la.\n- Khăn choàng Daphne Boutique, 1 chiếc: 62 đô la.\n\n**Tổng cộng: 526 đô la.**","translationStatus":"reviewed"},{"id":"h3/test09/131_DCAB.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 131–134","questions":{"131":"D","132":"C","133":"A","134":"B"},"image":"data/h3/test09/131_DCAB.png","markedImage":"marked/h3/test09/131_DCAB.png","translation":"### Thư cảm ơn\n\nNgày 15 tháng 3\n\nKính gửi ông Weber,\n\nTôi xin cảm ơn ông về **bài giảng** rất toàn diện. Phần trình bày của ông về cách giải quyết vấn đề một cách sáng tạo vừa bổ ích vừa thú vị, không chỉ với tôi mà còn với tất cả sinh viên **đang theo học** lớp của tôi. Tôi đặc biệt đánh giá cao việc ông đưa vào buổi nói chuyện những ví dụ giải quyết vấn đề có thể áp dụng cho nhiều lĩnh vực học tập khác nhau. Các sinh viên của tôi, **những người** theo học nhiều chuyên ngành khác nhau, đều đánh giá rất cao buổi trình bày vì các em đã học hỏi được nhiều điều từ những chia sẻ của ông. **Thành thật mà nói, tôi tin rằng ông là diễn giả khách mời thành công nhất từ trước đến nay của tôi.** Vì vậy, tôi muốn mời ông trở lại vào tháng tới. Nếu ông có thời gian, xin hãy cho tôi biết để chúng ta trao đổi chi tiết.\n\nMột lần nữa, xin cảm ơn ông.\n\nMila Hyatt, Tiến sĩ\nGiáo sư, Đại học Rappleton","translationStatus":"reviewed"},{"id":"h3/test09/135_CDBD.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 135–138","questions":{"135":"C","136":"D","137":"B","138":"D"},"image":"data/h3/test09/135_CDBD.png","markedImage":"marked/h3/test09/135_CDBD.png","translation":"### Bản ghi nhớ\n\n**Kính gửi:** Toàn thể trưởng khoa của Đại học Mount Westerly  \n**Người gửi:** Patricia Griffin, Giám đốc học vụ  \n**Ngày:** 29 tháng 4  \n**Chủ đề:** Xét thăng chức cho học kỳ tới\n\nĐã đến lúc chúng ta quyết định những giảng viên nào sẽ được thăng chức. **Những lựa chọn của chúng ta sẽ có ảnh hưởng đáng kể đến trường đại học.** Vì vậy, xin hãy cân nhắc kỹ các ứng viên tiềm năng. Trước khi viết thư giới thiệu để hội đồng xem xét, hãy lưu ý đến thành tích giảng dạy và học thuật **trước đây** của họ. Quý vị cũng cần nộp một số tài liệu đánh giá. Vui lòng trả lời mọi câu hỏi **cụ thể** nhất có thể. Tôi sẽ gửi giấy tờ cần thiết cho quý vị vào cuối ngày hôm nay, kèm theo một số hướng dẫn. Những hướng dẫn này sẽ **định hướng** cho quá trình ra quyết định.","translationStatus":"reviewed"},{"id":"h3/test09/139_DABC.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 139–142","questions":{"139":"D","140":"A","141":"B","142":"C"},"image":"data/h3/test09/139_DABC.png","markedImage":"marked/h3/test09/139_DABC.png","translation":"### Quy định hoạt động dành cho tất cả tiểu thương tại Chợ Nông sản\n\nChợ mở cửa cho công chúng lúc 8 giờ 30 sáng, nhưng tiểu thương có thể vào từ 6 giờ sáng. Tiểu thương phải đến **không muộn hơn** 30 phút trước giờ mở cửa để chuẩn bị gian hàng.\n\nNgoài ra, xin lưu ý rằng tiểu thương phải tuân thủ các quy định của tiểu bang về an toàn thực phẩm và bảo vệ khách hàng được đăng trên trang web của chúng tôi. Mỗi tiểu thương có trách nhiệm tự cập nhật các hướng dẫn này. **Những người không tuân thủ có thể bị thu hồi giấy phép kinh doanh.**\n\nMọi khoản phí áp dụng phải được thanh toán đúng hạn. Mức phí phụ thuộc vào **vị trí** gian hàng; các gian gần lối vào hơn sẽ bị tính phí cao hơn.\n\nCuối cùng, việc để lại rác trong khu vực bán hàng là trái quy định. **Vì vậy**, tất cả tiểu thương phải chuẩn bị sẵn thùng chứa để bỏ rác.","translationStatus":"reviewed"},{"id":"h3/test09/143_DADB.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 143–146","questions":{"143":"D","144":"A","145":"D","146":"B"},"image":"data/h3/test09/143_DADB.png","markedImage":"marked/h3/test09/143_DADB.png","translation":"### Khu liên hợp thể thao được đưa ra biểu quyết\n\nGainesburg, ngày 3 tháng 6 — Người dân Gainesburg đã **bỏ phiếu** về việc có nên xây dựng một khu liên hợp thể thao trong thị trấn hay không. Kết quả cho thấy 82% người dân **ủng hộ** dự án. Sau khi xem xét kết quả, thành phố đã phê duyệt việc xây dựng và dự kiến công tác triển khai sẽ bắt đầu trong những tháng tới.\n\nCâu lạc bộ thể hình duy nhất hiện có tại Gainesburg đã **đóng cửa** vào năm ngoái sau 30 năm hoạt động. Điều này khiến khu vực hoàn toàn không còn cơ sở vui chơi, rèn luyện nào hoạt động, và từ đó người dân liên tục kêu gọi xây dựng một khu liên hợp thể thao.\n\n**“Phần lớn người dân tin rằng một cơ sở như vậy sẽ mang lại lợi ích lớn cho Gainesburg.”** Thành viên hội đồng Claire Faukes cho biết: “Một trung tâm thể hình sẽ giúp nhiều người dễ dàng tiếp cận các nguồn lực thể thao hơn. Nơi đây cũng sẽ góp phần gắn kết cộng đồng theo một cách vui vẻ và lành mạnh.”","translationStatus":"reviewed"},{"id":"h3/test09/147_CC.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 147–148","questions":{"147":"C","148":"C"},"image":"data/h3/test09/147_CC.png","markedImage":"marked/h3/test09/147_CC.png","translation":"### Thư mời khai trương Ricardo’s Corner\n\nBạn được trân trọng mời tham dự lễ ra mắt Ricardo’s Corner!\n\n**Địa điểm:** 335 West Laughlin Drive  \n**Thời gian:** Chủ nhật, ngày 18 tháng 3, từ 10 giờ sáng đến 6 giờ tối\n\nSau bốn tháng xây dựng, cuối cùng chúng tôi đã sẵn sàng đón khách. Ricardo’s Corner là cửa hàng đầu tiên trong khu vực chuyên cung cấp nguyên liệu cho ẩm thực Mỹ Latinh. Sản phẩm của chúng tôi được nhập khẩu từ khắp Mexico, vùng Caribe, Trung Mỹ và Nam Mỹ. Giờ đây, bạn có thể chế biến những món ăn yêu thích của các khu vực này theo cách chân thực và truyền thống.\n\nĐể chào mừng dịp này, **50 khách hàng đầu tiên sẽ được giảm 50 đô la cho mọi hóa đơn mua hàng từ 200 đô la trở lên**. Hãy ghé thăm vào Chủ nhật để gặp chủ cửa hàng Ricardo Fuentes và dùng thử nhiều món ăn, trong đó có bánh tortilla và salsa tự làm.","translationStatus":"reviewed"},{"id":"h3/test09/149_DAC.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 149–151","questions":{"149":"D","150":"A","151":"C"},"image":"data/h3/test09/149_DAC.png","markedImage":"marked/h3/test09/149_DAC.png","translation":"### Phòng tập Renfrew: Thông báo dành cho toàn thể hội viên\n\nTại Phòng tập Renfrew, chúng tôi luôn cố gắng mang đến cho quý vị một buổi tập an toàn và thoải mái. Vì vậy, chúng tôi xin nhắc lại các quy định liên quan đến tư trang cá nhân.\n\nPhòng tập có bố trí tủ khóa trong phòng thay đồ để quý vị cất đồ trong lúc tập luyện. Tuy nhiên, vì lý do an ninh, xin đừng để những vật có giá trị cao trong tủ. Phòng tập Renfrew không chịu trách nhiệm đối với bất kỳ đồ vật nào bị thất lạc trong tủ. Quý vị có thể gửi đồ quý giá cho nhân viên quầy lễ tân; nhân viên sẽ cất chúng trong két an toàn. **Quý vị sẽ được cấp một phiếu nhận đồ và phải xuất trình phiếu này khi lấy lại đồ đã gửi.**\n\nNếu làm mất bất kỳ đồ dùng nào trong thời gian đến phòng tập, **hãy báo cho nhân viên tại quầy lễ tân**. Quý vị cũng có thể nhờ họ kiểm tra xem có ai đã giao món đồ đó vào khu vực đồ thất lạc hay không.\n\nCảm ơn sự hợp tác của quý vị. Nếu có câu hỏi hoặc thắc mắc, xin hãy trao đổi với một trong những nhân viên luôn sẵn lòng hỗ trợ của chúng tôi.\n\nBan quản lý","translationStatus":"reviewed"},{"id":"h3/test09/152_BD.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 152–153","questions":{"152":"B","153":"D"},"image":"data/h3/test09/152_BD.png","markedImage":"marked/h3/test09/152_BD.png","translation":"### Chuỗi tin nhắn\n\n**Colin McKay — 8:45 sáng:** Chào Brenda, ngày mai bạn hẹn khám sức khỏe định kỳ lúc mấy giờ?\n\n**Brenda Chan — 8:51 sáng:** 3 giờ 30 chiều. Sao bạn hỏi vậy?\n\n**Colin McKay — 8:52 sáng:** Lịch của tôi là 1 giờ, nên tôi muốn hỏi xem bạn có thể đổi giờ với tôi không. Tôi có một cuộc họp vào giờ ăn trưa nên lịch hơi gấp.\n\n**Brenda Chan — 8:53 sáng:** **Tôi cũng muốn đổi lắm, nhưng trưa tôi phải đến nhà máy để nhận thông tin từ người giám sát về sản lượng đã tăng.** Bạn không thể dời cuộc họp sớm hơn một tiếng sao?\n\n**Colin McKay — 8:54 sáng:** Có lẽ tôi sẽ phải làm vậy. Thật ra, tốt hơn là tôi nên gọi cho khách hàng ngay bây giờ.\n\n**Brenda Chan — 8:56 sáng:** Chúc may mắn!","translationStatus":"reviewed"},{"id":"h3/test09/154_BD.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 154–155","questions":{"154":"B","155":"D"},"image":"data/h3/test09/154_BD.png","markedImage":"marked/h3/test09/154_BD.png","translation":"### E-mail về đơn hàng P76559\n\n**Người nhận:** Meredith Patton  \n**Người gửi:** Arthur Compton  \n**Ngày:** 13 tháng 10\n\nKính gửi cô Patton,\n\nCảm ơn cô đã đặt hàng. Ba trong số bốn món cô đặt đã sẵn sàng để giao ngay. **Rất tiếc, chiếc hũ đựng bánh quy cô chọn đã hết hàng vì sản phẩm này quá được ưa chuộng.** Hiện cô có ba lựa chọn: hủy riêng món hũ đựng bánh quy để nhận hoàn tiền, chọn một sản phẩm khác đang còn hàng, hoặc chờ khoảng ba tuần để món này có hàng trở lại. Xin trả lời e-mail này để cho tôi biết cô muốn chọn phương án nào.\n\nTôi có thể gửi ngay ba món còn lại. Tuy nhiên, nếu cô muốn chờ món đang hết hàng, tôi có thể giữ lại và gửi tất cả cùng một lần. Như vậy, cô sẽ không phải trả thêm phí giao hàng.\n\nTrân trọng,\n\nArthur Compton  \nQuản lý dịch vụ khách hàng","translationStatus":"reviewed"},{"id":"h3/test09/156_CB.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 156–157","questions":{"156":"C","157":"B"},"image":"data/h3/test09/156_CB.png","markedImage":"marked/h3/test09/156_CB.png","translation":"### Lịch làm việc của Karen Greene\n\n**Bộ phim:** *Fire Across the Sand*  \n**Đơn vị sản xuất:** Cinemavent Studios  \n**Đạo diễn:** Karen Greene  \n**Thời gian:** Ngày 1–12 tháng 10\n\n- **Thứ Ba, ngày 2, 2 giờ chiều:** Họp sản xuất để giải quyết các vấn đề ngân sách.\n- **Thứ Tư, ngày 3, 3 giờ 30 chiều:** Trao đổi với biên kịch Joel Mabe về những thay đổi đối với cảnh kết.\n- **Thứ Năm, ngày 4, 1 giờ 30 chiều:** Gặp nhà thiết kế sản xuất để phê duyệt các thay đổi về trang phục.\n- **Thứ Sáu, ngày 5, 1 giờ 30 chiều:** Tham dự buổi diễn tập đầu tiên với các diễn viên.\n- **Thứ Hai, ngày 8, 2 giờ 30 chiều:** Trao đổi về cảnh mở đầu với giám đốc hình ảnh.\n- **Thứ Ba, ngày 9, 9 giờ sáng:** Duyệt bản thảo cuối của kịch bản cùng diễn viên chính.\n- **Thứ Tư, ngày 10, 2 giờ chiều:** **Tham dự buổi diễn tập thứ hai với các diễn viên.**\n- **Thứ Sáu, ngày 12, 7 giờ sáng:** Bắt đầu quay phim.","translationStatus":"reviewed"},{"id":"h3/test09/158_BCBA.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 158–161","questions":{"158":"B","159":"C","160":"B","161":"A"},"image":"data/h3/test09/158_BCBA.png","markedImage":"marked/h3/test09/158_BCBA.png","translation":"### Viện Gordon công bố nghiên cứu về thói quen ăn uống và tập luyện của người Mỹ\n\nTrong cuộc khảo sát gần nhất được thực hiện cách đây một thập kỷ, Viện Gordon nhận thấy nhiều người Mỹ vận động chưa đủ và thường ăn quá nhiều. Nay, tổ chức phi lợi nhuận có trụ sở tại Atlanta này đã công bố kết quả toàn diện của một cuộc khảo sát mới về cùng chủ đề.\n\nTheo khảo sát, 45% người Mỹ tập thể dục mỗi tuần một lần, mỗi ngày từ 30 phút trở lên. Thêm 25% tập ba lần mỗi tuần, mỗi ngày từ 30 phút trở lên; 10% khác tập ít nhất 30 phút vào tất cả các ngày trong tuần. **Số người còn lại cho biết họ hoàn toàn không tập thể dục.**\n\nTrong số những người có tập luyện, 65% cho biết họ chạy bộ chậm, 25% tập tạ, còn 10% đi bộ đường dài hoặc tham gia các hoạt động khác. Khoảng 40% nhóm này không cố gắng điều chỉnh lượng thức ăn nạp vào, trong khi khoảng 60% cho biết ít nhất đôi lúc họ cố gắng ăn uống lành mạnh.\n\nNhững kết quả này tạo nên sự so sánh thú vị với một khảo sát tương tự mà Viện Gordon công bố **20 năm trước**. Trong khảo sát đó, chỉ 23% người Mỹ cho biết họ tập thể dục ít nhất một lần mỗi tuần. Hơn nữa, tỷ lệ người theo dõi lượng thức ăn và cố gắng lựa chọn thực phẩm hợp lý đã tăng 11%.","translationStatus":"reviewed"},{"id":"h3/test09/162_BAC.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 162–164","questions":{"162":"B","163":"A","164":"C"},"image":"data/h3/test09/162_BAC.png","markedImage":"marked/h3/test09/162_BAC.png","translation":"### Super Ticket Exchange\n\nSuper Ticket Exchange là nơi lý tưởng để mua bán vé trực tuyến. Chúng tôi cung cấp nhiều lựa chọn nhất, với giá vé được niêm yết thấp hơn đáng kể so với giá ban đầu.\n\n**Kết quả tìm kiếm**  \nThành phố: Philadelphia · Loại sự kiện: Hòa nhạc · Khoảng ngày: 1–30 tháng 10\n\n- Dàn nhạc Giao hưởng Đại học — ngày 3 tháng 10, Đại học Finkle.\n- Stars of Country Music với Stacy Bellows và ban nhạc Howling Coyote — ngày 12 tháng 10, Anchor Arena.\n- Nghệ sĩ độc tấu khách mời Haley Hammond — ngày 15 tháng 10, khán phòng Withwell, khuôn viên Cao đẳng Windwell.\n- The Wandering Noisemakers — ngày 26 tháng 10, sân vận động Cougar.\n\nNếu gặp vấn đề với giao dịch hoặc vé và cần hoàn tiền, **quý khách phải liên hệ với chúng tôi trong vòng 30 ngày kể từ ngày mua**. Địa chỉ e-mail của chúng tôi là customerservice@supertix.com.\n\nNếu muốn bán vé, hãy vào trang dành cho người bán và **điền các thông tin được yêu cầu trong biểu mẫu trực tuyến**.","translationStatus":"reviewed"},{"id":"h3/test09/165_ABD.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 165–167","questions":{"165":"A","166":"B","167":"D"},"image":"data/h3/test09/165_ABD.png","markedImage":"marked/h3/test09/165_ABD.png","translation":"### Bảng khảo sát Trung tâm dịch vụ doanh nhân — Khách sạn Wembley, Chicago\n\nCảm ơn quý khách đã sử dụng trung tâm dịch vụ doanh nhân tại Khách sạn Wembley, Chicago. Chúng tôi hy vọng quý khách hài lòng với cơ sở vật chất, dịch vụ và sự hỗ trợ của nhân viên. Để giúp chúng tôi nâng cao chất lượng, xin quý khách dành ít phút điền bảng khảo sát ngắn này. Sau khi hoàn tất, hãy giao lại cho nhân viên trung tâm. Người tham gia khảo sát sẽ được sử dụng miễn phí các tiện ích của trung tâm trong lần lưu trú tiếp theo tại Khách sạn Wembley.\n\n**Mục đích chuyến đi đến Chicago:** Họp công việc với một số khách hàng.\n\n**Quý khách đã sử dụng trung tâm vào việc gì?** Tôi in một số hợp đồng, thực hiện một cuộc gọi hội nghị và sử dụng Wi-Fi.\n\n**Chúng tôi có thể cải thiện cơ sở vật chất như thế nào?** **Máy in hiện có hoạt động không tốt. Máy in chậm và đôi lúc ngừng hẳn. Tôi nghĩ mua một máy mới sẽ hữu ích.**\n\n**Dịch vụ quý khách nhận được như thế nào?** Nhân viên Erin Minors thân thiện và đã hỗ trợ tôi sử dụng máy in. Dịch vụ rất tốt.\n\n**Tên:** James Gould  \n**Điện thoại:** 555-3049  \n**E-mail:** jamesgould@pqfinvest.com","translationStatus":"reviewed"},{"id":"h3/test09/168_BCDA.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 168–171","questions":{"168":"B","169":"C","170":"D","171":"A"},"image":"data/h3/test09/168_BCDA.png","markedImage":"marked/h3/test09/168_BCDA.png","translation":"### Sau một thời gian dài vắng bóng, Thierry Martin đã trở lại!\n\nThierry Martin từng là một trong những nghệ sĩ guitar nổi tiếng và được ngưỡng mộ nhất thế giới. Album gần nhất của ông, *La Defense* — được đặt theo tên khu thương mại Paris — đã bán hơn một triệu bản và **nằm trong nhóm đầu của các bảng xếp hạng âm nhạc suốt sáu tuần**. Ngoài ra, ông còn dự kiến góp mặt trong album của một số ca sĩ đoạt giải.\n\nBa năm trước, trong một kỳ nghỉ trượt tuyết tại Colorado, ông bị gãy tay trái. Ông hủy toàn bộ lịch phỏng vấn và xuất hiện trước công chúng, đồng thời phải hoãn chuyến lưu diễn thế giới sắp tới. Người hâm mộ theo dõi quá trình hồi phục chậm chạp của ông, và có lúc tưởng rằng ông đã từ bỏ việc biểu diễn hoàn toàn.\n\nNhưng giờ đây, ông đã trở lại phòng thu. Theo thông báo trên trang web của Martin, album tiếp theo mang tên *Normandy* sẽ được BBS Records phát hành vào tháng 11 năm nay. Album gồm 20 ca khúc mới cùng phần góp giọng của nhiều ca sĩ nổi tiếng, trong đó có ngôi sao nhạc pop Anh Carly Fey và ca sĩ Mỹ James Norwell, nên gần như chắc chắn sẽ trở thành album bán chạy trong mùa lễ hội.\n\nĐể tạo sự mong đợi cho *Normandy*, Martin đã **phát hành trước đĩa đơn đầu tiên của album**. Ca khúc “Summer Squall” dài sáu phút, là một bản hòa tấu mang ảnh hưởng hard rock. Blog âm nhạc nổi tiếng *MP3Stream* gọi đây là một trong những ca khúc xuất sắc nhất trong sự nghiệp của ông.","translationStatus":"reviewed"},{"id":"h3/test09/172_CCDB.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 172–175","questions":{"172":"C","173":"C","174":"D","175":"B"},"image":"data/h3/test09/172_CCDB.png","markedImage":"marked/h3/test09/172_CCDB.png","translation":"### Cuộc trò chuyện trực tuyến về tuyển dụng tại Revenco\n\n**Andrew Walker — 4:45:** Revenco đang phát triển nhanh hơn nhiều so với dự tính. Dù liên tục nhận được hồ sơ, **phần lớn ứng viên không phù hợp với nhu cầu của chúng ta**.\n\n**Jolene Gibson — 4:46:** Tôi đồng ý. Chúng ta cần tập trung tuyển những người có năng lực và kinh nghiệm. Trước đây, chúng ta đã tham gia hội chợ việc làm, nhưng phần lớn người đến đó là sinh viên mới tốt nghiệp.\n\n**Andrew Walker — 4:47:** Để thu hút ứng viên tiềm năng, chúng ta cần quảng bá rộng rãi rằng công ty đang tuyển dụng và có chế độ đãi ngộ cạnh tranh. Mọi người có ý tưởng gì không?\n\n**Luke Garnier — 4:49:** Có lẽ chúng ta có thể chủ động tìm hồ sơ trên các trang tuyển dụng và liên hệ trực tiếp với những người đáp ứng mọi tiêu chí.\n\n**Alice Page — 4:50:** Tôi thích cách tiếp cận những ứng viên cụ thể mà ta muốn tuyển. **Chỉ có một vấn đề là việc trao đổi qua lại với từng người có thể mất rất nhiều thời gian.**\n\n**Andrew Walker — 4:51:** Vậy bạn đề xuất gì?\n\n**Alice Page — 4:52:** Chúng ta có thể tổ chức ngày hội mở cửa tại trụ sở chính hoặc chi nhánh Pendleton và chỉ mời những người mà ta quan tâm. Họ sẽ được xem văn phòng, gặp nhân viên và tìm hiểu một số dự án công ty đang thực hiện.\n\n**Jolene Gibson — 4:54:** Ý tưởng rất hay. Cách này cũng giúp sàng lọc ứng viên; những người phản hồi thư mời và đến tham dự sẽ thể hiện rằng họ thực sự quan tâm.\n\n**Andrew Walker — 4:55:** Tôi cũng thích ý tưởng đó. **Alice và Luke, tôi muốn hai bạn bắt đầu lập danh sách tên.** Sau đó chúng ta sẽ tổ chức ngày hội mở cửa.\n\n**Alice Page — 4:57:** Tuyệt. Tôi sẽ bắt đầu ngay.","translationStatus":"reviewed"},{"id":"h3/test09/176_CDDAB.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 176–180","questions":{"176":"C","177":"D","178":"D","179":"A","180":"B"},"image":"data/h3/test09/176_CDDAB.png","markedImage":"marked/h3/test09/176_CDDAB.png","translation":"### Lịch hội thảo: Những phát triển mới trong lịch sử cổ đại\n\n**Địa điểm:** Khách sạn Royal Harrington, Melbourne  \n**Ngày:** 25 tháng 7\n\n- **9:00–10:00:** Đăng ký tại sảnh.\n- **10:00–11:00:** Thảo luận nhóm về nghiên cứu mới nhất trong lịch sử cổ đại — Phòng hội nghị chính.\n- **11:00–12:00:** Các phiên nhỏ: Jonathan Taylor, “Kim tự tháp được xây dựng như thế nào”; Grace Li, “Những ngôi đền ở Triều Tiên cổ đại”; Zoe Harris, “Không gian công cộng ở Hy Lạp cổ điển”.\n- **12:00–13:00:** Ăn trưa. Phòng ăn chính đang được dùng cho một sự kiện khác, nên người tham dự có thể ngồi tại Phòng hội nghị chính hoặc Phòng hội nghị Hampton. **Suất ăn dành cho người có chế độ ăn đặc biệt chỉ có tại Phòng hội nghị Hampton và phải báo trước.**\n- **13:00–14:00:** Các phiên nhỏ: Michael Jones, **“Trang phục phổ biến trong Đế chế La Mã”**; Andrew Ware, “Nông nghiệp ở Lưỡng Hà”; Angela Cartwright, “Các tu sĩ và Stonehenge”.\n- **14:00–14:30:** Giải lao và dùng đồ uống tại sảnh.\n- **14:30–16:00:** Thảo luận tổng kết tại Phòng hội nghị chính.\n\n---\n\n### E-mail gửi ban tổ chức\n\n**Người gửi:** Jane Christie  \n**Ngày:** 20 tháng 7  \n**Chủ đề:** Một số vấn đề về hội thảo\n\nKính gửi ban tổ chức,\n\nTôi dự kiến tham dự hội thảo tại Khách sạn Royal Harrington vào tuần tới. Tuy nhiên, **do giờ xe buýt từ Adelaide, tôi chỉ có thể đến địa điểm vào khoảng 10 giờ 15 sáng**, sau khi thời gian đăng ký đã kết thúc. Xin cho tôi biết liệu tôi vẫn có thể đăng ký khi đến nơi hay không.\n\nNgoài ra, tôi là người ăn chay, vì vậy xin ban tổ chức lưu ý điều này khi chuẩn bị bữa trưa.\n\nCảm ơn sự hỗ trợ của quý vị.\n\nTrân trọng,\n\nJane Christie","translationStatus":"reviewed"},{"id":"h3/test09/181_CABCB.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 181–185","questions":{"181":"C","182":"A","183":"B","184":"C","185":"B"},"image":"data/h3/test09/181_CABCB.png","markedImage":"marked/h3/test09/181_CABCB.png","translation":"### Mở đường cho người đi xe đạp\n\nTừ khi ra đời, công nghệ Hệ thống Định vị Toàn cầu (GPS) chủ yếu được dùng để tìm tuyến đường hiệu quả và chính xác hơn cho tài xế. GPS thông thường có thể chỉ cho người ngồi trong ô tô tuyến đi nhanh và tiết kiệm nhiên liệu nhất từ điểm A đến điểm B, nhưng không thể cung cấp thông tin tương tự cho người đi xe đạp hoặc đi bộ.\n\nMột ứng dụng di động mới tên Ped-Routes, do hiệp hội xe đạp Two Wheels tài trợ, muốn thay đổi điều đó. Các nhà phát triển tại FGG Software đã dùng GPS để tạo bản đồ hiển thị những tuyến đường ít ùn tắc hơn, mang lại trải nghiệm di chuyển an toàn và dễ chịu hơn. Để Ped-Routes hấp dẫn với nhiều người hơn, Two Wheels còn cung cấp các tuyến đường dành cho người đi bộ.\n\nAdam Jorgeson, giám đốc Two Wheels, cho biết: “Chúng tôi rất hài lòng với dự án mới và mong phiên bản đầu tiên được ra mắt trước cuối tháng. Chúng tôi đang hợp tác với FGG để phát triển các phiên bản sau, cho phép người đi xe đạp chọn những tuyến đường có cảnh quan đẹp nhất.” **Ped-Routes có giá tải xuống 4,99 đô la và người dùng được quyền truy cập trong một năm.**\n\n---\n\n### E-mail phản hồi về ứng dụng Ped-Routes\n\n**Người gửi:** Georgina McGrath  \n**Người nhận:** Melissa Hawk, bộ phận hỗ trợ kỹ thuật Two Wheels  \n**Ngày:** 30 tháng 4\n\nKính gửi cô Hawk,\n\nGần đây tôi đã tải ứng dụng di động của tổ chức và muốn phản ánh một vấn đề. Tôi thử dùng ứng dụng để tìm đường ở Providence. **Tháng trước tôi vừa chuyển đến đây để làm việc nên vẫn chưa quen khu vực.** Ứng dụng đã dẫn tôi qua những con phố yên tĩnh, dễ chịu, nhưng có lần lại đề xuất một tuyến đường dài hơn mức cần thiết. Tôi đi theo tuyến đó và tính ra mất hơn 40 phút so với đường thẳng nhất.\n\nTôi hiểu ứng dụng chủ yếu được thiết kế cho người đi xe đạp, nhưng vẫn mong lỗi này được khắc phục. Dù vậy, tôi xin khen giao diện dễ sử dụng và tốc độ hoạt động ấn tượng của ứng dụng.\n\nTrân trọng,\n\nGeorgina McGrath","translationStatus":"reviewed"},{"id":"h3/test09/186_CBABC.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 186–190","questions":{"186":"C","187":"B","188":"A","189":"B","190":"C"},"image":"data/h3/test09/186_CBABC.png","markedImage":"marked/h3/test09/186_CBABC.png","translation":"### Quảng cáo trên bản tin cộng đồng Shelton Media\n\nShelton Media luôn quan tâm đến Birmingham, Alabama. Bản tin hằng tháng của chúng tôi được gửi riêng cho cư dân địa phương. Nếu bạn là doanh nghiệp trong khu vực và muốn tham gia mạng lưới các doanh nghiệp địa phương đa dạng mà chúng tôi hỗ trợ, hãy cân nhắc đăng quảng cáo. Việc này không chỉ giúp doanh nghiệp tiếp cận nhiều khách hàng hơn mà còn cho phép bạn quảng bá tại các sự kiện do chúng tôi tổ chức, như Chuyến dã ngoại và diễu hành cộng đồng Birmingham hằng năm và Hội chợ việc làm học kỳ mới hai năm một lần.\n\n**Mức phí mỗi số:** 6 số — 135/175/275 đô la; 12 số — 125/165/255 đô la; 24 số — 115/150/230 đô la, tương ứng quảng cáo 1/4 trang, 1/2 trang và nguyên trang.\n\nChúng tôi cũng nhận quảng cáo và tờ chèn ở trang bìa. Nếu muốn ký hợp đồng dài hạn trên 24 số và tìm hiểu mức giá ưu đãi, hãy gửi e-mail đến ads@sheltonmedia.com hoặc gọi 555-4311 để gặp Daniel Kelly. Có thể thanh toán bằng thẻ tín dụng, thẻ ghi nợ, tiền mặt và séc.\n\n---\n\n### Trang liên hệ Shelton Media\n\nQuý khách có thể gọi 555-4311 từ thứ Hai đến thứ Sáu, 9 giờ sáng–6 giờ chiều, rồi nhập số máy lẻ của bộ phận cần liên hệ.\n\n- Kinh doanh cộng đồng: máy lẻ 11\n- **Kinh doanh quảng cáo — Daniel Kelly: máy lẻ 18**\n- Thiết kế trình bày: máy lẻ 24\n- Kế toán: máy lẻ 28\n- Phân phối: máy lẻ 30\n\nChúng tôi rất mong nhận được ý kiến của quý khách về trang web và dịch vụ. **Nhấp vào liên kết để điền biểu mẫu góp ý.**\n\n---\n\n### E-mail về kế hoạch quảng cáo\n\n**Người gửi:** Eva Loeb, Quản lý tiếp thị, Lawler Scapes  \n**Ngày:** 2 tháng 2\n\nCharles,\n\nTôi đã tổng hợp báo cáo về các quảng cáo mà chúng ta đăng trên bản tin cộng đồng của Shelton Media trong 12 tháng qua để tiếp cận thêm khách hàng địa phương. Tôi đính kèm báo cáo để anh tiện xem.\n\nDựa trên số yêu cầu dịch vụ từ những khách hàng đã thấy quảng cáo, tôi đề nghị tiếp tục quảng cáo trong bản tin thêm một khoảng thời gian tương tự. Lần trước chúng ta trả 255 đô la cho mỗi quảng cáo, nhưng tôi nghĩ lần này nên in quảng cáo nhỏ hơn một cỡ để tiết kiệm. **Cỡ nhỏ hơn kế tiếp là nửa trang, có giá 165 đô la cho
