 hợp đồng 12 số.** Tuy sẽ khó đưa toàn bộ nội dung vào không gian hạn chế đó, tôi cho rằng nên đăng quảng cáo mới càng sớm càng tốt vì mùa xuân sắp đến và nhu cầu dịch vụ của chúng ta sẽ tăng cao.","translationStatus":"reviewed"},{"id":"h3/test09/191_CBBDC.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 191–195","questions":{"191":"C","192":"B","193":"B","194":"D","195":"C"},"image":"data/h3/test09/191_CBBDC.png","markedImage":"marked/h3/test09/191_CBBDC.png","translation":"### Trang khuyến mãi của Borderland Tours\n\nBorderland Tours mang đến những chuyến phiêu lưu đặc biệt mà rất ít người dám trải nghiệm. Mùa đông này, từ ngày 1 tháng 12 đến 28 tháng 2, chúng tôi tổ chức chuyến đi 30 ngày xuyên sa mạc Sahara với mức giá **giảm 20% so với giá thông thường**. Tuyến đường đi qua Morocco, Tây Sahara, Mauritania và Mali.\n\nQuý khách phải cung cấp giấy chứng nhận sức khỏe có chữ ký của cơ sở y tế, xác nhận đủ thể lực hoàn thành chuyến đi; nếu không, quý khách sẽ không được tham gia.\n\n---\n\n### Phiếu đặt tour\n\nHãy điền phiếu và gửi kèm **tiền đặt cọc 500 đô la** để giữ chỗ. Khoản này sẽ được trừ vào tổng chi phí hoặc hoàn lại nếu hủy ít nhất 30 ngày trước chuyến đi. Nếu hủy muộn hơn, chỉ một nửa khoản tiền được hoàn lại.\n\n**Tên:** Enrique Turner  \n**Tour:** Chuyến khuyến mãi Sahara 30 ngày  \n**Ngày:** 1–30 tháng 1\n\n**Lựa chọn tại Mauritania:** Các thành viên sẽ chọn giữa nhiều tuyến đường. Tôi thích nhất tuyến đi bằng tàu hỏa. Tuy nhiên, tôi sẵn sàng đi theo quyết định chung vì mọi lựa chọn đều hấp dẫn.\n\n---\n\n### Nhận xét của Enrique Turner — “Một hành trình có một không hai!”\n\nTôi vừa trở về từ tour Sahara 30 ngày. Ban đầu, tôi chỉ quan tâm đến chuyện ăn gì, nhưng nhìn chung tôi khá thất vọng về ẩm thực châu Phi. Vì không dừng ở đâu quá lâu, công ty du lịch cung cấp phần lớn các bữa ăn và **thực đơn cứ lặp đi lặp lại**.\n\nHành trình bắt đầu tại Morocco, đi qua Marrakech, Meknes và Fez, rồi đến nơi sa mạc tiếp giáp đại dương. Sau đó, chúng tôi vào Tây Sahara và tiếp tục dọc bờ biển đến Mauritania. Tại đây, du khách có thể đi về phía nam đến Nouakchott, cắm trại ở Banc d’Aguin, đi tàu đến Atar hoặc nhập đoàn lữ hành tới Tagant. Phần lớn nhóm muốn đi bằng đoàn lữ hành nên cuối cùng chúng tôi chọn phương án đó. Đây không phải lựa chọn đầu tiên của tôi, nhưng tôi vui vẻ đi cùng cả nhóm. Phong cảnh trên đường thật ngoạn mục.","translationStatus":"reviewed"},{"id":"h3/test09/196_BCDCB.png","folder":"h3/test09","book":"h3","bookLabel":"Hacker 3","test":"test09","testLabel":"Test 09","title":"Hacker 3 · Test 09 · Câu 196–200","questions":{"196":"B","197":"C","198":"D","199":"C","200":"B"},"image":"data/h3/test09/196_BCDCB.png","markedImage":"marked/h3/test09/196_BCDCB.png","translation":"### Autumn Leaf sẽ mở cơ sở thứ hai tại Buenos Aires\n\n*Tác giả: Leonard Oldman*\n\nAutumn Leaf Hotels thông báo kế hoạch mở chi nhánh thứ hai tại quận Liniers, Buenos Aires. Giám đốc quan hệ công chúng Angelo Suarez cho biết khách sạn mới sẽ giống một tòa căn hộ lưu trú tạm thời dành cho doanh nhân đến thành phố. **Có nhu cầu lớn từ những khách phải lưu trú dài ngày tại Buenos Aires nhưng không muốn chi quá nhiều tiền cho khách sạn đủ dịch vụ.**\n\nKhách sạn gồm các căn lớn có khu sinh hoạt và bếp để khách tự nấu ăn. Dù không có nhà hàng hay dịch vụ phòng như chi nhánh chính ở Monserrat, tầng trệt vẫn có quán cà phê hoạt động 24 giờ, nhân viên dọn phòng và bàn lễ tân. Khách sạn sẽ mở vào một thời điểm trong tháng 8.\n\n---\n\n### Thư của Angelo Suarez gửi Leonard Oldman — ngày 9 tháng 4\n\nKính gửi ông Oldman,\n\nCảm ơn ông đã viết bài về việc mở rộng chuỗi khách sạn của chúng tôi. Tuy nhiên, bài viết có một số sai sót. Bài nói rằng độc giả đã có thể đặt phòng trên trang web, nhưng thông tin này không chính xác. Chúng tôi chỉ bắt đầu nhận đặt phòng vài tuần trước ngày khai trương, mà ngày khai trương vẫn chưa được ấn định. Bài viết còn ghi khách sạn có thể mở vào tháng 7, trong khi thực tế chúng tôi dự định mở muộn hơn.\n\nTôi mong tạp chí đăng phần đính chính trong một số sắp tới.\n\nTrân trọng,\n\nAngelo Suarez\nGiám đốc quan hệ công chúng, Autumn Leaf Hotels\n\n---\n\n### E-mail xin lỗi của Leonard Oldman — ngày 13 tháng 4\n\nKính gửi ông Suarez,\n\nTôi xin lỗi về những sai sót trong bài viết. Có lẽ tôi đã hiểu nhầm một trong những người được phỏng vấn tại **chi nhánh chính của Autumn Leaf vào tháng trước**. Tôi đã trao đổi với cấp trên và chúng tôi sẽ đăng phần đính chính trong số tiếp theo. Tôi đính kèm bản thảo đã sửa để ông xem lại.\n\nNgoài ra, xin ông báo cho tôi khi ngày khai trương khách sạn được **chốt chính thức**, vì tạp chí có thể cử tôi đến đưa tin.\n\nMột lần nữa, tôi xin lỗi về những sai sót.\n\nTrân trọng,\n\nLeonard Oldman","translationStatus":"reviewed"},{"id":"h3/test10/131_BCCD.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 131–134","questions":{"131":"B","132":"C","133":"C","134":"D"},"image":"data/h3/test10/131_BCCD.png","markedImage":"marked/h3/test10/131_BCCD.png","translation":"### Dịch vụ vệ sinh Wimberley’s\n\nBạn có thấy việc **dọn dẹp** nhà cửa phiền phức hơn giá trị mà nó mang lại không? Nếu có, hãy gọi Wimberley’s — dịch vụ vệ sinh gia đình đáng tin cậy nhất. Kể từ khi khai trương cách đây năm năm, chúng tôi luôn nhận được đánh giá cao nhất từ khách hàng.\n\n**Wimberley’s đảm nhận mọi công việc mệt nhọc mà bạn không có thời gian làm.** Đội ngũ của chúng tôi lau cửa sổ và sàn nhà, hút bụi và đánh bóng gạch. Chúng tôi sử dụng thiết bị hiện đại để loại bỏ những mùi, bụi bẩn và vết ố khó xử lý. Ngoài ra, nếu bạn cần dọn bỏ những món đồ lớn **không mong muốn** như đồ nội thất hoặc thiết bị gia dụng, nhân viên Wimberley’s có thể thực hiện với một khoản phí nhỏ.\n\nChúng tôi **có thể đến** nhà bạn vào bất kỳ thời điểm nào thuận tiện nhất. Nếu quan tâm, vui lòng gọi 555-9190.","translationStatus":"reviewed"},{"id":"h3/test10/135_ABDC.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 135–138","questions":{"135":"A","136":"B","137":"D","138":"C"},"image":"data/h3/test10/135_ABDC.png","markedImage":"marked/h3/test10/135_ABDC.png","translation":"### E-mail phản hồi yêu cầu bảo hành\n\n**Đến:** Talia Moroz <talia.moroz@homemail.com>  \n**Từ:** Miles Kaufmann <m.kaufmann@coldmaker.com>  \n**Ngày:** 31 tháng 7  \n**Chủ đề:** Yêu cầu của quý khách\n\nKính gửi cô Moroz,\n\nTôi viết thư để trả lời câu hỏi của cô về chiếc tủ lạnh Coldmaker mới mua. Trong e-mail, cô cho biết ngăn tủ không đóng kín. **Vấn đề này** từng được một số khách hàng khác phản ánh. Kỹ thuật viên của chúng tôi sau đó đã xác định rằng **có vẻ người dùng chưa làm theo hướng dẫn trong sách hướng dẫn sản phẩm**.\n\nNhư sách hướng dẫn nêu rõ, để **cố định** cánh cửa, cô phải đẩy nó về phía trước cho đến khi nghe tiếng “tách”. Nếu chỉ đóng ngăn tủ mà không giữ lẫy, cửa sẽ không giữ được trạng thái đóng.\n\nCô vui lòng thử cách này trước nhé. Nếu vấn đề vẫn tiếp diễn, hãy liên hệ với một trung tâm dịch vụ **được liệt kê** trên trang web của chúng tôi.\n\nCảm ơn cô đã liên hệ. Hy vọng thông tin này hữu ích.\n\nTrân trọng,  \nMiles Kaufmann  \nNhân viên dịch vụ bảo hành","translationStatus":"reviewed"},{"id":"h3/test10/139_CBDD.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 139–142","questions":{"139":"C","140":"B","141":"D","142":"D"},"image":"data/h3/test10/139_CBDD.png","markedImage":"marked/h3/test10/139_CBDD.png","translation":"### E-mail về hồ sơ ứng tuyển\n\n**Đến:** Henry Chan <h.chan@followmail.com>  \n**Từ:** Gleeson Consulting <hr@gleeson.com>  \n**Ngày:** 14 tháng 3  \n**Chủ đề:** Về hồ sơ ứng tuyển vị trí quản lý dự án\n\nKính gửi ông Chan,\n\nChúng tôi đã nhận được hồ sơ ứng tuyển vị trí quản lý dự án tại Gleeson Consulting. Công ty nhận được rất nhiều hồ sơ nên mức độ **cạnh tranh** cho vị trí này khá cao. Vì vậy, tôi rất tiếc phải thông báo rằng ông không có tên trong danh sách ứng viên được chọn cho vị trí đó. **Tuy nhiên**, chúng tôi đã xem xét kỹ năng lực của ông và nhận thấy ông phù hợp với vị trí trợ lý dự án. **Chúng tôi hy vọng ông sẽ cân nhắc tham gia phỏng vấn cho vị trí đang tuyển này.**\n\nCác buổi phỏng vấn sẽ diễn ra ngày 20 tháng 3, từ 10 giờ sáng đến 3 giờ chiều. Vui lòng liên hệ để cho tôi biết ông có quan tâm và **có thể sắp xếp thời gian** đến phỏng vấn trong khung giờ trên hay không. Nếu không, chúng ta có thể sắp xếp một ngày thuận tiện hơn.\n\nTrân trọng,  \nJacqueline Hart  \nQuản lý Nhân sự  \nGleeson Consulting","translationStatus":"reviewed"},{"id":"h3/test10/143_DBAC.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 143–146","questions":{"143":"D","144":"B","145":"A","146":"C"},"image":"data/h3/test10/143_DBAC.png","markedImage":"marked/h3/test10/143_DBAC.png","translation":"### Thông báo mời nộp tham luận\n\nKhoa Xã hội học thuộc Đại học Northern Wisconsin **sẽ tổ chức** một hội nghị học thuật về sự chuyển đổi xã hội tại khu vực Trung Tây Hoa Kỳ từ ngày 7 đến ngày 9 tháng 6. **Liên quan đến sự kiện này, hiện chúng tôi đang nhận các đề xuất tham luận về chủ đề trên.** Các giáo sư và giảng viên quan tâm vui lòng gửi bản tóm tắt trước ngày 1 tháng 5.\n\nKhoa sẽ gửi thông báo nếu **đề cương** của bạn được chọn. Sau khi nhận thông báo, bạn phải nộp toàn bộ bài viết để xem xét và phê duyệt.\n\nChúng tôi hoan nghênh bài gửi từ mọi trường đại học và mong đợi nhiều chủ đề đa dạng. **Mặc dù** hội nghị tập trung vào vùng Trung Tây, các công trình về khu vực khác vẫn được chấp nhận, miễn là có liên quan đến nhu cầu của khu vực mục tiêu.","translationStatus":"reviewed"},{"id":"h3/test10/147_DB.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 147–148","questions":{"147":"D","148":"B"},"image":"data/h3/test10/147_DB.png","markedImage":"marked/h3/test10/147_DB.png","translation":"### Tin nhắn khuyến mại từ Bergman Glazer\n\n**Nhận ngày 14 tháng 6 lúc 1 giờ chiều**\n\nKính gửi cô Crowder,\n\nHãy mua sắm tại Bergman Glazer để nhận những ưu đãi hấp dẫn cho đồ nội thất và phụ kiện gia đình chất lượng. Nhập mã khuyến mại **S7HPDQIX** tại www.bergmanglazer.com trước khi thanh toán để được **miễn phí giao hàng cho đơn hàng từ 100 đô la trở lên**. Mã chỉ dùng được một lần, không được chia sẻ và hết hạn lúc 11 giờ 59 tối ngày 30 tháng 6.\n\nTin nhắn này được gửi vì **cô là khách hàng đã đăng ký trên trang web bergmanglazer.com**. Nếu không muốn nhận tin quảng cáo tương tự trong tương lai, hãy trả lời “STOP”. Nếu cần trợ giúp, hãy nhắn “HELP?”. Cước tin nhắn thông thường được áp dụng.","translationStatus":"reviewed"},{"id":"h3/test10/149_AB.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 149–150","questions":{"149":"A","150":"B"},"image":"data/h3/test10/149_AB.png","markedImage":"marked/h3/test10/149_AB.png","translation":"### Thông báo tới toàn thể người sử dụng thư viện\n\nTrong tháng tới, Thư viện West Springs sẽ **chuyển từ địa điểm hiện tại sang một không gian lớn hơn nhiều**, nhờ đó chúng tôi có thể cung cấp nhiều dịch vụ tốt hơn. Thư viện đã ký hợp đồng thuê tòa nhà Benchmark Cinema cũ tại góc Wentworth Rise và Đại lộ 5, đồng thời sẽ cải tạo tòa nhà trước khi chuyển bộ sưu tập đến đó. Vị trí mới ở khu vực trung tâm hơn, giúp thư viện phục vụ được nhiều người dùng hơn.\n\nQuá trình chuyển địa điểm sẽ tạm thời làm gián đoạn dịch vụ. Người dùng không thể mượn tài liệu sau ngày 6 tháng 4 và mọi tài liệu đang mượn phải được trả trước ngày 13 tháng 4. Thư viện sẽ đóng cửa từ ngày 14 tháng 4 đến ngày 1 tháng 5, thời điểm cơ sở mới dự kiến khai trương. Trong thời gian đóng cửa, **thư viện công cộng gần nhất là cơ sở tại Coach Hill**.\n\nChúng tôi xin lỗi vì sự bất tiện và cảm ơn sự thông cảm của quý vị.\n\nDịch vụ Thư viện Calgary","translationStatus":"reviewed"},{"id":"h3/test10/151_BB.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 151–152","questions":{"151":"B","152":"B"},"image":"data/h3/test10/151_BB.png","markedImage":"marked/h3/test10/151_BB.png","translation":"### Thư xin việc\n\nNgày 3 tháng 3\n\nKính gửi cô Judy Mayer,  \nWhole Nutrition Pet Foods, Inc.  \n1930 Industrial Street  \nLawton, OK 73501\n\nTôi viết thư để **ứng tuyển vị trí thợ điện tại nhà máy sản xuất ở Lawton**. Tôi đã là thợ điện có chứng chỉ trong 15 năm và vừa rời công việc ba năm tại cơ sở Loyalty Limited ở Oklahoma City để chuyển đến Lawton. Công việc quý công ty đăng tuyển rất phù hợp với tôi.\n\nTrong tám năm làm việc gần đây nhất, tôi phụ trách hệ thống điện và thiết bị của nhà máy. Công việc đòi hỏi khả năng giải quyết nhiều vấn đề cùng kiến thức chuyên môn điện; việc lắp đặt và điều chỉnh thiết bị thường xuyên liên quan đến công nghệ máy tính.\n\nKhoảng tám năm trước, tôi lấy bằng cao đẳng công nghệ máy tính để có thể làm thợ điện thiết bị. Kể từ đó, tôi luôn cập nhật kiến thức qua các khóa đào tạo. Thành tích chi tiết có trong sơ yếu lý lịch đính kèm.\n\nDo gần đây tôi làm việc tại **một công ty sản xuất các sản phẩm tương tự sản phẩm của quý công ty**, tôi tin mình có thể thích nghi nhanh. Rất có thể hai công ty còn sử dụng nhiều thiết bị giống nhau.\n\nCảm ơn cô đã xem xét. Tôi hy vọng được liên hệ phỏng vấn qua filaney@postmail.com hoặc số 655-9483.\n\nTrân trọng,  \nRick Delaney","translationStatus":"reviewed"},{"id":"h3/test10/153_BACC.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 153–156","questions":{"153":"B","154":"A","155":"C","156":"C"},"image":"data/h3/test10/153_BACC.png","markedImage":"marked/h3/test10/153_BACC.png","translation":"### Cornucopia Industries\n\n**?i?u h??ng:** Trang ch? | T?ng quan c?ng ty | Th?ng tin s?n ph?m | **Vi?c l?m** | Li?n h?\n\n### Trang giới thiệu Cornucopia Industries\n\nCornucopia Industries đã phát triển song hành với công nghệ tại nơi làm việc trên toàn cầu. Dù khách hàng doanh nghiệp có nhu cầu cụ thể nào, công ty vẫn cung cấp các giải pháp viễn thông và **dịch vụ khách hàng chất lượng cao nhất**. Trong nhiều năm, Cornucopia đã xây dựng danh tiếng tốt với khách hàng khắp Bắc Mỹ.\n\nCornucopia tiếp tục là nhà cung cấp giải pháp toàn diện với nhiều sản phẩm viễn thông cho doanh nghiệp thuộc mọi ngành. Các sản phẩm bán chạy gồm thiết bị chuyển mạch tương tự và kỹ thuật số, cáp quang, modem, bộ định tuyến cùng những thiết bị mạng LAN khác.\n\nCornucopia Industries hiện chuẩn bị trở thành doanh nghiệp dẫn đầu toàn cầu bằng cách **nghiên cứu các lĩnh vực sản phẩm mới như công nghệ vệ tinh và mạng di động**. **Để đạt được mục tiêu này, chúng tôi phải vận dụng hàng chục năm kinh nghiệm vào những công nghệ mới nhất.** Đội ngũ tận tâm cũng không ngừng thu hút khách hàng nước ngoài và xây dựng quan hệ với nhiều tổ chức.\n\nMục tiêu hàng đầu của Cornucopia Industries là trở thành một doanh nghiệp mang tính cách mạng, tiếp tục phát triển và cải tiến công nghệ truyền thông trong ít nhất nửa thế kỷ nữa. Chúng tôi cảm ơn mọi đối tác và khách hàng đã luôn ủng hộ.","translationStatus":"reviewed"},{"id":"h3/test10/157_CCA.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 157–159","questions":{"157":"C","158":"C","159":"A"},"image":"data/h3/test10/157_CCA.png","markedImage":"marked/h3/test10/157_CCA.png","translation":"### Khách sạn Granriver — Phiếu khảo sát lưu trú\n\nChúng tôi kính đề nghị quý khách dành ít phút điền biểu mẫu để cung cấp phản hồi, giúp khách sạn cải thiện dịch vụ.\n\n**Tên:** Gordon Pence  \n**Ngày lưu trú:** 18–19 tháng 8  \n**Điện thoại:** (404) 555-3984  \n**E-mail:** gorpen@gotomail.com\n\nKhách sạn hỏi về trải nghiệm tổng thể, thủ tục nhận phòng, tình trạng phòng, độ chính xác của danh bạ khách sạn và thái độ cũng như khả năng hỗ trợ của nhân viên.\n\n### Nhận xét của khách\n\nNhìn chung, tôi khá hài lòng với trải nghiệm tại khách sạn. Tuy nhiên, tôi gặp một vấn đề nhỏ sau khi nhận phòng. Tôi có vài chiếc túi lớn nhưng lễ tân cho biết lúc đó không có nhân viên hành lý, vì vậy **tôi phải tự mang hành lý lên phòng**.\n\nPhòng sạch sẽ và rộng rãi. Tuy nhiên, khi bước vào, tôi nhận thấy **máy điều hòa không hiểu sao lại được chỉnh xuống mức rất lạnh là 16°C**. Hồ bơi trong nhà rất tuyệt và thư giãn, nhưng đôi khi tôi khó liên hệ với nhân viên để hỏi nơi nhận và trả khăn hồ bơi.","translationStatus":"reviewed"},{"id":"h3/test10/160_BAB.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 160–162","questions":{"160":"B","161":"A","162":"B"},"image":"data/h3/test10/160_BAB.png","markedImage":"marked/h3/test10/160_BAB.png","translation":"### Cuộc hội ngộ Đường sắt Hơi nước\n\n**Từ thứ Sáu, ngày 2 tháng 5 đến Chủ nhật, ngày 4 tháng 5**\n\nNhư thường lệ, cuối tuần đầu tiên của tháng 5 sẽ diễn ra cuộc hội ngộ Đường sắt Hơi nước thường niên. Tuyến đường sắt hơi nước Concord–Marlborough được xây dựng năm 1847 và ngừng hoạt động vào đầu thế kỷ 20. Tuy nhiên, đường ray vẫn nguyên vẹn và mỗi năm một lần, Hiệp hội Bảo tồn Lịch sử Massachusetts vận hành các chuyến tàu cổ trong ba ngày qua khung cảnh tuyệt đẹp.\n\nCác chuyến tàu đi qua bảy ga lịch sử và khởi hành từ Concord mỗi giờ. Khách có thể lên xuống tùy ý; từ ga Maynard và Hudson còn có những tuyến đi bộ đường dài tuyệt vời. Hoặc bạn có thể đi đến ga Marlborough ở cuối tuyến, nơi có **nhiều quầy bán đồ ăn và thức uống**. Các toa tàu đều có hoạt động giải trí và du khách được khuyến khích mặc trang phục thế kỷ 19.\n\nCó thể mua vé trước tại www.massivehistory.com hoặc tại ga Concord. Vé cho phép đi không giới hạn trong ngày mua, giá 14 đô la cho người lớn và 7 đô la cho trẻ em.","translationStatus":"reviewed"},{"id":"h3/test10/163_BB.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 163–164","questions":{"163":"B","164":"B"},"image":"data/h3/test10/163_BB.png","markedImage":"marked/h3/test10/163_BB.png","translation":"### Chuỗi tin nhắn về tiệc cuối năm\n\n**Kate Hendrickson — 5:01 chiều**\nJackie, chúng ta đã nhận được phản hồi từ Viện Loflin chưa? Lẽ ra cô phải hỏi xem Sảnh D có trống cho tiệc cuối năm của chúng ta không.\n\n**Jackie Dalton — 5:03 chiều**\nHọ nói một công ty khác đã đặt phòng vào ngày 28 tháng 12. Nhưng họ có nhắc đến một phòng khiêu vũ mới mở tháng trước mà chúng ta có thể dùng.\n\n**Kate Hendrickson — 5:06 chiều**\nỒ, cô chưa nghe à? Bữa tiệc đã được chuyển sang ngày 27 rồi.\n\n**Jackie Dalton — 5:07 chiều**\n**Tôi không hề biết việc thay đổi lịch này.** Tôi sẽ gọi lại để kiểm tra ngày đó.\n\n**Kate Hendrickson — 5:08 chiều**\nTuyệt. Sau khi chốt xong, vui lòng gửi thông báo sự kiện cho nhân viên vào ngày 15 tháng 12.\n\n**Jackie Dalton — 5:09 chiều**\nHôm đó tôi vẫn đang nghỉ phép. Ngày hôm sau có được không?\n\n**Kate Hendrickson — 5:11 chiều**\nĐược đấy. Cảm ơn cô nhiều!","translationStatus":"reviewed"},{"id":"h3/test10/165_DBD.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 165–167","questions":{"165":"D","166":"B","167":"D"},"image":"data/h3/test10/165_DBD.png","markedImage":"marked/h3/test10/165_DBD.png","translation":"### Thử thách Đi bộ Rock River lần thứ tư\n\n**Thứ Bảy, ngày 16 tháng 4, từ 9 giờ sáng đến 1 giờ chiều**\n\nỦy ban Giải trí Watertown mời bạn tham gia sự kiện thường niên do thành phố tổ chức nhằm thúc đẩy tinh thần cộng đồng và tôn vinh di sản Watertown. Sự kiện dành cho mọi lứa tuổi. Sau cuộc đi bộ chính là một buổi chiều vui chơi tại khu lễ hội Hạt Jefferson, với món ăn ngon, nhạc sống và đồ uống từ các nhà máy bia hàng đầu của bang. Các tình nguyện viên Quỹ Trẻ em Anne Witmer sẽ tổ chức trò chơi, hoạt động và cung cấp dịch vụ trông trẻ tại chỗ.\n\n### Cách tham gia\n\n- Đăng ký trước 9 giờ sáng trong ngày diễn ra sự kiện.\n- Phí 10 đô la cho cá nhân; 5 đô la cho người tham gia theo nhóm hoặc đội.\n- Trẻ dưới 12 tuổi được miễn phí.\n- Có giải tiền mặt cho cá nhân và nhóm về nhất.\n- Mười người hoặc đội đứng đầu nhận phiếu quà tặng từ doanh nghiệp địa phương.\n- **Mọi người tham gia đều nhận một áo phông kỷ niệm.**\n\nNgười muốn tổ chức đội qua doanh nghiệp, gia đình, trường học hoặc tổ chức khác cần **liên hệ điều phối viên chương trình Rachel Bocher trước ngày 16 tháng 4**. Mỗi đội sẽ nhận bộ tài liệu gồm hướng dẫn, biểu mẫu sức khỏe và tờ thông tin để phát cho thành viên.\n\n### Liên hệ\nRachel Bocher — rbocher@watertown_vt.org","translationStatus":"reviewed"},{"id":"h3/test10/168_ABCD.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 168–171","questions":{"168":"A","169":"B","170":"C","171":"D"},"image":"data/h3/test10/168_ABCD.png","markedImage":"marked/h3/test10/168_ABCD.png","translation":"### Cuối cùng cũng có hy vọng cho các nhà bán lẻ nhỏ trong khu vực!\n\n*Bài viết của Doris Bentley*\n\nTrong ngành bán lẻ cạnh tranh khốc liệt, doanh nhân ít kinh nghiệm khó thu lợi khi giá thuê cửa hàng vượt ngân sách. Nhưng các nhà bán lẻ địa phương không cần tìm đâu xa ngoài **Bradford Retail Cooperative**, dự án phát triển bất động sản sẽ khai trương ngày 1 tháng 3.\n\nHợp tác xã nằm trong tòa nhà Pullings cũ ở ngoại ô Bradford, trước đây do siêu thị Mega-B-Mart sử dụng. Phối hợp với chính quyền thành phố, Phoenix-Star Properties đã nâng cấp công trình thành nơi có 160 gian hàng nhỏ. Giám đốc Brenda Nixon cho biết tòa nhà từng trở nên xấu xí sau khi cửa hàng cũ phá sản; với khoản đầu tư tương đối nhỏ, công ty đã khôi phục nó thành một cơ sở vừa hữu ích cho cộng đồng vừa giúp cải thiện kinh tế địa phương.\n\nPhoenix-Star Properties cung cấp một nửa vốn cho việc thay đổi kết cấu; phần còn lại đến từ ngân sách phát triển thành phố được tài trợ bằng thuế địa phương. “Chúng tôi rất hào hứng với dự án và tin rằng nó sẽ thành công như **những dự án tương tự mà Phoenix-Star từng thực hiện tại các địa điểm bỏ trống khác trên cả nước**,” phát ngôn viên chính quyền Beatrice Guzman nói.\n\nCác gian bán lẻ dành cho nghệ nhân, tiểu thương và chủ doanh nghiệp tư nhân thuê, với giá từ 500 đô la mỗi tháng. Phoenix-Star xác nhận **90% diện tích đã có người thuê**. Hợp tác xã rõ ràng đã được doanh nhân địa phương đón nhận. **Tuy nhiên, vẫn còn phải chờ xem người mua sắm địa phương có yêu thích địa điểm này hay không.**","translationStatus":"reviewed"},{"id":"h3/test10/172_CBCD.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 172–175","questions":{"172":"C","173":"B","174":"C","175":"D"},"image":"data/h3/test10/172_CBCD.png","markedImage":"marked/h3/test10/172_CBCD.png","translation":"### Trò chuyện về Hội chợ Việc làm Thường niên Sacramento\n\n**Alison Cambie — 4:12 chiều**\nVừa kết thúc ngày đầu tiên tại Hội chợ Việc làm Thường niên Sacramento. Chỉ có ba người ở gian hàng công ty mà khách lại đông hơn khả năng phục vụ. Có ai giúp được ngày mai không? Chúng ta sẽ được trả thêm giờ.\n\n**Justin Bostwick — 4:15 chiều**\n**Tôi có thể đến hỗ trợ**, nhưng chỉ rảnh buổi sáng vì chiều có việc quan trọng.\n\n**Reena Kumar — 4:15 chiều**\nXin lỗi, tôi phải kiểm tra một công trường cho khách hàng. Có vẻ một vấn đề có thể làm chậm thời điểm khách hàng chuyển vào tòa nhà mới.\n\n**Angus O’Hara — 4:17 chiều**\nNgày mai tôi không có việc gì gấp. Tôi cần có mặt tại trung tâm hội nghị lúc mấy giờ?\n\n**Alison Cambie — 4:19 chiều**\nTôi hiểu, Reena, chúc cô may mắn! Cảm ơn hai anh đã tình nguyện. Trung tâm triển lãm mở cửa cho khách lúc 10 giờ; hãy đến sớm để giúp chuẩn bị.\n\n**Justin Bostwick — 4:20 chiều**\nTôi sẽ đến trước giờ khai mạc 30 phút.\n\n**Angus O’Hara — 4:21 chiều**\nCòn vé vào cửa giảm giá thì sao?\n\n**Alison Cambie — 4:22 chiều**\nỒ, cảm ơn đã nhắc. **Tôi sẽ để vé cho hai anh tại văn phòng hành chính gần lối vào chính.**","translationStatus":"reviewed"},{"id":"h3/test10/176_BBCDC.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 176–180","questions":{"176":"B","177":"B","178":"C","179":"D","180":"C"},"image":"data/h3/test10/176_BBCDC.png","markedImage":"marked/h3/test10/176_BBCDC.png","translation":"### E-mail thiết lập tài khoản nhân viên\n\n**Đến:** Janice Vespino  \n**Từ:** Mike Duff  \n**Ngày:** 3 tháng 2  \n**Chủ đề:** Thông tin tài khoản\n\nChào Janice,\n\nSau khi nhận danh sách nhân viên mới hôm qua, tôi đã tạo tên người dùng và mật khẩu. Trước khi hoàn tất các trang tài khoản cá nhân, tôi muốn xác nhận tên và chức danh sau: Peter Firth — Chuyên viên nhân sự; Margaret Wurst — Chuyên viên quản lý khách hàng; Leslie Yang — Trợ lý giám đốc tiếp thị; Fred Braxton — Chuyên viên nhân sự cấp cơ sở; Jamie Martinez — Thực tập sinh.\n\nChức danh phải chính xác vì nó quyết định quyền truy cập. Chẳng hạn, chuyên viên quản lý khách hàng có thể xem cơ sở dữ liệu e-mail khách hàng, còn thực tập sinh thì không. Sau khi nhận phản hồi, tôi có thể hoàn tất các trang trong vài giờ. Mỗi nhân viên sẽ đăng nhập bằng mật khẩu tạm thời gửi tới e-mail công ty, sau đó hệ thống sẽ **yêu cầu** họ đặt mật khẩu mới dài tám ký tự, gồm cả chữ và số.\n\nTrân trọng,  \nMike Duff\n\n---\n\n### Phản hồi của Janice Vespino\n\n**Ngày:** 4 tháng 2\n\nChào Mike,\n\nMọi chức danh đều chính xác. Vui lòng hoàn tất công việc và báo tôi khi các trang cá nhân hoạt động.\n\nAnh nói thực tập sinh thường không được truy cập cơ sở dữ liệu e-mail khách hàng. Tuy nhiên, tôi muốn có ngoại lệ: Jamie Martinez sẽ gửi rất nhiều e-mail cho khách hàng, nên sẽ hữu ích nếu cô ấy có đầy đủ thông tin liên hệ và xem được trao đổi trước đây. Tôi có thể yêu cầu cô ấy ký thỏa thuận bảo mật.\n\nNgoài ra, hãy bảo đảm các nhân viên mới có thể đăng nhập trang tài khoản bằng trình duyệt NetSurfer. **Trước đây chúng ta từng gặp lỗi không truy cập được trang tài khoản bằng trình duyệt này**, nhưng nó hiện được cài trên phần lớn máy tính văn phòng.\n\nCảm ơn anh,  \nJanice Vespino  \nGiám đốc Nhân sự","translationStatus":"reviewed"},{"id":"h3/test10/181_ABDDC.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 181–185","questions":{"181":"A","182":"B","183":"D","184":"D","185":"C"},"image":"data/h3/test10/181_ABDDC.png","markedImage":"marked/h3/test10/181_ABDDC.png","translation":"### Cửa hàng quà tặng mới tại Peckham đề cao chất lượng\n\nLondon Gifts khai trương ba tuần trước, bán sản phẩm của các nghệ sĩ, thợ thủ công và nhà xuất bản độc lập trên khắp cả nước. Cửa hàng chủ yếu kinh doanh sách, tác phẩm nghệ thuật và quần áo mang chủ đề Anh, thu hút cả người dân địa phương lẫn khách du lịch.\n\nPhần lớn hàng hóa hiện đến từ doanh nghiệp London, nhưng cửa hàng đã mở rộng sang Finlay Street Books ở Birmingham, Southern Clothing ở Southampton và nghệ sĩ John Stamp tại Manchester. Quản lý Stephanie Blanc dự định tăng thêm sự đa dạng. Bà cho biết các cửa hàng du lịch thường bán đồ sản xuất hàng loạt, còn London Gifts muốn bán những sản phẩm được thiết kế và chế tác đẹp, đủ chất lượng để khách giữ nhiều năm.\n\nLondon Gifts ở số 12 Goldsmith Road, **cách ga Queens Road mười phút đi bộ**, mở cửa thứ Hai đến thứ Bảy, từ 9 giờ sáng đến 8 giờ tối.\n\n---\n\n### E-mail đề xuất hợp tác\n\n**Đến:** Stephanie Blanc  \n**Từ:** Sarah Broadhurst <sarah@oceanside.co.uk>  \n**Chủ đề:** Đề xuất kinh doanh\n\nKính gửi cô Blanc,\n\nTôi điều hành Oceanside Woodworks, một doanh nghiệp nhỏ **đặt gần Southern Clothing ở Southampton**. Người quản lý công ty đó đã cho tôi địa chỉ e-mail của cô.\n\nChúng tôi sản xuất đế lót ly, tấm lót bàn và tác phẩm nghệ thuật; nhiều món phù hợp với hàng hóa cửa hàng cô đang bán. Đặc biệt, chúng tôi có dòng sản phẩm khắc hình nhân vật trong các tác phẩm văn học kinh điển của Anh. **Tôi đã đính kèm danh mục năm nay để cô xem sản phẩm và giá cả.**\n\nTôi đang tìm các nhà bán lẻ muốn bán sản phẩm chất lượng của chúng tôi và tin rằng sự hợp tác sẽ có lợi cho cả hai bên. Nếu cô quan tâm, **tôi sẵn lòng đến London vào tuần tới và mang theo một số mẫu để giới thiệu**. Vui lòng trả lời e-mail hoặc gọi 555-6366.\n\nTrân trọng,  \nSarah Broadhurst  \nChủ sở hữu, Oceanside Woodworks","translationStatus":"reviewed"},{"id":"h3/test10/186_CBBAD.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 186–190","questions":{"186":"C","187":"B","188":"B","189":"A","190":"D"},"image":"data/h3/test10/186_CBBAD.png","markedImage":"marked/h3/test10/186_CBBAD.png","translation":"### E-mail giao bài viết\n\n**Từ:** Casey Whitmore <caseywhitmore@planetvoyage.com>  \n**Đến:** Rica Foust  \n**Chủ đề:** Bài đánh giá\n\nChào Rica,\n\nTôi có một đề tài liên quan đến du lịch một mình, xu hướng đang ngày càng phổ biến. Để theo kịp xu hướng này, chúng tôi đang tập hợp các bài đánh giá về một hãng du thuyền có dịch vụ cho khách đi một mình cho số báo tiếp theo. **Cô có sẵn lòng nhận bài này không?** Chúng tôi sẽ chi trả mọi chi phí. Vì thời gian gấp, cô cần đặt chuyến sớm; bản thảo đầu tiên phải gửi trước ngày 13 tháng 8 để đăng trong số tháng 9.\n\nCasey Whitmore  \nQuản lý biên tập, Planet Voyage\n\n---\n\n### Seabird Ocean Liners — Chuyến ba đêm từ Los Angeles đến Baja\n\nKhách đi một mình có thể tận hưởng cabin rộng rãi, tiện nghi, không hút thuốc; hồ bơi và sàn thể thao. Phòng hạng sang có TV hàng trăm kênh, máy tính kết nối Wi‑Fi, vòi sen riêng và bàn trang điểm. Giá phòng đơn từ 437 đô la.\n\nCác ngày khởi hành: 3, 7, 13, 16 và 22 tháng 8. Có thể **nhấp vào ngày để đặt chỗ trực tuyến**.\n\n---\n\n### Tạp chí Planet Voyage — Số tháng 9\n\n## Du lịch một mình: Seabird Ocean Liners\n\n*Bài viết của Rica Foust*\n\nTôi đặt chuyến ba đêm từ Los Angeles đến Baja và thấy trải nghiệm hoàn toàn xứng đáng. Phòng hiện đại, tiện nghi và rộng rãi so với tàu du lịch. Dịch vụ dọn phòng **xuất sắc**, phòng luôn sạch sẽ.\n\nDù nhỏ hơn một số tàu khác, tàu có hồ bơi, nhà hàng và sàn giải trí. Nhờ kích thước vừa phải, tôi dễ dàng nhận được sự hỗ trợ của thủy thủ đoàn và làm quen với hành khách khác. Tôi đã kết thêm nhiều bạn. Nếu bạn ít giao tiếp, thủy thủ đoàn cũng tổ chức hoạt động giúp mọi người thoải mái với nhau. Dù muốn tận hưởng thời gian riêng hay gặp người mới, bạn đều có thể hài lòng. Khung cảnh Baja tuyệt đẹp khiến đây là chuyến đi tôi sẽ nhớ nhiều năm.","translationStatus":"reviewed"},{"id":"h3/test10/191_ACCBD.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 191–195","questions":{"191":"A","192":"C","193":"C","194":"B","195":"D"},"image":"data/h3/test10/191_ACCBD.png","markedImage":"marked/h3/test10/191_ACCBD.png","translation":"### Quảng cáo Flash-805 của Brilliant Techware\n\n**Chỉ hôm nay — giảm 40%**\n\nMáy ghi âm Flash-805 có micrô tích hợp thu và tái tạo âm thanh trung thực. Công nghệ phân tích dạng sóng được cấp bằng sáng chế tự động giảm méo và loại bỏ tiếng ồn không mong muốn như giao thông hay trò chuyện nền. Pin có thời lượng dài hơn 50% so với mẫu trước. Đây là công cụ linh hoạt cho sinh viên, nhà nghiên cứu và chuyên gia.\n\nBrilliant Techware miễn phí giao hàng cho đơn từ 40 đô la, trừ hàng khuyến mại. Đơn dưới 40 đô la có phí 5 đô la trong Bắc Mỹ và 10 đô la tới phần lớn nơi khác; giao nhanh có phụ phí 5 đô la.\n\n---\n\n### Đơn hàng số 7891000\n\n**Khách hàng:** Chris Altman, Bournemouth  \n**Ngày:** 17 tháng 10, 11 giờ 23 sáng\n\n- Flash-805: 145 đô la\n- Giảm 40%: −58 đô la\n- Tạm tính: 87 đô la\n- Vận chuyển: 10 đô la\n- **Phụ phí giao nhanh: 5 đô la**\n- Tổng cộng: 102 đô la\n\nMỗi mặt hàng chỉ được giảm giá một lần. Đơn được gửi sau 3–4 ngày làm việc; có thể hủy trong vòng 24 giờ. Khách chịu thuế hải quan.\n\n---\n\n### E-mail hỏi về việc thay đổi đơn hàng\n\n**Đến:** service@brillianttechware.com  \n**Từ:** caltman@ukmail.com  \n**Ngày:** Thứ Năm, 17 tháng 10\n\nSáng nay tôi đặt một máy Flash-805 trên trang web, đơn số 7891000. Đồng nghiệp tôi cũng muốn mua vì mức giá thấp nhất cô ấy tìm thấy trên mạng và **cô ấy bị thu hút bởi tính năng giảm độ méo âm thanh**. Tôi muốn hỏi có thể thêm máy của cô ấy vào đơn hiện tại không và có phát sinh phí không. Chúng tôi muốn tiết kiệm phí vận chuyển; nếu không được, bạn tôi sẽ tự đặt hàng. Mong nhận phản hồi hôm nay để cô ấy kịp hưởng ưu đãi.\n\nTrân trọng,  \nChris Altman","translationStatus":"reviewed"},{"id":"h3/test10/196_BACBC.png","folder":"h3/test10","book":"h3","bookLabel":"Hacker 3","test":"test10","testLabel":"Test 10","title":"Hacker 3 · Test 10 · Câu 196–200","questions":{"196":"B","197":"A","198":"C","199":"B","200":"C"},"image":"data/h3/test10/196_BACBC.png","markedImage":"marked/h3/test10/196_BACBC.png","translation":"### Cuộc thi “Đặt tên cho bánh mì của chúng tôi” của O-Deli’s\n\nO-Deli’s sẽ ra mắt món bánh mì mới ngày 1 tháng 2: bánh mì lúa mạch đen nướng, gà tây quay, sốt cay, phô mai cheddar chảy, xà lách và hành tươi. Khách có thể đến **bất kỳ một trong 16 chi nhánh tại bang New York**, nếm thử, đặt tên và nộp đơn.\n\nNgười thắng nhận 1.000 đô la. Cả ba người vào chung kết nhận phiếu ăn bánh mì miễn phí hằng tuần trong một năm. Mọi người nộp đơn còn được **phiếu đồ uống cỡ vừa miễn phí**.\n\n---\n\n### Đơn dự thi của Cheryl Posen\n\n**Ngày nộp:** 18 tháng 2  \n**Cửa hàng:** Đại lộ 45, Thành phố New York\n\n“Chiếc bánh mì thú vị này vừa cay vừa tươi, rất hợp cho bữa trưa. Phô mai đậm vị bổ sung cho thịt và mức giá 4,89 đô la rất đáng tiền.”\n\n**Tên đề xuất:** Hot Red Turkey Sandwich\n\nBa người vào chung kết sẽ nhận tin nhắn và lời mời đến sự kiện quảng bá ngày 28 tháng 2, nơi công bố người thắng.\n\n---\n\n### Tin nhắn gửi ba người vào chung kết\n\n**Từ:** O-Deli’s  \n**Đến:** Ray Colsen, Amos Vaughn và Fiona Henry\n\nChào các bạn! Cảm ơn mọi người đã xác nhận tham dự. Chúng tôi dự định tổ chức tại chi nhánh Đường 59, nhưng **chi nhánh này đang gặp sự cố điện**, nên sẽ chuyển sang chi nhánh Đại lộ 45. Vui lòng xác nhận sớm xem bạn vẫn tham dự được không. Nếu cần hỗ trợ di chuyển đến địa điểm mới, hãy báo để chúng tôi sắp xếp. Chúng tôi xin lỗi vì sự bất tiện và mong được gặp mọi người.","translationStatus":"reviewed"}]};
    const state = {
      deck: [], index: 0, checked: false,
      correct: 0, wrong: 0, wrongIds: new Set(), translationVisible: false
    };
    const $ = (id) => document.getElementById(id);
    const shuffle = (items) => {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };
    function setupFilters() {
      const books = [...new Map(
        DATA.items.map(item => [item.book, item.bookLabel])
      ).entries()].sort((a, b) => a[1].localeCompare(b[1], undefined, {numeric: true}));
      $("book").innerHTML = '<option value="*">Tất cả sách</option>' +
        books.map(([value, label]) =>
          `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`
        ).join("");
      $("book").onchange = () => {
        setupTests();
        start();
      };
      $("test").onchange = start;
      $("mode").onchange = () => {
        if ($("mode").value === "answers" && state.deck.length) {
          state.checked = false;
          render();
          return;
        }
        start();
      };
      setupTests();
    }
    function setupTests() {
      const selectedBook = $("book").value;
      const tests = [...new Map(
        DATA.items
          .filter(item => selectedBook === "*" || item.book === selectedBook)
          .map(item => [item.test, item.testLabel])
      ).entries()].sort((a, b) => a[1].localeCompare(b[1], undefined, {numeric: true}));
      $("test").innerHTML = '<option value="*">Tất cả test</option>' +
        tests.map(([value, label]) =>
          `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`
        ).join("");
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => (
        {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]
      ));
    }
    function start() {
      const book = $("book").value;
      const test = $("test").value;
      const mode = $("mode").value;
      let deck = DATA.items.filter(item =>
        (book === "*" || item.book === book) &&
        (test === "*" || item.test === test)
      );
      if (mode === "wrong") deck = deck.filter(item => state.wrongIds.has(item.id));
      if (mode === "random") deck = shuffle(deck);
      state.deck = deck;
      state.index = 0;
      state.checked = false;
      state.translationVisible = mode === "answers";
      render();
    }
    function render() {
      const item = state.deck[state.index];
      $("counter").textContent = item ? `Bộ ${state.index + 1} / ${state.deck.length}` : "Không có bài phù hợp";
      if (!item) {
        $("imagePanel").innerHTML = '<div class="empty">Hãy chọn folder hoặc làm sai một bài để dùng chế độ “Ôn câu sai”.</div>';
        $("answerPanel").innerHTML = '<div class="empty">Chưa có câu hỏi.</div>';
        return;
      }
      const imageSource = $("mode").value === "answers"
        ? item.markedImage || item.image
        : item.image;
      $("imagePanel").innerHTML = `
        <img src="${imageSource}" alt="${escapeHtml(item.title)}">
        ${renderTranslation(item)}`;
      const translationButton = $("translationButton");
      if (translationButton) translationButton.onclick = toggleTranslation;
      const questions = Object.keys(item.questions).sort((a, b) =>
        a.localeCompare(b, undefined, {numeric: true})
      );
      $("answerPanel").innerHTML = `
        <h1>${escapeHtml(item.title)}</h1>
        <form id="quizForm" class="quiz-form">
          ${questions.map(number => `
            <div class="question" data-question="${escapeHtml(number)}">
              <div class="question-head">
                <div class="question-title">Câu ${escapeHtml(number)}</div>
                <div class="question-status" aria-live="polite"></div>
              </div>
              <div class="choices">
                ${["A","B","C","D"].map(choice => `
                  <label class="choice" data-choice="${choice}">
                    <input type="radio" name="q-${escapeHtml(number)}" value="${choice}">
                    <span>${choice}</span>
                  </label>`).join("")}
              </div>
            </div>`).join("")}
        </form>
        <div class="result" id="result"></div>
        <div class="actions">
          <button class="button" id="prevButton">← Trước</button>
          <button class="button" id="nextButton">Tiếp →</button>
          <button class="button primary" id="checkButton">Chấm đáp án</button>
        </div>`;
      $("prevButton").disabled = state.index === 0;
      $("nextButton").disabled = state.index === state.deck.length - 1;
      $("prevButton").onclick = () => navigate(-1);
      $("nextButton").onclick = () => navigate(1);
      $("checkButton").onclick = checkAnswers;
      if ($("mode").value === "answers") revealAnswers(item);
    }
    function navigate(offset) {
      state.index += offset;
      state.checked = false;
      state.translationVisible = $("mode").value === "answers";
      render();
      window.scrollTo({top: 0, behavior: "smooth"});
    }
    function revealAnswers(item) {
      let gradedCount = 0;
      let ungradedCount = 0;
      for (const [number, correctAnswer] of Object.entries(item.questions)) {
        const row = document.querySelector(`[data-question="${CSS.escape(number)}"]`);
        const status = row.querySelector(".question-status");
        if (correctAnswer === "X") {
          ungradedCount++;
          row.classList.add("ungraded");
          status.classList.add("ungraded");
          status.textContent = "— Chưa có đáp án";
        } else {
          gradedCount++;
          const correctChoice = row.querySelector(`[data-choice="${correctAnswer}"]`);
          correctChoice.classList.add("correct");
          correctChoice.querySelector("input").checked = true;
          status.classList.add("correct");
          status.textContent = `Đáp án ${correctAnswer}`;
        }
        row.querySelectorAll("input").forEach(input => input.disabled = true);
      }
      $("checkButton").disabled = true;
      $("checkButton").textContent = "Đang hiện đáp án";
      const suffix = ungradedCount ? ` ${ungradedCount} câu chưa có đáp án chính thức.` : "";
      $("result").textContent = gradedCount
        ? `Đáp án đúng được tô xanh.${suffix}`
        : `Bộ này chưa có đáp án chính thức.${suffix}`;
    }
    function checkAnswers() {
      if (state.checked) return;
      const item = state.deck[state.index];
      let missingGraded = 0;
      const results = [];
      for (const [number, correctAnswer] of Object.entries(item.questions)) {
        const selected = document.querySelector(`input[name="q-${CSS.escape(number)}"]:checked`);
        if (!selected && correctAnswer !== "X") missingGraded++;
        results.push({number, selected: selected?.value, correctAnswer});
      }
      if (missingGraded) {
        $("result").textContent = `Bạn còn ${missingGraded} câu có đáp án chưa chọn.`;
        return;
      }
      state.checked = true;
      state.translationVisible = true;
      let itemHasError = false;
      let gradedCount = 0;
      let ungradedCount = 0;
      for (const result of results) {
        const row = document.querySelector(`[data-question="${CSS.escape(result.number)}"]`);
        const status = row.querySelector(".question-status");
        if (result.correctAnswer === "X") {
          ungradedCount++;
          row.classList.add("ungraded");
          status.classList.add("ungraded");
          status.textContent = "— Không tính điểm";
          row.querySelectorAll("input").forEach(input => input.disabled = true);
          continue;
        }
        gradedCount++;
        if (result.selected === result.correctAnswer) {
          state.correct++;
          row.querySelector(`[data-choice="${result.correctAnswer}"]`).classList.add("correct");
          status.classList.add("correct");
          status.textContent = "✓ Đúng";
        } else {
          state.wrong++;
          itemHasError = true;
          row.querySelector(`[data-choice="${result.selected}"]`).classList.add("wrong");
          row.querySelector(`[data-choice="${result.correctAnswer}"]`).classList.add("correct");
          status.classList.add("wrong");
          status.textContent = `✕ Sai · Đáp án ${result.correctAnswer}`;
        }
        row.querySelectorAll("input").forEach(input => input.disabled = true);
      }
      if (itemHasError) state.wrongIds.add(item.id);
      else state.wrongIds.delete(item.id);
      const suffix = ungradedCount ? ` ${ungradedCount} câu X không tính điểm.` : "";
      if (!gradedCount) {
        $("result").textContent = `Bộ này chưa có đáp án chính thức.${suffix}`;
      } else {
        $("result").textContent = (
          itemHasError
            ? "Có câu chưa đúng — đáp án đúng đã được tô xanh."
            : "Chính xác tất cả!"
        ) + suffix;
      }
      updateScore();
      renderTranslationPanel(item);
    }
    function renderInlineMarkdown(value) {
      return escapeHtml(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }
    function renderTranslation(item) {
      if (!item.translation) return "";
      const visible = state.translationVisible || $("mode").value === "answers";
      const note = item.translationStatus === "reviewed"
        ? "Đã hiệu đính"
        : "Bản dịch tự động · Có thể cần hiệu đính";
      const answers = Object.entries(item.questions)
        .map(([number, answer]) => `${escapeHtml(number)} ${escapeHtml(answer)}`)
        .join(", ");
      return `
        <div class="translation-actions">
          <button class="button" id="translationButton" type="button">
            ${visible ? "Ẩn bản dịch" : "Xem bản dịch tiếng Việt"}
          </button>
        </div>
        <section class="translation-panel" id="translationPanel" ${visible ? "" : "hidden"}>
          <div class="translation-head">
            <h2 class="translation-title">Bản dịch tiếng Việt</h2>
            <span class="translation-note">${escapeHtml(note)}</span>
          </div>
          <div class="translation-text">${renderInlineMarkdown(item.translation)}</div>
          <div class="translation-answers">Đáp án: <strong>${answers}</strong>.</div>
        </section>`;
    }
    function toggleTranslation() {
      state.translationVisible = !state.translationVisible;
      const panel = $("translationPanel");
      const button = $("translationButton");
      if (!panel || !button) return;
      panel.hidden = !state.translationVisible;
      button.textContent = state.translationVisible
        ? "Ẩn bản dịch"
        : "Xem bản dịch tiếng Việt";
    }
    function renderTranslationPanel(item) {
      const panel = $("translationPanel");
      const button = $("translationButton");
      if (!item.translation || !panel || !button) return;
      panel.hidden = false;
      button.textContent = "Ẩn bản dịch";
    }
    function updateScore() {
      const total = state.correct + state.wrong;
      $("correctScore").textContent = state.correct;
      $("wrongScore").textContent = state.wrong;
      $("percentScore").textContent = total ? `${Math.round(state.correct / total * 100)}%` : "0%";
    }
    $("startButton").onclick = start;
    $("resetButton").onclick = () => {
      state.correct = 0;
      state.wrong = 0;
      state.wrongIds.clear();
      updateScore();
      start();
    };
    setupFilters();
    start();
  </script>
</body>
</html>
