"markedImage":"marked/h3/test02/139_CBBD.png","translation":"### Các lựa chọn giao thông công cộng mới sắp được triển khai\n\nHôm qua, Hội đồng Thành phố đã **biểu quyết** thông qua đề xuất kéo dài tuyến tàu điện ngầm đến khu Gloistrup của Copenhagen. **Dân số khu vực này đã tăng do giá bất động sản thấp.** Điều này khuyến khích các nhà phát triển xây thêm nhiều căn hộ tại đây. Hơn nữa, việc thành lập Công viên Công nghệ Albertislund gần đó đã tạo ra hàng nghìn việc làm mới. Những cơ hội **việc làm** này là yếu tố then chốt thu hút thêm nhiều người đến khu vực. Tuy nhiên, kể từ khi quá trình phát triển bắt đầu, nó **đã đẩy** năng lực giao thông của khu vực đến giới hạn, khiến người dân và doanh nghiệp địa phương vận động cho việc kéo dài tuyến tàu điện ngầm.\n\nMột số thành viên hội đồng phản đối đề xuất vì chi phí xây dựng giao thông ngầm quá cao. Dù vậy, dự án kéo dài tuyến tàu điện ngầm vẫn sẽ được tiến hành, với chi phí ước tính 650 triệu euro và dự kiến đi vào hoạt động trong vòng năm năm.","translationStatus":"reviewed"},{"id":"h3/test02/143_BACD.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 143–146","questions":{"143":"B","144":"A","145":"C","146":"D"},"image":"data/h3/test02/143_BACD.png","markedImage":"marked/h3/test02/143_BACD.png","translation":"### Bản ghi nhớ về sự kiện khách VIP\n\n**Đến:** Toàn thể nhân viên  \n**Từ:** Louise Nixon, Giám đốc vận hành  \n**Chủ đề:** Sự kiện khách VIP  \n**Ngày:** 6 tháng 9\n\nChúng ta đã xác nhận đặt phòng cho hơn 200 khách từ ngày 27 đến ngày 30 tháng 9. Nhiều người trong số **họ** là nhân vật quan trọng đến từ các tổ chức uy tín và mong đợi dịch vụ ở tiêu chuẩn cao.\n\nHọ sẽ là nhóm khách duy nhất của khách sạn trong toàn bộ bốn ngày. Vì lý do riêng tư, mọi người phải hợp tác với các yêu cầu từ nhân viên an ninh của họ và **không được** thảo luận về sự kiện bên ngoài khách sạn.\n\n**Hợp đồng quy định các bữa ăn của họ phải được cung cấp miễn phí.** Chúng ta cũng đã đồng ý cho khách sử dụng miễn phí spa, phòng tập thể dục và trung tâm dịch vụ doanh nhân. **Mặt khác**, họ vẫn phải thanh toán nếu gọi dịch vụ phòng hoặc thực hiện cuộc gọi đường dài.","translationStatus":"reviewed"},{"id":"h3/test02/147_BD.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 147–148","questions":{"147":"B","148":"D"},"image":"data/h3/test02/147_BD.png","markedImage":"marked/h3/test02/147_BD.png","translation":"### Thư gửi Tallahassee Bike Works\n\nMartin Bailey  \nTallahassee Bike Works  \n1105 Old Bainbridge Road  \nTallahassee, FL 32308\n\nKính gửi ông Bailey,\n\nKhoảng một tháng trước, ông đã liên hệ với công ty chúng tôi để hỏi về tài liệu giới thiệu các bộ phận xe đạp mới nhất. Khi đó, chúng tôi đang chỉnh sửa danh mục sản phẩm và tôi đã nói sẽ gửi tài liệu giới thiệu cùng phiếu đặt hàng sau khi hoàn tất các thay đổi. Tôi vui mừng thông báo rằng tập tài liệu mới đã được in trong tuần này và **một bản được gửi kèm theo thư**.\n\nChúng tôi rất trân trọng sự quan tâm của ông đối với hàng hóa của mình cũng như những lần mua trước đây cho cửa hàng, và mong tiếp tục hợp tác trong năm tới. Nếu có thắc mắc về bất kỳ bộ phận nào, xin đừng ngần ngại liên hệ với tôi. Chúng tôi cũng sẵn sàng trao đổi mức giá dành cho đơn hàng số lượng lớn hoặc các thỏa thuận dài hạn.\n\nTrân trọng,\n\nCatherine Jenkins  \nShipson Bicycle Parts","translationStatus":"reviewed"},{"id":"h3/test02/149_DC.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 149–150","questions":{"149":"D","150":"C"},"image":"data/h3/test02/149_DC.png","markedImage":"marked/h3/test02/149_DC.png","translation":"### Thông báo của Thị trấn Shakersfield\n\nNhằm cung cấp dịch vụ nhanh chóng cho khu vực Shakersfield, công tác sửa chữa đường sẽ được tiến hành quanh Ga Shakersfield vào tuần tới. Công việc bắt đầu lúc 7 giờ sáng Chủ nhật, ngày 12 tháng 5 và kết thúc vào cuối buổi sáng thứ Hai, ngày 20 tháng 5. Văn phòng Công trình Công cộng xin lỗi trước về mọi tiếng ồn phát sinh trong quá trình thi công.\n\nĐoạn đường chính của thị trấn bị ảnh hưởng nằm giữa đường Mayfield và đường Morton. Các khu vực địa phương sau cũng có thể chịu ảnh hưởng:\n\n- Đường Oakwood đến đường Morton\n- **Lối đi bộ dẫn đến quảng trường Granderry**\n- Tuyến 39 về phía nam đến New Hammersworth\n\nNếu có câu hỏi hoặc thắc mắc về thông báo này, vui lòng liên hệ Mary Newton, cán bộ cấp cao của Văn phòng Công trình Công cộng, theo số 555-3344 hoặc e-mail m_newton@shakersfield.gov.","translationStatus":"reviewed"},{"id":"h3/test02/151_BA.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 151–152","questions":{"151":"B","152":"A"},"image":"data/h3/test02/151_BA.png","markedImage":"marked/h3/test02/151_BA.png","translation":"### E-mail về đơn đặt may riêng\n\n**Người gửi:** Pierre Grenier  \n**Người nhận:** Elizabeth Monaco  \n**Chủ đề:** Đơn đặt hàng riêng  \n**Ngày:** 12 tháng 7\n\nKính gửi cô Monaco,\n\nTôi xin thông báo rằng chúng tôi đã hoàn thành chiếc váy của cô. Cụ thể, gấu váy đã được rút ngắn bốn centimet đúng như cô yêu cầu, vì cô cho biết mình sẽ không đi giày cao gót.\n\nChúng tôi mở cửa đến 6 giờ tối vào thứ Sáu và nghỉ cuối tuần, vì vậy xin cô **đến nhận váy trong tuần này**. Chúng tôi cũng khuyến khích cô thử váy lần cuối để chắc chắn mọi thứ đều vừa vặn như mong muốn.\n\nXin cô thanh toán toàn bộ số tiền trong lần tới ghé cửa hàng. Chi tiết như sau:\n\n- 7 mét lụa gấm đỏ: 580 đô la\n- Thiết kế váy riêng: 200 đô la\n- Nhân công (may, thử và chỉnh sửa): 400 đô la\n- Tạm tính: 1.180 đô la\n- Thuế bán hàng 10%: 118 đô la\n- **Tổng tiền phải trả: 1.298 đô la**\n\nMột lần nữa, cảm ơn cô đã tin tưởng. Tôi chắc rằng cô sẽ rất đẹp trong chiếc váy tại lễ trao giải của công ty luật vào tối thứ Bảy này.\n\nTrân trọng,\n\nPierre Grenier  \nGrenier Custom Fashions","translationStatus":"reviewed"},{"id":"h3/test02/153_CD.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 153–154","questions":{"153":"C","154":"D"},"image":"data/h3/test02/153_CD.png","markedImage":"marked/h3/test02/153_CD.png","translation":"### Chuỗi tin nhắn về việc cập nhật trang web\n\n**Fumiko Nakamura — 10:50 sáng:** Philip, tôi sắp lên máy bay và sẽ đến Boston vào chiều nay. Mọi việc thế nào rồi?\n\n**Philip Akkarat — 10:55 sáng:** Phần lớn đều ổn. Tuy nhiên, đã xảy ra một vài lỗi hệ thống trên các máy chủ mới mà chúng ta đang dùng để cập nhật trang web. Tôi đã gọi kỹ thuật viên và anh ấy đến vào khoảng 8 giờ sáng nay.\n\n**Fumiko Nakamura — 10:58 sáng:** Anh ấy đã khắc phục được vấn đề chưa?\n\n**Philip Akkarat — 10:59 sáng:** Anh ấy nói vấn đề phức tạp hơn dự kiến ban đầu. Anh ấy có một công việc khác lúc 10 giờ sáng, nên nói rằng **sẽ quay lại lúc 2 giờ chiều để hoàn tất**.\n\n**Fumiko Nakamura — 11:02 sáng:** Các bản cập nhật phải hoàn thành trước 4 giờ chiều. Tại sao lúc này anh không yêu cầu nhân viên dùng lại các máy chủ cũ?\n\n**Philip Akkarat — 11:03 sáng:** Được rồi. Cách đó sẽ mất nhiều thời gian hơn, nên có lẽ chúng ta nên bắt đầu ngay để hoàn thành đúng hạn.\n\n**Fumiko Nakamura — 11:05 sáng:** Tốt. Tôi sẽ gặp anh sau vài giờ nữa.","translationStatus":"reviewed"},{"id":"h3/test02/155_CDB.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 155–157","questions":{"155":"C","156":"D","157":"B"},"image":"data/h3/test02/155_CDB.png","markedImage":"marked/h3/test02/155_CDB.png","translation":"### Sân trượt băng Pendleton\n\nNhân viên Sân trượt băng Pendleton mong muốn mọi người có một trải nghiệm an toàn và thú vị. Vì vậy, chúng tôi yêu cầu khách tham quan tuân thủ các quy định sau:\n\n- Không chơi gậy hoặc bóng khúc côn cầu ngoài khu vực sân băng.\n- Không mang thức ăn hoặc đồ uống lên sân băng hay vào phòng thay đồ.\n- Không ai được lên sân băng nếu không mang giày trượt.\n- Không được đưa động vật vào sân băng hoặc các cơ sở của nhà thi đấu.\n- Mọi người phải liên tục di chuyển khi ở trên sân băng.\n- Khách có thể thuê giày trượt hoặc mang giày của mình.\n- Mọi người phải nghe hướng dẫn của nhân viên sân băng và làm theo.\n\nNhân viên đã qua đào tạo luôn trượt trên sân. Họ rất dễ nhận biết vì mặc áo khoác xanh có dòng chữ “Pendleton Ice Rink”. Nếu có câu hỏi hoặc thắc mắc, xin hãy trao đổi với họ.\n\nSân trượt băng Pendleton mở cửa hằng ngày từ ngày 10 tháng 11 đến ngày 1 tháng 3, trừ các ngày lễ quốc gia. Giờ hoạt động là 10 giờ sáng–8 giờ tối từ thứ Hai đến thứ Sáu và 10 giờ sáng–9 giờ tối vào thứ Bảy và Chủ nhật. Nếu muốn đăng ký một trong các lớp trượt băng hằng tuần do huấn luyện viên chuyên nghiệp giảng dạy, **hãy hỏi nhân viên tại quầy thông tin hoặc phòng vé**.","translationStatus":"reviewed"},{"id":"h3/test02/158_BAC.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 158–160","questions":{"158":"B","159":"A","160":"C"},"image":"data/h3/test02/158_BAC.png","markedImage":"marked/h3/test02/158_BAC.png","translation":"### Đổi đồ cũ lấy tiền mặt!\n\nNhà bạn có đầy những món đồ không còn cần hoặc không còn sử dụng? Có thể đó là quần áo từ vài cỡ trước, hoặc những chiếc đĩa cũ bà bạn để lại vẫn nằm im trong hộp. Hãy mang tất cả đến cửa hàng đồ cũ Bargain-Bin gần nhất; chúng tôi sẽ trả tiền cho những món đồ cũ của bạn!\n\nBargain-Bin có hai chi nhánh tại Beauville: 6254 Leonardo Crescent và 137 Mount Theresa Avenue. Nhân viên thân thiện của chúng tôi sẽ lập tức cho bạn biết món đồ có giá trị với cửa hàng hay không, rồi trả bằng tiền mặt hoặc tín dụng mua hàng. Đơn giản chỉ có vậy!\n\nBạn không chỉ nhận được tiền từ đồ cũ mà còn có thể tìm thấy nhiều món đồ đã qua sử dụng với giá hấp dẫn tại cả hai cửa hàng. Chúng tôi có rất nhiều quần áo, đồ gia dụng, đồ cổ, đồ sưu tầm, nội thất nhà ở và văn phòng. Hơn nữa, mọi thứ trong cửa hàng chỉ có giá bằng một phần nhỏ so với đồ mới. **Mỗi ngày đều có những mặt hàng khác nhau được chuyển đến**, nên bạn sẽ không bao giờ biết mình có thể tìm thấy kho báu gì.\n\nQuan trọng nhất, khách hàng cảm thấy vui khi biết rằng **20% toàn bộ lợi nhuận của chúng tôi được trao cho các nhóm thanh thiếu niên địa phương**. Hãy ghé Bargain-Bin ngay hôm nay để kiếm tiền, tìm những món hời tuyệt vời và góp phần vào sự phát triển cũng như giáo dục của thanh thiếu niên Beauville. Muốn biết thêm chi tiết, hãy gọi 555-3009.","translationStatus":"reviewed"},{"id":"h3/test02/161_CDC.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 161–163","questions":{"161":"C","162":"D","163":"C"},"image":"data/h3/test02/161_CDC.png","markedImage":"marked/h3/test02/161_CDC.png","translation":"### Tuyển thành viên cho dàn hợp xướng địa phương\n\nDàn hợp xướng cộng đồng Winfield sẽ tổ chức buổi thử giọng mở cho thành viên mới vào ngày 17 tháng 1, từ 6 giờ tối đến 9 giờ tối tại Centennial Hall, nằm gần phố Elm ở trung tâm Winfield. Chúng tôi tuyển cả nam lẫn nữ với mọi loại giọng, gồm giọng trầm, nam cao, nữ trầm và nữ cao.\n\nNgười thử giọng phải ít nhất 18 tuổi, sống tại Winfield và có khả năng đọc nhạc hoặc sẵn sàng học. Kinh nghiệm hát hợp xướng trước đây được đánh giá cao nhưng không bắt buộc. Chúng tôi sẽ đánh giá khả năng hát đúng nốt, đúng nhịp và đúng giai điệu của các bài thử giọng.\n\nChúng tôi cũng mong người biểu diễn thể hiện sự chuyên nghiệp và có biểu cảm khuôn mặt phù hợp để truyền tải cảm xúc. Trong các buổi hòa nhạc, họ còn phải học lời bài hát bằng nhiều ngôn ngữ, gồm tiếng Ý, tiếng Đức và tiếng Pháp.\n\nMọi người tham gia thử giọng sẽ nhận thông báo vào ngày 19 tháng 1 về việc có được chấp nhận hay không. Thành viên mới cần nhớ rằng dàn hợp xướng là một tổ chức cộng đồng gồm các tình nguyện viên và họ sẽ không nhận thù lao. **Họ cũng có trách nhiệm tự mua đồng phục; thông tin chi tiết sẽ được cung cấp sau.**\n\nHãy cùng những người yêu âm nhạc tận hưởng niềm vui và tham gia thật nhiều buổi biểu diễn hấp dẫn!","translationStatus":"reviewed"},{"id":"h3/test02/164_DDCB.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 164–167","questions":{"164":"D","165":"D","166":"C","167":"B"},"image":"data/h3/test02/164_DDCB.png","markedImage":"marked/h3/test02/164_DDCB.png","translation":"### Thảo luận trực tuyến về tiến độ dự án phần mềm\n\n**Gloria Arden — 8:20 sáng:** Tôi đã xem báo cáo tiến độ của mọi người về dự án phần mềm. Dựa trên những gì thấy được, tôi không nghĩ chúng ta có thể hoàn thành đúng ngày phát hành đã định.\n\n**Isabel Cabrera — 8:22 sáng:** Có lẽ cô nói đúng. **Kể từ khi Bob và Carol chuyển sang dự án phần cứng mới, chúng ta đã gặp khó khăn trong việc đáp ứng các thời hạn ban đầu.**\n\n**Gordon Brickyard — 8:26 sáng:** Chúng ta không thể dời lịch phát hành sao? Lùi lại một tháng chắc sẽ đủ thời gian để hoàn thành.\n\n**Joe Freemont — 8:28 sáng:** Nhưng hãy nhớ sản phẩm phải có mặt vào mùa lễ hội, thời điểm doanh số đạt đỉnh. Nếu lỡ thời hạn đó, chúng ta có thể mất nhiều khách hàng tiềm năng.\n\n**Gordon Brickyard — 8:31 sáng:** Nhóm của tôi có nhiều nhiệm vụ khẩn cấp, nên tôi nghĩ thuê một số nhà thầu độc lập hỗ trợ sẽ là ý hay.\n\n**Gloria Arden — 8:32 sáng:** Anh đang nghĩ đến phương án cụ thể nào?\n\n**Gordon Brickyard — 8:33 sáng:** Trước hết, họ có thể giúp nhóm tôi hoàn thành việc viết hướng dẫn sử dụng. Họ cũng có thể hỗ trợ kiểm thử sản phẩm.\n\n**Gloria Arden — 8:35 sáng:** Tôi hiểu. Isabel, cô thấy sao?\n\n**Isabel Cabrera — 8:37 sáng:** Có thể sẽ khá tốn kém, nhưng tôi thích ý tưởng đó. Các nhà thiết kế đồ họa của chúng ta chắc chắn cần thêm sự hỗ trợ từ bên ngoài.\n\n**Gloria Arden — 8:40 sáng:** Có vẻ chúng ta nên làm theo ý tưởng của Gordon. Tôi cũng sẽ đưa vấn đề này ra trong cuộc họp hội đồng quản trị vào thứ Sáu để biết ý kiến của họ.","translationStatus":"reviewed"},{"id":"h3/test02/168_CBBA.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 168–171","questions":{"168":"C","169":"B","170":"B","171":"A"},"image":"data/h3/test02/168_CBBA.png","markedImage":"marked/h3/test02/168_CBBA.png","translation":"### Thành phố Barriston công bố dự án phát triển mới\n\n*Tác giả: Wendy Ogilvy*\n\nỦy ban Quy hoạch Thành phố Barriston hôm thứ Năm tuần trước đã công bố kế hoạch bắt đầu cải tạo khu nghệ thuật trên đại lộ Chestnut. Khu vực này từ lâu được xem là trung tâm nghệ thuật của Barriston nhưng nay đã xuống cấp. Dự án gồm mở rộng vỉa hè, lát lại đường và xây dựng một công viên trong khu vực. Ngoài ra, hai bảng thông tin hiển thị bản đồ khu vực sẽ được lắp đặt dọc tuyến đường để phục vụ khách tham quan.\n\nĐiểm nổi bật của dự án là một sân khấu ngoài trời mới tại góc đại lộ Chestnut. Sân khấu do kiến trúc sư địa phương Theresa Vergara thiết kế, được dùng cho các buổi hòa nhạc và biểu diễn sân khấu, với chỗ ngồi ngoài trời cho tối đa 500 người.\n\nMột phần ngân sách của chính quyền thành phố đã được phân bổ cho việc phục hồi các tòa nhà dọc đại lộ Chestnut. Thanh tra sẽ đánh giá các công trình để xác định những hạng mục cần thực hiện. Chủ sở hữu sẽ không bị tính phí, nhưng theo chuyên viên định giá thuế thành phố Peter Jones, **thuế bất động sản trong khu vực sẽ tăng 1% kể từ năm sau**.\n\nDo nhiều chủ doanh nghiệp địa phương trong khu vực báo cáo doanh số và lượng khách sụt giảm, ủy ban hy vọng dự án sẽ giúp **thu hút người dân quay trở lại khu vực**. Chủ tịch ủy ban Evan Sweeney cho biết: “Chúng tôi tin rằng công trình này sẽ hồi sinh khu vực và khôi phục lại thời kỳ huy hoàng trước đây.”","translationStatus":"reviewed"},{"id":"h3/test02/172_CDAC.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 172–175","questions":{"172":"C","173":"D","174":"A","175":"C"},"image":"data/h3/test02/172_CDAC.png","markedImage":"marked/h3/test02/172_CDAC.png","translation":"### Dịch vụ in ấn EZ-R — Nhận đúng những gì bạn muốn!\n\nNếu doanh nghiệp nhỏ của bạn cần tài liệu quảng cáo, tờ rơi, danh thiếp, danh mục sản phẩm hoặc bất kỳ ấn phẩm quảng bá nào khác, bạn có thể tạo ra chính xác sản phẩm mình cần với EZ-R Printing Services. Hệ thống thiết kế dễ sử dụng cho phép bạn chọn phông chữ, hình ảnh, vị trí của chúng trên trang và cả loại giấy muốn dùng.\n\nSau khi hoàn toàn hài lòng với tài liệu, hãy chọn số bản in và thanh toán bằng thẻ tín dụng, chuyển khoản trực tiếp từ tổ chức tài chính hoặc dịch vụ giao dịch trực tuyến Paybuddy. Điền biểu mẫu giao hàng và sản phẩm sẽ được chuyển đến bất kỳ đâu tại Hoa Kỳ trong vòng năm ngày làm việc. Phí vận chuyển và xử lý đã bao gồm trong tổng chi phí nên không có khoản phí ẩn.\n\n**Nếu không tự tin về kỹ năng bố cục và thiết kế, bạn hoàn toàn không phải tự làm.** Với khoản phí một lần chỉ từ 180 đô la, một trong những chuyên gia lành nghề của chúng tôi sẽ tạo ra một ấn phẩm bắt mắt. Họ có thể làm việc cùng bạn trên mọi tài liệu quảng bá in ấn cho đến khi bạn hài lòng.\n\nNgoài ra, chỉ trong tháng 5, bất kỳ ai đặt đơn hàng từ 75 đô la trở lên sẽ **được tặng số danh thiếp trị giá 25 đô la**.\n\nHãy xem hàng trăm ấn phẩm mẫu trên trang web và tham quan hệ thống thiết kế để thấy việc sử dụng dịch vụ tại www.ezrprintingservices.com dễ dàng và tiết kiệm đến mức nào.","translationStatus":"reviewed"},{"id":"h3/test02/176_ADBCA.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 176–180","questions":{"176":"A","177":"D","178":"B","179":"C","180":"A"},"image":"data/h3/test02/176_ADBCA.png","markedImage":"marked/h3/test02/176_ADBCA.png","translation":"### Thông báo về các hội chợ tuyển sinh\n\nSắp đến thời điểm hằng năm Cao đẳng Cofton cử nhân viên tham dự các hội chợ tuyển sinh đại học trên toàn quốc để thu hút sinh viên mới. Cô Malkovich, với tư cách quản lý tiếp thị, sẽ phụ trách việc này và tham dự tất cả sự kiện. Không giống các trường tư lớn khác tại Vương quốc Anh, chúng ta muốn nhấn mạnh mức độ quan tâm trực tiếp mà sinh viên nhận được từ giảng viên. Vì vậy, chúng ta vừa duy trì sĩ số lớp ở mức dễ quản lý, vừa thúc đẩy sự giao lưu xã hội lành mạnh giữa sinh viên và giảng viên. Do đó, chúng ta cố gắng bố trí ít nhất một giảng viên tham dự mỗi hội chợ.\n\nBốn sự kiện tháng tới:\n\n- Thứ Năm, ngày 10 tháng 2 — Khách sạn Mercia, Birmingham\n- Thứ Tư, ngày 16 tháng 2 — Cao đẳng Hartford, London\n- Thứ Bảy, ngày 19 tháng 2 — Trung tâm Hội nghị Leeds Metropolitan, Leeds\n- Thứ Tư, ngày 23 tháng 2 — Trung tâm Hội nghị Brighton and Hove, Brighton\n\nNếu có thể tham dự, vui lòng liên hệ với tôi qua lsullivan@coftoncollege.co.uk. **Người sẵn sàng làm việc tại sự kiện cuối tuần sẽ được trả lương làm thêm theo mức giờ thông thường.**\n\nTrân trọng,\n\nLisa Sullivan  \nTrợ lý hành chính\n\n---\n\n### E-mail của Giáo sư Andrew Jansen\n\n**Người nhận:** Lisa Sullivan  \n**Ngày:** 25 tháng 1  \n**Chủ đề:** Hội chợ tuyển sinh\n\nChào Lisa,\n\nTôi rất vui khi thấy thông báo của cô trên bảng tin khoa hôm nay, vì hằng năm tôi luôn thích tham dự một hoặc hai sự kiện để gặp gỡ các sinh viên tiềm năng. Trong các sự kiện được liệt kê, tôi sẵn lòng đến sự kiện ngày 19 tháng 2. **Gia đình tôi sống cùng khu vực nơi sự kiện diễn ra và cuối tuần đó tôi sẽ đến thăm họ.** Vì vậy, tôi có thể dễ dàng dành vài giờ tham dự.\n\nRất tiếc, hiện giờ tôi chỉ có thể đề nghị tham gia sự kiện đó vì tôi giảng dạy cả ngày vào thứ Ba, thứ Tư và thứ Năm. Xin gửi cho tôi toàn bộ thông tin chi tiết về sự kiện ngay khi có thể.\n\nThân mến,\n\nGiáo sư Andrew Jansen","translationStatus":"reviewed"},{"id":"h3/test02/181_ABBDD.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 181–185","questions":{"181":"A","182":"B","183":"B","184":"D","185":"D"},"image":"data/h3/test02/181_ABBDD.png","markedImage":"marked/h3/test02/181_ABBDD.png","translation":"### Đơn đăng ký thành viên Fit Prime Gym\n\n**Ngày:** 2 tháng 3  \n**Họ tên:** Cindy Norenski  \n**Giới tính:** Nữ  \n**Ngày sinh:** 27 tháng 3  \n**Điện thoại nhà:** 555-2237  \n**Di động:** 555-6923  \n**E-mail:** cinnoren5@gladmail.net  \n**Địa chỉ:** 46 North Ranch Drive, Kansas City, MO 64110\n\n**Thành viên gia đình:**\n\n- Gerald Norenski — nam, 45 tuổi, chồng\n- Jennifer Norenski — nữ, 19 tuổi, con gái\n- Melissa Norenski — nữ, 12 tuổi, con gái\n\n**Gói thành viên:** Gói Gia đình  \n**Biết đến phòng tập qua:** Nhân viên giới thiệu\n\n---\n\n### E-mail chào mừng từ Fit Prime Gym\n\n**Người gửi:** Jerry Hanover  \n**Ngày:** 12 tháng 3  \n**Chủ đề:** Chào mừng!\n\nKính gửi cô Norenski,\n\nCảm ơn cô đã đăng ký Fit Prime Gym. Tôi rất vui vì cô đã làm theo lời khuyên của tôi và tham gia cùng chúng tôi. Như đã nói, tôi tin rằng chồng và các con cô sẽ tận hưởng tất cả cơ sở vật chất và hoạt động mà Fit Prime cung cấp.\n\nKhi trao đổi, cô cho biết quan tâm đến việc sử dụng hồ bơi để bơi theo làn. Lịch dành cho hoạt động này đã thay đổi. Hồ bơi trong nhà vẫn mở lúc 8 giờ sáng hằng ngày. Tuy nhiên, giờ đóng cửa hiện là 10 giờ tối từ thứ Hai đến thứ Sáu; cuối tuần đóng lúc 9 giờ 15 tối. Xin nhớ **chỉ sử dụng hai làn đầu tiên của hồ để bơi theo làn**.\n\nTôi cũng muốn thông báo rằng con gái cô, Jennifer, đủ điều kiện tham gia Gói Sinh viên. Cô ấy có thể tham gia miễn phí trong khi vẫn thuộc Gói Gia đình của cô. **Gói Sinh viên kèm theo hai tháng tập luyện cá nhân nhập môn cho thành viên mới.** Hãy hỏi xem cô ấy có quan tâm không để tôi đăng ký nếu cần.\n\nMột lần nữa xin cảm ơn, hẹn sớm gặp cô tại phòng tập!\n\nTrân trọng,\n\nJerry Hanover  \nBan quản lý Fit Prime Gym","translationStatus":"reviewed"},{"id":"h3/test02/186_CBDBD.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 186–190","questions":{"186":"C","187":"B","188":"D","189":"B","190":"D"},"image":"data/h3/test02/186_CBDBD.png","markedImage":"marked/h3/test02/186_CBDBD.png","translation":"### Thư từ Franchise Master\n\n**Ngày:** 11 tháng 7  \n**Người nhận:** Daniel Ainge, Brandon, Florida\n\nKính gửi ông Ainge,\n\nXin chúc mừng! Ông đã tiến gần thêm một bước đến giấc mơ sở hữu doanh nghiệp. Trong hai thập kỷ qua, Franchise Master đã giúp hàng nghìn doanh nhân đầy khát vọng như ông đạt được thành công thông qua mô hình nhượng quyền thương mại.\n\nLà bên nhận quyền, ông sẽ được hưởng lợi từ các phương thức kinh doanh đã được kiểm chứng, nhận hỗ trợ hành chính và có khả năng dự báo doanh số cũng như chi phí. Ông không cần có kinh nghiệm trước đó vì mọi bên nhận quyền đều được đào tạo chuyên sâu. Ông sẽ được hưởng đầy đủ lợi thế khi gia nhập một công ty đã có nền tảng vững chắc.\n\nNgoài ra, ông còn có cơ hội lý tưởng để tìm hiểu thêm về các đối tác của chúng tôi tại Hội chợ Nhượng quyền thường niên lần thứ 24 ở Fort Myers, Florida. Nhiều thương hiệu nổi tiếng yêu cầu mức vốn đầu tư ban đầu như ông cho biết mình sẵn sàng chi trả sẽ tham gia, chẳng hạn AirCare Repair và Missy’s Ice.\n\nNếu có câu hỏi, vui lòng gọi 555-8965 hoặc ghé văn phòng của chúng tôi.\n\nTrân trọng,\n\nHilary Archer  \nChuyên viên tư vấn\n\n---\n\n### Hội chợ Nhượng quyền thường niên lần thứ 24\n\n**Thời gian:** Ngày 6–9 tháng 9  \n**Địa điểm:** Fort Myers, Florida\n\n| Khu | Gian hàng | Công ty | Ngành | Vốn đầu tư ban đầu |\n|---|---:|---|---|---:|\n| 2 | 52 | AirCare Repair | Dịch vụ sửa chữa | 20.000 đô la |\n| 2 | 54 | ShoeSaver | Dịch vụ sửa chữa | 31.500 đô la |\n| 4 | 79 | Barb’s Chicken | Bán lẻ thực phẩm | 32.000 đô la |\n| 4 | 81 | Missy’s Ice | Bán lẻ thực phẩm | 20.000 đô la |\n| 5 | 94 | Muscle Bound | Dịch vụ thể hình | 38.000 đô la |\n| 5 | 113 | Space Cycle | Dịch vụ thể hình | 25.000 đô la |\n| 10 | 205 | Clean Sweep | Dịch vụ gia đình | 26.500 đô la |\n\nCác doanh nghiệp cùng ngành được bố trí trong **cùng một khu**. Mỗi đơn vị tham gia chỉ được sử dụng một gian hàng.\n\n---\n\n### Bài báo: Nhượng quyền có phù hợp với bạn không?\n\n*Tampa Weekly — tiếp theo từ trang 1*\n\nTheo những gì tôi tìm hiểu khi trò chuyện với các chuyên gia tại Hội chợ Nhượng quyền vừa tổ chức ở Fort Myers, mô hình này không phù hợp với tất cả mọi người. Sam Romanek của Franchise Friendly nói: “Nhượng quyền có thể ít rủi ro hơn khởi nghiệp, nhưng không phù hợp nếu bạn coi trọng sự độc lập và quyền kiểm soát tuyệt đối.”\n\nVề cách chọn thương hiệu phù hợp, Barbara Allred của FBA khuyên mọi người nghiên cứu kỹ. Bà nói: “Đừng chỉ nhìn vào kết quả gần đây của một công ty; hãy tìm hiểu tình hình chung của cả ngành.” Ví dụ, bà dẫn chứng triển vọng của các dịch vụ sửa chữa nhà cửa và sự suy giảm của lĩnh vực thể hình cá nhân: “Các câu lạc bộ thể hình đã bùng nổ trong những năm gần đây, nhưng giờ thị trường đã bão hòa.”","translationStatus":"reviewed"},{"id":"h3/test02/191_BBBDA.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 191–195","questions":{"191":"B","192":"B","193":"B","194":"D","195":"A"},"image":"data/h3/test02/191_BBBDA.png","markedImage":"marked/h3/test02/191_BBBDA.png","translation":"### Phiếu đặt hàng của Majestic Porcelain\n\n**Số đơn hàng:** 209154-68  \n**Ngày:** 24 tháng 4  \n**Giao cho:** Lorraine Plummer, Crawley, Vương quốc Anh  \n**Loại khách hàng:** Mới\n\n- Tượng “Seated Lady with Peacock” — 1 × 62,98 đô la\n- Tượng “Angelic Cherubs” — 4 × 35 đô la = 140 đô la\n- Tượng “Young Lady with Fan” — 1 × 42,99 đô la\n- Tạm tính: 245,97 đô la\n- Phí vận chuyển: 110 đô la\n- Tổng cộng: 355,97 đô la\n\nKhách hàng sẽ nhận được mã theo dõi từ nhà vận chuyển sau khi đơn hàng rời kho. Dự kiến giao hàng trong 5–7 ngày kể từ ngày gửi.\n\n---\n\n### E-mail về đơn hàng bị hư hỏng\n\n**Người gửi:** Joel Nesbitt  \n**Người nhận:** Lorraine Plummer  \n**Ngày:** 5 tháng 5  \n**Tệp đính kèm:** Nhãn gửi trả đã trả trước\n\nKính gửi cô Plummer,\n\nTôi xin lỗi về trải nghiệm vừa qua của cô. Chúng tôi luôn cố gắng bảo đảm mọi sản phẩm được giao đến trong tình trạng tốt bằng cách bọc riêng từng món bằng vật liệu chống va đập. Tuy nhiên, hư hỏng đôi khi vẫn xảy ra, đặc biệt khi hàng được gửi ra nước ngoài.\n\nVấn đề là, như đã nêu trên trang web, nhà vận chuyển của chúng tôi không cung cấp bảo hiểm nên không chi trả chi phí hàng hóa hư hỏng trong quá trình giao. Tuy nhiên, chúng tôi sẽ tự chịu chi phí này. Xin gửi lại sản phẩm bị hỏng, mã LV-98201, và chúng tôi sẽ hoàn lại toàn bộ tiền. Chúng tôi đã đính kèm nhãn gửi trả đã thanh toán trước để cô thuận tiện sử dụng.\n\nTrân trọng,\n\nJoel Nesbitt  \nMajestic Porcelain\n\n---\n\n### E-mail về các nhà vận chuyển thay thế\n\n**Người gửi:** Randall Howe  \n**Người nhận:** Joel Nesbitt  \n**Ngày:** 25 tháng 5  \n**Chủ đề:** Các nhà cung cấp dịch vụ vận chuyển\n\nÔng yêu cầu tôi tìm các phương án thay thế nhà vận chuyển hiện tại, PK Logistics. Chúng ta muốn tránh lặp lại tổn thất như với đơn hàng 209154-68, nên tôi cho rằng cần chọn đơn vị bảo đảm sự cố đó không xảy ra. Nhà cung cấp mới cũng nên cam kết thời gian giao tương đương.\n\n| Nhà vận chuyển | Bảo hiểm | Theo dõi | Giao nhanh nhất | Ưu điểm |\n|---|---|---|---|---|\n| Super Mail Carriers | Có | Có | 5 ngày | Chi phí thấp, giao quanh năm |\n| Corporate Parcel Service | Không | Có | 5 ngày | Hiện diện mạnh ở nước ngoài |\n| Global Delivery | Không | Không | 7 ngày | **Giảm giá cho lô hàng số lượng lớn** |\n| Overseas Transport Specialists | Có | Không | 8 ngày | Mạng lưới chi nhánh lớn nhất Hoa Kỳ |\n\nXin xem bảng và cho tôi biết khi nào ông rảnh để trao đổi.","translationStatus":"reviewed"},{"id":"h3/test02/196_BABBD.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 196–200","questions":{"196":"B","197":"A","198":"B","199":"B","200":"D"},"image":"data/h3/test02/196_BABBD.png","markedImage":"marked/h3/test02/196_BABBD.png","translation":"### Sav-Tech tuyển nhân viên tiếp thị\n\nSav-Tech Incorporated tại San Bernardino đang tìm chuyên gia quảng bá cho phòng tiếp thị. Hai vị trí hợp đồng toàn thời gian làm việc tại trụ sở San Bernardino, California, bắt đầu từ ngày 1 tháng 2. Ứng viên phải có bằng cấp về tiếp thị; chúng tôi chỉ xem xét người có ít nhất ba năm kinh nghiệm trong lĩnh vực này.\n\nNgười trúng tuyển sẽ làm việc trong nhóm tiếp thị. Nhiệm vụ gồm xây dựng, chỉnh sửa và triển khai nhiều chiến lược tiếp thị để quảng bá **các ứng dụng phần mềm dành cho điện thoại di động và máy tính bảng của Sav-Tech**.\n\nGửi thư xin việc và sơ yếu lý lịch hiện tại đến marketing@savtech.com. Hạn nhận hồ sơ là ngày 15 tháng 1.\n\n---\n\n### E-mail của Pradeep Kumar gửi Mia Choi\n\n**Ngày:** 14 tháng 1  \n**Chủ đề:** Vị trí tiếp thị tiềm năng\n\nMia,\n\nHôm nay tôi ăn trưa với đồng nghiệp Rupert Kim, người làm việc ở bộ phận tiếp thị của công ty tôi. Anh ấy nói rằng hai thành viên trong nhóm sắp nghỉ việc và cấp trên đang tìm hai nhân viên mới. Tôi lập tức nghĩ đến cô vì nhớ rằng cô đang tìm đúng loại công việc này.\n\nTôi đã nói chuyện với quản lý tiếp thị David Bradley và kể một chút về kinh nghiệm cũng như tình hình hiện tại của cô. Ông ấy có vẻ khá quan tâm và nói cô có thể gọi 555-3928 để trao đổi về công việc, thậm chí có thể sắp xếp một cuộc gặp. Ông ấy nói đã có nhiều ứng viên đủ trình độ học vấn cần thiết, **nhưng ít người đáp ứng yêu cầu về kinh nghiệm**. Có lẽ cô nên liên hệ ông Bradley ngay hôm nay. Nếu quan tâm, ông ấy sẽ yêu cầu cô gửi người tham khảo.\n\nPradeep\n\n---\n\n### Thư giới thiệu của Headman Advertising Agency\n\n**Ngày:** 18 tháng 1  \n**Người nhận:** David Bradley, Sav-Tech\n\nKính gửi ông Bradley,\n\nTôi viết thư này liên quan đến Mia Choi vì được biết ông đang cân nhắc cô ấy cho một vị trí trong phòng tiếp thị tại Sav-Tech. Tôi nhiệt tình giới thiệu cô Choi cho vai trò đó, vì cô ấy đã là một nhân viên xuất sắc trong sáu năm qua tại Headman Advertising Agency ở Los Angeles.\n\nTôi đã làm giám đốc của cô Choi trong nhiều năm và nhận thấy cô ấy thông minh, sáng tạo. Cô ấy đã giúp công ty chúng tôi phát triển nhiều chiến dịch quảng bá thành công, trong đó có các dự án cho Gleaming Studios và Holstein Dairy. Lĩnh vực chuyên môn của cô ấy là mạng xã hội; cô cũng am hiểu những tiến bộ công nghệ có liên quan đến tiếp thị.\n\nTôi sẽ rất tiếc khi không còn được làm việc cùng cô ấy, nhưng hiểu đây là một cơ hội tuyệt vời cho sự nghiệp. Tôi chắc rằng ông cũng sẽ đánh giá cao cô ấy như tôi.\n\nTrân trọng,\n\nRichard Morrison  \nGiám đốc sáng tạo  \nHeadman Advertising Agency","translationStatus":"reviewed"},{"id":"h3/test03/131_CBBC.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 131–134","questions":{"131":"C","132":"B","133":"B","134":"C"},"image":"data/h3/test03/131_CBBC.png","markedImage":"marked/h3/test03/131_CBBC.png","translation":"**Chủ đề: Hóa đơn Clarks Telecom**\n\nKính gửi ông McCabe,\n\nHóa đơn Internet hằng tháng **có tổng trị giá** 48,25 đô la lẽ ra phải được thanh toán trước ngày 15 tháng 2. Ông cần thanh toán ngay; nếu không, mỗi tháng sẽ cộng thêm khoản phí bằng 5% số tiền nợ cho đến khi số dư được **thanh toán đầy đủ**.\n\nChúng tôi đề xuất sử dụng hệ thống thanh toán tự động. Hãy đăng nhập, vào “Payment Settings”, chọn “Automatic” rồi nhấn “Submit”. **Khoản nợ sẽ được thanh toán vào ngày đã lên lịch bằng phương thức này.**\n\nNếu cho rằng hóa đơn có sai sót, ông **được khuyến khích** liên hệ để chúng tôi xem lại lịch sử thanh toán.\n\nVirginia Payton  \nClarks Telecom","translationStatus":"reviewed"},{"id":"h3/test03/135_CDBC.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 135–138","questions":{"135":"C","136":"D","137":"B","138":"C"},"image":"data/h3/test03/135_CDBC.png","markedImage":"marked/h3/test03/135_CDBC.png","translation":"**Kỳ nghỉ cưỡi ngựa tại Waterview Valley Ranch**\n\nWaterview Valley Ranch là địa điểm lý tưởng cho kỳ nghỉ cưỡi ngựa. Hãy khám phá vẻ đẹp khu vực và **tìm hiểu** lịch sử qua những câu chuyện thú vị của hướng dẫn viên giàu kiến thức.\n\n**Dù** bạn cưỡi ngựa để thư giãn hay muốn thử thách trên vùng đồng quê rộng mở, chúng tôi đều có đầy đủ thiết bị phù hợp. **Điều này bảo đảm trải nghiệm vừa an toàn vừa làm bạn hài lòng.**\n\nNếu mang ngựa riêng, chúng tôi có thể **bố trí chuồng nuôi** trong suốt thời gian lưu trú. Chuồng có nhiều không gian và ngựa sẽ được chăm sóc tốt.\n\nHãy báo nhu cầu của đoàn khi gọi 555-7823 để đặt chỗ.","translationStatus":"reviewed"},{"id":"h3/test03/139_BDCB.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 139–142","questions":{"139":"B","140":"D","141":"C","142":"B"},"image":"data/h3/test03/139_BDCB.png","markedImage":"marked/h3/test03/139_BDCB.png","translation":"**Thông báo quan trọng — Hủy buổi hòa nhạc ngày 17 tháng 8**\n\nBeaumont Hall rất **tiếc nuối** thông báo buổi hòa nhạc của nghệ sĩ piano Sophia Kaminsky đã bị hủy vì cô đột ngột lâm bệnh. Ban tổ chức quyết định **hoãn** sự kiện cho đến khi có thông báo mới.\n\nNgười mua vé bằng tiền mặt được hoàn tiền ngay. Người thanh toán bằng thẻ tín dụng sẽ không nhận được khoản hoàn tiền **nhanh chóng** như vậy do quy định xử lý thẻ.\n\nNgoài được hoàn đủ tiền, mọi người mua vé còn nhận mức giảm 20% cho lần đặt chỗ sau. **Mức giảm này không thể kết hợp với chương trình khuyến mãi hoặc ưu đãi khác.**\n\nChúng tôi chân thành xin lỗi vì sự bất tiện.","translationStatus":"reviewed"},{"id":"h3/test03/143_DACD.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 143–146","questions":{"143":"D","144":"A","145":"C","146":"D"},"image":"data/h3/test03/143_DACD.png","markedImage":"marked/h3/test03/143_DACD.png","translation":"**Lời mời tham dự chương trình “Speaking Poetry”**\n\nKính gửi cô Florins,\n\nCô được trân trọng mời tham dự buổi đọc thơ với ba nhà thơ **đầy triển vọng**: Adalberto Marte, Marceline Fontes và Lawrence Faucher. Họ sẽ đọc những tác phẩm mới xuất bản.\n\nCác **buổi biểu diễn** trước đây chủ yếu giới thiệu tác phẩm theo phong cách truyền thống. Lần này, chương trình làm nổi bật sự đa dạng của thơ ca. Các tác giả khách mời loại bỏ khuôn mẫu và vần điệu thông thường. **Thay vào đó, họ dùng lối viết giàu biểu cảm để đề cập các vấn đề hiện đại.**\n\nTập trung vào xã hội đang thay đổi nhanh chóng và ảnh hưởng của công nghệ, những bài thơ **của họ** chắc chắn sẽ đồng cảm với khán giả.\n\nChương trình diễn ra ngày 10 tháng 10 tại Rocheport Arts Center.\n\nAbraham Schlitz  \nRocheport Arts Center","translationStatus":"reviewed"},{"id":"h3/test03/147_CA.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 147–148","questions":{"147":"C","148":"A"},"image":"data/h3/test03/147_CA.png","markedImage":"marked/h3/test03/147_CA.png","translation":"**FlexiWorld Yoga — Thiết bị yoga giá hợp lý**\n\nYoga xuất hiện khắp nơi và mang lại nhiều lợi ích sức khỏe, nhưng giá thiết bị có thể khiến người mới e ngại — ngay cả một tấm thảm đơn giản cũng có thể trên 50 đô la.\n\nFlexiWorld Yoga bán từ thiết bị thương hiệu hàng đầu đến dụng cụ giá thấp cho người mới. Chúng tôi có thể đưa ra mức giá thấp hơn cửa hàng bách hóa và nhà bán lẻ khác vì **chỉ kinh doanh hoàn toàn trực tuyến**.\n\nNếu muốn thử yoga mà không chi quá nhiều, hãy truy cập www.flexiworldyoga.com.","translationStatus":"reviewed"},{"id":"h3/test03/149_BB.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 149–150","questions":{"149":"B","150":"B"},"image":"data/h3/test03/149_BB.png","markedImage":"marked/h3/test03/149_BB.png","translation":"**Ramford Center for the Arts tuyển nhân viên gây quỹ**\n\nTrung tâm cần một ứng viên năng động tham gia đội gây quỹ tại cơ sở chính ở Houston. Nhân viên sẽ báo cáo cho giám đốc điều hành và vận động tài trợ cho các chương trình, sự kiện quanh năm.\n\nỨng viên cần bằng cử nhân quản lý phi lợi nhuận, mỹ thuật hoặc ngành tương tự. Kinh nghiệm liên quan được ưu tiên nhưng không bắt buộc.\n\nGói phúc lợi gồm bảo hiểm y tế, kỳ nghỉ rộng rãi, đóng góp lương hưu và **quyền tham quan miễn phí mọi triển lãm dành cho toàn thể nhân viên**.\n\nHồ sơ gồm thư ứng tuyển và lý lịch gửi Andrea Perkins trước thứ Sáu, ngày 3 tháng 10.","translationStatus":"reviewed"},{"id":"h3/test03/151_AD.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 151–152","questions":{"151":"A","152":"D"},"image":"data/h3/test03/151_AD.png","markedImage":"marked/h3/test03/151_AD.png","translation":"**Chuỗi tin nhắn về việc sản xuất máy tính xách tay mới**\n\n**Frank Cameron — 2:22 chiều**  \nKhi nào việc sản xuất máy tính mới bắt đầu?\n\n**Liz Cohen — 2:24**  \nStan Lowell nói nhà máy chưa thể bắt đầu trong ít nhất bốn tuần.\n\n**Frank Cameron — 2:26**  \nNguyên nhân trì hoãn là gì?\n\n**Liz Cohen — 2:28**  \nNhà máy phải chờ phòng kỹ thuật **hoàn tất kiểm nghiệm sản phẩm**, lâu hơn dự kiến.\n\n**Frank Cameron — 2:29**  \nMáy dự kiến giao đến cửa hàng đầu tháng tới. Có đạt mục tiêu không?\n\n**Liz Cohen — 2:31**  \n“Không có cơ hội nào” — cô **không tin máy tính sẽ được giao đúng ngày đã lên kế hoạch**.\n\n**Liz Cohen — 2:34**  \nNhân viên kinh doanh sẽ ổn nếu được báo trước. Hiện giờ cần tập trung đưa sản phẩm tốt nhất ra thị trường, dù hơi muộn.","translationStatus":"reviewed"},{"id":"h3/test03/153_CCB.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 153–155","questions":{"153":"C","154":"C","155":"B"},"image":"data/h3/test03/153_CCB.png","markedImage":"marked/h3/test03/153_CCB.png","translation":"**Thông báo sự kiện diễn thuyết tại TechBase**\n\nNgày 12 tháng 9, Elsa Goncalvez, tác giả *The Key Components of Selling*, sẽ đến văn phòng TechBase nói về các chiến lược tiếp thị đã được chứng minh. Bà từng làm với Stentech và Microtrax — hai nhà sản xuất máy tính hàng đầu — cho thấy TechBase là **công ty liên quan đến máy tính**.\n\nTham dự không bắt buộc nhưng được khuyến khích. Nội dung gồm hiểu nhu cầu khách hàng, xác định điểm bán hàng độc đáo và tạo tài liệu quảng cáo hiệu quả. Bài nói **không đề cập xây dựng đội ngũ bán hàng**.\n\nMỗi người tham dự được **tặng một bản sách** của bà Goncalvez.","translationStatus":"reviewed"},{"id":"h3/test03/156_CB.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 156–157","questions":{"156":"C","157":"B"},"image":"data/h3/test03/156_CB.png","markedImage":"marked/h3/test03/156_CB.png","translation":"**Thông báo diễn đàn công cộng tại Sheltonville**\n\nMột diễn đàn sẽ được tổ chức để thảo luận công trình chung cư ở góc Smith Street và Lincoln Avenue. Giai đoạn xây dựng kéo dài đến cuối tháng 9, có thể gây đóng đường, tiếng ồn và đóng vỉa hè vì an toàn.\n\nĐại diện công ty xây dựng Blakely and Reid sẽ trả lời câu hỏi. Joseph Coran, thành viên hội đồng thành phố khu vực 11, sẽ **điều phối diễn đàn**.\n\nSự kiện bắt đầu lúc 6 giờ tối thứ Ba, ngày 10 tháng 7 tại Evergreen Community Center. Mọi cư dân trong khu vực đều được tham dự miễn phí.","translationStatus":"reviewed"},{"id":"h3/test03/158_ACD.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 158–160","questions":{"158":"A","159":"C","160":"D"},"image":"data/h3/test03/158_ACD.png","markedImage":"marked/h3/test03/158_ACD.png","translation":"**Đại học Belajar xây trung tâm công nghệ cao tại Malacca**\n\nĐại học Belajar bắt đầu xây cơ sở mới ở Malacca City, dự kiến hoàn thành cuối năm sau. Đây là chiến lược **thu hút sinh viên từ nhiều khu vực khác nhau của Malaysia**, thay vì chỉ tập trung tại Kuala Lumpur.\n\nChính phủ Malaysia tài trợ một phần vì xem dự án là trọng tâm phát triển miền nam thành trung tâm công nghệ cao. Cơ sở mới có phòng máy tính hiện đại nghiên cứu vi mạch và bộ xử lý.\n\nChính phủ còn xây **tuyến đường sắt cao tốc giữa Kuala Lumpur và Malacca City** để khuyến khích doanh nghiệp công nghệ chuyển đến.\n\nThống đốc Qing Weihai kỳ vọng cơ sở mới thu hút doanh nghiệp và tạo **hàng nghìn cơ hội việc làm cho người dân địa phương**.","translationStatus":"reviewed"},{"id":"h3/test03/161_DCBB.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 161–164","questions":{"161":"D","162":"C","163":"B","164":"B"},"image":"data/h3/test03/161_DCBB.png","markedImage":"marked/h3/test03/161_DCBB.png","translation":"**Chủ đề: Giáo trình *Economics for Business* phiên bản thứ 10**\n\nKính gửi cô Shah,\n\nCasper Publishing vừa phát hành một đầu sách quan trọng phù hợp với QRC Bookstore. Phiên bản thứ 10 của *Economics for Business* có nội dung đa phương tiện được cập nhật và bài tập mới trên DVD.\n\nCó phiên bản cho sinh viên và giáo viên. Bản sinh viên có giá phải chăng; bản giáo viên gồm nhiều nội dung cao cấp như bài thuyết trình cài sẵn. **Những tài liệu này có thể dùng trong lớp cùng giáo án chi tiết ở mỗi chương.**\n\nVì QRC chủ yếu bán giáo trình đại học, khách hàng của cửa hàng gồm **sinh viên đại học**.\n\nĐể đặt hàng, cô cần tải biểu mẫu tại www.caspub.com/orders và **gửi qua đường bưu điện**.\n\nTrân trọng,  \nEdwin Lewis","translationStatus":"reviewed"},{"id":"h3/test03/165_ADAD.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 165–168","questions":{"165":"A","166":"D","167":"A","168":"D"},"image":"data/h3/test03/165_ADAD.png","markedImage":"marked/h3/test03/165_ADAD.png","translation":"### Trò chuyện trực tuyến về triển lãm nghệ thuật\n\n**Clara Dalton — 2:01 chiều**\nChào buổi chiều mọi người. Như chắc hẳn mọi người đã nghe vào thứ Hai, ban giám đốc đã lên lịch khai mạc triển lãm của nghệ sĩ Erik Masterson vào tháng tới. Chúng ta cần bắt đầu quảng bá rộng rãi, và tôi muốn biết tiến độ mọi việc đến đâu rồi.\n\n**Aaron Cobble — 2:04 chiều**\nTôi đã thiết kế xong thiệp mời cá nhân hóa cho tất cả những người từng tham dự triển lãm gần nhất, nhưng danh sách gửi thư vẫn chưa được tổng hợp. George, anh nghĩ việc này có gây vấn đề gì không?\n\n**George Duffy — 2:10 chiều**\nChậm một ngày cũng không sao. Tuy nhiên, khách mời cần nhận được thiệp **trước thứ Bảy, khi chúng ta phát hành thông cáo báo chí về lễ khai mạc**. Vì vậy, muộn nhất là thứ Năm chúng ta phải giao thiệp cho đơn vị chuyển phát.\n\n**Clara Dalton — 2:12 chiều**\nĐược rồi. Tôi sẽ nhờ Steven xử lý việc đó. Deborah, còn áp phích thì sao?\n\n**Deborah Emerson — 2:14 chiều**\nÁp phích đã sẵn sàng để in. Chị có ý tưởng nên nhờ các tình nguyện viên treo chúng ở đâu không?\n\n**Clara Dalton — 2:16 chiều**\nTôi nghe nói tác phẩm của Masterson rất được sinh viên đại học yêu thích.\n\n**Deborah Emerson — 2:20 chiều**\n**Ồ, vậy Đại học Randall thì sao? Phòng trưng bày nằm trong khoảng cách có thể đi bộ từ đó.**\n\n**Clara Dalton — 2:21 chiều**\nNghe hay đấy. Có lẽ chúng ta cũng nên tổ chức một buổi thuyết trình trong khuôn viên trường để quảng bá triển lãm.\n\n**Deborah Emerson — 2:22 chiều**\nChắc chắn rồi. Tôi sẽ gọi cho trường đại học để hỏi về việc đó.","translationStatus":"reviewed"},{"id":"h3/test03/169_BDB.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 169–171","questions":{"169":"B","170":"D","171":"B"},"image":"data/h3/test03/169_BDB.png","markedImage":"marked/h3/test03/169_BDB.png","translation":"### Thư từ Bộ phận Chăm sóc Khách hàng North Bank\n\nAdam Suzuki  \n12 Westbourne Avenue  \nHull, Vương quốc Anh, HU2 7HF\n\nNgày 22 tháng 11\n\nKính gửi ông Suzuki,\n\nTôi vui mừng thông báo về một thay đổi đối với tài khoản North Bank của ông. Hiện tại, khi cần, ông có thể thấu chi tối đa 250 bảng Anh từ tài khoản thanh toán. Vì ông đã là khách hàng trung thành của chúng tôi trong hơn ba năm qua và có xếp hạng tín dụng xuất sắc, **hạn mức thấu chi của ông đã được tăng lên 750 bảng Anh**. Mức tăng này sẽ có hiệu lực từ đầu tháng tới. **Các điều khoản và điều kiện khác liên quan đến tài khoản của ông vẫn được giữ nguyên.**\n\nNgoài ra, tôi xin thông báo rằng ông đủ điều kiện đăng ký thẻ tín dụng Silver Spender và Graduate Spender. Một số quyền lợi của từng loại thẻ được liệt kê dưới đây. Nếu quan tâm đến một trong hai loại thẻ, vui lòng điền vào biểu mẫu đính kèm và gửi lại cho chúng tôi. Ông không cần thực hiện thêm thủ tục nào vì đã được phê duyệt trước.\n\n### Thẻ tín dụng Silver Spender\n\n- Giảm 10% phí vé xem phim\n- Trả góp lãi suất 0% trong tối đa 24 tháng\n- Phí thường niên: 25 bảng Anh\n\n### Thẻ tín dụng Graduate Spender\n\n- Quyền sử dụng phòng chờ VIP của Greyline Air tại các sân bay trên toàn quốc\n- **Trả góp lãi suất 0% trong tối đa 12 tháng**\n- Phí thường niên: 45 bảng Anh\n\nNếu có bất kỳ câu hỏi hoặc thắc mắc nào, xin vui lòng liên hệ với chúng tôi bất cứ lúc nào.\n\nBộ phận Chăm sóc Khách hàng North Bank","translationStatus":"reviewed"},{"id":"h3/test03/172_CCCB.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 172–175","questions":{"172":"C","173":"C","174":"C","175":"B"},"image":"data/h3/test03/172_CCCB.png","markedImage":"marked/h3/test03/172_CCCB.png","translation":"### Tạp chí Health First — Số tháng 4\n\n## Những xu hướng thể hình hàng đầu\n\nMùa xuân luôn là mùa bận rộn nhất của các trung tâm thể hình, khi mọi người chuẩn bị lấy lại vóc dáng cho những tháng hè sắp tới. Các chủ phòng tập muốn tạo **lợi thế cạnh tranh** so với những cơ sở khác sẽ rất vui khi biết rằng RockTech, nhà sản xuất thiết bị sức khỏe nổi tiếng, vừa ra mắt **một dòng thiết bị thể hình mới với nhiều tính năng ấn tượng**.\n\nNancy Flores, trưởng bộ phận thiết kế sản phẩm của RockTech, cho biết thiết bị mới có kiểu dáng thanh thoát và ứng dụng những tiến bộ công nghệ mới nhất. Chẳng hạn, máy chạy bộ RockRunner tự động điều chỉnh các thiết lập như tốc độ và độ dốc theo các tuyến đường trên bản đồ vệ tinh, giúp người dùng có cảm giác như đang chạy trên địa hình thực tế.\n\nNgoài ra, bà Flores cho biết RockTech sắp ra mắt một dòng thiết bị tập tạ mới. Các máy này sẽ có bộ đếm lượng calo tiêu hao tiên tiến, có thể đồng bộ với thiết bị theo dõi sức khỏe đeo trên người. “Những người tập trung vào việc đốt cháy calo có thể dễ dàng theo dõi tiến độ của mình,” bà Flores giải thích. Bà cũng cho biết **RockTech dự định trang bị tính năng này cho tất cả sản phẩm mới ra mắt**.\n\nCác sản phẩm này và nhiều sản phẩm khác có trên trang web www.rocktech.com, nhưng **hiện chỉ được bán cho các phòng tập và câu lạc bộ sức khỏe**.","translationStatus":"reviewed"},{"id":"h3/test03/176_DBBBD.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 176–180","questions":{"176":"D","177":"B","178":"B","179":"B","180":"D"},"image":"data/h3/test03/176_DBBBD.png","markedImage":"marked/h3/test03/176_DBBBD.png","translation":"### Thư mời tham dự sự kiện gây quỹ thường niên của SRA\n\n## Hãy đến với buổi thử rượu gây quỹ thường niên của SRA!\n\n**Thứ Bảy, ngày 5 tháng 11  \nTừ 6 giờ tối đến 11 giờ đêm  \nTại Đại sảnh Grand Ballroom, Khách sạn Lambdia**\n\nHiệp hội Sight Right (SRA) trân trọng mời bạn tham dự sự kiện gây quỹ thường niên. Bạn sẽ được thưởng thức nhiều món ăn cao cấp và các loại rượu thượng hạng được tuyển chọn riêng cho những khẩu vị tinh tế. Hãy tận hưởng phần trình diễn âm nhạc của ban nhạc jazz Willis Gustavo, với nhiều tiết mục trong suốt buổi tối.\n\nTrong sự kiện cũng sẽ có một cuộc đấu giá, nơi khách tham dự có thể **đấu giá tất cả các loại rượu được phục vụ tại sự kiện**. Sau bài phát biểu chào mừng ngắn của đại diện SRA, các đầu bếp sẽ bắt đầu chuẩn bị món ăn tại các quầy đặt quanh đại sảnh. Khách có thể tự lấy thức ăn trong lúc giao lưu. Đừng quên ghé khu vực lễ tân để tham gia rút thăm miễn phí, với giải thưởng là một chai Riesling Miller-Ortega.\n\n### Giá vé\n\n- 85 đô la cho hội viên SRA / 145 đô la cho cặp đôi hội viên\n- 95 đô la cho người không phải hội viên / 165 đô la cho cặp đôi không phải hội viên\n- **Phải đặt chỗ qua số 555-3509 chậm nhất ngày 1 tháng 11.**\n\nToàn bộ số tiền thu được từ sự kiện sẽ dùng để cung cấp dịch vụ chăm sóc mắt và kính thuốc cho những người có hoàn cảnh khó khăn.\n\n---\n\n### Danh sách món ăn và rượu tại sự kiện gây quỹ SRA\n\n**Quầy 1**\n- Salad rau bina và nam việt quất\n- Mứt quả mâm xôi đen dùng với kem hạt dẻ rang\n- Rượu vang trắng: Chateau 54 Sauvignon Blanc\n\n**Quầy 2**\n- Bánh focaccia với phô mai mozzarella và ô liu đen\n- Risotto nấm\n- Rượu vang trắng: Mosdell Pinot Gris\n\n**Quầy 3**\n- **Cá hồi phủ sốt đường nâu và mù tạt**\n- Rượu vang đỏ: Pewter Vineyards Pinot Noir\n\n**Quầy tráng miệng**\n- Các loại bánh ngọt nhỏ\n- Kẹo sô-cô-la truffle\n- Cà phê và trà nóng\n- Rượu vang sủi: Willfell Moscato\n\nCác đầu bếp sẽ chuẩn bị những phần ăn nhỏ để khách tự lấy tại từng quầy cùng với rượu vang.","translationStatus":"reviewed"},{"id":"h3/test03/181_CACBB.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 181–185","questions":{"181":"C","182":"A","183":"C","184":"B","185":"B"},"image":"data/h3/test03/181_CACBB.png","markedImage":"marked/h3/test03/181_CACBB.png","translation":"### Thông báo dành cho khách tham quan\n\nChúng tôi đã có một mùa hè tuyệt vời tại Công viên Giải trí và Vườn thú Hạt Newport. Tuy nhiên, khi mùa đông đến gần, một số khu vực trong công viên sẽ đóng cửa để bảo trì và sửa chữa.\n\nTừ ngày 1 tháng 10, tàu lượn siêu tốc Mach One sẽ đóng cửa để kiểm tra và sửa chữa cho đến đầu mùa hè năm sau. Ngoài ra, một số khu chuồng nuôi động vật cũng sẽ tạm thời đóng cửa để công nhân tiến hành các hạng mục cải tạo cần thiết. Những biện pháp này rất quan trọng nhằm bảo đảm an toàn và trải nghiệm tốt đẹp cho khách tham quan trong tương lai.\n\nĐể bù lại sự bất tiện này, chúng tôi sẽ đưa vào một số hoạt động mùa đông mới. Ngày có thể ngắn hơn, nhưng đó lại là lý do tuyệt vời để **tổ chức trình diễn pháo hoa hằng ngày lúc 7 giờ tối, từ ngày 22 tháng 10 đến ngày 4 tháng 12**. Ngoài ra, từ ngày 30 tháng 9, tất cả nhà hàng trong công viên sẽ phục vụ thực đơn mùa đông hoàn toàn mới do đầu bếp nổi tiếng Alexandre Mapouche sáng tạo, lấy cảm hứng từ các món ngon mùa đông của châu Âu.\n\nNếu có bất kỳ câu hỏi nào về những thay đổi này, vui lòng hỏi đội ngũ nhân viên nhiệt tình và am hiểu của chúng tôi.\n\n---\n\n### E-mail phản hồi\n\n**Đến:** Bộ phận Quan hệ Khách hàng <relations@ncapz.com>  \n**Từ:** Sandra Higson <Sandra1973@zipmail.com>  \n**Chủ đề:** Phản hồi\n\nKính gửi quý công ty,\n\nTôi muốn phản ánh một vấn đề gặp phải tại Công viên Giải trí và Vườn thú Hạt Newport liên quan đến việc đóng cửa một trò chơi. Con trai tôi đã mong được đến công viên trong nhiều tháng để chơi tàu lượn Mach One. Cuối cùng tôi cũng có thời gian đưa cháu đi và cháu rất háo hức. Tuy nhiên, khi đến nơi, chúng tôi thấy thông báo bên ngoài phòng vé cho biết Mach One đã đóng cửa để bảo trì.\n\nChúng tôi vẫn quyết định vào công viên vì đã đi một quãng đường dài từ Colebrook, nhưng con trai tôi vô cùng thất vọng. Tôi cho rằng ít nhất quý công ty cũng nợ chúng tôi một lời xin lỗi vì **không thông báo việc đóng cửa trên trang web**; và có lẽ chúng tôi còn nên được **hoàn lại một nửa số tiền vé**, vì trò chơi mà chúng tôi quan tâm nhất lại không hoạt động.\n\nTôi mong sớm nhận được phản hồi.\n\nSandra Higson","translationStatus":"reviewed"},{"id":"h3/test03/186_DCDCB.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 186–190","questions":{"186":"D","187":"C","188":"D","189":"C","190":"B"},"image":"data/h3/test03/186_DCDCB.png","markedImage":"marked/h3/test03/186_DCDCB.png","translation":"### Tea Tree Eco-Resorts sắp khai trương tại Mexico vào cuối năm\n\n*Bài viết của Consuela Hidalgo*\n\nChuỗi khách sạn quốc tế Tea Tree Eco-Resorts đang ở giai đoạn cuối của quá trình xây dựng một khu nghỉ dưỡng rộng 22 mẫu Anh trên vùng Riviera Maya của Mexico. Những vị khách đầu tiên dự kiến đến vào ngày 21 tháng 12. Giống như các khu Tea Tree Eco-Resorts khác tại Philippines, Thái Lan và Hy Lạp, khách sạn mới sẽ thân thiện với môi trường nhất có thể. Chẳng hạn, khu nghỉ dưỡng sử dụng các tấm pin mặt trời để tạo điện và làm nóng nước. Ngoài ra, không nông dân địa phương nào cung cấp nguyên liệu cho các món đặc sản vùng miền, như thịt heo gói lá chuối và súp gà ướp cam quýt, sử dụng thuốc trừ sâu hóa học.\n\n“Chúng tôi hoàn toàn không sử dụng thuốc trừ sâu hóa học,” tổng quản lý Jose Perez cho biết. Khu nghỉ dưỡng được quy hoạch xoay quanh cây cối tự nhiên và đời sống thực vật, với các công trình hòa mình vào khu rừng. Thông tin chi tiết có tại **www.teatreeecoresorts.com/mexico**.\n\n---\n\n### Lịch hoạt động trong tuần tại Tea Tree Eco-Resorts, Riviera Maya\n\n**Thứ Hai, ngày 17 tháng 1: Chuyến đi thuyền buồm (22 đô la)**\nTham gia chuyến đi thuyền buồm kéo dài hai giờ, dừng tại các đảo địa phương. Bạn thậm chí có thể bắt gặp một vài chú cá heo! Đăng ký tại quầy hoạt động dành cho khách.\n\n**Thứ Tư, ngày 19 tháng 1: Tham quan công viên động vật hoang dã (38 đô la)**\nDi chuyển bằng xe buýt đến công viên động vật hoang dã địa phương để ngắm các loài động, thực vật bản địa. Khởi hành lúc 9 giờ sáng và trở về lúc 5 giờ chiều. Bữa trưa gồm bánh mì kẹp sẽ được phục vụ tại một nhà hàng gần công viên. Cần đặt chỗ trước.\n\n**Thứ Năm, ngày 20 tháng 1: Tham quan thành phố Maya cổ (57 đô la)**\nXe buýt đưa khách đến một khu khảo cổ, nơi có kim tự tháp và các công trình cổ khác. Khởi hành lúc 8 giờ sáng và trở về lúc 5 giờ chiều. Giá vé bao gồm bữa trưa và phí vào cửa; cần đặt chỗ trước.\n\n**Thứ Bảy, ngày 22 tháng 1: Tiệc bãi biển (miễn phí cho mọi khách lưu trú)**\nGhé bãi biển từ 11 giờ 30 sáng đến 2 giờ 30 chiều để dự tiệc nướng ngoài trời và thưởng thức các món địa phương tuyệt vời: hải sản nướng, súp gà ướp cam quýt và **thịt heo gói lá chuối**.\n\n*Giá được tính bằng đô la Mỹ.*\n\n---\n\n### Phiếu phản hồi của khách lưu trú\n\n**Tên:** Henry O’Neil  \n**Ngày lưu trú:** 17–23 tháng 1  \n**E-mail:** Henoneil@awesomepost.com  \n**Điện thoại:** (905) 555-6948\n\n- Vệ sinh cơ sở vật chất: Có\n- Dịch vụ của nhân viên: Có\n- Bữa ăn và dịch vụ ăn uống: Có\n- Hoạt động hằng ngày: Không\n\n**Nhận xét:**\nVợ chồng tôi muốn tham gia chuyến đi thuyền buồm nhưng được thông báo thuyền chỉ chở được 24 hành khách và đã kín chỗ. Vì vậy, chúng tôi hỏi về chuyến tham quan thành phố Maya, nhưng chuyến đó cũng đã được đặt kín hoàn toàn. May mắn thay, chúng tôi đã tham gia được chuyến đi ngày 19 tháng 1 và rất thích chuyến đi ấy. Tôi đề nghị nên bổ sung thêm chỗ cho các chuyến tham quan, đặc biệt trong mùa du lịch cao điểm.","translationStatus":"reviewed"},{"id":"h3/test03/191_ABBDC.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 191–195","questions":{"191":"A","192":"B","193":"B","194":"D","195":"C"},"image":"data/h3/test03/191_ABBDC.png","markedImage":"marked/h3/test03/191_ABBDC.png","translation":"### Thư thông báo nghỉ hưu\n\nNgày 4 tháng 2\n\nKính gửi bà Montessori,\n\nNhư bà có lẽ đã biết, hợp đồng của tôi sẽ hết hạn vào cuối tháng Ba. Chúng ta đã trao đổi về kế hoạch nghỉ hưu của tôi, nên hy vọng điều này không gây bất ngờ. **Lá thư này là thông báo chính thức về ý định thôi giữ chức Phó chủ tịch phụ trách tài chính của công ty.** Tôi sẵn lòng ở lại thêm một tháng để đào tạo và hỗ trợ người thay thế do bà lựa chọn.\n\nTôi thực sự trân trọng quãng thời gian làm việc tại Homestead Properties và mọi sự hỗ trợ đã nhận được trong những năm qua. Tôi sẽ nhớ những đồng nghiệp tuyệt vời của mình, nhưng vẫn sẽ giữ liên lạc.\n\nCảm ơn bà và ban giám đốc vì tất cả những cơ hội đã dành cho tôi.\n\nTrân trọng,\n\nEdward Grainger\n\n---\n\n### E-mail chuẩn bị tiệc\n\n**Đến:** Florence Ingram <f.ingram@homesteadprop.com>  \n**Từ:** Elizabeth Montessori <e.montessori@homesteadprop.com>  \n**Chủ đề:** Chuẩn bị tiệc  \n**Ngày:** 12 tháng 3\n\nChào Florence,\n\nChắc cô đã nghe tin về ông Grainger. Tôi muốn tổ chức một bữa tiệc tối để vinh danh ông ấy. Cô đã làm rất tốt khi tổ chức lễ trao giải của chúng ta vào mùa thu năm ngoái, nên tôi muốn nhờ cô **phụ trách luôn việc sắp xếp cho sự kiện này**.\n\nChúng ta dự định chi tối đa 6.000 đô la cho địa điểm tổ chức. Ban giám đốc sẽ lo phần quà. Sự kiện dự kiến diễn ra vào thứ Sáu, ngày 27 tháng 3. Tôi có thể gửi danh sách khách mời vào cuối hôm nay. Tôi dự kiến khoảng 50–60 người tham dự. Như lần trước, công ty vui lòng trả thêm cho cô 500 đô la trong kỳ lương tới để đền đáp công sức. Hãy báo cho tôi biết ngay khi có thể nếu cô quan tâm.\n\nTrân trọng,\n\nElizabeth Montessori  \nGiám đốc vận hành, Homestead Properties Inc.\n\n---\n\n### Xác nhận đặt địa điểm sự kiện — Khách sạn Grand-Mont\n\n**Tên:** Florence Ingram  \n**Công ty:** Homestead Properties Inc.  \n**Điện thoại:** (604) 555-4995  \n**E-mail:** f.ingram@homesteadprop.com  \n**Ngày tổ chức:** 27 tháng 3  \n**Thời gian:** 7 giờ tối–10 giờ tối  \n**Địa điểm:** Sảnh sự kiện Victoriana, tầng 2  \n**Số khách:** 66\n\n**Bữa ăn:** Bữa tối bốn món, có lựa chọn thịt bò, cá và món chay  \n**Đồ uống:** Quầy bar mở phục vụ nước ngọt, rượu vang và cocktail  \n**Yêu cầu đặc biệt:** **Micrô và hệ thống trình chiếu có âm thanh**\n\nBiểu mẫu này xác nhận việc đặt chỗ và việc đã nhận khoản đặt cọc 2.500 đô la. Số tiền 2.500 đô la còn lại phải được thanh toán sau khi sự kiện kết thúc. Nếu hủy đặt chỗ, khoản đặt cọc sẽ không được hoàn lại. Tổng chi phí 5.000 đô la đã bao gồm phí dịch vụ 500 đô la.","translationStatus":"reviewed"},{"id":"h3/test03/196_BDAAD.png","folder":"h3/test03","book":"h3","bookLabel":"Hacker 3","test":"test03","testLabel":"Test 03","title":"Hacker 3 · Test 03 · Câu 196–200","questions":{"196":"B","197":"D","198":"A","199":"A","200":"D"},"image":"data/h3/test03/196_BDAAD.png","markedImage":"marked/h3/test03/196_BDAAD.png","translation":"### Quảng cáo cho thuê căn hộ trung tâm thành phố\n\n**Địa chỉ: 543 Mapleton Street**\n\nCăn hộ rộng 950 feet vuông này nằm ở trung tâm thành phố, trong tòa Portsmouth Residential Towers. Căn hộ gồm hai phòng ngủ, phòng khách, bếp và khu vực ăn uống, phòng tắm, phòng làm việc và ban công. Vị trí thuận tiện, gần trạm xe buýt, ga tàu điện ngầm và trung tâm mua sắm. Căn hộ đi kèm **một chỗ đậu xe trong gara của tòa nhà; chi phí đã được tính trong tiền thuê 1.900 đô la mỗi tháng**.\n\nGiấy dán tường mới sẽ được lắp cho người thuê mới. Căn hộ có thể dọn vào ngay sau khi công việc hoàn tất vào ngày 30 tháng 8. Hợp đồng thuê có thời hạn một hoặc hai năm và có thể gia hạn. Người thuê phải đặt cọc một tháng tiền thuê và cung cấp thư giới thiệu từ chủ nhà trước đây.\n\nĐể đặt lịch xem nhà, vui lòng liên hệ George Lee qua e-mail georgelee@vendorealty.com hoặc gọi số 555-0393.\n\n---\n\n### Tin nhắn từ Neil Kaplun gửi George Lee\n\n**Nhận lúc 4 giờ 10 chiều, ngày 25 tháng 5**\n\nCảm ơn anh đã dẫn tôi xem ba căn hộ sáng nay. Tôi muốn thuê căn ở Mapleton Street. Tôi hiểu rằng chủ nhà cần thư giới thiệu trước khi ký bất kỳ thỏa thuận nào. Anh ấy có thể liên hệ Miranda Chase tại mirandac@verymail.com. **Cô ấy là chủ căn hộ studio mà tôi đang thuê tại Tanner Hill Condominiums.** Tôi sẵn sàng ký hợp đồng hai năm và chuyển vào ngay khi giấy dán tường mới được lắp xong. Cảm ơn anh.\n\n---\n\n### Thông báo dành cho toàn thể người thuê nhà\n\nBãi đậu xe ngầm của Tanner Hill Condominiums sẽ được lát lại trong tuần này. Công việc bắt đầu vào thứ Hai, ngày 30 tháng 5 và kéo dài đến thứ Sáu. Bãi xe không chỉ đóng cửa trong thời gian thi công mà còn trong cả cuối tuần, vì bê tông cần thời gian đông cứng hoàn toàn. Người thuê có thể đậu xe trở lại trong gara từ thứ Hai, ngày 6 tháng 6.\n\nNgười thuê cần **di chuyển xe vào ngày trước khi công việc bắt đầu**, đến bãi Downtown Parkade ở phía đối diện đường, tại 168 Beauregard Avenue. Chỉ cần lấy thẻ tạm thời tại phòng vé của bãi xe và đặt trên kính chắn gió.\n\nChúng tôi xin lỗi vì mọi bất tiện và gián đoạn do công việc gây ra. Để biết thêm chi tiết, vui lòng liên hệ văn phòng quản lý tòa nhà theo số 555-4958 trong giờ làm việc, từ 8 giờ sáng đến 4 giờ chiều, thứ Hai đến thứ Sáu.","translationStatus":"reviewed"},{"id":"h3/test04/131_BCAB.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 131–134","questions":{"131":"B","132":"C","133":"A","134":"B"},"image":"data/h3/test04/131_BCAB.png","markedImage":"marked/h3/test04/131_BCAB.png","translation":"**BẢN GHI NHỚ**\n\n**Gửi:** Toàn thể nhân viên  \n**Từ:** Greg Birch, Giám đốc Công nghệ  \n**Chủ đề:** Máy chủ  \n**Ngày:** 2 tháng 3\n\nNhư mọi người có thể đã biết, máy chủ của công ty **đã bị ngắt kết nối**. Mặc dù sự gián đoạn chỉ diễn ra tạm thời và máy chủ hiện đã hoạt động trở lại, tôi đang cân nhắc chuyển sang một hệ thống khác. **Nếu** máy chủ lại ngừng hoạt động, điều đó có thể gây ra vấn đề nghiêm trọng.\n\nVì muốn ngăn tình trạng này tái diễn, tôi đã trao đổi với Jason, trưởng nhóm CNTT. Anh ấy có thể cài đặt một máy chủ mới ít **có nguy cơ** gặp trục trặc hơn. **Ngoài ra, máy chủ mới sẽ có dung lượng bộ nhớ lớn hơn và khả năng bảo mật tốt hơn.** Rất may, chúng ta có thể chuyển các tệp từ máy chủ cũ sang máy chủ mới mà không gặp khó khăn.\n\nTôi sẽ tiếp tục cập nhật cho mọi người khi nhận thêm thông tin từ Jason.","translationStatus":"reviewed"},{"id":"h3/test04/135_BBDC.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 135–138","questions":{"135":"B","136":"B","137":"D","138":"C"},"image":"data/h3/test04/135_BBDC.png","markedImage":"marked/h3/test04/135_BBDC.png","translation":"Nicole Freemont  \n1452 Reservoir Road NW  \nWashington, D.C. 20057\n\nKính gửi cô Freemont,\n\nTôi rất vui được xác nhận tư cách thành viên của cô tại Hợp tác xã Thực phẩm Georgetown. **Theo đó**, chúng tôi gửi kèm thẻ thành viên của cô. Khi ủng hộ chúng tôi, cô đang góp phần giúp thực phẩm trở nên vừa túi tiền hơn đối với cộng đồng. Đó là vì chúng tôi lấy sản phẩm từ các doanh nghiệp địa phương nên chi phí vận chuyển và sản xuất thấp hơn.\n\nTuy nhiên, chúng tôi chỉ có thể **duy trì hoạt động** khi nhận được sự hỗ trợ tích cực của tất cả thành viên. Vì vậy, chúng tôi đề nghị mỗi thành viên đóng góp bốn giờ làm việc tình nguyện tại cửa hàng mỗi tháng. **Nếu không thể thực hiện, cô có thể đóng khoản phụ phí 20 đô la mỗi tháng.**\n\nNgoài ra, chúng tôi khuyến khích cô ghé qua để làm quen với những vấn đề liên quan đến chi phí thực phẩm **ngày càng tăng**, đồng thời tìm hiểu những cách khác mà cô có thể hỗ trợ.\n\nThân ái,\n\nEdwin Krueger  \nĐiều phối viên thành viên  \nHợp tác xã Thực phẩm Georgetown","translationStatus":"reviewed"},{"id":"h3/test04/139_DABD.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 139–142","questions":{"139":"D","140":"A","141":"B","142":"D"},"image":"data/h3/test04/139_DABD.png","markedImage":"marked/h3/test04/139_DABD.png","translation":"**Lãnh địa mới của Aarhus Clothing**\n\nCông chúng Anh đang háo hức chờ đón cửa hàng đầu tiên của Aarhus Clothing tại Vương quốc Anh. Công ty Đan Mạch này nổi tiếng nhờ liên tục đạt mức độ hài lòng cao của khách hàng. Thương hiệu nhanh chóng được biết đến rộng rãi tại quê nhà. **Sau đó, sự nổi tiếng của công ty lan sang các quốc gia lân cận.**\n\nAarhus Clothing mở cửa hàng đầu tiên tại Đức cách đây hai năm, rồi nhanh chóng tiến vào Bỉ và Hà Lan. Với việc khai trương cửa hàng chủ lực trên phố Oxford ở Luân Đôn vào tháng tới, công ty hy vọng nổi bật giữa thị trường thời trang **sinh lợi cao** của Vương quốc Anh.\n\nNhà thiết kế Mads Jensen nói với báo giới: “Các sản phẩm của chúng tôi được ưa chuộng tại châu Âu suốt nhiều năm vì có thiết kế đơn giản và **bền**. Vì kiểu dáng cơ bản và sử dụng lâu dài, chúng tôi tin rằng chúng cũng sẽ được yêu thích không kém tại Vương quốc Anh.”","translationStatus":"reviewed"},{"id":"h3/test04/143_CAAD.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 143–146","questions":{"143":"C","144":"A","145":"A","146":"D"},"image":"data/h3/test04/143_CAAD.png","markedImage":"marked/h3/test04/143_CAAD.png","translation":"**Biến giấc mơ lặn biển của bạn thành hiện thực!**\n\nCác khóa cấp chứng chỉ mùa hè của Trung tâm Lặn Estrella sẽ bắt đầu tại cơ sở Playa Del Carmen vào ngày 2 tháng 6. Học viên không cần có **kiến thức hướng dẫn** trước đó vì các huấn luyện viên sẽ dạy toàn bộ kỹ thuật cơ bản dành cho người mới bắt đầu. **Người học phải đáp ứng một số tiêu chí nhất định trước khi tham gia khóa học.**\n\nNhư thường lệ, học viên không được có bệnh lý sẵn có và phải từ 13 tuổi trở lên. Những người không đáp ứng **một trong hai** yêu cầu này sẽ không thể đăng ký.\n\nMọi thiết bị đều được cung cấp, và chương trình đào tạo gồm ba buổi **liên tiếp** trong cùng một ngày. Mỗi buổi kéo dài một giờ, xen giữa là những quãng nghỉ ngắn. Thời gian đăng ký bắt đầu vào thứ Hai, ngày 3 tháng 5.","translationStatus":"reviewed"},{"id":"h3/test04/147_DA.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 147–148","questions":{"147":"D","148":"A"},"image":"data/h3/test04/147_DA.png","markedImage":"marked/h3/test04/147_DA.png","translation":"**Ủy ban Phát triển Giáo dục Thế giới trân trọng kính mời bạn tham dự**\n\n### Hội chợ Du học Portland thường niên lần thứ 20\n\n**Ngày 10–14 tháng 1, từ 10:00 sáng đến 4:00 chiều**  \nBarrington Exhibition Hall  \n475 Wharton Drive, Portland, Oregon\n\nỦy ban Phát triển Giáo dục Thế giới tự hào tổ chức sự kiện này tại trung tâm thành phố Portland. Hội chợ quy tụ **hơn 2.000 đại diện của các trường đại học, cao đẳng, trường ngôn ngữ và những cơ sở giáo dục khác trên khắp thế giới**.\n\nBạn có thể tham dự vào bất kỳ ngày nào của hội chợ bằng cách **xuất trình thiệp mời này tại bàn đăng ký gần lối vào phía trước của sảnh triển lãm**. Người nhận thiệp được phép đưa thêm một khách đi cùng.","translationStatus":"reviewed"},{"id":"h3/test04/149_BC.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 149–150","questions":{"149":"B","150":"C"},"image":"data/h3/test04/149_BC.png","markedImage":"marked/h3/test04/149_BC.png","translation":"**Bảo tàng Khoa học Vũ trụ — Thông báo dành cho khách tham quan**\n\nXin lưu ý rằng tòa nhà chính của Bảo tàng Khoa học Vũ trụ tại 290 Chamomile Street sẽ **đóng cửa từ ngày 4 đến ngày 8 tháng 6 để thực hiện công việc trùng tu theo lịch**.\n\nCông việc sẽ cải thiện nền móng và thiết kế nội thất của một số phòng triển lãm, qua đó nâng cao trải nghiệm tham quan. Cung thiên văn của bảo tàng cũng sẽ đóng cửa để nhân viên lắp thiết bị mới và nâng cấp ghế ngồi.\n\nTuy nhiên, **các tòa nhà phụ của bảo tàng vẫn mở cửa trong thời gian này**. Khách có vé tham quan triển lãm đặc biệt *Những mặt trăng của Sao Thổ* vẫn có thể vào Orbital Hall. Tương tự, người muốn xem khu trưng bày phương tiện vận tải không gian vẫn có thể đến Satellite Hall.\n\nTất cả cơ sở của bảo tàng sẽ chính thức mở cửa trở lại vào thứ Năm, ngày 9 tháng 6. Chúng tôi xin lỗi vì sự bất tiện.","translationStatus":"reviewed"},{"id":"h3/test04/151_DC.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 151–152","questions":{"151":"D","152":"C"},"image":"data/h3/test04/151_DC.png","markedImage":"marked/h3/test04/151_DC.png","translation":"**E-mail về Burton Farms**\n\n**Gửi:** Joseph Hillier  \n**Từ:** Marilyn Sharpe  \n**Chủ đề:** Burton Farms  \n**Ngày:** 21 tháng 10  \n**Đính kèm:** Danh sách sản phẩm\n\nJoseph,\n\nNhư anh đã biết, chúng ta đang đàm phán một thỏa thuận với Burton Farms để **bán một số sản phẩm sữa của họ tại tất cả các siêu thị của chúng ta ở vùng Trung Tây**. Tùy theo mức độ tiêu thụ, sau này chúng ta có thể phân phối các sản phẩm ấy đến những cửa hàng khác trên toàn quốc.\n\nLiên quan đến việc này, tôi muốn đội của anh hoàn tất một bài thuyết trình để kịp buổi gặp với Burton Farms vào ngày 11 tháng tới. Anh cần nghiên cứu vị thế thương hiệu và thị trường mục tiêu của họ. Tiếp theo, hãy đề xuất cách sắp xếp sản phẩm trên kệ và quảng bá tới khách hàng. Tôi đã đính kèm danh sách sản phẩm của Burton Farms và **đánh dấu những mặt hàng chúng ta dự định bán**. Tôi sẽ có mặt tại văn phòng cả tuần nếu anh muốn trao đổi thêm.\n\nCảm ơn!\n\nMarilyn Sharpe  \nPhó chủ tịch phụ trách tiếp thị  \nRomano’s Groceries","translationStatus":"reviewed"},{"id":"h3/test04/153_ACD.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 153–155","questions":{"153":"A","154":"C","155":"D"},"image":"data/h3/test04/153_ACD.png","markedImage":"marked/h3/test04/153_ACD.png","translation":"**Cuộc thi nghệ thuật thường niên lần thứ ba — “Nước cho mọi người”**\n\nSở Nước Millsboro kêu gọi tất cả học sinh trong khu vực tham gia cuộc thi nghệ thuật thường niên lần thứ ba. Chủ đề cuộc thi năm nay là **Nước cho mọi người**.\n\nCuộc thi dành cho học sinh Millsboro từ lớp 4 đến lớp 12. Tác phẩm dự thi phải là tác phẩm gốc, được thực hiện trên bảng hoặc giấy áp phích kích thước 75 x 110 cm, có đường viền 3 cm ở tất cả các cạnh. Thí sinh có thể sử dụng bất kỳ chất liệu truyền thống nào như phấn màu, bút chì màu, màu nước, giấy cắt hoặc vải. Tuy nhiên, **tác phẩm tạo bằng máy tính và ảnh chụp sẽ không được chấp nhận**. Học sinh có thể nhận hướng dẫn từ cha mẹ, giáo viên hoặc người giám hộ nhưng phải tự mình thực hiện toàn bộ tác phẩm.\n\nNgười đoạt giải nhất ở mỗi khối lớp sẽ nhận 300 đô la tiền mặt và thẻ quà tặng 200 đô la từ đơn vị đồng tài trợ Millsboro Shopping Center. Ngoài ra, ba thí sinh khác sẽ nhận thẻ quà tặng 100 đô la, cũng do trung tâm mua sắm cung cấp. Cùng với những bài dự thi khác, **các tác phẩm đoạt giải sẽ xuất hiện trong lịch nghệ thuật học sinh của năm sau; cuốn lịch sẽ được phát miễn phí cho khách hàng của Sở Nước Millsboro vào đầu năm tới**.\n\nHạn chót nhận bài là ngày 30 tháng 4. Để biết thêm thông tin, truy cập www.mwd.com/art_contest.","translationStatus":"reviewed"},{"id":"h3/test04/156_CC.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 156–157","questions":{"156":"C","157":"C"},"image":"data/h3/test04/156_CC.png","markedImage":"marked/h3/test04/156_CC.png","translation":"**Chuỗi tin nhắn về dự án Lambert**\n\n**Dawn Konrad — 4:48 chiều**\nYoon-Hee, ngày mai cô có bận không? Cô Jackson nhắn rằng chúng ta cần gấp người làm dự án Lambert. **Tối mai tôi sẽ làm thêm giờ cho dự án và rất cần cô giúp.**\n\n**Yoon-Hee Sung — 4:51 chiều**\nNgày mai tôi sẽ đi dự hội nghị tiếp thị, nhớ không? Tôi sẽ vắng văn phòng hai ngày.\n\n**Dawn Konrad — 4:52 chiều**\nÀ, đúng rồi. Tôi quên mất. Tôi có nên hỏi ông Martin không?\n\n**Yoon-Hee Sung — 4:54 chiều**\nTôi sẽ thử nhờ ông Stewart. **Ông ấy đã làm dự án lâu hơn và biết Percy Lambert rất rõ.**\n\n**Dawn Konrad — 5:00 chiều**\nTôi sẽ làm vậy. Cảm ơn cô và chúc chuyến đi thuận lợi!","translationStatus":"reviewed"},{"id":"h3/test04/158_BAD.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 158–160","questions":{"158":"B","159":"A","160":"D"},"image":"data/h3/test04/158_BAD.png","markedImage":"marked/h3/test04/158_BAD.png","translation":"**Nâng tầm bản thân**\n\nDù bạn là vận động viên chuyên nghiệp hay chỉ là người tập luyện nhiệt tình, một đôi giày phù hợp đóng vai trò thiết yếu trong việc cải thiện **khả năng thi đấu**. Giày thể thao Lynx là kết quả của 25 năm nghiên cứu và thử nghiệm để tạo ra đôi giày thể thao hoàn hảo. Jet Shoe Company đã hợp tác với một số nhà khoa học thể thao hàng đầu và tiến hành thử nghiệm cùng những vận động viên hàng đầu thế giới để phát triển Lynx. Nỗ lực đó thể hiện trong mọi hoạt động của bạn khi mang giày.\n\nCông nghệ Absorbex được cấp bằng sáng chế giúp **giảm chấn động lên các khớp khi chạy**, đồng thời tạo bề mặt vững chắc để bật lên. Phần cổ giày được thiết kế đặc biệt nhằm tăng độ ổn định cho mắt cá chân, qua đó giảm nguy cơ bong gân. Lynx được các vận động viên hàng đầu như vận động viên chạy nước rút Dwayne Harrison và cầu thủ bóng rổ Andrew Singer sử dụng. Huấn luyện viên Dennis Potts của đội bóng bầu dục Baltimore Crabs khuyên tất cả cầu thủ mang giày có công nghệ này khi tập luyện.\n\nLynx có bán tại **hầu hết các cửa hàng bán lẻ đồ thể thao thông thường**. Để tìm cửa hàng gần nhất, hãy truy cập www.jetshoe.com.","translationStatus":"reviewed"},{"id":"h3/test04/161_DDB.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 161–163","questions":{"161":"D","162":"D","163":"B"},"image":"data/h3/test04/161_DDB.png","markedImage":"marked/h3/test04/161_DDB.png","translation":"**Khách sạn Winspear**  \n3498 Ada Boulevard, Edmonton AB T6A 2C1\n\nNgày 14 tháng 11\n\nKính gửi ông Mansbridge,\n\nCảm ơn ông đã gửi thư ngày 12 tháng 11 về kỳ nghỉ tại Khách sạn Winspear ở Edmonton. Tôi hiểu rằng ông và một đồng nghiệp là khách của chúng tôi từ ngày 8 đến ngày 10 tháng 11 nhưng đã gặp một số vấn đề trong chuyến đi.\n\nQuản lý trực, cô Melanie Depuis, cho biết một trong những phòng ông đặt đã bị đặt trùng. **Do khách sạn đã kín phòng khi ông đến nên chúng tôi không thể sửa sai; vì vậy ông buộc phải ở chung phòng với người đồng hành.** Chúng tôi thành thật xin lỗi và gửi kèm **hai phiếu nghỉ một đêm miễn phí tại bất kỳ Khách sạn Winspear nào trên toàn quốc—một phiếu cho ông và một phiếu cho cộng sự David Solomon**.\n\nÔng cũng nói rằng dù bữa sáng được quảng cáo là miễn phí, ông vẫn phải trả tiền. Về vấn đề này, bữa sáng chỉ miễn phí cho khách lưu trú trong phòng hạng cao cấp. Vì ông và ông Solomon ở phòng tiêu chuẩn nên chúng tôi phải tính phí bữa sáng. Tôi xin lỗi vì sự hiểu nhầm.\n\nChúng tôi trân trọng sự ủng hộ lâu dài của khách hàng và hy vọng các phiếu nghỉ sẽ bù đắp phần nào sự bất tiện.\n\nTrân trọng,\n\nKimberley Bell  \nTổng quản lý, Khách sạn Winspear Edmonton","translationStatus":"reviewed"},{"id":"h3/test04/164_DCBB.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 164–167","questions":{"164":"D","165":"C","166":"B","167":"B"},"image":"data/h3/test04/164_DCBB.png","markedImage":"marked/h3/test04/164_DCBB.png","translation":"**Pure Mix**  \nHộp thư 12525, Oregon City, OR 97045\n\nKính gửi ông McCall,\n\nChúng tôi đã nhận được câu hỏi của ông về thực phẩm bổ sung vitamin hằng ngày có nguồn gốc tự nhiên. Ông hỏi sản phẩm có chứa hóa chất hoặc nguyên liệu phi hữu cơ hay không. Ông cũng hỏi về một số nguyên liệu dùng để sản xuất bột vitamin vì ông dị ứng với dâu tây và không thể dùng bưởi vì lý do y tế.\n\nĐúng như quảng cáo, chúng tôi là nhà cung cấp **các sản phẩm hữu cơ được chứng nhận**, do đó hoàn toàn không có hóa chất hay vật liệu không tự nhiên trong sản phẩm. Nguyên liệu hữu cơ của chúng tôi có chất lượng cao nhất, chỉ được làm từ trái cây, thực vật và động vật nuôi tự nhiên.\n\nNhư đã nêu, sản phẩm của chúng tôi có sử dụng trái cây. Tuy nhiên, thực phẩm bổ sung vitamin hằng ngày không chứa dâu tây hoặc bưởi, nên ông có thể dùng an toàn mà không phải lo phản ứng dị ứng với dâu tây hay tương tác thuốc với bưởi. Tuy vậy, một số sản phẩm khác có thể chứa một trong hai loại quả này. Chẳng hạn, **nước tăng lực Pure Mix có chứa hạt bưởi**.\n\nTôi hy vọng đã trả lời thỏa đáng các câu hỏi của ông. Kèm theo thư là tài liệu giới thiệu về những sản phẩm phổ biến nhất. Như thường lệ, **nếu định bắt đầu dùng vitamin thường xuyên, chúng tôi đặc biệt khuyên ông nên tham khảo ý kiến bác sĩ trước**.\n\nTrân trọng,\n\nLinda Mills  \nQuản lý quan hệ khách hàng","translationStatus":"reviewed"},{"id":"h3/test04/168_DBBC.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 168–171","questions":{"168":"D","169":"B","170":"B","171":"C"},"image":"data/h3/test04/168_DBBC.png","markedImage":"marked/h3/test04/168_DBBC.png","translation":"**Một ý tưởng đầy hoa quả**\n\nCác thành phố của chúng ta có rất nhiều cây xanh, và phần lớn trong số đó cho quả ăn được. Nhưng vì không có ai thu hái và chế biến, đa số quả chỉ rụng xuống đất rồi thối đi, làm lãng phí một nguồn dinh dưỡng tiềm năng rất tốt.\n\nMột tổ chức mới muốn thay đổi tình trạng này. Fresh From The Tree là tổ chức phi lợi nhuận đặt mục tiêu **thu hái càng nhiều trái cây trên cây trong thành phố càng tốt, sau đó chế biến thành những món ăn ngon bán với giá thấp cho cư dân địa phương**.\n\n“Chúng tôi đã khảo sát vị trí của tất cả cây ăn quả trong thành phố,” đồng sáng lập Michaela Anderson cho biết. “Khi xác định được một cây có triển vọng, chúng tôi liên hệ chủ nhà và hỏi liệu có thể hái quả giúp họ không. **Phần lớn cư dân vui vẻ chấp nhận đề nghị này.** Họ thường không có thời gian tự xử lý.”\n\nSau khi tình nguyện viên thu hái, **một nửa số quả được trao cho chủ nhà**, nửa còn lại được dùng làm bánh nướng, mứt, kem trái cây và các món tráng miệng ngon nhưng lành mạnh khác. Hiện nhóm chỉ có một số ít tình nguyện viên nhưng hy vọng tuyển thêm trong những tháng tới. Họ cũng đang đàm phán với thành phố để thu hái quả trên các cây thuộc khu đất của chính quyền.","translationStatus":"reviewed"},{"id":"h3/test04/172_DBBA.png","folder":"h3/test04","book":"h3","bookLabel":"Hacker 3","test":"test04","testLabel":"Test 04","title":"Hacker 3 · Test 04 · Câu 172–175","questions":{"172":"D","173":"B","174":"B","175":"A"},"image":"data/h3/test04/172_DBBA.png","markedImage":"marked/h3/test04/172_DBBA.png","translation":"**Cuộc trò chuyện trực tuyến về bài thuyết trình cho Harper Telecom**\n\n**Cheryl Stone — 3:48 chiều**\nTôi vừa nhận được tin nhắn của ông Baker nói rằng chuyến bay của ông ấy bị hoãn đến 9 giờ tối. Thời tiết ở Chicago rất tệ.\n\n**Allan Franklin — 3:50 chiều**\nThật sao? Nhưng hôm nay ông ấy phải **thuyết trình trước các lãnh đạo của Harper Telecom** mà!\n\n**Maurice Wood — 3:51 chiều**\nTôi đã chuẩn bị xong toàn bộ hình ảnh minh họa. Nhưng sẽ rất khó nếu chúng ta không có người thuyết trình.\n\n**Allan Franklin — 3:52 chiều**\nChắc chắn rồi. **Chúng ta cần hợp đồng này, nếu không có thể không đạt mục tiêu doanh số trong năm.**\n\n**Cheryl Stone — 3:54 chiều**\nChúng ta không thể tự thuyết trình sao?\n\n**Allan Franklin — 3:55 chiều**\nTôi không chắc. Có vài công ty đang cạnh tranh để giành hợp đồng mà chúng ta muốn. Harper Telecom có thể trao hợp đồng cho bên khác nếu không ấn tượng với bài thuyết trình của chúng ta.\n\n**Cheryl Stone — 3:57 chiều**\nTôi nghĩ mình có thể đứng nói, nhưng nếu không có **kiến thức nền và chuyên môn kỹ thuật của ông Baker**, đề xuất của chúng ta có lẽ sẽ không đủ thuyết phục. Anh nghĩ sao?\n\n**Allan Franklin — 3:58 chiều**\nTôi đồng ý. Tôi nghĩ tốt hơn hết nên gọi Harper Telecom và cố thuyết phục họ nghe bài trình bày vào sáng mai. Đó có thể là lựa chọn tốt nhất.\n\n**Cheryl Stone — 3:59 chiều**\n**Tôi sẽ xử lý ngay.** Tôi sẽ báo anh biết kết quả.","translationStatus":"reviewed"},{"id":"h3/test04/176_BCBDD.png","folder":"
