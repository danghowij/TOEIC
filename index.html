148","questions":{"147":"C","148":"D"},"image":"data/h2/test09/147_CD.png","markedImage":"marked/h2/test09/147_CD.png","translation":"**EVERIDGE CERTIFIED ACCOUNTANTS (ECA)**\n\nBạn gặp khó khăn với biểu mẫu thuế? Tình hình tài chính của doanh nghiệp nhỏ vượt quá khả năng xử lý? Hãy để ECA, một trong những công ty kế toán phát triển nhanh nhất Canada, giải quyết mọi nỗi lo kế toán của bạn.\n\nDịch vụ gồm:\n- Khai thuế thu nhập cá nhân\n- Thiết lập và duy trì hệ thống sổ sách kế toán\n- Lập báo cáo tài chính\n- Hỗ trợ soạn thảo hợp đồng\n\nĐể xem đầy đủ danh sách dịch vụ, mức phí và **thông tin về các kế toán viên**, truy cập www.everidgeacc.co.ca. Muốn gặp trực tiếp, hãy đặt lịch qua số (604) 555-8872 hoặc everidgeacc@coolmail.com.\n\nĐáp án: **147 C, 148 D**.","translationStatus":"reviewed"},{"id":"h2/test09/149_DC.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 149–150","questions":{"149":"D","150":"C"},"image":"data/h2/test09/149_DC.png","markedImage":"marked/h2/test09/149_DC.png","translation":"**ĐÊM NHẠC TỪ THIỆN MELODY THƯỜNG NIÊN LẦN THỨ 12**\n\nHội Chuyên gia New Hampton trân trọng kính mời quý vị tham dự vào lúc 6 giờ tối thứ Bảy, ngày 24 tháng 7, tại Nhà hát Greenfield.\n\nDàn nhạc Giao hưởng Smithson sẽ biểu diễn sáu tác phẩm cổ điển của các nhà soạn nhạc nổi tiếng thế giới và cựu sinh viên Nhạc viện Salzburg, Johannes Linden và Vladimir Tepanor. Khách tham dự phải mặc trang phục trang trọng.\n\nBan tổ chức nhận tiền quyên góp trong đêm diễn; toàn bộ số tiền được chuyển đến Rainbow House thuộc Bệnh viện Đa khoa New Hampton, cơ sở y tế chuyên chăm sóc bệnh nhi. Vui lòng xác nhận tham dự tại www.newhamptonhospital.com.\n\nĐáp án: **149 D, 150 C**.","translationStatus":"reviewed"},{"id":"h2/test09/151_DB.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 151–152","questions":{"151":"D","152":"B"},"image":"data/h2/test09/151_DB.png","markedImage":"marked/h2/test09/151_DB.png","translation":"**Chuỗi tin nhắn**\n\n**Gary Perkins – 1:25 chiều:** Allie, kỳ nghỉ Cancun của cô diễn ra khi nào? Ngày 18 cô vẫn vắng mặt chứ?\n\n**Allie Chen – 1:27:** Đúng vậy, tôi đi bốn ngày từ 16 đến 19. Có việc gì sao?\n\n**Gary – 1:28:** Ngày 18 có diễn giả đến thuyết trình. Tôi đang tìm người hỗ trợ vì hôm đó là Chủ nhật.\n\n**Gary – 1:29:** Tôi đã có đủ tình nguyện viên lo tiệc và trang trí. Tôi sẽ tự đón diễn giả nên chỉ cần người dựng sân khấu.\n\n**Allie – 1:29:** Tôi hiểu. Xin lỗi vì không giúp được.\n\n**Gary – 1:31:** Không sao. **Tôi còn nhiều người để hỏi; chắc chắn sẽ có người rảnh.**\n\n**Allie – 1:34:** Nếu nhớ đúng, cô Farley sẽ trở về sau kỳ nghỉ vào ngày 13.\n\n**Gary – 1:35:** Vậy à? Tôi sẽ nhắn cho cô ấy sau. Cảm ơn Allie.\n\nĐáp án: **151 D, 152 B**.","translationStatus":"reviewed"},{"id":"h2/test09/153_CBA.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 153–155","questions":{"153":"C","154":"B","155":"A"},"image":"data/h2/test09/153_CBA.png","markedImage":"marked/h2/test09/153_CBA.png","translation":"**MÁY BÁN ĐỒ UỐNG LẠNH REFRESH D-02**\n\nMáy Refresh D-02 mới cung cấp nhiều lựa chọn đồ uống đóng chai và lon hơn. Máy chứa được 10 loại đồ uống, từ nước ngọt, nước trái cây đến nước đóng chai. Đây là phiên bản cải tiến của D-01, vẫn có bảng hiển thị có đèn nền tháo rời và các khay sản phẩm nạp nhanh.\n\nThông số: cao 1,8 m; rộng và sâu 0,8 m; nặng 261 kg; sức chứa tiêu chuẩn 200 chai loại 20 ounce. Thiết bị thanh toán nhận **tiền giấy, tiền xu và thẻ tín dụng**.\n\nĐể biết thêm chi tiết, gọi 555-8591 hoặc truy cập www.timeoutvendors.com. **Quảng cáo không nêu giá thuê máy.**\n\nĐáp án: **153 C, 154 B, 155 A**.","translationStatus":"reviewed"},{"id":"h2/test09/156_CCB.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 156–158","questions":{"156":"C","157":"C","158":"B"},"image":"data/h2/test09/156_CCB.png","markedImage":"marked/h2/test09/156_CCB.png","translation":"**HÃY ĐẾN HỘI CHỢ QUÀ TẶNG NGÀY LỄ PORTLAND!**\n\nThành phố Portland và Trung tâm Hội nghị Willamette thông báo Hội chợ Quà tặng Ngày lễ diễn ra từ ngày 25 tháng 11 đến 8 tháng 12, mở cửa hằng ngày từ 10 giờ sáng đến 9 giờ tối. Hội chợ quy tụ hơn 600 nhà cung cấp tại Riverside Hall, **khu triển lãm lớn nhất của trung tâm**.\n\nVé vào cửa là 5 đô la cho người lớn và 3 đô la cho trẻ dưới 12 tuổi hoặc người cao tuổi. Trẻ dưới 5 tuổi miễn phí. Khách còn có thể tham gia rút thăm hằng giờ với hơn 18.000 đô la hàng hóa được trao trong hai tuần. Các gian hàng bán quà, đồ trang trí, thiệp, đồ chơi, thực phẩm và nhiều sản phẩm khác.\n\nXem danh sách nhà cung cấp tại www.willamettecon.com/events. Vé được bán trực tuyến từ ngày 10 tháng 11 hoặc tại cửa Riverside Hall.\n\nĐáp án: **156 C, 157 C, 158 B**.","translationStatus":"reviewed"},{"id":"h2/test09/159_CD.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 159–160","questions":{"159":"C","160":"D"},"image":"data/h2/test09/159_CD.png","markedImage":"marked/h2/test09/159_CD.png","translation":"**Chủ đề: Phản hồi về tín hiệu kém**\n\nKính gửi ông Jude Feldstein,\n\nCảm ơn ông đã báo về tình trạng tín hiệu chập chờn của dịch vụ điện thoại không dây trong vài ngày qua. Ông yêu cầu giải thích nguyên nhân và đề nghị giảm phí dịch vụ tháng này.\n\nChúng tôi cho rằng sự cố xuất phát từ công việc sửa chữa đang diễn ra tại các tháp phát sóng ở Mountainview, vốn bị hư hại nặng trong trận bão tuyết gần đây. Đội bảo trì vẫn đang khắc phục.\n\nChúng tôi xin lỗi vì bất tiện. Vì ông là khách hàng thân thiết, **chúng tôi sẽ trừ 40 đô la khỏi hóa đơn kỳ tới**.\n\nJanina Winslow  \nDịch vụ khách hàng MyCel\n\nĐáp án: **159 C, 160 D**.","translationStatus":"reviewed"},{"id":"h2/test09/161_DBDC.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 161–164","questions":{"161":"D","162":"B","163":"D","164":"C"},"image":"data/h2/test09/161_DBDC.png","markedImage":"marked/h2/test09/161_DBDC.png","translation":"**CÁC DỊCH VỤ MIỄN PHÍ CỦA THÀNH PHỐ BURBANK**\n\nThành phố cung cấp thêm nhiều dịch vụ miễn phí cho cư dân. Có thể xem **thông tin về các dịch vụ khác** tại www.burbank.ca.gov.\n\n**Đánh giá năng lượng:** Cư dân đặt lịch với cố vấn năng lượng trong giờ làm việc để nhận đề xuất cải thiện việc sử dụng năng lượng trong nhà.\n\n**Cắt bỏ cây:** Sở Quản lý Môi trường cung cấp dịch vụ tỉa và loại bỏ cây miễn phí quanh năm. Gọi 555-4091, số máy lẻ 808 để đặt lịch.\n\n**Phân tích nước:** Chủ nhà lo ngại về nước uống có thể mang mẫu đến Sở Nước để kiểm tra. **Kỹ thuật viên phòng thí nghiệm cần tối đa 10 ngày làm việc để có kết quả.** Nguồn nước nhiễm bẩn sẽ được xử lý ngay.\n\n**Xe đưa đón:** Dịch vụ miễn phí giữa khu dân cư và thương mại dành cho người từ 65 tuổi trở lên và người gặp khó khăn khi di chuyển. Gọi Sở Phúc lợi Người cao tuổi để đặt xe.\n\nĐáp án: **161 D, 162 B, 163 D, 164 C**.","translationStatus":"reviewed"},{"id":"h2/test09/165_CABB.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 165–168","questions":{"165":"C","166":"A","167":"B","168":"B"},"image":"data/h2/test09/165_CABB.png","markedImage":"marked/h2/test09/165_CABB.png","translation":"**Thảo luận chuẩn bị đề xuất tiếp thị cho AEK**\n\nJulianna Lopez xác nhận nhóm sẽ trình bày đề xuất tại trụ sở AEK ngày 18 tháng 7. AEK có 6.000 nhân viên, nhà máy tại Thái Lan, Thổ Nhĩ Kỳ và Mexico, cùng các nhà cung cấp ở Trung Quốc, Đức và Hàn Quốc; doanh thu năm trước vượt 2 tỷ đô la.\n\nYvonne Bailey sẽ phân tích tiếp thị bằng **số liệu trong cuốn giới thiệu công ty**. Julianna yêu cầu John Brenner và Eric Zalewski chuẩn bị trình chiếu và tài liệu phát tay. John nói sẽ mất không quá hai ngày.\n\nNhóm sẽ tập dượt ngày 15 tháng 7. Julianna trình bày phần chính, ba người còn lại giải thích ngắn gọn vai trò của mình rồi cùng trả lời câu hỏi kỹ thuật hoặc tài chính. Vì vậy, Eric nhiều khả năng sẽ **trả lời các câu hỏi tài chính** vào ngày 18.\n\nĐáp án: **165 C, 166 A, 167 B, 168 B**.","translationStatus":"reviewed"},{"id":"h2/test09/169_CAD.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 169–171","questions":{"169":"C","170":"A","171":"D"},"image":"data/h2/test09/169_CAD.png","markedImage":"marked/h2/test09/169_CAD.png","translation":"**Thư gửi nhà tài trợ của Hiệp hội Bảo tồn Môi trường Trái đất (SPEE)**\n\nKính gửi bà Barbara Koteva, Giám đốc Quan hệ Công chúng của Ademus Petroleum,\n\nCảm ơn bà và công ty đã hỗ trợ SPEE. Chúng tôi gửi kèm báo cáo thường niên trình bày những bước phát triển mới, hoạt động đang diễn ra và việc phân bổ ngân sách trong năm tài chính vừa qua.\n\nĐây là năm hiệu quả nhất kể từ khi SPEE thành lập mười năm trước. Tổ chức đạt mức kỷ lục về quyên góp tư nhân, hỗ trợ từ tổ chức công và cam kết tài chính từ doanh nghiệp. Kết quả này có được nhờ trang web đa ngôn ngữ và sự quảng bá từ một phim tài liệu.\n\nHai chuyên gia phi lợi nhuận Johan Gelling và Heather Leach gia nhập hội đồng quản trị; kinh nghiệm của họ tại Nam Á và Đông Âu đã giúp tăng số thành viên ở các khu vực này. SPEE cũng triển khai chính sách quản lý dự án mới giúp tinh gọn hoạt động và chi tiêu hiệu quả hơn.\n\nĐáp án: **169 C, 170 A, 171 D**.","translationStatus":"reviewed"},{"id":"h2/test09/172_CBCC.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 172–175","questions":{"172":"C","173":"B","174":"C","175":"C"},"image":"data/h2/test09/172_CBCC.png","markedImage":"marked/h2/test09/172_CBCC.png","translation":"**SỞ THÚ MIDLAND MỞ TRANG TRẠI CÁ SẤU**\n\nSở thú Midland vừa mở một điểm tham quan mới nhằm **giúp giáo dục** khách về cách cá sấu sinh sống, sinh sản và tồn tại. Trang trại nằm tại đầm phá nhân tạo và nuôi hơn 20 cá sấu Xiêm. Khách có thể quan sát chúng ở cự ly gần qua cửa sổ của khu quan sát dưới nước.\n\nCơ sở mới còn có phòng thí nghiệm nghiên cứu phục vụ nhân giống động vật. **Sở thú hy vọng nơi này giúp nhân viên gia tăng số lượng một số loài**, nhờ hợp tác giữa ban quản lý và nhóm giáo sư sinh học của Đại học Central Plains. Khu chăm sóc con non và ấp trứng sẽ mở cửa cho công chúng từ tuần tới.\n\nCuối tuần này, sở thú cũng mở phòng chiếu mới có 100 chỗ, trình chiếu phim tài liệu về cá sấu và các loài nguy cấp khác.\n\nĐáp án: **172 C, 173 B, 174 C, 175 C**.","translationStatus":"reviewed"},{"id":"h2/test09/176_BADDC.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 176–180","questions":{"176":"B","177":"A","178":"D","179":"D","180":"C"},"image":"data/h2/test09/176_BADDC.png","markedImage":"marked/h2/test09/176_BADDC.png","translation":"**Tài liệu 1 – Phản hồi của Jenna Palmer về Stop and Sew**\n\nJenna chúc mừng cửa hàng mới khai trương. Cô đánh giá cao sự đa dạng vật liệu, cách sắp xếp vải theo mục đích và chất liệu, cùng đội ngũ bán hàng hiểu biết và **dịch vụ xuất sắc**. Nhân viên đã tư vấn cho bộ sưu tập đồ bơi của cô và cung cấp tài liệu về các vật liệu cơ bản.\n\nCô đề nghị cửa hàng nhập thêm vải váy cưới độc đáo vì xu hướng đang chuyển từ thiết kế đơn giản sang kiểu chi tiết hơn. Cô hiện phải đặt toàn bộ vải cưới từ nhà cung cấp ngoài thành phố.\n\n---\n\n**Tài liệu 2 – Các loại vải cơ bản**\n\n- **Cotton:** tự nhiên, thoáng khí, giặt máy được; thích hợp may áo sơ mi.\n- **Len Merino:** mềm, giữ ấm mùa đông và mát mùa hè, giặt máy được, nhiều màu; dùng cho đồ trẻ em, thời trang cao cấp và đồ ngoài trời.\n- **Lụa:** tự nhiên, sang trọng, dễ nhuộm, độ rủ đẹp; dùng may váy dạ hội và váy cưới.\n- **Polyester:** nhẹ, co giãn tốt, bền với nếp gấp, nhiệt, ánh nắng và mồ hôi; dùng may đồ thể thao.\n\nDo Jenna đang chọn vải cho bộ sưu tập đồ bơi, cô nhiều khả năng đã mua **polyester**. Tài liệu không nói len Merino đắt hơn các loại khác.\n\nĐáp án: **176 B, 177 A, 178 D, 179 D, 180 C**.","translationStatus":"reviewed"},{"id":"h2/test09/181_BDBBD.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 181–185","questions":{"181":"B","182":"D","183":"B","184":"B","185":"D"},"image":"data/h2/test09/181_BDBBD.png","markedImage":"marked/h2/test09/181_BDBBD.png","translation":"**Tài liệu 1 – Kho lưu trữ rẻ và đơn giản**\n\nFor-U-Storage phục vụ người có đồ vật mang giá trị tình cảm nhưng không đủ chỗ cất giữ. Khách Carl Johansen thuê hộp với giá 30 đô la mỗi tháng để giữ album ảnh và đĩa nhạc.\n\nNhà sáng lập Adriana Solis cho biết cách tính giá sáng tạo là lý do chính giúp doanh nghiệp phát triển: khách **chỉ trả theo kích cỡ và số lượng hộp cần dùng**. Khách có thể lấy hộp tại điểm giao dịch hoặc được giao miễn phí đến nhà hay văn phòng; sau đó tự đóng gói và mang đến cơ sở hoặc đặt lịch nhận.\n\n---\n\n**Tài liệu 2 – Đơn hàng của Cameron Foster**\n\nĐơn gồm 3 hộp tiêu chuẩn, 3 hộp Plus và 2 hộp Deluxe; tổng phí tháng sau giảm giá là 109,65 đô la. Thời gian dự kiến lưu kho: **3 tháng**; kéo dài thời gian sẽ phát sinh phí.\n\nHộp được giao đến nhà bà Foster. Vì cửa tầng một có chuông, nhân viên cần bấm số 203 để bà mở cửa. Sau khi đóng gói, bà phải dán nhãn hoàn trả trả trước lên các hộp và liên hệ để sắp xếp nhận.\n\nĐáp án: **181 B, 182 D, 183 B, 184 B, 185 D**.","translationStatus":"reviewed"},{"id":"h2/test09/186_CDCBC.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 186–190","questions":{"186":"C","187":"D","188":"C","189":"B","190":"C"},"image":"data/h2/test09/186_CDCBC.png","markedImage":"marked/h2/test09/186_CDCBC.png","translation":"**Tài liệu 1 – Đợt thanh lý thường niên của Babson's**\n\nTừ ngày 1 đến 15 tháng 9, Babson's giảm giá để **dọn chỗ cho hàng mùa tới**: đồ giường và đồ tắm giảm đến 25%, đồ nữ giảm đến 50%, đồ nam giảm đến 75%. Ưu đãi áp dụng tại cửa hàng và trực tuyến, không cộng dồn khuyến mãi hay chiết khấu hội viên.\n\n---\n\n**Tài liệu 2 – Tổng kết doanh số tháng 8 và 9**\n\nDoanh thu tháng 9 tăng ở bộ phận nữ, trẻ em & thiếu niên, giường & đồ tắm, đồng hồ & trang sức; riêng bộ phận nam giảm. Đồng hồ & trang sức có tổng doanh thu thấp nhất nhưng **doanh thu tháng 9 vẫn tăng dù không nằm trong đợt giảm giá**.\n\n---\n\n**Tài liệu 3 – Email sau cuộc họp tiếp thị**\n\nLawrence Devine xác nhận sẽ cấp thêm ngân sách nghiên cứu thị trường **chỉ cho bộ phận nam**, nơi doanh số tháng 9 giảm. Các danh mục tăng trưởng tiếp tục được quảng bá. Với đồng hồ và trang sức, công ty sẽ khảo sát khách hàng để biết mặt hàng họ muốn nhất và có thể mở rộng lựa chọn vì biên lợi nhuận cao. Ông gửi email cho Margaret Atkins, người đã triệu tập cuộc họp và sẽ trao đổi lại với toàn bộ nhân viên tiếp thị.\n\nĐáp án: **186 C, 187 D, 188 C, 189 B, 190 C**.","translationStatus":"reviewed"},{"id":"h2/test09/191_CCABB.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 191–195","questions":{"191":"C","192":"C","193":"A","194":"B","195":"B"},"image":"data/h2/test09/191_CCABB.png","markedImage":"marked/h2/test09/191_CCABB.png","translation":"**Tài liệu 1 – Hội nghị Doanh nhân thường niên lần thứ 7**\n\nTạp chí *Big Success Magazine* tổ chức hội nghị “Mọi điều cần biết để tiếp thị sản phẩm trực tuyến”, hướng dẫn tăng doanh số Internet và quản lý cửa hàng trực tuyến. Sự kiện diễn ra **một ngày, 5 tháng 4**, từ 10 giờ sáng đến 5 giờ chiều tại Traylor Hall. Diễn giả chính Kyle Rogan, chủ Ottawa Intra Cycles, là người đoạt giải Doanh nhân của năm. Người tham dự phải hoàn thành khóa học trực tuyến sáu tuần của tạp chí.\n\n---\n\n**Tài liệu 2 – Email của Lilianne Maille**\n\nLilianne gặp Harrison Marcoux tại sự kiện kết nối dành cho doanh nhân mới. Harrison mới mở doanh nghiệp ván trượt tùy chỉnh và đang gặp khó khăn; Lilianne cũng mới bắt đầu dòng mỹ phẩm riêng nên đồng cảm. Cô giới thiệu hội nghị vì diễn ra tại thành phố của Harrison và tập trung đúng vấn đề anh đang gặp: **bán sản phẩm qua Internet**.\n\n---\n\n**Tài liệu 3 – Phiếu đăng ký khóa học**\n\nHarrison chọn thanh toán học phí 786 đô la thành **ba đợt, mỗi đợt 262 đô la**. Chương trình bảo đảm hoàn tiền 100% trong 30 ngày. Sau khi đăng ký, học viên nhận sáu tuần đào tạo trực tuyến và bộ DVD qua bưu điện.\n\nĐáp án: **191 C, 192 C, 193 A, 194 B, 195 B**.","translationStatus":"reviewed"},{"id":"h2/test09/196_BCDAB.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 196–200","questions":{"196":"B","197":"C","198":"D","199":"A","200":"B"},"image":"data/h2/test09/196_BCDAB.png","markedImage":"marked/h2/test09/196_BCDAB.png","translation":"**Tài liệu 1 – Thư đề nghị viết lời tựa**\n\nNhà văn Rory Dansen gửi Marjorie Harkness bản thảo miễn phí của *Tony's Tune*, phần tiếp theo của *Adriana's Song*, dự kiến phát hành vào mùa thu. Vì bà từng đánh giá rất tích cực các tiểu thuyết của ông trên *Print Media Magazine*, ông mời bà **viết một lời tựa ngắn cho tác phẩm mới**.\n\n---\n\n**Tài liệu 2 – Email phản hồi**\n\nMarjorie nhận gói hàng cùng bản thảo vào ngày 9 tháng 6, vui vẻ nhận lời viết lời tựa. Bà đã đọc từ tối hôm đó và rất thích, nhưng cần biết hạn nộp và độ dài yêu cầu. Bà cũng muốn viết bài đánh giá tiểu thuyết cho tạp chí trong tương lai.\n\n---\n\n**Tài liệu 3 – Lời tựa**\n\nTrong *Tony's Tune*, Rory Dansen tiếp tục câu chuyện đầy kịch tính về gia đình Beaumont. Lấy cảm hứng từ tuổi thơ của chính tác giả ở miền Nam, cuốn thứ hai trong loạt truyện khắc họa chi tiết đời sống miền Nam Hoa Kỳ những năm 1920.\n\nMarjorie ca ngợi tài kể chuyện và khả năng tạo nhân vật hấp dẫn của ông, thể hiện rõ trong *Tony's Tune* cũng như các tiểu thuyết nổi tiếng khác là *Fortune Fountain* và *Cry of the Seagull*. Bà cho rằng tác phẩm mới sẽ trở thành kinh điển.\n\nĐáp án: **196 B, 197 C, 198 D, 199 A, 200 B**.","translationStatus":"reviewed"},{"id":"h2/test10/131_BABD.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 131–134","questions":{"131":"B","132":"A","133":"B","134":"D"},"image":"data/h2/test10/131_BABD.png","markedImage":"marked/h2/test10/131_BABD.png","translation":"**Thông báo đến cư dân Sudbury**\n\nMột buổi họp mặt khu dân cư **sẽ diễn ra** tại trung tâm cộng đồng vào tối thứ Năm tuần tới. Cuộc họp mở cửa cho toàn bộ cư dân địa phương.\n\nVấn đề chính cần thảo luận là việc triển khai các biện pháp giảm tốc độ giao thông trên đường Kingston. Vấn đề này phải được giải quyết sớm vì số lượng xe sử dụng con đường đã **tăng mạnh**. Những nội dung khác trong chương trình gồm lịch thu gom rác và việc phân vùng lại đường Hammersmith. **Quý vị có thể tìm hiểu trước các vấn đề này trên trang web của chúng tôi.**\n\nĐồ ăn nhẹ được phục vụ từ 7 giờ 30 tối và cuộc họp bắt đầu lúc 8 giờ. Vui lòng đến **đúng giờ** để chúng ta có đủ thời gian giải quyết mọi nội dung.\n\nĐáp án: **131 B, 132 A, 133 B, 134 D**.","translationStatus":"reviewed"},{"id":"h2/test10/135_CDDD.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 135–138","questions":{"135":"C","136":"D","137":"D","138":"D"},"image":"data/h2/test10/135_CDDD.png","markedImage":"marked/h2/test10/135_CDDD.png","translation":"**Đến:** Denise Brooks  \n**Từ:** Nelson Lee  \n**Chủ đề:** Acton  \n**Ngày:** 18 tháng 1\n\nChào Denise,\n\nNhư cô biết, tôi sắp gặp một khách hàng tiềm năng từ Acton — công ty muốn mua linh kiện máy tính của chúng ta thường xuyên. Vì cuộc họp sẽ diễn ra sau vài ngày nữa, tôi đang cố hoàn thiện một **đề xuất bán hàng**.\n\nTuy nhiên, có vẻ tôi đã làm thất lạc bản in. Dù tệp vẫn còn trong ổ cứng, bản in đặc biệt quan trọng vì tôi đã ghi chú lên đó. **Tôi chưa có thời gian nhập những ghi chú này vào tệp điện tử.** Cô có thể kiểm tra xem bản nháp có bị cất nhầm không? **Nếu không** lấy lại được bản đó, tôi sẽ phải xem lại bản đang có và ghi chú lại. Điều thiết yếu là chúng ta phải giành được Acton làm **khách hàng**, vì vậy tôi rất biết ơn nếu cô tìm được tài liệu bị thất lạc.\n\nCảm ơn cô,  \nNelson Lee\n\nĐáp án: **135 C, 136 D, 137 D, 138 D**.","translationStatus":"reviewed"},{"id":"h2/test10/139_BDBC.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 139–142","questions":{"139":"B","140":"D","141":"B","142":"C"},"image":"data/h2/test10/139_BDBC.png","markedImage":"marked/h2/test10/139_BDBC.png","translation":"**James Gretsky**  \nPhòng Giải đáp Khách hàng, Mythos Computers  \n1511 South Lowell Boulevard, Denver, Colorado 80236\n\nKính gửi ông Gretsky,\n\nGần đây tôi gọi đến đường dây chăm sóc khách hàng của công ty để báo sự cố máy tính xách tay. Tôi hiếm khi sử dụng những dịch vụ như vậy vì nhân viên thường **không nhiệt tình hỗ trợ**. Tuy nhiên, lần này tôi đã rất bất ngờ theo chiều hướng tích cực.\n\nNhân viên tôi trao đổi, Patrick Kelley, **ngay lập tức** hiểu vấn đề. Anh ấy nắm thông tin rất rõ và cho biết từng gặp sự cố tương tự. **Anh ấy đề nghị tôi để kỹ thuật viên kiểm tra máy càng sớm càng tốt.** Vì vậy, tôi làm theo lời khuyên và gửi máy đi sửa.\n\nÔng Kelley đã mang đến một trong những trải nghiệm dịch vụ tốt nhất mà tôi **từng nhận được**. Mong ông chuyển lời cảm ơn của tôi đến anh ấy. Nếu thiết bị lại gặp vấn đề, chắc chắn tôi sẽ tiếp tục nhờ anh ấy hỗ trợ.\n\nTrân trọng,  \nSandra Stevenson\n\nĐáp án: **139 B, 140 D, 141 B, 142 C**.","translationStatus":"reviewed"},{"id":"h2/test10/143_ABAC.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 143–146","questions":{"143":"A","144":"B","145":"A","146":"C"},"image":"data/h2/test10/143_ABAC.png","markedImage":"marked/h2/test10/143_ABAC.png","translation":"**Viện dưỡng lão Seattle New Light — Chúng tôi luôn sẵn sàng hỗ trợ**\n\nNhiều người cao tuổi phải sống trong các viện dưỡng lão xa thành phố và cách gia đình, bạn bè một **khoảng cách** đáng kể. Seattle New Light thì không như vậy.\n\nSức khỏe thể chất và tinh thần của người cao tuổi là ưu tiên hàng đầu. Vì thế, chúng tôi giúp cư dân **duy trì** mức độ giao tiếp xã hội lành mạnh bằng nhiều hoạt động bổ ích mỗi ngày, gồm lớp thể dục, trò chơi và biểu diễn âm nhạc. **Những hoạt động này góp phần đáng kể nâng cao chất lượng cuộc sống của họ.**\n\nNgoài ra, nhờ vị trí thuận tiện để tiếp cận phương tiện công cộng, trung tâm cộng đồng và công viên, cư dân có thể tự do theo đuổi sở thích, đồng thời nhận được sự **chăm sóc** và quan tâm hằng ngày từ nhân viên.\n\nGọi 206-665-8924 để đặt lịch tham quan cơ sở.\n\nĐáp án: **143 A, 144 B, 145 A, 146 C**.","translationStatus":"reviewed"},{"id":"h2/test10/147_BA.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 147–148","questions":{"147":"B","148":"A"},"image":"data/h2/test10/147_BA.png","markedImage":"marked/h2/test10/147_BA.png","translation":"**Đến:** Frederick Montaigne  \n**Từ:** Gina Herald  \n**Ngày:** 3 tháng 2  \n**Chủ đề:** Mã bảo mật\n\nKính gửi ông Montaigne,\n\nCảm ơn ông rất nhiều vì đã hỗ trợ tài khoản thanh toán của tôi hôm qua tại chi nhánh Harvard Street của Burgundy Capital. Tôi đã làm theo hướng dẫn để thiết lập ngân hàng trực tuyến và mọi việc đều thuận lợi.\n\nTuy nhiên, tôi gặp sự cố khi nhấp vào một số dịch vụ chuyển tiền. Khi chuyển tiền giữa tài khoản Burgundy Capital và một tài khoản ở ngân hàng khác, hệ thống yêu cầu nhập **mã bảo mật sáu chữ số**. Tôi không nhớ mình đã thiết lập mã này khi chúng ta trao đổi hôm qua. Xin ông hướng dẫn cách lấy lại mã.\n\nTrân trọng,  \nGina Herald\n\nEmail nhằm **giải thích một vấn đề với dịch vụ trực tuyến**, và cô Herald cần ngân hàng cung cấp **mã bảo mật**.\n\nĐáp án: **147 B, 148 A**.","translationStatus":"reviewed"},{"id":"h2/test10/149_BC.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 149–150","questions":{"149":"B","150":"C"},"image":"data/h2/test10/149_BC.png","markedImage":"marked/h2/test10/149_BC.png","translation":"**Chuỗi tin nhắn**\n\n**Mitchell Roach — 11:27:** Chào Jillian, tuần này cô có rảnh ăn trưa không? Tôi muốn hỏi ý kiến cô về một vụ án mới được giao. Tôi biết cô từng là luật sư chính khi Brighton Industries tranh chấp bằng sáng chế với Grant Industries. Cô Baird đã yêu cầu tôi xử lý vụ kiện mới nhất của Brighton chống lại Cromwell Holdings.\n\n**Jillian Barrera — 11:32:** Chào Mitchell. Xin lỗi để anh chờ, tôi vừa họp xong với Astoria Enterprises. Sáng thứ Năm được không? Tuần này tôi khá bận.\n\n**Mitchell — 11:33:** Thứ Năm được. Chúng ta có thể uống cà phê hoặc gặp tại văn phòng khi cô rảnh.\n\n**Jillian — 11:33:** Anh đến văn phòng tôi lúc 8 giờ 30 sáng uống cà phê nhé? Tôi có khoảng một giờ trước cuộc hẹn đầu tiên.\n\n**Mitchell — 11:34:** **Thời gian đó cũng hoàn toàn phù hợp với tôi.** Cảm ơn cô đã dành thời gian.\n\n**Jillian — 11:36:** Tôi rất vui được giúp. Tôi khá quen với Brighton nên có thể đưa ra vài gợi ý hữu ích.\n\n**Mitchell — 11:37:** Chắc chắn cô sẽ giúp được rất nhiều. Thực ra, cô Baird đã đích thân giới thiệu tôi liên hệ cô.\n\nÔng Roach được yêu cầu đại diện cho **Brighton Industries**, và cuộc hẹn **sáng thứ Năm phù hợp với lịch của ông**.\n\nĐáp án: **149 B, 150 C**.","translationStatus":"reviewed"},{"id":"h2/test10/151_DB.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 151–152","questions":{"151":"D","152":"B"},"image":"data/h2/test10/151_DB.png","markedImage":"marked/h2/test10/151_DB.png","translation":"**Hiệp hội Tiếp thị Internet Đông Bắc (NEIMA)**\n\n**Hội nghị Tương lai của Tiếp thị Internet — Ngày 1, 23 tháng 4**\n\n- 9:00–10:00, phòng Hawthorne, tầng 1: Đăng ký và nhận thẻ tên.\n- 10:00–11:30, hội trường Johnstone, tầng 1: Thảo luận khai mạc về các xu hướng tiếp thị Internet sắp tới; James Burke, Andrea Harrison và Giáo sư Ming Chao trình bày.\n- 11:30–12:30, phòng Washington, tầng 3: Hội thảo “Cách đo lường tác động”, với Simon Gleason.\n- 12:30–1:30: Ăn trưa tại căng tin tòa Student Union.\n- 1:30–3:00, phòng Dawson, tầng 2: Hội thảo “Làm thế nào để thực tập sinh trở nên vô giá”, với **Padma Singh**.\n- 3:00–4:30, hội trường Johnstone, tầng 1: Phiên bế mạc; Gwen Carter tổng kết và thu thập đề xuất chủ đề cho **các phiên tương tác ngày hôm sau**.\n\nViệc nhắc đến các phiên của “ngày hôm sau” cho thấy hội nghị **tiếp tục sang ngày thứ hai**.\n\nĐáp án: **151 D, 152 B**.","translationStatus":"reviewed"},{"id":"h2/test10/153_CB.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 153–154","questions":{"153":"C","154":"B"},"image":"data/h2/test10/153_CB.png","markedImage":"marked/h2/test10/153_CB.png","translation":"**Các khoản khấu trừ thuế dành cho người làm việc từ xa**\n\nNhân viên làm việc từ xa được hưởng một số khoản khấu trừ khi tính thuế thu nhập. Người phát sinh chi phí văn phòng tại nhà liên quan đến thiết bị mới như máy tính, màn hình, điện thoại và máy in có thể khấu trừ theo hai cách: khấu trừ toàn bộ trong năm mua hoặc chia đều trong bảy năm. Ví dụ, món đồ trị giá 70 đô la có thể được khấu trừ hết trong năm đầu hoặc 10 đô la mỗi năm trong bảy năm.\n\nNhân viên thường xuyên dùng điện thoại cho công việc cũng đủ điều kiện, với điều kiện cung cấp **tài liệu chứng minh điện thoại được sử dụng trong giờ làm việc**, chẳng hạn nhật ký cuộc gọi. Chi phí chỗ ở gồm tiền thuê nhà, khoản vay thế chấp và bảo hiểm nhà được khấu trừ một phần tùy diện tích dùng làm nơi làm việc. Nếu có câu hỏi, hãy liên hệ quản lý nhân sự của chi nhánh.\n\nThông tin này nhiều khả năng nằm trong **sổ tay nhân viên**; **nhật ký cuộc gọi có thể cần thiết để được khấu trừ chi phí điện thoại**.\n\nĐáp án: **153 C, 154 B**.","translationStatus":"reviewed"},{"id":"h2/test10/155_CBC.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 155–157","questions":{"155":"C","156":"B","157":"C"},"image":"data/h2/test10/155_CBC.png","markedImage":"marked/h2/test10/155_CBC.png","translation":"**Đến:** Sara Brunelli  \n**Từ:** Mitchell Harcourt, Tuton Educational Services  \n**Ngày:** 17 tháng 1  \n**Chủ đề:** V/v: Dạy kèm lịch sử\n\nThưa cô Brunelli,\n\nChúng tôi đã nhận email về việc tìm gia sư cho con trai cô, Jason, và xin cung cấp thêm thông tin. Hiện có hai gia sư lịch sử. Michael Scott có bằng cử nhân lịch sử của Đại học Calgary City và có thể dạy Jason tại văn phòng trung tâm Edmonton hoặc tại nhà cô. Francine Gatineau có bằng thạc sĩ lịch sử cổ đại của Đại học Eastern Canada, nhưng **chỉ dạy tại văn phòng của chúng tôi**.\n\nTrước hết, xin cô bổ sung thời gian dự kiến Jason cần học kèm và lớp hiện tại của em. Thông tin này giúp chúng tôi xây dựng chương trình phù hợp. Sau khi nhận được, chúng ta có thể trao đổi về **phương thức thanh toán học phí**.\n\nMong sớm nhận phản hồi. Nếu có câu hỏi, xin liên hệ lại.\n\nTrân trọng,  \nMitchell Harcourt\n\nEmail không nhằm **mô tả các lựa chọn nghề nghiệp cho học sinh**.\n\nĐáp án: **155 C, 156 B, 157 C**.","translationStatus":"reviewed"},{"id":"h2/test10/158_DDC.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 158–160","questions":{"158":"D","159":"D","160":"C"},"image":"data/h2/test10/158_DDC.png","markedImage":"marked/h2/test10/158_DDC.png","translation":"**Học viện Mỹ thuật Dublin phối hợp cùng Bộ Văn hóa giới thiệu**\n\n**Các tác phẩm của Annie O’Dell — Triển lãm hồi cố**\n\nTác phẩm trong hơn ba thập kỷ sự nghiệp của nghệ sĩ đoạt giải Annie O’Dell sẽ được trưng bày tại tòa Sumner, khuôn viên chính Học viện Mỹ thuật Dublin, từ ngày 10 tháng 8 đến ngày 10 tháng 9. Được xem là người dẫn đầu của nghệ thuật điêu khắc đương đại, bà O’Dell từng trưng bày tại nhiều bảo tàng và phòng tranh nổi tiếng trên thế giới.\n\nTriển lãm gồm hơn 30 tác phẩm điêu khắc và một bộ phim tiểu sử ngắn. Phòng tranh mở từ thứ Hai đến thứ Bảy, 10 giờ sáng đến 5 giờ chiều. Sinh viên và nhân viên đang học/làm việc tại học viện được vào cửa **miễn phí**; khách khác trả 5 euro. Triển lãm cũng có các chuyến tham quan có hướng dẫn. Thông tin chi tiết tại www.events.dafa.com.\n\nAnnie O’Dell đã hoạt động nghệ thuật **nhiều năm**. Sự kiện không đề cập **tiệc khai mạc**.\n\nĐáp án: **158 D, 159 D, 160 C**.","translationStatus":"reviewed"},{"id":"h2/test10/161_DDB.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 161–163","questions":{"161":"D","162":"D","163":"B"},"image":"data/h2/test10/161_DDB.png","markedImage":"marked/h2/test10/161_DDB.png","translation":"**THÔNG BÁO**\n\nCăng tin tầng sáu của tòa nhà Superion sẽ đóng cửa với nhân viên kể từ ngày 27 tháng 5. **Chúng tôi xin lỗi vì sự bất tiện trong thời gian cải tạo.** Căng tin sẽ được sửa sang và chuyển thành Servex Modern, với nhiều món ăn mới. Chúng tôi hy vọng việc cải tạo phản ánh các đề xuất trong khảo sát gần đây. **Chúng tôi đồng ý rằng cần cung cấp nhiều lựa chọn bữa ăn phù hợp với mọi người.** Vì vậy, thực đơn hằng ngày sẽ có món chay, thuần chay và không gluten.\n\nĐăng nhập mạng nội bộ GlobalFerm, chọn “Servex Modern” trong mục “Employee Benefits” để xem **thực đơn bữa sáng và bữa trưa**, được cập nhật hằng tuần. Số ghế cũng tăng lên 550, gồm đủ chỗ cho người khuyết tật. Chúng tôi tin mọi người sẽ hài lòng với các thay đổi. **Cảm ơn sự kiên nhẫn của mọi người.**\n\nĐáp án: **161 D, 162 D, 163 B**.","translationStatus":"reviewed"},{"id":"h2/test10/164_DDCD.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 164–167","questions":{"164":"D","165":"D","166":"C","167":"D"},"image":"data/h2/test10/164_DDCD.png","markedImage":"marked/h2/test10/164_DDCD.png","translation":"**First Global tiếp tục mở rộng**\n\nNgày 28 tháng 12 — First Global, hãng điện tử sản xuất linh kiện cho điện thoại thông minh, cho biết sẽ sớm xây nhà máy thứ 20. Thông báo được đưa ra sau một năm thành công, với doanh số quý IV tăng 7% và quý III tăng 15%. Tổng giám đốc Genevieve Durand cho rằng tăng trưởng đến từ hiệu quả sản xuất: “Chúng tôi tìm cách làm được nhiều hơn với ít nguồn lực hơn, đồng thời sản xuất hàng chất lượng cao với giá cạnh tranh.”\n\nKhi hoàn tất, nhà máy mới gần Bắc Kinh sẽ là cơ sở lớn nhất của First Global và là cơ sở thứ sáu tại Đông Á. Công ty sẽ **dùng lợi nhuận của chính mình để tài trợ xây dựng**, không vay thêm hay bán tài sản. Nhà máy được kỳ vọng nâng năng suất khoảng 20%. **Mức tăng sản lượng này sẽ giúp công ty đáp ứng nhu cầu mạnh về điện thoại thông minh.** Việc xây dựng bắt đầu vào mùa xuân năm sau.\n\nBài viết nhằm **công bố kế hoạch xây dựng một cơ sở mới**. Việc mở rộng tại châu Á **không phải trải nghiệm mới** của công ty.\n\nĐáp án: **164 D, 165 D, 166 C, 167 D**.","translationStatus":"reviewed"},{"id":"h2/test10/168_CBBA.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 168–171","questions":{"168":"C","169":"B","170":"B","171":"A"},"image":"data/h2/test10/168_CBBA.png","markedImage":"marked/h2/test10/168_CBBA.png","translation":"**Cuộc trò chuyện trực tuyến về ảnh cho cửa hàng**\n\n**Beatrice Swenson — 1:22:** Tôi đang xem ảnh mẫu Billy Blake chụp sản phẩm để ra mắt cửa hàng trực tuyến. Ảnh chưa truyền tải được cảm giác mua sắm tại cửa hàng thật. Sản phẩm nên được bày trong bối cảnh thoải mái hơn để khách thấy dễ liên hệ. Tôi sẽ gửi ảnh qua email.\n\n**Roberto Hernandez — 1:29:** Tôi hiểu. Sẽ tốt hơn nếu mỗi sản phẩm được chụp trong không gian nhà thật.\n\n**Angela Orbison — 1:30:** Tôi cũng nghĩ vậy. Có lẽ nên thuê người mẫu mặc quần áo hoặc ngồi trên thảm để khách dễ hình dung sản phẩm.\n\n**Beatrice — 1:31:** Tôi đồng ý cả hai điểm. Nhưng có nên đổi nhiếp ảnh gia không?\n\n**Angela — 1:33:** Tác phẩm của anh ấy khá tốt, chỉ là chưa hợp phong cách sản phẩm.\n\n**Roberto — 1:34:** Có lẽ cho anh ấy cơ hội thứ hai. Hãy nêu mối quan ngại và xem anh ấy xử lý thế nào; sẽ phiền nếu phải tìm người khác.\n\n**Beatrice — 1:38:** Anh nói đúng. Tôi sẽ **cho anh ấy chụp lại ảnh mẫu**; nếu cần, anh ấy có thể dùng một trong các cửa hàng làm bối cảnh.\n\n**Roberto — 1:42:** Lô bình hoa từ Thái Lan chưa đến, có thể không kịp đăng trước ngày ra mắt. Ngoài ra mọi thứ ổn.\n\n**Angela — 1:42:** Tôi đã hoàn tất gần hết hệ thống thanh toán sau vài tháng. Còn vài lỗi nhỏ nhưng đúng tiến độ và sẽ hoạt động trong vài ngày.\n\nNội dung chính là **ảnh do một nhiếp ảnh gia chuyên nghiệp chụp cho trang bán lẻ**. Beatrice cũng cho rằng **nên sử dụng người mẫu**; Angela nhiều khả năng là **nhà phát triển hệ thống thanh toán**.\n\nĐáp án: **168 C, 169 B, 170 B, 171 A**.","translationStatus":"reviewed"},{"id":"h2/test10/172_ACAD.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 172–175","questions":{"172":"A","173":"C","174":"A","175":"D"},"image":"data/h2/test10/172_ACAD.png","markedImage":"marked/h2/test10/172_ACAD.png","translation":"**Đến:** Benjamin Pinkerton  \n**Từ:** Carol Andrews  \n**Chủ đề:** Chuyến công tác đến trụ sở chính  \n**Ngày:** 18 tháng 7\n\nBenjamin,\n\nTôi muốn gửi lịch trình dự kiến cho chuyến đi Washington, D.C. tuần tới. Chiều thứ Hai, xe công ty sẽ đón chúng ta tại sân bay và đưa đến khách sạn Earthgate. Khách sạn đã xác nhận phòng suite tổng thống. Sau vài giờ nghỉ, chúng ta sẽ gặp Linda Krakowski, người đứng đầu Recon Paper Company. Cô ấy đề nghị ăn tối tại khách sạn để chúng ta không phải di chuyển sau chuyến đi dài.\n\nNgày hôm sau, chúng ta có các cuộc họp gần như cả ngày tại **trụ sở công ty**, gồm bữa trưa với tổng giám đốc và một số thành viên hội đồng quản trị. Dự kiến hoàn tất khoảng 7 giờ tối.\n\nChúng ta đã đặt chuyến bay về sáng thứ Tư, nhưng có chuyến muộn lúc 11 giờ 35 tối thứ Ba. Anh muốn về thứ Ba hay thứ Tư? Cả hai đều được. **Hãy cho tôi biết ngày anh muốn**, để tôi báo cho văn phòng tại D.C.\n\nCảm ơn!  \nCarol Andrews\n\nEmail nhằm thông báo **lịch trình dự kiến**. Cô Krakowski đến khách sạn vì **thuận tiện cho khách**, và chưa hề đề cập việc khởi động dự án bị hoãn.\n\nĐáp án: **172 A, 173 C, 174 A, 175 D**.","translationStatus":"reviewed"},{"id":"h2/test10/176_DBBCB.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 176–180","questions":{"176":"D","177":"B","178":"B","179":"C","180":"B"},"image":"data/h2/test10/176_DBBCB.png","markedImage":"marked/h2/test10/176_DBBCB.png","translation":"**Tài liệu 1 — Trang trại Lamington chứng minh mô hình hợp tác có thể thành công**\n\nTrang trại Lamington ở New Zealand được Ben và Rachel Lamington thành lập 12 năm trước. Họ mua đất tại Masterton, cách Wellington hai giờ, để tự canh tác. Không có lao động nên trang trại không hiệu quả; sau bốn năm, họ đứng trước nguy cơ phá sản.\n\nHọ cân nhắc thuê nhân công nhưng thiếu vốn, bán đất nhưng không thành, rồi cho một tập đoàn nông nghiệp thuê. Cuối cùng, Rachel nhớ đến mô hình trang trại hợp tác ở Israel và hai người quyết định thử. Các phần đất được giao cho cư dân địa phương; họ trả tiền thuê vừa phải và chia một phần lợi nhuận. Quỹ chung dùng cho bảo trì, xây dựng và thuế, phần còn lại thuộc về Lamington.\n\nSau vài năm, họ trả hết nợ và có lãi. Hiện trang trại có 22 người chăn nuôi hoặc trồng kiwi, táo, ôliu. Nhiều trang trại khác cũng đang xem xét mô hình này. Trong các phương án đối phó phá sản, bài viết **không nói họ xin vay ngân hàng**. Mô hình của trang trại được **lấy cảm hứng từ một cộng đồng tương tự tại Israel**.\n\n---\n\n**Tài liệu 2 — Email đề nghị thực hiện bài báo**\n\n**Đến:** Rachel Lamington  \n**Từ:** Darius Carver, *Oceania Entrepreneurs*  \n**Ngày:** 11 tháng 6  \n**Chủ đề:** Đề nghị viết bài đặc biệt\n\nThưa bà Lamington,\n\nTôi vừa đọc bài viết về bà và chồng trên *The Cook Strait Times*. Tôi muốn đến thăm trang trại và phỏng vấn hai người. Tôi là cây bút của *Oceania Entrepreneurs*, tạp chí giới thiệu doanh nhân, nhà phát minh và nhà tư tưởng đổi mới tại Australasia.\n\nChúng tôi cũng muốn chụp ảnh trang trại, cơ sở vật chất và có thể phỏng vấn những nông dân khác. Bài có thể được chọn làm bài trang bìa, mang lại **cơ hội quảng bá miễn phí rất tốt**. Văn phòng chúng tôi tại Wellington nên tôi có thể tự lái xe đến. Xin cho biết bà có quan tâm và thời gian rảnh.\n\nTrân trọng,  \nDarius Carver\n\nEmail nhằm **xin một cuộc gặp trực tiếp**. Nếu được chấp thuận, ông Carver nhiều khả năng sẽ **đến Masterton**.\n\nĐáp án: **176 D, 177 B, 178 B, 179 C, 180 B**.","translationStatus":"reviewed"},{"id":"h2/test10/181_ABDBC.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 181–185","questions":{"181":"A","182":"B","183":"D","184":"B","185":"C"},"image":"data/h2/test10/181_ABDBC.png","markedImage":"marked/h2/test10/181_ABDBC.png","translation":"**Tài liệu 1 — Email tư vấn kế hoạch nghỉ hưu**\n\nKính gửi ông Gary Flores,\n\nLần trước gặp nhau, ông nhờ tôi tư vấn cách lập kế hoạch nghỉ hưu. Trước hết, hãy tạo quỹ dự phòng tiền mặt tương đương khoảng ba tháng chi tiêu hằng tháng. **Vì** số tiền này có thể khá lớn, nên bắt đầu tiết kiệm càng sớm càng tốt.\n\nNgoài ra, tôi khuyên ông tìm hiểu các lựa chọn chăm sóc y tế dài hạn cho bản thân, vợ/chồng và cha mẹ; đồng thời tổng hợp thông tin khẩn cấp để **chia sẻ với các thành viên gia đình**.\n\nTôi gửi kèm thẻ khách mời để ông dự bài giảng “Retirement for One” và hội thảo bữa trưa về bảo hiểm y tế cho người cao tuổi. Xuất trình thẻ tại cửa thì **cả hai sự kiện đều miễn phí**.\n\nTrân trọng,  \nWendy Rhodes, chuyên gia lập kế hoạch nghỉ hưu\n\n---\n\n**Tài liệu 2 — Trung tâm Phát triển Nghề nghiệp, Đại học Sunfield State**\n\nTrung tâm cung cấp giáo dục và phát triển nghề nghiệp chất lượng, giá phải chăng cho **người đang đi làm và người đã nghỉ hưu**.\n\n- Thứ Hai, 12/7: Sự kiện thông tin thường niên; có bài giảng của Wendy Rhodes.\n- Thứ Ba và thứ Tư, 13–14/7: Hội thảo hai phần về triển vọng việc làm bán thời gian, 3–5 giờ chiều.\n- Thứ Năm, 15/7: Thuyết trình bữa trưa của Victor Rochester.\n\nVé vào cửa 10 đô la cho thành viên và 15 đô la cho công chúng; vé bữa trưa thêm 10 đô la.\n\nÔng Flores có thể **tham dự miễn phí một sự kiện vào thứ Năm** nhờ thẻ khách mời.\n\nĐáp án: **181 A, 182 B, 183 D, 184 B, 185 C**.","translationStatus":"reviewed"},{"id":"h2/test10/186_CABCB.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 186–190","questions":{"186":"C","187":"A","188":"B","189":"C","190":"B"},"image":"data/h2/test10/186_CABCB.png","markedImage":"marked/h2/test10/186_CABCB.png","translation":"**Tài liệu 1 — Business 101 của Hiệp hội Doanh nghiệp Pittsburgh**\n\nHội thảo diễn ra thứ Năm, 12 tháng 10, 8 giờ 30–1 giờ tại khách sạn Vantage. Nội dung gồm lập kế hoạch kinh doanh, tìm vốn, **các vấn đề pháp lý do Robert Chang trình bày**, tuyển nhân viên, thu hút khách hàng và xét duyệt hồ sơ vay vốn với Linda Baker của Capitol Bank.\n\nSự kiện miễn phí cho thành viên, tư vấn viên và diễn giả; người khác mua vé 125 đô la. Người cần tư vấn vay vốn phải nộp hồ sơ trước ngày 11 tháng 10. Capitol Bank là nhà tài trợ.\n\n---\n\n**Tài liệu 2 — Email thay đổi diễn giả**\n\nLinda Baker báo rằng bà phải dự hội thảo đào tạo ở Miami từ 11–14 tháng 10. Simon Ashley sẽ thay bà **xét duyệt hồ sơ vay vốn**. Ông là cán bộ phát triển kinh doanh có kỹ năng, làm tại Capitol Bank tám năm, quen các thông lệ ngân hàng và hiểu rõ yêu cầu thành lập doanh nghiệp cũng như vay thế chấp.\n\n---\n\n**Tài liệu 3 — Đơn xin vay vốn của Shirley Castle, ngày 10 tháng 10**\n\nCastle Arts & Crafts có 15 nhân viên và xin vay 5.000–25.000 đô la. Dự kiến dùng 7.000 đô la chuyển kho thành phòng học thực hành và 2.500 đô la mua đồ đạc, thiết bị. Như vậy, bà Castle **dự định tổ chức lớp học tại cơ sở của mình**.\n\nĐơn ghi rõ mọi khoản vay phải được cán bộ phát triển kinh doanh hoặc cán bộ cho vay cấp cao đánh giá. Hồ sơ **phải được gửi trước ngày 11 tháng 10**, không phải gửi qua bưu điện trước ngày 10.\n\nĐáp án: **186 C, 187 A, 188 B, 189 C, 190 B**.","translationStatus":"reviewed"},{"id":"h2/test10/191_CACDC.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 191–195","questions":{"191":"C","192":"A","193":"C","194":"D","195":"C"},"image":"data/h2/test10/191_CACDC.png","markedImage":"marked/h2/test10/191_CACDC.png","translation":"**Tài liệu 1 — Buổi trình diễn thời trang mùa xuân thường niên của MFI**\n\nViện Thời trang Meredith mời tham dự *A Breath of Fresh Air*, chương trình giới thiệu thiết kế nhẹ nhàng, thoáng đãng và sáng tạo của sinh viên sắp tốt nghiệp. Sự kiện gồm giải trí, ăn trưa và trình diễn thời trang; Melvin Lee dẫn chương trình, DJ Raina phụ trách âm nhạc. Vé 40 đô la/người, diễn ra trưa thứ Bảy ngày 7 tháng 5 tại khuôn viên MFI. Toàn bộ tiền thu được dành cho quỹ khởi nghiệp hỗ trợ nhà thiết kế mới. Đây **không phải sự kiện ra mắt một thương hiệu**.\n\n---\n\n**Tài liệu 2 — Email của nhiếp ảnh gia Anna Cruise**\n\nAnna đánh giá cao mục đích sử dụng doanh thu nên sẵn lòng làm nhiếp ảnh gia chính thức miễn phí và cung cấp ảnh cho trường. Tuy nhiên, chi phí tác nghiệp cao, nên bà xin đặt một quầy ảnh gần lối vào và thu một khoản nhỏ khi khách in ảnh để **bù lại một phần chi phí**.\n\n---\n\n**Tài liệu 3 — Bài đánh giá trên Fashion Guide Magazine**\n\nChương trình thường niên của MFI mang đến cái nhìn thú vị về tương lai ngành thời trang. MFI từng đào tạo nhiều nhà thiết kế thành công, gồm Roxy Cooper và Belle Hashimoto. Người dẫn chương trình, cũng là cựu sinh viên, từng làm tóc và trang điểm cho người mẫu trong nhiều bài nổi bật của *Fashion Guide Magazine*.\n\nTrang phục năm nay đúng chủ đề “nhẹ nhàng, thoáng đãng và sáng tạo”, gồm áo rộng, quần thụng và áo khoác ngoại cỡ với tông màu trung tính. Các chất liệu có họa tiết nổi bật được cắt thành hình dáng táo bạo. Một số mẫu **có thể được bán tại các cửa hàng thời trang địa phương trong tương lai**.\n\nMelvin Lee đã **giúp tạo kiểu cho người mẫu của một tạp chí**.\n\nĐáp án: **191 C, 192 A, 193 C, 194 D, 195 C**.","translationStatus":"reviewed"},{"id":"h2/test10/196_DCDBC.png","folder":"h2/test10","book":"h2","bookLabel":"Hacker 2","test":"test10","testLabel":"Test 10","title":"Hacker 2 · Test 10 · Câu 196–200","questions":{"196":"D","197":"C","198":"D","199":"B","200":"C"},"image":"data/h2/test10/196_DCDBC.png","markedImage":"marked/h2/test10/196_DCDBC.png","translation":"**Tài liệu 1 — Bảo vệ an toàn cùng PFS**\n\nPFS chuyên lắp đặt hệ thống báo cháy và vòi phun nước cho khách hàng dân dụng và doanh nghiệp tại trung tâm New York. Công ty đảm bảo chất lượng thi công tuân thủ quy chuẩn xây dựng thành phố, thực hiện nhanh chóng và bảo đảm sự hài lòng. Nếu cần sửa chữa hoặc điều chỉnh, PFS sẽ xử lý **trong vòng 48 giờ**. Thông tin về các hệ thống có tại www.pfssystems.com. Quảng cáo **không nói PFS hoạt động tại nhiều bang**.\n\n---\n\n**Tài liệu 2 — Phiếu yêu cầu dịch vụ của Gwyneth Pierce**\n\nBà Pierce, thuộc Serene Peace Spa, muốn thay hệ thống phun tràn đã cũ. Bà đề nghị lắp hệ thống ống ướt trong từng phòng trị liệu và hệ thống ống khô ở khu vực ít bảo trì hơn. Riêng sảnh có nhiều đồ giá trị, bà muốn hệ thống **pre-action**, vì loại này ít nhạy hơn và **ít có khả năng kích hoạt ngoài ý muốn**.\n\n---\n\n**Tài liệu 3 — Email báo lắp đặt sai**\n\n**Đến:** John Boone, PFS  \n**Từ:** Gwyneth Pierce  \n**Ngày:** 15 tháng 4  \n**Chủ đề:** Sự cố\n\nBà Pierce không kịp kiểm tra trước khi đội lắp đặt rời đi. Sáng hôm sau, bà phát hiện sảnh được lắp cùng loại hệ thống như các phòng khác, không phải loại yêu cầu. Bà đề nghị đổi sang hệ thống ban đầu càng sớm càng tốt và hỏi khi nào có thể sửa.\n\nHệ thống PFS đã lắp tại sảnh là **ống ướt**. Theo cam kết dịch vụ, bà Pierce được **giải quyết sự cố trong vòng hai ngày**.\n\nĐáp án: **196 D, 197 C, 198 D, 199 B, 200 C**.","translationStatus":"reviewed"},{"id":"h3/test01/131_BCCB.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 131–134","questions":{"131":"B","132":"C","133":"C","134":"B"},"image":"data/h3/test01/131_BCCB.png","markedImage":"marked/h3/test01/131_BCCB.png","translation":"**Chủ đề: Đề xuất sản phẩm**\n\nKính gửi McRay Productions,\n\nDoanh nghiệp bán lẻ Delrio của tôi hiện đang cần một **nhà sản xuất** mới cho các sản phẩm của mình. Delrio chủ yếu bán đồ lưu niệm như túi vải, túi nhỏ và ô. Tôi muốn hỏi liệu quý công ty có thể sản xuất một số mặt hàng do tôi thiết kế để phục vụ hội chợ thương mại sắp tới hay không. Sự kiện này sẽ mang đến cơ hội thu hút khách hàng và xây dựng **danh tiếng** tích cực cho công ty quý vị.\n\nVì vậy, hàng hóa tôi bán phải hấp dẫn đúng thị trường mục tiêu. **Đặc biệt**, mọi sản phẩm đều phải tiện dụng và được làm từ vật liệu bền. Tôi đã đính kèm danh sách những sản phẩm dự định giới thiệu và muốn nhận một mẫu của mỗi loại. **Nếu hài lòng với kết quả, tôi sẵn sàng hợp tác thường xuyên với quý công ty.**\n\nTrân trọng,  \nLaura Hahn  \nGiám đốc điều hành Delrio","translationStatus":"reviewed"},{"id":"h3/test01/135_DBBB.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 135–138","questions":{"135":"D","136":"B","137":"B","138":"B"},"image":"data/h3/test01/135_DBBB.png","markedImage":"marked/h3/test01/135_DBBB.png","translation":"**Thông báo đến toàn thể cư dân Northup Apartment**\n\nNhư mọi người đã biết, lần đầu tiên chúng tôi thực hiện một số đợt cải tạo **quy mô lớn** tại khu nhà. Một sân chơi trẻ em đã được bổ sung trong khuôn viên, các đường ống nước cũ đã được thay mới và những lối đi bị thủng đã được làm lại.\n\nBan quản lý Northup Apartment **đã gửi** cho cư dân bản báo cáo chi tiết về chi phí vật liệu và nhân công. Đến nay, mọi người hẳn đã có thời gian xem xét kỹ. Chi phí sẽ được phân chia theo phương án mà chúng ta **đã thống nhất** tại cuộc họp giữa ban quản lý và cư dân: ban quản lý chi trả 60%, cư dân thanh toán phần còn lại.\n\nĐể bù cho phần chi phí thuộc trách nhiệm của cư dân, hóa đơn tiện ích và bảo trì hằng tháng sẽ tăng thêm 25 đô la từ tháng tới. **Khoản phụ phí này sẽ tiếp tục được thu cho đến khi toàn bộ chi phí được thanh toán.**","translationStatus":"reviewed"},{"id":"h3/test01/139_DBBA.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 139–142","questions":{"139":"D","140":"B","141":"B","142":"A"},"image":"data/h3/test01/139_DBBA.png","markedImage":"marked/h3/test01/139_DBBA.png","translation":"**Cơ hội nhận vé cáp treo trượt tuyết miễn phí từ Schuler**\n\nSchuler Gas **đang mang đến** cho khách hàng cơ hội giành vé cáp treo trượt tuyết miễn phí. Mỗi vé trị giá 149 đô la và có thể sử dụng tại bất kỳ khu nghỉ dưỡng nào trong số 15 địa điểm tham gia chương trình.\n\nTừ nay đến ngày 26 tháng 12, chỉ cần mua hơn 38 lít nhiên liệu tại bất kỳ trạm xăng Schuler nào trên toàn quốc. Sau đó, ghi thông tin liên hệ vào mặt sau hóa đơn rồi bỏ vào thùng đặt **bên cạnh** lối ra.\n\nXin lưu ý vé chỉ có hiệu lực trong thời gian giới hạn. **Mỗi vé phải được sử dụng trước ngày và giờ được in trên vé.** Vé không thể đổi thành tiền mặt. Buổi bốc thăm ngày 1 tháng 1 sẽ xác định người thắng; họ có thể **đến nhận** vé tại trạm xăng vào ngày sau khi được gọi điện, hoặc yêu cầu gửi vé qua đường bưu điện.","translationStatus":"reviewed"},{"id":"h3/test01/143_CDBB.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 143–146","questions":{"143":"C","144":"D","145":"B","146":"B"},"image":"data/h3/test01/143_CDBB.png","markedImage":"marked/h3/test01/143_CDBB.png","translation":"**Trung tâm Cộng đồng Abbotsburg sắp khánh thành**\n\nAbbotsburg, ngày 9 tháng 5 – Sau một năm xây dựng, Trung tâm Cộng đồng Abbotsburg sẽ được khánh thành vào thứ Sáu tới. Với chi phí gần 5 triệu đô la, một số người cho rằng đây là công trình xa xỉ và số tiền đáng lẽ nên được dùng để **sửa chữa** đường sá địa phương. **Vì vậy, dự án đã vấp phải một số ý kiến phản đối khi mới khởi công.**\n\nTuy nhiên, phần lớn cư dân cho rằng trung tâm là một **nhu cầu thiết yếu**. Karen Petrowski, **người** đã được bổ nhiệm làm giám đốc trung tâm, cho biết nơi đây sẽ cung cấp cho cư dân các cơ hội giao lưu, giải trí và giáo dục quan trọng. Bà nói thêm rằng theo thời gian, cả cộng đồng sẽ xem đây là một công trình xứng đáng.","translationStatus":"reviewed"},{"id":"h3/test01/147_CA.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 147–148","questions":{"147":"C","148":"A"},"image":"data/h3/test01/147_CA.png","markedImage":"marked/h3/test01/147_CA.png","translation":"**Lựa chọn nổi bật trong tuần: Cẩm nang ăn uống lành mạnh dành cho người trẻ**\n\nBạn sắp rời nhà bố mẹ lần đầu để đi làm hoặc học tập và lo lắng không biết sẽ ăn gì? Đừng chỉ dựa vào đồ ăn mang đi đắt đỏ hay những bữa ăn nhàm chán ở căng tin trường đại học. Hãy tự học cách chuẩn bị những món ăn lành mạnh và bổ dưỡng.\n\nĐầu bếp nổi tiếng Alexandra Maldini, ngôi sao chương trình truyền hình *Cooking the Italian Way*, vừa phát hành **ấn bản mới nhất của cuốn *The Young Person’s Guide to Eating Well***. Với các công thức từ món ăn nhẹ chỉ mất năm phút đến những món chính giúp bạn gây ấn tượng với bạn bè, cuốn **sách công thức nấu ăn** này phù hợp với nhiều độc giả. Sách hiện có tại các cửa hàng Winter World Bookstore.","translationStatus":"reviewed"},{"id":"h3/test01/149_CB.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 149–150","questions":{"149":"C","150":"B"},"image":"data/h3/test01/149_CB.png","markedImage":"marked/h3/test01/149_CB.png","translation":"**Chủ đề: Nhắc nhanh về quy trình mua đồ dùng văn phòng**\n\nXin chào mọi người,\n\nKhi yêu cầu đồ dùng văn phòng mới, hãy nhớ tuân thủ quy trình tiêu chuẩn. Quy trình này giúp chúng ta theo dõi lượng vật tư tiêu thụ thường xuyên. Trước khi gửi yêu cầu, nhân viên phải điền phiếu đề nghị chi tiết, liệt kê mọi món cần mua cùng số lượng và giá cả.\n\nPhiếu cũng phải có chữ ký của trưởng bộ phận. Những giao dịch không có phiếu chính thức sẽ không được hoàn tiền.\n\nCảm ơn,  \nMarion Jessop  \nQuản lý Thu mua","translationStatus":"reviewed"},{"id":"h3/test01/151_DA.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 151–152","questions":{"151":"D","152":"A"},"image":"data/h3/test01/151_DA.png","markedImage":"marked/h3/test01/151_DA.png","translation":"**Tin nhắn chuẩn bị thực phẩm cho các sự kiện**\n\n**Nicky Candela – 11:01:** Jacob, có vài thay đổi. Trên đường đi làm, anh có thể ghé mua giúp một số đồ không?\n\n**Jacob Brosky – 11:04:** Được thôi. Nhưng tôi tưởng hôm qua chúng ta đã mua đủ rồi.\n\n**Nicky Candela – 11:07:** Người tổ chức đám cưới của cô Arden vừa gọi. Cô ấy muốn thêm 40 chiếc bánh cupcake vào đơn hàng. Tôi đã cho bánh vào lò nhưng chúng ta hết hạt trang trí màu bạc. Ngoài ra, cần thêm kem phủ màu vàng cho phù hợp với màu sắc của buổi tiệc.\n\n**Jacob Brosky – 11:08:** Vậy tôi đoán chúng ta cần ít nhất hai túi hạt bạc và bốn tuýp kem vàng. **Ý cô là hai túi hạt bạc và bốn tuýp kem vàng, đúng không?**\n\n**Nicky Candela – 11:10:** Chính xác. Chúng ta sẽ hoàn thành việc này trong sáng nay rồi bắt đầu chuẩn bị đồ ăn cho tiệc kỷ niệm của ông bà Morton.","translationStatus":"reviewed"},{"id":"h3/test01/153_BC.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 153–154","questions":{"153":"B","154":"C"},"image":"data/h3/test01/153_BC.png","markedImage":"marked/h3/test01/153_BC.png","translation":"**Vé vào Công viên Seafoam**\n\nVé dành cho một người lớn từ 18 đến 65 tuổi  \nGiá đã thanh toán: 34 đô la\n\nCông viên mở cửa lúc 7 giờ sáng mỗi ngày. Khách được ở lại đến 9 giờ tối vào ngày thường và **8 giờ tối vào cuối tuần**. Khách được đỗ xe miễn phí. **Vé không ghi vị trí của bãi đỗ xe**.\n\n**Phiếu ưu đãi tại Seaview Restaurant**\n\nGiảm 10% cho bất kỳ suất ăn trưa đặc biệt nào. Phiếu có hiệu lực đến ngày 15 tháng 7.","translationStatus":"reviewed"},{"id":"h3/test01/155_CAD.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 155–157","questions":{"155":"C","156":"A","157":"D"},"image":"data/h3/test01/155_CAD.png","markedImage":"marked/h3/test01/155_CAD.png","translation":"**Thông báo dành cho cư dân Aston Towers**\n\nTòa nhà chung cư này đã gần 30 năm tuổi và đã khá lâu chưa được cải tạo lớn. Hiệp hội Cư dân cũng **liên tục yêu cầu nâng cấp các căn hộ trong nhiều tháng**, nên ban quản lý đồng ý rằng đã đến lúc thực hiện thay đổi. Công việc có thể gây bất tiện trong một thời gian ngắn.\n\nKế hoạch bảo trì gồm ba giai đoạn:\n\n- Giai đoạn 1, từ 18 tháng 4 đến 11 tháng 5: cải tạo mặt ngoài tòa nhà.\n- Giai đoạn 2, từ 13 tháng 5 đến 24 tháng 6: cải tạo hành lang bên trong.\n- Giai đoạn 3, từ 30 tháng 6 đến 1 tháng 9: sửa chữa cần thiết trong từng căn hộ.\n\nHai giai đoạn đầu sẽ gây tiếng ồn xây dựng từ 10 giờ sáng đến 4 giờ chiều. Đối với việc sửa chữa trong từng căn hộ, ban quản lý sẽ sớm liên hệ để xác định hạng mục cần làm và **sắp xếp thời gian thợ sửa chữa đến gặp từng cư dân**.\n\nCảm ơn sự kiên nhẫn và hợp tác của mọi người trong thời gian **công việc bảo trì sắp diễn ra**.","translationStatus":"reviewed"},{"id":"h3/test01/158_DABC.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 158–161","questions":{"158":"D","159":"A","160":"B","161":"C"},"image":"data/h3/test01/158_DABC.png","markedImage":"marked/h3/test01/158_DABC.png","translation":"**Bluecoats hướng tới một tương lai tươi sáng hơn**\n\nTối qua, ban lãnh đạo đội Kansas City Bluecoats cuối cùng đã đưa ra thông báo được mong đợi từ lâu: đội sẽ **chuyển đến một sân vận động mới** ở vùng ngoại ô nhưng vẫn trong địa giới Kansas City.\n\nHai thập niên trước, Bluecoats từng là một trong những đội bóng bầu dục hàng đầu Hoa Kỳ, **giành chức vô địch quốc gia một lần** và một lần khác lọt vào trận chung kết. Tuy nhiên, những năm gần đây khó khăn hơn vì thứ hạng đáng thất vọng và lượng người hâm mộ suy giảm do họ chuyển sang ủng hộ các đội thể thao thành công hơn trong khu vực.\n\nViệc chuyển sân sẽ giúp giá vé rẻ hơn, có thêm chỗ đỗ xe và thuận tiện tiếp cận từ các khu vực khác. **Người hâm mộ trong thành phố lẫn người từ nơi khác sẽ được phục vụ tốt hơn nhờ những thay đổi này.** Đội vẫn được tập luyện tại cơ sở hiện đại. Công việc xây dựng sân vận động mới **hiện chưa có tên** sẽ bắt đầu trong tháng này và dự kiến hoàn thành trong vòng hai năm.\n\nThị trưởng Lester Hickman hoan nghênh việc di chuyển và hy vọng Bluecoats sẽ trở lại thời kỳ thành công trước đây.","translationStatus":"reviewed"},{"id":"h3/test01/162_AACD.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 162–165","questions":{"162":"A","163":"A","164":"C","165":"D"},"image":"data/h3/test01/162_AACD.png","markedImage":"marked/h3/test01/162_AACD.png","translation":"**Thảo luận trực tuyến về việc thu hồi sản phẩm**\n\n**Gina Adenan – 10:09:** Nhà máy Maryland phát hiện lỗi sản xuất nên công ty phải lập tức thu hồi toàn bộ máy nướng bánh T-20 và T-21 đã bán trong năm qua.\n\n**Hal Anderson – 10:12:** Việc thu hồi sẽ rất lớn. Chúng ta phải đăng thông báo trên một số tờ báo lớn.\n\n**Oliver Lee – 10:14:** Đúng vậy, đồng thời đăng cùng thông tin lên trang web.\n\n**Hal Anderson – 10:16:** Đây là cách tốt nhất để tiếp cận khách hàng ở nước ngoài. Katie, cô soạn thông báo khi tôi gửi đầy đủ chi tiết nhé.\n\n**Katie Ford – 10:19:** Tôi sẽ làm ngay khi nhận danh sách liên hệ của báo chí từ bộ phận marketing.\n\n**Gina Adenan – 10:22:** Oliver, vì anh điều hành trung tâm cuộc gọi, hãy chuẩn bị hướng dẫn nhân viên xử lý cuộc gọi về đợt thu hồi.\n\n**Oliver Lee – 10:25:** Tôi sẽ làm ngay. Chúng ta từng xử lý một sự cố tương tự cách đây ba năm nên tôi biết cần làm gì.","translationStatus":"reviewed"},{"id":"h3/test01/166_ACC.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 166–168","questions":{"166":"A","167":"C","168":"C"},"image":"data/h3/test01/166_ACC.png","markedImage":"marked/h3/test01/166_ACC.png","translation":"**Visit Indonesia – Các gói du lịch nổi bật**\n\nVisit Indonesia cung cấp nhiều chuyến tham quan phù hợp với mọi du khách. Bạn có thể khám phá thiên nhiên, trải nghiệm nhịp sống đô thị hoặc thư giãn tại các di tích cổ với mức giá hợp lý.\n\n**Đi bộ đường dài ở Sumatra**\n\nChuyến đi bắt đầu tại Medan, tiếp tục đến khu bảo tồn đười ươi ở Bukit Lawang, cắm trại một đêm trong rừng rồi kết thúc bằng hành trình đến đỉnh núi lửa Sibayak.\n\n**Khám phá Java**\n\nJava tuy là một trong những đảo chính nhỏ nhất Indonesia nhưng có rất nhiều điều hấp dẫn, không chỉ ở thủ đô Jakarta. **Bên ngoài thành phố là cả một thế giới kỳ quan thiên nhiên và lịch sử.** Du khách đi qua vùng núi miền trung rồi đến Yogyakarta, nơi có quần thể đền thờ lớn nhất thế giới.\n\n**Bãi biển Bali**\n\nDu khách được đón tại Denpasar và đi thẳng xuống phía nam đảo để lặn ống thở và lặn biển. Chương trình còn có chuyến đi trong ngày đến ruộng lúa, hồ và các điểm tham quan khác.","translationStatus":"reviewed"},{"id":"h3/test01/169_BDC.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 169–171","questions":{"169":"B","170":"D","171":"C"},"image":"data/h3/test01/169_BDC.png","markedImage":"marked/h3/test01/169_BDC.png","translation":"**Bản ghi nhớ: Quy định nộp báo cáo bảo trì hằng ngày**\n\nGửi toàn thể nhân viên bảo trì,\n\nTôi biết mọi người có lịch làm việc bận rộn và rất trân trọng sự cố gắng của các bạn. Tuy nhiên, tất cả nhân viên phải tuân thủ chính sách hoàn thành báo cáo hằng ngày đúng hạn. Mọi thông tin phải được nhập đầy đủ trước cuối mỗi ngày làm việc, gồm số giờ dành cho từng nhiệm vụ bảo trì. Tháng 11, tôi nhận được một số phiếu chấm công muộn hơn hai tuần và đến nay vẫn còn báo cáo chưa nộp.\n\nNhiều báo cáo nộp đúng hạn lại thiếu chi tiết quan trọng. Báo cáo không chỉ dùng để theo dõi số nhiệm vụ bảo trì mà còn **đánh giá mức độ hiệu quả khi hoàn thành công việc**.\n\nĐể giải quyết vấn đề, chính sách mới sẽ có hiệu lực **từ tháng tới, tức tháng 1**. Tôi sẽ kiểm tra báo cáo hằng tuần để bảo đảm chúng đầy đủ và được đăng đúng hạn trên trang web công ty. Nếu có vấn đề, tôi sẽ trực tiếp trao đổi với từng người.\n\nJanice Lai  \nGiám sát","translationStatus":"reviewed"},{"id":"h3/test01/172_DCBB.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 172–175","questions":{"172":"D","173":"C","174":"B","175":"B"},"image":"data/h3/test01/172_DCBB.png","markedImage":"marked/h3/test01/172_DCBB.png","translation":"**Suy nghĩ về nền kinh tế chia sẻ**\n\nTrong những năm gần đây, ứng dụng di động và trang web giúp mọi người đi nhờ xe, tìm nơi lưu trú hoặc thuê người trông trẻ dễ dàng và rẻ hơn. Hệ thống dựa trên Internet này được gọi là “nền kinh tế chia sẻ”, mang đến cơ hội kiếm tiền cho nhiều người hơn. Tuy nhiên, khi việc mua dịch vụ từ cá nhân thay vì doanh nghiệp truyền thống ngày càng phổ biến, một số chính quyền địa phương đã quản lý hoặc cấm hoàn toàn mô hình này.\n\nGhorinburg là một ví dụ phản đối mạnh mẽ. Chính quyền địa phương cấm cư dân tham gia nền kinh tế chia sẻ. Thị trưởng Robert Smollet, **người đắc cử năm ngoái**, cho rằng các lợi ích không lớn như vẻ bề ngoài. Theo ông, dịch vụ cá nhân giá rẻ có thể khiến doanh nghiệp đóng cửa và người lao động mất việc.\n\nCác thành phố nhỏ như Browenville, Marog và Quentintown cũng áp dụng hạn chế, vì **doanh nghiệp địa phương đóng vai trò thiết yếu đối với tăng trưởng kinh tế**. Chỉ thời gian mới cho biết quan điểm này có còn duy trì hay không khi công nghệ tiếp tục lan rộng.","translationStatus":"reviewed"},{"id":"h3/test01/176_DDCAA.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 176–180","questions":{"176":"D","177":"D","178":"C","179":"A","180":"A"},"image":"data/h3/test01/176_DDCAA.png","markedImage":"marked/h3/test01/176_DDCAA.png","translation":"**Tài liệu 1 — Quảng cáo của Siêu thị Bulk Land**\n\nHãy đăng ký với Siêu thị Bulk Land ngay hôm nay để việc mua thực phẩm hằng tuần trở nên nhanh chóng và dễ dàng hơn. Chúng tôi hoạt động khác với các cửa hàng thực phẩm khác. Không giống phần lớn siêu thị, **chúng tôi không có cửa hàng bán lẻ thực tế**. Quý khách chỉ cần thoải mái ở nhà xem hàng trên cửa hàng trực tuyến, đặt mua rồi chúng tôi sẽ giao đến tận cửa.\n\nChúng tôi cũng khuyến khích khách mua hàng với số lượng lớn. Khi mua số lượng nhiều, quý khách có thể tiết kiệm tới một nửa cho mỗi mặt hàng. Để bắt đầu xem danh mục thực phẩm phong phú của chúng tôi, hãy truy cập www.bulkland.com. Chọn thời gian giao hàng phù hợp là mọi việc hoàn tất.\n\nTháng này, chúng tôi có một số ưu đãi đặc biệt. Nếu đặt lịch giao trước ngày 15 tháng 11, quý khách sẽ nhận **phiếu giảm 5% cho lần mua tiếp theo**. Đơn hàng trên 100 đô la được giao miễn phí. Ngoài ra, mọi khách hàng đăng ký trong tháng này và đặt một túi gạo 5 kg sẽ được tặng hộp bảo quản giúp ngũ cốc luôn tươi và khô.\n\n---\n\n**Tài liệu 2 — Phiếu đặt hàng trực tuyến của Bulk Land**\n\n**Tên:** Alexander Johnson  \n**Địa chỉ:** 2235 West Grovers Avenue, Phoenix, AZ 85007  \n**Mã khách hàng:** 054489  \n**Điểm tích lũy:** **2.300 điểm**  \n**Ngày đặt:** 11 tháng 11\n\n| Mã hàng | Sản phẩm | Giá |\n| --- | --- | ---: |\n| P889 | Mì ống nguyên cám, 5 kg | 18 đô la |\n| R426 | Gạo, 3 kg | 22 đô la |\n| T114 | Đậu gà đóng hộp, lốc 12 hộp | 15 đô la |\n| T526 | Cà chua cắt nhỏ đóng hộp, lốc 12 hộp | 11,50 đô la |\n| B496 | Bơ đậu phộng hữu cơ loại hạt, lốc 6 hũ | 21,50 đô la |\n\n**Tổng cộng:** 88 đô la\n\nThời gian giao mong muốn: khoảng **10 giờ sáng thứ Năm, ngày 13 tháng 11**. Nếu không thể giao đúng ngày giờ đã chọn, siêu thị sẽ liên hệ sớm nhất có thể để sắp xếp thời điểm khác.","translationStatus":"reviewed"},{"id":"h3/test01/181_CACDC.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 181–185","questions":{"181":"C","182":"A","183":"C","184":"D","185":"C"},"image":"data/h3/test01/181_CACDC.png","markedImage":"marked/h3/test01/181_CACDC.png","translation":"**Tài liệu 1 — Thư mời tham dự Hội chợ Sản phẩm Làm đẹp Hữu cơ**\n\n**Ngày 23 tháng 3**\n\nBrittany Cosmetics  \nCarla Danbury  \n3411 Appleton Way  \nPortland, OR 97035\n\nKính gửi cô Danbury,\n\nĐã đến lúc chuẩn bị cho Hội chợ Sản phẩm Làm đẹp Hữu cơ thường niên lần thứ 15. Năm nay, sự kiện sẽ diễn ra tại Trung tâm Hội nghị Seacrest ở Seattle từ ngày 8 đến ngày 10 tháng 7.\n\nVì công ty cô từng là nhà cung cấp tại sự kiện năm ngoái ở Denver, chúng tôi xin dành cho cô **mức giảm 15% đối với cả phí thuê gian hàng lẫn thiết bị** tại hội chợ năm nay. Để thuận tiện, tôi gửi kèm lịch sự kiện đầy đủ và mẫu đăng ký có thông tin giá.\n\nMột khách sạn nối liền với trung tâm hội nghị. Mọi công ty có gian hàng tại hội chợ đều có thể đặt phòng với giá ưu đãi 120 đô la mỗi đêm. Vui lòng liên hệ với chúng tôi nếu muốn đặt phòng. Ngoài ra, **toàn bộ trung tâm có Wi-Fi miễn phí**, nên cô có thể truy cập Internet ngay tại gian hàng.\n\nĐơn đăng ký và toàn bộ khoản thanh toán phải được gửi trước ngày 15 tháng 5. Có thể thanh toán bằng tiền mặt, séc hoặc chuyển khoản. Nếu có câu hỏi hoặc cần thêm thông tin, hãy gửi e-mail đến toddbanks@tradevent.com.\n\nTrân trọng,  \nTodd Banks  \nChuyên viên tổ chức sự kiện doanh nghiệp  \nTradevent Incorporated\n\n---\n\n**Tài liệu 2 — E-mail của Carla Danbury**\n\n**Đến:** Todd Banks <toddbanks@tradevent.com>  \n**Từ:** Carla Danbury <cdan@brittanycos.com>  \n**Chủ đề:** Hội chợ thương mại  \n**Ngày:** 25 tháng 3\n\nKính gửi ông Banks,\n\nCảm ơn ông về lá thư. Chúng tôi muốn **tham gia hội chợ một lần nữa trong năm nay**, vì đã nhận được rất nhiều đơn đặt hàng sản phẩm trong sự kiện lần trước. Sáng nay tôi đã gửi mẫu đăng ký cùng một tấm séc thanh toán phí. Xin hãy gửi e-mail xác nhận sau khi séc được nộp.\n\nNgoài ra, tôi muốn đặt phòng khách sạn cho nhân viên và bản thân. Chúng tôi cần ba phòng trong suốt thời gian diễn ra hội chợ. Xin cho biết tôi phải làm gì để giữ phòng; chẳng hạn, tôi có cần thanh toán trước toàn bộ hay chỉ cần đặt cọc?\n\nCảm ơn sự hỗ trợ của ông. Chúng tôi mong được tham gia thêm một sự kiện thành công nữa.\n\nTrân trọng,  \nCarla Danbury  \nChủ sở hữu, Brittany Cosmetics","translationStatus":"reviewed"},{"id":"h3/test01/186_CBCBB.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 186–190","questions":{"186":"C","187":"B","188":"C","189":"B","190":"B"},"image":"data/h3/test01/186_CBCBB.png","markedImage":"marked/h3/test01/186_CBCBB.png","translation":"**Tài liệu 1 — Quảng cáo Port Royal Cruises**\n\n**Một chuyến phiêu lưu khó quên tại Jamaica lịch sử!**\n\nHãy tận hưởng chuyến phiêu lưu để đời bằng cách tham gia hải trình trên bản sao tuyệt đẹp của một con tàu cướp biển có thật. Khởi hành từ Port Royal, Jamaica vào thứ Hai, thứ Tư và thứ Sáu, tàu H.M.S. Lady Blackbeard đi qua nhiều thắng cảnh nổi tiếng.\n\nNgoài các món ăn và đồ uống cao cấp, tàu có phòng ăn, phòng khách, quầy bar và quán cà phê. Chương trình còn có tiệc trên boong với bữa buffet do đầu bếp nổi tiếng Elijah Bolt chuẩn bị. Tàu chở tối đa 110 hành khách; **các phòng có phòng tắm riêng và TV**. Giá vé 450 đô la một người cho chuyến đi hai đêm, bao gồm ba bữa ăn mỗi ngày. Tàu cũng có thể được thuê cho các sự kiện doanh nghiệp hoặc riêng tư. Xem chi tiết và hình ảnh tại www.portroyalcruise.co.jm.\n\n---\n\n**Tài liệu 2 — E-mail đề xuất hoạt động sau hội nghị**\n\n**Đến:** Evan Baughman <evbau@pealeint.com>  \n**Từ:** Rayleen Webb <raweb@pealeint.com>  \n**Chủ đề:** Hoạt động sau hội nghị  \n**Ngày:** 30 tháng 4\n\nEvan,\n\nTôi đã xem trang web Port Royal Cruises mà anh đề cập và đồng ý đây sẽ là một hoạt động thú vị cho những người trong công ty tham dự hội nghị tại Jamaica vào tháng 6. Tôi đã liên hệ với hãng về việc thuê tàu; chi phí là 7.500 đô la mỗi ngày, gồm bữa ăn, chỗ ở và các chuyến tham quan. Như vậy, thuê hai ngày vẫn nằm trong ngân sách. Chúng ta có thể khởi hành vào thứ Sáu và trở lại Port Royal sáng Chủ Nhật, kịp chuyến bay về Edmonton buổi chiều.\n\nNếu cần, tàu có thiết bị nghe nhìn để sử dụng và có kết nối Internet. Tàu cũng cung cấp dịch vụ giặt là có tính phí; xe buýt của hãng có thể đón chúng ta tại Mont Drake Resort, nơi hội nghị diễn ra.\n\nTôi sẽ tiến hành đặt chỗ ngay khi anh đồng ý.\n\nRayleen\n\n---\n\n**Tài liệu 3 — Phiếu nhận xét của Port Royal Cruises**\n\nÝ kiến của quý khách rất quan trọng. Phản hồi sẽ giúp chúng tôi cải thiện dịch vụ và cơ sở vật chất. Thông tin không được chia sẻ với bên thứ ba. Sau khi điền phiếu, vui lòng mang đến quầy lễ tân trên tàu hoặc nộp tại văn phòng hành chính.\n\n**1. Quý khách biết đến Port Royal Cruises bằng cách nào?**  \nMột đồng nghiệp đã giới thiệu cho tôi.\n\n**2. Quý khách có giới thiệu chuyến đi cho bạn bè không?**  \nCó, cũng như cho các công ty tổ chức sự kiện.\n\n**3. Điểm tuyệt vời nhất của chuyến đi là gì?**  \n**Cơ sở vật chất trên tàu rất tốt, nhân viên nhiệt tình, các điểm tham quan vui, thực đơn cao cấp của Elijah Bolt xuất sắc và phòng khách thoải mái.**\n\n**4. Chuyến đi có thể được cải thiện như thế nào?**  \nDịch vụ giặt là có thể tốt hơn; một số quần áo của tôi bị trả lại trong tình trạng nhăn. Ngoài ra, xe buýt đưa đón có thể bớt đông hơn.\n\n**5. Quý khách có muốn nhận bản tin e-mail thường xuyên không?** Không.\n\n**Tên:** Rayleen Webb  \n**Ngày đi:** 26–27 tháng 6  \n**E-mail:** raweb@pealeint.com","translationStatus":"reviewed"},{"id":"h3/test01/191_CABCB.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 191–195","questions":{"191":"C","192":"A","193":"B","194":"C","195":"B"},"image":"data/h3/test01/191_CABCB.png","markedImage":"marked/h3/test01/191_CABCB.png","translation":"**Tài liệu 1 — Danh sách phim của diễn viên Henry Spencer**\n\n- *Run for Your Life*: vai vận động viên marathon Dale Warren; đạo diễn Aaron Marks.\n- *Some Prefer the Breeze*: vai bác sĩ Richie Dean; được đề cử Giải SPG cho Nam diễn viên phụ xuất sắc nhất; đạo diễn Larry Loden.\n- *Therein Lies the Truth*: vai luật sư Abner Cole; được đề cử Giải SPG cho Nam diễn viên chính xuất sắc nhất và đoạt Giải International Screen cho Nam diễn viên chính; đạo diễn Greg Steinfeld.\n- *Show Me the Way*: vai nhà khoa học Ellis Charleston; đoạt Giải International Screen cho Nam diễn viên chính; đạo diễn Greg Steinfeld.\n- *Bandits of Time*: vai phi hành gia Hal Lourdes; đoạt Giải Sci-Fi cho Nam diễn viên phụ xuất sắc nhất; đạo diễn Jerry Bradbury.\n\n---\n\n**Tài liệu 2 — Trang web chương trình Screen Action**\n\nHãy cùng Korinna McKay theo dõi *Screen Action* vào 5 giờ chiều thứ Tư hằng tuần. Đây là chương trình phát thanh trên Slick Radio 93.9 FM, cung cấp tin tức và các cuộc phỏng vấn về ngành điện ảnh.\n\nTuần này, ngày 7 tháng 6, Korinna chào đón Cheri Oakland đến trường quay để trò chuyện về tác phẩm mới nhất của cô, *Bandits of Time II*. Đây là phần tiếp theo của bộ phim *Bandits of Time* rất thành công, ra mắt hai mùa hè trước, và có đầy đủ dàn diễn viên của phần đầu. Cô Oakland sẽ kể về bộ phim cũng như trải nghiệm đạo diễn tác phẩm này. Sau cuộc phỏng vấn, cô sẽ cùng diễn viên Cecily Monroe, người trở lại với vai Sylvia Slade trong *Bandits of Time II*, tham gia phần hỏi đáp.\n\nHãy gọi 1-800-555-3944 vào cuối chương trình nếu có câu hỏi dành cho khách mời. Nếu bỏ lỡ chương trình tuần này, hãy nhấp vào thẻ “SHOW RECORDINGS” sau khi chương trình phát sóng.\n\n---\n\n**Tài liệu 3 — E-mail gửi Bob Voorhies**\n\n**Đến:** Bob Voorhies <bobv@genericpost.com>  \n**Từ:** Marnie Hefner <mhef@screenaction.com>  \n**Chủ đề:** Chương trình *Screen Action* ngày 7 tháng 6  \n**Tệp đính kèm:** Mẫu cho phép  \n**Ngày:** 8 tháng 6\n\nKính gửi ông Voorhies,\n\nCảm ơn ông đã gọi đến chương trình ngày 7 tháng 6. **Câu hỏi và nhận xét của ông đã được cô McKay cùng các khách mời đánh giá rất cao.**\n\nNhư ông có thể đã biết, *Screen Action* ghi âm mọi chương trình và đăng lên trang web để thính giả tiện nghe lại. Theo quy định, chúng tôi phải xin phép bất kỳ ai phát biểu trong chương trình trước khi thực hiện việc này. Vì vậy, tôi gửi kèm một mẫu cho phép và kính nhờ ông ký rồi gửi lại.\n\nMột lần nữa, chúng tôi rất trân trọng những thính giả trung thành như ông.\n\nTrân trọng,  \nMarnie Hefner  \nNhà sản xuất, *Screen Action*","translationStatus":"reviewed"},{"id":"h3/test01/196_CADAD.png","folder":"h3/test01","book":"h3","bookLabel":"Hacker 3","test":"test01","testLabel":"Test 01","title":"Hacker 3 · Test 01 · Câu 196–200","questions":{"196":"C","197":"A","198":"D","199":"A","200":"D"},"image":"data/h3/test01/196_CADAD.png","markedImage":"marked/h3/test01/196_CADAD.png","translation":"**Tài liệu 1 — Bài viết trên Health Note, số tháng 3**\n\n**Sự thật về thực phẩm bổ sung** *(tiếp theo từ trang 19)*\n\nLý tưởng nhất là một chế độ ăn đa dạng có thể đáp ứng đầy đủ nhu cầu dinh dưỡng của người từ 65 tuổi trở lên. Tuy nhiên, một số người cao tuổi khó thực hiện điều này vì thiếu thời gian và thấy việc chuẩn bị những bữa ăn bổ dưỡng quá vất vả. Trong những trường hợp như vậy, nhiều bác sĩ đồng ý rằng **việc uống vitamin và các thực phẩm bổ sung khác có thể hữu ích**.\n\nDù vậy, các bác sĩ cho rằng những sản phẩm này phải được quản lý cẩn thận để không gây ra tác hại ngoài ý muốn. Theo một nghiên cứu có kiểm soát của Viện Nghiên cứu Lão hóa, một số vitamin và khoáng chất có thể trở nên độc hại khi được hấp thụ với lượng lớn. Vì vậy, trước khi bắt đầu chế độ vitamin, người cao tuổi cần xin lời khuyên của một bác sĩ có chuyên môn và đáng tin cậy.\n\nHealth Note đã được quyền tiếp cận trước nghiên cứu này; nghiên cứu sẽ sớm được công bố.\n\nMuốn xin phép đăng lại bài viết, vui lòng gửi thư đến admin@healthnote.com. Việc đăng toàn bộ bài hoặc từ 500 từ trở lên sẽ bị tính phí. Đoạn trích dưới 500 từ được phép đăng miễn phí nhưng phải ghi nguồn Health Note.\n\n---\n\n**Tài liệu 2 — E-mail về việc xin phép đăng lại**\n\n**Đến:** Ernst Hopson <ehopson@psychguide.com>  \n**Từ:** Gayle Brenner <admin@healthnote.com>  \n**Chủ đề:** Xin phép đăng lại  \n**Ngày:** 12 tháng 4  \n**Tệp đính kèm:** Mẫu yêu cầu đăng lại\n\nKính gửi ông Hopson,\n\nChúng tôi đã nhận e-mail hỏi về việc đăng lại một đoạn từ số tháng 3 của *Health Note*. Tôi gửi ông một biểu mẫu; ông phải điền đầy đủ rồi gửi lại. Về cơ bản, ông sẽ được yêu cầu đánh dấu phần bài viết muốn đăng lại trong tạp chí và nêu mục đích sử dụng.\n\nÔng có thể gửi biểu mẫu đã hoàn thành qua e-mail. Yêu cầu gửi trước ngày 15 của tháng sẽ nhận phản hồi vào cuối tháng đó. Yêu cầu gửi sau ngày này sẽ nhận phản hồi vào đầu tháng kế tiếp. **Quyền đăng lại được tạp chí xem xét riêng cho từng trường hợp.**\n\nCảm ơn ông. Mong sớm nhận được phản hồi.\n\nTrân trọng,  \nGayle Brenner\n\n---\n\n**Tài liệu 3 — Đơn xin phép đăng lại bài viết**\n\n**Ngày:** 27 tháng 4  \n**Người nộp đơn:** Ernst Hopson  \n**Địa chỉ:** 1219 Lee Gardens, Arlington, VA 22201  \n**E-mail:** edreports@psychguide.com  \n**Điện thoại:** 555-4189  \n**Tên tạp chí:** *Psychology Guide*  \n**Liên kết:** Không hoạt động\n\n**Tên bài:** “The Truth About Supplements?”  \n**Ấn phẩm đăng bài:** *Health Note*, số tháng 3\n\n**Phần muốn đăng lại:** Một đoạn **200 từ** nằm trong đoạn thứ hai ở trang 5.\n\n**Mục đích:** *Psychology Guide* sẽ dành số sắp tới cho chủ đề sức khỏe tinh thần của người cao tuổi. Bài viết trên đề cập đến vitamin và các thực phẩm bổ sung khác, nên chúng tôi muốn đăng lại đoạn này dưới dạng một bài ngắn.\n\nNếu đơn được chấp thuận, tôi sẽ ghi nguồn Health Note phù hợp.\n\n☑ Tôi đồng ý với các điều khoản trên.","translationStatus":"reviewed"},{"id":"h3/test02/131_AADC.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 131–134","questions":{"131":"A","132":"A","133":"D","134":"C"},"image":"data/h3/test02/131_AADC.png","markedImage":"marked/h3/test02/131_AADC.png","translation":"### E-mail thông báo nghỉ hưu\n\n**Người nhận:** Christine Lata  \n**Người gửi:** Bác sĩ Miles Hamilton  \n**Ngày:** 15 tháng 3  \n**Chủ đề:** Nghỉ hưu\n\nKính gửi cô Lata,\n\nSự nghiệp bác sĩ kéo dài 40 năm của tôi sắp khép lại vì tôi dự định **rời khỏi** vị trí của mình vào ngày 1 tháng 6. Dù mong chờ những năm tháng nghỉ hưu an nhàn, tôi sẽ rất nhớ công việc chăm sóc và giúp đỡ bệnh nhân.\n\nLà bác sĩ của cô, tôi nghĩ mình nên giới thiệu một người thay thế phù hợp. **Vì vậy**, tôi muốn giới thiệu bác sĩ Jennifer Jana. Cô ấy là một bác sĩ xuất sắc và phòng khám của cô ấy nằm **gần** phòng khám hiện tại của tôi. Nếu cô đồng ý, hồ sơ y tế của cô sẽ được chuyển cho bác sĩ Jana vào ngày 2 tháng 6. **Nếu không, cô có thể đến nhận hồ sơ từ nhân viên của tôi trước ngày đó.** Chúc cô luôn khỏe mạnh và có một tương lai tốt đẹp.\n\nTrân trọng,\n\nBác sĩ Miles Hamilton  \nPhòng khám Hamilton Medical","translationStatus":"reviewed"},{"id":"h3/test02/135_DBCC.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 135–138","questions":{"135":"D","136":"B","137":"C","138":"C"},"image":"data/h3/test02/135_DBCC.png","markedImage":"marked/h3/test02/135_DBCC.png","translation":"### Thư báo trúng tuyển\n\nNgày 7 tháng 4\n\nWilliam Randell  \n118 West Ocean Boulevard  \nOceanside, California 92049\n\nKính gửi ông Randell,\n\nHồ sơ đăng ký của ông đã được **chấp thuận**. Chúng tôi vui mừng chào đón ông đến với Đại học West Coast State. Trong những tuần tới, chúng tôi sẽ gửi thêm thông tin về những việc ông cần chuẩn bị cho học kỳ đầu tiên. **Với điều kiện** ông đáp ứng thời hạn đăng ký, ông sẽ được phép đăng ký đủ số môn học và có thể thanh toán học phí vào tuần cuối của tháng 7. Khi đó, chúng tôi cũng sẽ cấp thẻ sinh viên cho ông. **Sau khi nhận thẻ, ông có thể sử dụng tất cả cơ sở vật chất trong khuôn viên trường.** Nếu lúc đó ông muốn ở ký túc xá, chúng tôi sẽ bố trí phòng cho ông một tuần trước khi các lớp học bắt đầu. Ông sẽ được phép chuyển vào ở ngay **sau đó**.\n\nMột lần nữa, xin chúc mừng hồ sơ đăng ký thành công của ông. Chúng tôi hy vọng được gặp ông vào mùa thu này.\n\nTrân trọng,\n\nPhòng Tuyển sinh và Hỗ trợ tài chính  \nĐại học West Coast State","translationStatus":"reviewed"},{"id":"h3/test02/139_CBBD.png","folder":"h3/test02","book":"h3","bookLabel":"Hacker 3","test":"test02","testLabel":"Test 02","title":"Hacker 3 · Test 02 · Câu 139–142","questions":{"139":"C","140":"B","141":"B","142":"D"},"image":"data/h3/test02/139_CBBD.png",
