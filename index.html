hững người chưa nhận lương sẽ có tiền trong vài giờ tới. Tôi sẽ báo lại khi có diễn biến mới.\n\n**William Stuttgart — 10:34:** Tôi vừa nhận được thông báo từ ngân hàng rằng tiền đã được chuyển.\n\n**Jessica Jang — 10:35:** Erin, cô có thể liên hệ các phòng ban khác để xác nhận vấn đề đã được giải quyết không?\n\n**Erin Hinkle — 10:36:** Được, tôi sẽ làm.\n\nWilliam Stuttgart là người **nhận lương trước một số nhân viên khác**, còn Erin sẽ **kiểm tra xem tất cả nhân viên đã được trả lương hay chưa**.\n\nĐáp án: **160 C, 161 B**.","translationStatus":"reviewed"},{"id":"h2/test06/162_BCD.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 162–164","questions":{"162":"B","163":"C","164":"D"},"image":"data/h2/test06/162_BCD.png","markedImage":"marked/h2/test06/162_BCD.png","translation":"**Báo cáo cho cuộc họp Ban điều hành Hội đồng Thành phố ngày 18 tháng 3**\n\n**Các phương án của Sở Quy hoạch**\n\nĐường cao tốc Truman đã 50 năm tuổi và không còn phù hợp để sử dụng. Mặt đường ngày càng gồ ghề; phần dưới của cầu cạn đang xuống cấp, có thể gây nguy hiểm cho khu vực dành cho người đi bộ và những con đường nhỏ bên dưới. Có ba phương án chính để xử lý vấn đề này.\n\nPhương án thứ nhất là sửa chữa các đoạn bị hư hỏng. Đây là cách rẻ nhất và nhanh nhất. Tuy nhiên, một số nhà hoạt động cộng đồng lưu ý rằng người dân không thích đi bộ dọc các con phố tối dưới đường cao tốc để đến khu bờ sông phía bên kia. Thành phố đang cố tăng **lượng khách vốn còn thấp tại khu bờ sông**, nên chỉ sửa đường sẽ không giải quyết được vấn đề này.\n\nPhương án thứ hai là xây lại tuyến đường dưới lòng đất. Cách này giữ nguyên lưu lượng giao thông và tạo thêm không gian phía trên cho các công trình khác, nhưng sẽ cực kỳ tốn kém và có thể gây nhiều xáo trộn.\n\nPhương án cuối cùng là phá bỏ đường cao tốc và mở rộng đường Elmview bên dưới. Việc này có thể giúp phát triển ngành bán lẻ địa phương vì các cửa hàng ở mặt đường sẽ tiếp cận được lượng khách lớn hơn. Tuy nhiên, đường Elmview không thể tiếp nhận toàn bộ lưu lượng hiện tại. Nhiều phương tiện sẽ tìm cách đi vòng qua phía bắc, có thể qua cộng đồng Greenville. Người dân Greenville rất có thể sẽ **phản đối kế hoạch chuyển hướng giao thông** vì lượng xe đi xuyên qua và tiếng ồn trên đường của họ sẽ tăng.\n\nBáo cáo không đề xuất **dời đường cao tốc xa hơn về phía bắc**.\n\nĐáp án: **162 B, 163 C, 164 D**.","translationStatus":"reviewed"},{"id":"h2/test06/165_BBB.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 165–167","questions":{"165":"B","166":"B","167":"B"},"image":"data/h2/test06/165_BBB.png","markedImage":"marked/h2/test06/165_BBB.png","translation":"**Đến:** Marcie Camden  \n**Từ:** Christina Garcia  \n**Ngày:** 10 tháng 11  \n**Chủ đề:** Đơn hàng của quý khách\n\nThưa cô Camden,\n\nThư này liên quan đến hai túi xách thiết kế Lucia Simonetti mà cô đã đặt trên trang web của chúng tôi vào ngày 8 tháng 11. Rất tiếc, một trong hai chiếc, mẫu số 452, hiện đã hết hàng. Đây là mặt hàng rất được ưa chuộng và chúng tôi vừa bán hết. Chúng tôi đã đặt thêm hàng từ nhà cung cấp tại Ý cách đây khoảng một tuần rưỡi. **Tuy nhiên, họ cho biết việc giao hàng có thể bị chậm do một cuộc đình công trong ngành vận tải tại Milan.** Sớm nhất phải hai tuần nữa hàng mới về.\n\nChúng tôi muốn biết cô có còn muốn tiếp tục đơn hàng hay không. **Cả hai lựa chọn đều không phát sinh thêm chi phí.** Nếu đồng ý, chúng tôi sẽ gửi mẫu 450 hiện có bằng dịch vụ chuyển phát qua đêm mà không tính thêm phí. Hoặc cô có thể chờ mẫu 452 về và chúng tôi sẽ gửi cả hai chiếc cùng lúc.\n\nVui lòng trả lời email để thông báo quyết định. Tôi sẽ cập nhật cho cô ngay khi có thông tin mới. Chúng tôi xin lỗi vì sự bất tiện này.\n\nTrân trọng,  \nChristina Garcia  \nĐại diện bán hàng, E-Shopping\n\nEmail được gửi để **hỏi khách hàng muốn xử lý đơn hàng theo phương án nào**; cô Camden đã **mua hàng qua Internet**.\n\nĐáp án: **165 B, 166 B, 167 B**.","translationStatus":"reviewed"},{"id":"h2/test06/168_ACDC.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 168–171","questions":{"168":"A","169":"C","170":"D","171":"C"},"image":"data/h2/test06/168_ACDC.png","markedImage":"marked/h2/test06/168_ACDC.png","translation":"**Tàu Armitage đến Fullerton**\n\nBảo tàng Hàng hải Blackwell tại Fullerton sẽ tổ chức triển lãm *The Ocean King*, giới thiệu lịch sử của tàu Armitage — tàu chở khách hạng sang đầu tiên của Mỹ vượt Thái Bình Dương từ Hoa Kỳ đến Nhật Bản. Triển lãm diễn ra từ ngày 1 tháng 7 đến ngày 30 tháng 10, gồm mô hình Armitage dài 5 mét, các khu vực nội thất tàu được phục dựng và hơn 500 hiện vật thu hồi trong những chuyến thám hiểm tư nhân. Ngoài ra còn có một bộ phim ngắn nhằm làm sáng tỏ bí ẩn về vụ tàu chìm không rõ nguyên nhân vào năm 1898.\n\n“Đây là cơ hội để mọi người thấy nội thất con tàu thực sự trông như thế nào,” quản thủ Jonathan Wiley cho biết. “Khách tham quan có thể đi xuyên qua khu trưng bày như thể là hành khách trên tàu và nhìn thấy những nơi mà một số người giàu có và có ảnh hưởng nhất từng ở trong hành trình.”\n\nTriển lãm *The Ocean King* nhằm mang đến cái nhìn **toàn diện** về lịch sử, tầm quan trọng và ảnh hưởng của tàu Armitage đối với ngành hàng hải. Triển lãm mở cửa từ thứ Ba đến Chủ nhật, 9 giờ sáng đến 7 giờ tối. Vé thường là 20 đô la; **sinh viên được giảm 50%**, còn trẻ em từ sáu tuổi trở xuống được miễn phí. Để đặt vé, truy cập www.blackwell.org/armitage hoặc gọi phòng vé theo số 555-0391.\n\nBài viết cung cấp thông tin về **một sự kiện sắp diễn ra tại bảo tàng**; tàu Armitage **bị chìm vì nguyên nhân chưa rõ**.\n\nĐáp án: **168 A, 169 C, 170 D, 171 C**.","translationStatus":"reviewed"},{"id":"h2/test06/172_DDCB.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 172–175","questions":{"172":"D","173":"D","174":"C","175":"B"},"image":"data/h2/test06/172_DDCB.png","markedImage":"marked/h2/test06/172_DDCB.png","translation":"**Davenport Accounting — BẢN GHI NHỚ**\n\n**Đến:** Toàn thể nhân viên  \n**Từ:** Phillip Christensen\n\nNhư hầu hết mọi người đã biết, chúng ta sắp tiến hành nâng cấp toàn bộ phần cứng văn phòng. Phần lớn thiết bị đã khá cũ và đến hạn thay mới trong năm nay. **Việc nâng cấp đã được lên lịch vào cuối tuần tới.** Chúng ta sẽ nâng cấp máy chủ và cấp máy tính mới cho tất cả những ai chưa được nhận máy mới trong năm năm qua. Ngoài ra, các máy in mới sẽ được bố trí khắp văn phòng. Nhiều người cũng đã yêu cầu màn hình mới. **Đáng tiếc, do kinh phí hạn chế, chúng tôi không thể phê duyệt mọi yêu cầu.**\n\nNếu được nhận máy tính mới, vui lòng tải tất cả các tệp cần thiết xuống ổ cứng ngoài trước thứ Sáu. Điều này rất quan trọng vì thiết bị cũ sẽ được thay trong cuối tuần và nhân viên sẽ không thể truy cập từ thứ Hai.\n\n**Quá trình thay thế sẽ bắt đầu vào thứ Sáu lúc 8 giờ tối.** Các kỹ thuật viên hy vọng hoàn tất toàn bộ công việc trong thứ Bảy và Chủ nhật. Nếu có chậm trễ, chúng tôi sẽ thông báo. Nếu có câu hỏi, hãy gọi số máy lẻ 115 hoặc gửi email đến philchristensen@davenport.com.\n\n**Nếu yêu cầu của bạn được phê duyệt, bạn hẳn đã nhận được email về yêu cầu đó.** Cảm ơn sự hợp tác của mọi người.\n\nNhân viên có trách nhiệm **lưu lại các tệp cần thiết**. Bản ghi nhớ **không nói rằng nhân viên văn phòng phải làm thêm giờ** vào cuối tuần tới.\n\nĐáp án: **172 D, 173 D, 174 C, 175 B**.","translationStatus":"reviewed"},{"id":"h2/test06/176_BDDBA.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 176–180","questions":{"176":"B","177":"D","178":"D","179":"B","180":"A"},"image":"data/h2/test06/176_BDDBA.png","markedImage":"marked/h2/test06/176_BDDBA.png","translation":"**Tài liệu 1 — Generix Motors thông báo thu hồi xe thể thao**\n\nGenerix Motors có trụ sở tại Detroit vừa thông báo thu hồi mẫu xe thể thao GX-490 vào thứ Sáu tuần trước để thay thế một hệ thống an toàn bị lỗi. Tất cả chủ xe được yêu cầu đưa xe đến đại lý Generix gần nhất để nâng cấp. Công ty cho biết đã gửi thư thông báo chính thức cho chủ sở hữu.\n\nDo lỗi lập trình trong hệ thống máy tính của xe, túi khí hành khách phía trước đôi khi hoạt động sai. Generix sẽ cài đặt bản cập nhật và thay hai linh kiện nhỏ. Trong thông cáo báo chí của Davis Martino, giám đốc quan hệ công chúng của Generix, vấn đề được mô tả là không nghiêm trọng. Ông cũng viết rằng Generix luôn thực hiện mọi biện pháp phòng ngừa để bảo đảm an toàn cho người lái xe và ngay cả vấn đề nhỏ nhất cũng cần được khắc phục.\n\nĐợt thu hồi dự kiến khiến hãng tốn gần 70 triệu đô la, nhưng nhiều người cho rằng phản ứng có trách nhiệm như vậy chỉ có lợi cho hình ảnh của Generix Motors. Chủ xe thuộc diện thu hồi có thể truy cập www.generixmotors.com/outlets để tìm nơi sửa chữa gần nhất, hoặc gửi email đến recall@generixmotors.com.\n\n---\n\n**Tài liệu 2 — Email yêu cầu hỗ trợ**\n\n**Đến:** Bộ phận hỗ trợ khách hàng  \n**Từ:** Graham Worthington  \n**Chủ đề:** Thu hồi  \n**Ngày:** 22 tháng 4\n\nKính gửi quý công ty,\n\nTôi mua một chiếc GX-490 Sports Coupe cách đây sáu tháng. Gần đây tôi đọc trên báo địa phương rằng công ty đã thu hồi mẫu xe này. Tôi vẫn chưa nhận được thư thông báo nên khá bất ngờ.\n\nTôi muốn đưa xe đi sửa nhưng không biết phải đến đâu. Tôi không tìm thấy đại lý nào trong khu vực của mình trên trang web. Điểm Generix gần nhất có vẻ ở Madison, khá xa để lái xe đến.\n\nXin cho tôi biết nên đưa xe đến đâu. Tôi sống tại thị trấn nhỏ Monroe, Wisconsin, mã bưu chính 53556. Đại lý càng gần càng thuận tiện. Vui lòng phản hồi sớm qua email hoặc gọi cho tôi theo số (608) 555-3456. Đây là vấn đề nghiêm trọng với tôi vì **tôi có hai con nhỏ thường ngồi trên xe**, nên muốn xử lý thật nhanh.\n\nTrân trọng,  \nGraham Worthington\n\nBài báo nói về **lỗi kỹ thuật của một sản phẩm**. Davis Martino **viết thông cáo báo chí**. Ông Worthington liên hệ để **xác minh thông tin liên lạc của đại lý** và xe của ông cần **cập nhật hệ thống máy tính**.\n\nĐáp án: **176 B, 177 D, 178 D, 179 B, 180 A**.","translationStatus":"reviewed"},{"id":"h2/test06/181_CBBDA.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 181–185","questions":{"181":"C","182":"B","183":"B","184":"D","185":"A"},"image":"data/h2/test06/181_CBBDA.png","markedImage":"marked/h2/test06/181_CBBDA.png","translation":"**Tài liệu 1 — Donnelly & Chung Publicity: Chuyên gia xây dựng thương hiệu**\n\nBạn là công ty mới đang gặp khó khăn trong việc nâng cao nhận diện thương hiệu? Bạn có sản phẩm tuyệt vời nhưng chưa biết quảng bá thế nào? Hay doanh nghiệp cần thay đổi hình ảnh? Dù vấn đề tiếp thị là gì, Donnelly & Chung Publicity đều có thể hỗ trợ. Khách hàng của chúng tôi gồm các doanh nghiệp địa phương như Shasta-Clear Beverages và Deverborne Stationery, cũng như các tập đoàn quốc tế lớn như Compton Clothiers và Just-Ate Dietary Supplements.\n\nCác chuyên gia của chúng tôi có thể lập kế hoạch cụ thể để quảng bá sản phẩm hoặc dịch vụ của bạn. Chúng tôi cung cấp dịch vụ phát triển chiến dịch quảng cáo, xây dựng thương hiệu doanh nghiệp, tư vấn xác định khách hàng mục tiêu, nghiên cứu thị trường và nhiều dịch vụ khác.\n\nBuổi tư vấn đầu tiên hoàn toàn miễn phí. Một cộng sự sẽ trao đổi nhu cầu và cung cấp báo giá miễn phí. Hãy gọi 555-4951 để đặt lịch tư vấn miễn phí.\n\n---\n\n**Tài liệu 2 — Thư ngày 2 tháng 7**\n\nKính gửi cô Patricia Draper,\n\nTôi rất vui vì gần đây được gặp và trao đổi với cô về nhu cầu xây dựng thương hiệu. Tôi vừa mở doanh nghiệp tại Denver và rất cần hỗ trợ quảng bá.\n\nTôi đã trao đổi về buổi tư vấn với đối tác kinh doanh Walter Preston. Anh ấy nhớ chiến dịch quảng bá rất thành công mà công ty cô từng thực hiện cho Shasta-Clear. Vì vậy, chúng tôi thống nhất thuê công ty cô lập kế hoạch xây dựng thương hiệu cho tiệm bánh. Chúng tôi muốn bắt đầu càng sớm càng tốt; vui lòng cho biết khi nào cô rảnh để gặp trực tiếp tôi và Walter. **Hai chúng tôi thường rảnh sau 11 giờ sáng các ngày trong tuần.**\n\nTrong buổi gặp, cô nói công ty cần mô tả đầy đủ các sản phẩm chúng tôi bán nếu tiến hành công việc xây dựng thương hiệu. Tôi gửi kèm danh sách toàn bộ sản phẩm, bao gồm các nguyên liệu. Nếu cần thêm thông tin trước cuộc gặp, tôi sẵn lòng cung cấp.\n\nMong sớm được hợp tác và nhận phản hồi từ cô.\n\nTrân trọng,  \nKevin Swords  \nĐồng sở hữu PS Baked Goods\n\nDonnelly & Chung hỗ trợ **quảng bá thương hiệu doanh nghiệp**. Walter Preston là **đồng sở hữu PS Baked Goods**. Kevin muốn cô Draper **xác nhận thời gian rảnh để gặp mặt**, và thư có đính kèm **phần mô tả các mặt hàng được bán**.\n\nĐáp án: **181 C, 182 B, 183 B, 184 D, 185 A**.","translationStatus":"reviewed"},{"id":"h2/test06/186_ADBBC.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 186–190","questions":{"186":"A","187":"D","188":"B","189":"B","190":"C"},"image":"data/h2/test06/186_ADBBC.png","markedImage":"marked/h2/test06/186_ADBBC.png","translation":"**Tài liệu 1 — Email yêu cầu bồi hoàn**\n\n**Đến:** Dịch vụ khách hàng Tailwind Airlines  \n**Từ:** Maggie Flowers  \n**Ngày:** 29 tháng 5  \n**Chủ đề:** Bồi thường  \n**Đính kèm:** Biên lai thuê xe\n\nKính gửi bộ phận Dịch vụ khách hàng,\n\nNgày 25 tháng 5, tôi dự kiến đi chuyến bay 535 từ Cleveland đến Pittsburgh. Tuy nhiên, chuyến bay bị hủy do sự cố kỹ thuật. Tại sân bay, tôi được hứa cấp phiếu bồi thường cho sự bất tiện này nhưng chưa bao giờ nhận được, nên muốn liên hệ để giải quyết. Ngoài ra, tôi muốn được hoàn lại một khoản chi phí phát sinh. Tôi phải tham dự một cuộc phỏng vấn việc làm và không thể chờ đến ngày hôm sau, nên đã thuê xe và tự lái đến nơi. Tôi gửi kèm bản sao biên lai thuê xe.\n\nMong quý công ty hỗ trợ giải quyết vấn đề.\n\nTrân trọng,  \nMaggie Flowers\n\n---\n\n**Tài liệu 2 — Phản hồi của hãng hàng không**\n\n**Đến:** Maggie Flowers  \n**Từ:** Dịch vụ khách hàng Tailwind Airlines  \n**Ngày:** 8 tháng 6  \n**Đính kèm:** Biểu mẫu bồi hoàn  \n**Chủ đề:** V/v: Bồi thường\n\nThưa cô Flowers,\n\nTôi rất tiếc về sự bất tiện của cô và xin được khắc phục tình hình.\n\nTrước hết, hệ thống cho thấy cô đủ điều kiện nhận phiếu bồi thường. Thông thường, chúng tôi báo với khách rằng họ sẽ nhận phiếu trong vòng bốn tuần. Tôi xin lỗi nếu nhân viên không **truyền đạt** rõ thông tin này khi chuyến bay bị hủy. Phiếu đã được gửi qua bưu điện và sẽ sớm đến. Thứ hai, **tất cả hành khách trên chuyến bay đều được mời nghỉ một đêm tại khách sạn sân bay**. Chính sách cho phép hoàn trả chi phí cho hành khách có hoàn cảnh đặc biệt, tối đa bằng giá phòng khách sạn. Trường hợp của cô đủ điều kiện vì khoản thuê xe 135 đô la thấp hơn chi phí đó, tức là **mỗi phòng khách sạn có giá hơn 135 đô la**.\n\nĐể tiếp tục, hãy điền biểu mẫu đính kèm và gửi lại cùng **biên lai thuê xe bản gốc**. Nếu cần thêm hỗ trợ, vui lòng liên hệ lại. Cảm ơn cô đã là một khách hàng trung thành và đáng quý.\n\nTrân trọng,  \nPaul Russell  \nĐại diện dịch vụ khách hàng\n\n---\n\n**Tài liệu 3 — Biểu mẫu yêu cầu bồi hoàn**\n\n**Hãng hàng không Tailwind — Thời gian giải quyết có thể lên đến 30 ngày**\n\n- Tên: Maggie Flowers\n- Mã thành viên thưởng: 4793345\n- Loại yêu cầu: Bồi hoàn\n- Số tiền yêu cầu: 135 đô la\n- Chuyến bay: 535, ngày 25 tháng 5\n- Điểm đi: Cleveland, Ohio\n- Điểm đến: Pittsburgh, Pennsylvania\n- Lý do: Chuyến bay bị hủy; yêu cầu hoàn trả một số chi phí\n- Chứng từ cần gửi kèm: Biên lai thuê xe\n- Ký ngày: 10 tháng 6\n\nVì quy trình giải quyết có thể mất 30 ngày kể từ 10 tháng 6, cô Flowers **có thể phải chờ đến tháng 7 mới nhận được tiền hoàn lại**.\n\nĐáp án: **186 A, 187 D, 188 B, 189 B, 190 C**.","translationStatus":"reviewed"},{"id":"h2/test06/191_CBBDC.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 191–195","questions":{"191":"C","192":"B","193":"B","194":"D","195":"C"},"image":"data/h2/test06/191_CBBDC.png","markedImage":"marked/h2/test06/191_CBBDC.png","translation":"**Tài liệu 1 — Hội nghị Công nghệ Xanh lần thứ 12**\n\n**Thứ Năm, ngày 9 tháng 6 — Phòng A, Trung tâm Hội nghị Singapore**\n\n- 12:30: Đăng ký\n- 1:00: Phát biểu chào mừng — Ellen Matsushita, Chủ tịch Hiệp hội Công nghệ Xanh\n- 1:30: Bài phát biểu chính — Harold Baker, Chủ tịch Greentrade Technologies\n- 2:00: Triển vọng ngành — Jeremy Porter, Giám đốc điều hành Viện Nghiên cứu Xanh\n- 2:30: Năng lượng gió, mặt trời và sinh khối — Nathan Chaudry, Tổng giám đốc Leaftech International\n- 3:00: Nghỉ giải lao\n- 3:30: Các ứng dụng mới trong công nghệ xanh — Thomas Keng, Chủ tịch Environmental Research Group\n- 4:00: Thảo luận nhóm về tài trợ dự án xanh — Điều phối: Barbara Woodbine, Giám đốc tài chính Global Lending\n- 5:00: Phát biểu bế mạc — Sylvia Klein, Chủ tịch European Green Initiative\n\nChương trình **không có bữa tiệc trưa đặc biệt**.\n\n---\n\n**Tài liệu 2 — Email cập nhật chương trình**\n\n**Đến:** Eduardo Ferrer  \n**Từ:** Ellen Matsushita  \n**Ngày:** 14 tháng 5  \n**Chủ đề:** V/v: Chương trình hội nghị\n\nCần thực hiện thêm một vài thay đổi. Chủ tịch Greentrade Technologies không thể tham dự. Thay vào đó, chúng ta sẽ mời Tiến sĩ Connor Aromdee của Đại học Thái Lan, nên ông có khả năng phát biểu **lúc 1 giờ 30 chiều**. Ngoài ra, cô Woodbine của Global Lending sẽ rời hội nghị sớm nên không thể điều phối phiên thảo luận. Cô đề nghị mời Bộ trưởng thuộc Hội đồng Phát triển Kinh tế Singapore thay thế. Tôi đã liên hệ và ông ấy nhận lời. Nếu còn thay đổi, tôi sẽ báo vào buổi sáng; sau đó chương trình sẽ được chốt.\n\nCảm ơn!  \nEllen\n\n---\n\n**Tài liệu 3 — Bản tin kinh doanh**\n\nSingapore, ngày 11 tháng 6 — Hiệp hội Công nghệ Xanh (GTA) vừa tổ chức Hội nghị Công nghệ Xanh lần thứ 12 tại Trung tâm Hội nghị Singapore. Lãnh đạo của một số tổ chức có vai trò **then chốt** trong sự phát triển công nghệ xanh trên toàn thế giới đã tham dự. Theo diễn giả Jeremy Porter của Viện Nghiên cứu Xanh, triển vọng ngành vẫn ổn định dù một số chính trị gia tại vài quốc gia đang **cản trở việc sử dụng công nghệ xanh**.\n\nChủ tịch GTA Ellen Matsushita cũng lạc quan tương tự và trích dẫn những nhận định sâu sắc của David Mah, Bộ trưởng thuộc Hội đồng Phát triển Kinh tế Singapore. Có thể tải báo cáo đầy đủ về các bài phát biểu và tài liệu trình bày tại www.gta.org.\n\nDavid Mah là người **điều phối phiên thảo luận về tài trợ các dự án xanh**.\n\nĐáp án: **191 C, 192 B, 193 B, 194 D, 195 C**.","translationStatus":"reviewed"},{"id":"h2/test06/196_CCBAB.png","folder":"h2/test06","book":"h2","bookLabel":"Hacker 2","test":"test06","testLabel":"Test 06","title":"Hacker 2 · Test 06 · Câu 196–200","questions":{"196":"C","197":"C","198":"B","199":"A","200":"B"},"image":"data/h2/test06/196_CCBAB.png","markedImage":"marked/h2/test06/196_CCBAB.png","translation":"**Tài liệu 1 — Chính sách gia hạn trực tuyến của Thư viện Công cộng Westerburn**\n\nMọi sách thuộc sở hữu của Westerburn đều có thể được gia hạn qua tài khoản trực tuyến. Hãy đăng nhập, mở trình đơn “View”, chọn “Checked out items”, đánh dấu các sách muốn gia hạn rồi nhấn “Send”. Thành viên được phép gia hạn tài liệu thêm **hai tuần**, miễn là không có yêu cầu đặt trước. Nếu một thành viên khác đã yêu cầu tài liệu, hệ thống sẽ báo rằng sách không thể được mượn lại.\n\nSách mượn liên thư viện cũng có thể được gia hạn trực tuyến, nhưng có thể áp dụng một số hạn chế. Hãy kiểm tra nhãn ở bìa sau để biết chính sách của thư viện cho mượn, vì chính sách đó có thể khác với Westerburn.\n\n---\n\n**Tài liệu 2 — Danh sách sách đang mượn của Melissa Terrance, ngày 8 tháng 8**\n\n- *The Reign of King Jordanius* — Thư viện Westerburn — hạn 10/8 — Không thể gia hạn\n- *The Science of Memory* — Thư viện Westerburn — hạn 10/8 — Đã chọn gia hạn\n- *A History of Medicinal Plants* — Mượn liên thư viện từ Highland Marsh — hạn 10/8 — Đã chọn gia hạn\n- *Tell Her: Short Stories* — Mượn liên thư viện từ Greenporter University — hạn 15/8 — Chưa chọn gia hạn\n\nSách mượn liên thư viện có thể được trả tại Westerburn hoặc thư viện gốc. Vì vậy, sách của Maya Teller có thể được **trả tại Thư viện Công cộng Westerburn**.\n\n---\n\n**Tài liệu 3 — Email giải đáp thắc mắc**\n\n**Đến:** Melissa Terrance  \n**Từ:** Agnes Featherstone, nhân viên Thư viện Công cộng Westerburn  \n**Ngày:** 9 tháng 8  \n**Chủ đề:** V/v: Thắc mắc\n\nThưa cô Terrance,\n\nYêu cầu của cô bị từ chối vì cuốn sách cô muốn gia hạn, mã 147.09WUD, đến từ một thư viện khác có chính sách cho mượn khác Westerburn; hệ thống gia hạn trực tuyến của chúng tôi không thể phản ánh các quy định đó. Nhãn ở bìa sau cho biết thư viện sở hữu sách chỉ cho phép gia hạn tài liệu tham khảo **một lần**. Khác với các sách còn lại trong danh sách đang mượn, cô đã gia hạn cuốn này một lần trước đây. Xin lưu ý sách đến hạn vào ngày mai.\n\nCảm ơn cô.  \nAgnes Featherstone\n\nCuốn Melissa đã gia hạn một lần là **A History of Medicinal Plants**. *The Reign of King Jordanius* không gia hạn được vì **đã có người khác yêu cầu mượn**. Chính sách không đề cập việc **thanh toán phí trễ hạn qua tài khoản trực tuyến**.\n\nĐáp án: **196 C, 197 C, 198 B, 199 A, 200 B**.","translationStatus":"reviewed"},{"id":"h2/test07/131_DBCA.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 131–134","questions":{"131":"D","132":"B","133":"C","134":"A"},"image":"data/h2/test07/131_DBCA.png","markedImage":"marked/h2/test07/131_DBCA.png","translation":"**Thông báo về tiệc nghỉ hưu của ông Kaur**\n\nGửi: Toàn thể nhân viên  \nTừ: Stephanie Johnstone\n\nXin chào mọi người,\n\nĐây là lời nhắc rằng chúng ta đã tổ chức một buổi tiệc nghỉ hưu cho ông Kaur vào thứ Sáu tuần tới, từ 6 giờ tối **trở đi**. Tôi rất mong tất cả mọi người có thể tham dự, trừ khi có lý do chính đáng khiến bạn không thể đến. Sau khi mọi người ổn định chỗ ngồi, chương trình **sẽ bắt đầu** đúng 6 giờ 15 phút tối. Tổng giám đốc điều hành dự định sẽ có một bài phát biểu chúc mừng. **Sau đó, một thành viên hội đồng quản trị sẽ trao tặng ông Kaur một giải thưởng ghi nhận lòng trung thành.** Là nhân viên có thâm niên lâu nhất của chúng ta, ông hoàn toàn xứng đáng nhận được sự ghi nhận này.\n\nTôi đã đề nghị quản lý của từng bộ phận **chuyền tay** một cuốn sổ để các nhân viên viết lời chúc tốt đẹp dành cho ông Kaur nhân dịp nghỉ hưu. Cuốn sổ sẽ bắt đầu được chuyền từ sáng mai và được trao cho ông vào cuối buổi lễ, vì vậy xin mọi người dành thời gian viết vài lời.\n\nĐáp án: **131 D, 132 B, 133 C, 134 A**.","translationStatus":"reviewed"},{"id":"h2/test07/135_DDBD.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 135–138","questions":{"135":"D","136":"D","137":"B","138":"D"},"image":"data/h2/test07/135_DDBD.png","markedImage":"marked/h2/test07/135_DDBD.png","translation":"**Thư tư vấn đầu tư**\n\nNgày 5 tháng 3\n\nKính gửi cô Jeanie Handa,\n\nTôi đã nghe một đồng nghiệp của cô báo tin vui. Xin chúc mừng cô đã được **thăng chức** lên vị trí chuyên viên phân tích hệ thống cấp cao!\n\nTôi viết thư này để cập nhật tình hình các khoản đầu tư của cô; hiện chúng vẫn hoạt động khá tốt. **Tuy nhiên, có lẽ đây là lúc cô nên xem xét lại chiến lược đầu tư của mình.** Giờ đây, khi sự nghiệp đang phát triển thuận lợi, cô có thể đầu tư vào các quỹ khác hoặc mua thêm cổ phiếu **để tăng** thu nhập và mở rộng danh mục đầu tư. Tôi muốn sắp xếp một cuộc hẹn để chúng ta trao đổi chi tiết hơn về các lựa chọn. Tôi có thể gặp cô sớm nhất là vào tuần tới.\n\nChúng ta có thể xem xét **tình trạng** danh mục đầu tư hiện tại của cô và tìm hiểu thêm các cơ hội tài chính khác. Vui lòng gọi cho tôi theo số 555-8343 hoặc gửi email đến j.clark@secureinvestments.com để đặt lịch hẹn.\n\nTrân trọng,  \nJack Clark  \nChuyên viên tư vấn, Secure Investments\n\nĐáp án: **135 D, 136 D, 137 B, 138 D**.","translationStatus":"reviewed"},{"id":"h2/test07/139_CCBC.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 139–142","questions":{"139":"C","140":"C","141":"B","142":"C"},"image":"data/h2/test07/139_CCBC.png","markedImage":"marked/h2/test07/139_CCBC.png","translation":"**Thư khảo sát trải nghiệm bệnh nhân**\n\nNgày 31 tháng 3\n\nKính gửi cô Annika Dahl,\n\nCảm ơn cô đã đến khám gần đây. **Tại High Point Medical, chúng tôi luôn nỗ lực đáp ứng nhu cầu của từng bệnh nhân.** Chúng tôi hy vọng cô hoàn toàn hài lòng với chất lượng chăm sóc đã nhận được.\n\nChúng tôi muốn tìm hiểu thêm về trải nghiệm của cô tại cơ sở y tế thông qua Khảo sát Chăm sóc Bệnh nhân. Vui lòng điền vào bảng câu hỏi và bảo đảm rằng mỗi mục trong số năm mục đều **được đánh giá** theo hướng dẫn. Nếu có ý kiến bổ sung, xin hãy **ghi kèm** vào phần để trống.\n\nThông tin cô cung cấp trong khảo sát sẽ được phân tích và sử dụng để cải thiện dịch vụ trong tương lai. **Tuy nhiên**, quyền riêng tư của cô vẫn được bảo vệ; chúng tôi sẽ không thể truy ngược bất kỳ câu trả lời nào về phía cô. Cảm ơn cô đã tham gia.\n\nStanley Waite  \nBộ phận Đánh giá Người tiêu dùng của Bệnh viện\n\nĐáp án: **139 C, 140 C, 141 B, 142 C**.","translationStatus":"reviewed"},{"id":"h2/test07/143_CDAB.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 143–146","questions":{"143":"C","144":"D","145":"A","146":"B"},"image":"data/h2/test07/143_CDAB.png","markedImage":"marked/h2/test07/143_CDAB.png","translation":"**Sự kiện giới thiệu công nghệ GizmoTech**\n\nSự kiện GizmoTech Technology Showcase sẽ diễn ra tại Somerset Hall vào thứ Sáu, ngày 3 tháng 10, từ 7 giờ tối đến 11 giờ 45 phút tối. Sản phẩm được mong chờ nhất, GizPhone Gold, dự kiến sẽ thu hút một lượng lớn khách hàng muốn mua thiết bị ngay khi nó được mở bán vào nửa đêm **sau** sự kiện.\n\nTrong suốt buổi giới thiệu, nhân viên GizmoTech sẽ luôn **sẵn sàng** giải đáp thắc mắc. Sau phần trình diễn các chức năng, khách tham dự cũng có cơ hội tự mình dùng thử thiết bị. **Đặc biệt hơn cả, họ sẽ được ưu tiên mua điện thoại.** Vì hàng tồn kho của GizmoTech vốn thường bán hết chỉ trong vài phút, quyền lợi này chắc chắn sẽ khuyến khích khách đăng ký sớm.\n\nNhững ai quan tâm nên đăng ký tại www.GizmoTech.com/Showcase càng sớm càng tốt để tránh **bị** từ chối vào khu triển lãm do hết chỗ.\n\nĐáp án: **143 C, 144 D, 145 A, 146 B**.","translationStatus":"reviewed"},{"id":"h2/test07/147_BA.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 147–148","questions":{"147":"B","148":"A"},"image":"data/h2/test07/147_BA.png","markedImage":"marked/h2/test07/147_BA.png","translation":"**SHARPNET CABLE – Yêu cầu kích hoạt lại dịch vụ**\n\nVui lòng điền thông tin bên dưới và gửi mẫu đơn hoàn chỉnh cho trưởng bộ phận tài khoản Wendy Shore. Nếu có câu hỏi, vui lòng liên hệ đại diện chăm sóc khách hàng Raymond Hinckley theo số 555-8734, máy lẻ 016.\n\nTên thuê bao: Darius Jackson  \nSố tài khoản: MM7681WRE3\n\nLý do hủy dịch vụ ban đầu: **Chuyển đến nơi ở mới**\n\nÝ kiến bổ sung:\n\nBan đầu, tôi dự định đăng ký dịch vụ mở rộng thông qua tài khoản của một thuê bao khác là Michael Blakeley, nhưng anh ấy sẽ chuyển đi vào tháng tới. Vì vậy, tôi muốn kích hoạt lại tài khoản cũ tại địa chỉ mới. Tôi hy vọng mức giảm giá dành cho sinh viên vẫn được áp dụng.\n\nChữ ký thuê bao: Darius Jackson  \nNgày: 25 tháng 6\n\nPhê duyệt bởi: **Trưởng bộ phận tài khoản Wendy Shore**\n\nĐáp án: **147 B, 148 A**.","translationStatus":"reviewed"},{"id":"h2/test07/149_CC.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 149–150","questions":{"149":"C","150":"C"},"image":"data/h2/test07/149_CC.png","markedImage":"marked/h2/test07/149_CC.png","translation":"**Hilltop Spa and Wellness Center – Thư hỏi mua hệ thống bán hàng**\n\nNgày 14 tháng 8\n\nKính gửi ông Theodore Cummings,\n\nTôi đã lấy một tờ giới thiệu về công ty ông tại hội chợ thương mại gần đây và muốn hỏi về việc mua một hệ thống bán hàng tại điểm bán (POS). Tài liệu cho biết công ty có thể tùy chỉnh hệ thống POS cho gần như mọi loại hình kinh doanh. Tôi điều hành trung tâm spa nói trên; chúng tôi bán các sản phẩm như kem dưỡng da tay và kem dưỡng, đồng thời cung cấp dịch vụ mát-xa cùng nhiều liệu pháp khác.\n\nTôi đánh giá cao việc hệ thống POS có thể theo dõi doanh số hàng hóa hoặc dịch vụ được thanh toán bằng tiền mặt, thẻ ghi nợ và thẻ tín dụng. Tôi cũng thích khả năng **tạo báo cáo bán hàng chi tiết**. Tuy nhiên, tôi muốn biết hệ thống có thể hiển thị riêng các mặt hàng bán với giá ưu đãi hoặc được thanh toán bằng điểm thưởng hay không. Chúng tôi thỉnh thoảng tổ chức khuyến mãi, phát thẻ quà tặng và **duy trì chương trình tích điểm cho khách hàng thường xuyên**. Vì vậy, tôi muốn hệ thống theo dõi các mặt hàng thuộc những nhóm này và phản ánh chúng trong báo cáo bán hàng.\n\nXin cho biết khi nào chúng ta có thể gặp nhau để trao đổi thêm. Tôi muốn hệ thống mới được lắp đặt và vận hành trước ngày 15 tháng 10. Ông có thể gọi cho tôi trong giờ làm việc, từ 8 giờ sáng đến 7 giờ tối, thứ Ba đến Chủ nhật, theo số 555-2306.\n\nTrân trọng,  \nShauna Gillis  \nChủ sở hữu\n\nĐáp án: **149 C, 150 C**.","translationStatus":"reviewed"},{"id":"h2/test07/151_ACB.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 151–153","questions":{"151":"A","152":"C","153":"B"},"image":"data/h2/test07/151_ACB.png","markedImage":"marked/h2/test07/151_ACB.png","translation":"**Quy trình đặt phòng họp**\n\nNhân viên Great Files Inc. muốn đặt phòng họp cần truy cập lịch đặt phòng trực tuyến tại www.greatfiles.com/employee/meetings để kiểm tra khung giờ còn trống. Nếu không có khung giờ phù hợp, hãy gửi email cho đại diện hành chính của tầng mình và nêu rõ mục đích cuộc họp. Đại diện sẽ liên hệ lại nếu lịch đặt phòng có thể điều chỉnh. Không được tự liên hệ với người đã đặt phòng để thương lượng đổi lịch.\n\nĐại diện theo tầng:\n\n- Tầng 2: Heather Greenstone\n- Tầng 3 và 7: Roxanne Laddington\n- Tầng 4 và 10: Elissa Hunter\n- Tầng 5: Victor Anzelo\n- Tầng 8: Jonathan Madison\n- Tầng 9: Ian Dexter\n\nNếu lịch trực tuyến cho thấy khung giờ mong muốn còn trống, hãy chọn giờ từ trình đơn, nhập số người tham dự và mục đích cuộc họp. Nên đặt trước ít nhất một tuần vì rất khó đáp ứng yêu cầu vào phút chót.\n\nNgoài ra, các phòng họp lớn ở tầng 7 và tầng 8 hiện có thể sử dụng đến 11 giờ đêm mỗi ngày, kể cả thứ Bảy và Chủ nhật; tức là **giờ sử dụng của một số phòng đã được kéo dài**. Tất cả phòng khác chỉ được đặt trong giờ làm việc thông thường. Nếu có thắc mắc về hệ thống đặt lịch, hãy liên hệ Roxanne Laddington theo máy lẻ 2968.\n\nĐây là hướng dẫn nhằm **giải thích quy trình đặt phòng họp cho nhân viên**. Lưu ý rằng không chỉ một người mà **hai đại diện được phân công phụ trách hai tầng**.\n\nĐáp án: **151 A, 152 C, 153 B**.","translationStatus":"reviewed"},{"id":"h2/test07/154_AC.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 154–155","questions":{"154":"A","155":"C"},"image":"data/h2/test07/154_AC.png","markedImage":"marked/h2/test07/154_AC.png","translation":"**Chuỗi tin nhắn về việc đặt vé máy bay cho ông Parker**\n\n**Dorothy Lee – 4:15:** Bạn là thực tập sinh phụ trách đặt chuyến bay đến Las Vegas cho ông Parker, đúng không? Ông ấy nói lịch trình đã thay đổi: ông cần đi ngày 9 tháng 6 và trở về ngày 14.\n\n**James Harter – 4:18:** Tôi chưa làm vì cần số hội viên bay thường xuyên của ông ấy để kiểm tra số điểm còn lại. Tôi định hỏi sớm hơn nhưng ông ấy và các quản lý khác vẫn đang họp.\n\n**Dorothy Lee – 4:20:** Tôi có thông tin đó ở đâu đó. Tôi là trợ lý riêng của ông ấy nên bạn cứ liên hệ với tôi khi cần những chi tiết như vậy.\n\n**Dorothy Lee – 4:24:** Số là **KLJ0294SB1**.\n\n**James Harter – 4:25:** Đã nhận. Tôi đang kiểm tra.\n\n**James Harter – 4:28:** Ông ấy không có đủ điểm cho một vé khứ hồi. Chúng ta vẫn nên dùng số điểm đó chứ?\n\n**Dorothy Lee – 4:29:** Không cần đâu. **Chúng ta có thể để dành điểm cho chuyến bay sau**, tức là lần này cứ thanh toán vé mà không dùng điểm.\n\n**James Harter – 4:30:** Được, tôi sẽ đặt vé ngay.\n\n**Dorothy Lee – 4:30:** Gửi email xác nhận cho tôi nhé. Cảm ơn James.\n\nJames chưa thể hoàn thành công việc vì **thiếu một thông tin cần thiết là số hội viên bay thường xuyên**.\n\nĐáp án: **154 A, 155 C**.","translationStatus":"reviewed"},{"id":"h2/test07/156_CC.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 156–157","questions":{"156":"C","157":"C"},"image":"data/h2/test07/156_CC.png","markedImage":"marked/h2/test07/156_CC.png","translation":"**Hyperbar – Giải pháp tương lai cho một vấn đề hiện tại**\n\nKhartoum, Sudan – Công ty công nghệ Trung Quốc Chaoji International vừa ra mắt một thiết bị mạnh mẽ có thể thay đổi cuộc sống của hàng triệu người trên thế giới. Mang tên Hyperbar, chiếc máy tính chạy bằng năng lượng mặt trời này hướng tới việc cung cấp cho các cộng đồng nông thôn nước sạch, điện và kết nối Internet.\n\nThiết bị thu năng lượng mặt trời qua các tấm pin trên bề mặt rồi chuyển thành điện năng bằng pin tích hợp. Điện được dùng để vận hành hệ thống xử lý nước, có thể tạo ra tới 3.000 lít nước sạch mỗi ngày. Lượng điện dư còn có thể sạc các thiết bị di động. Hơn nữa, hệ thống cung cấp Internet không dây cho mọi người **trong bán kính 750 ki-lô-mét**; con số này nói về phạm vi phủ sóng, **không phải khả năng sạc 750 thiết bị cùng lúc**.\n\nNgười phát ngôn Damien Lin cho biết Hyperbar sẽ đáp ứng một số nhu cầu cơ bản mà nhiều người vẫn xem là điều hiển nhiên. Thiết bị cũng tạo việc làm trong khâu xây dựng và bảo trì. Chaoji còn hình dung các cá nhân có óc kinh doanh có thể tận dụng kết nối Internet của Hyperbar để phát triển dịch vụ mới và thúc đẩy hoạt động kinh tế.\n\nHyperbar hiện được thử nghiệm tại một số ngôi làng ở Sudan, nhưng Chaoji **dự định mở rộng thử nghiệm sang Ethiopia và Chad trước cuối năm**. Nếu thành công, công ty có thể sản xuất hàng nghìn thiết bị trong thập niên tới. Một số doanh nghiệp phương Tây đã bày tỏ mong muốn đầu tư.\n\nĐáp án: **156 C, 157 C**.","translationStatus":"reviewed"},{"id":"h2/test07/158_DCA.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 158–160","questions":{"158":"D","159":"C","160":"A"},"image":"data/h2/test07/158_DCA.png","markedImage":"marked/h2/test07/158_DCA.png","translation":"**Chủ đề: Khóa đào tạo**\n\nGửi toàn thể nhân viên Ellis and Ellis Consulting,\n\nNhư mọi người đã biết, tôi đang tìm cách nâng cao hiệu quả làm việc trong văn phòng và đã đề nghị các bạn hoàn thành một khảo sát để đóng góp ý kiến. **Sau khi xem các câu trả lời, tôi nhận thấy rõ một vài xu hướng.** Chẳng hạn, nhiều nhân viên mong muốn tham gia thêm các lớp phát triển chuyên môn để bổ sung kỹ năng. Đồng thời, tôi nhận thấy chúng ta thường xuyên phải thuê nhà thiết kế đồ họa bên ngoài.\n\nĐiều này hợp lý với những dự án lớn như thiết kế trang web hoặc lập báo cáo thường niên. Tuy nhiên, trong nhiều trường hợp, chúng ta thuê họ chỉ để làm khoảng một giờ công việc mà một nhân viên của chính công ty có thể thực hiện với chút đào tạo. **Vì thế, công ty đang có khoản chi không cần thiết cho thiết kế đồ họa và muốn giảm sự phụ thuộc vào nhân lực bên ngoài.**\n\nDo đó, tôi đang cân nhắc tổ chức một khóa học ngắn về kỹ năng thiết kế đồ họa cơ bản cho nhân viên quan tâm. Khóa học sẽ giúp chúng ta dùng năng lực nội bộ cho những dự án thiết kế nhỏ trong tương lai. Nếu muốn tham gia, vui lòng trả lời email này trước ngày 20 tháng 4.\n\nTrân trọng,  \nBrendon Rogerson  \nGiám đốc Nhân sự\n\nĐáp án: **158 D, 159 C, 160 A**.","translationStatus":"reviewed"},{"id":"h2/test07/161_DAB.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 161–163","questions":{"161":"D","162":"A","163":"B"},"image":"data/h2/test07/161_DAB.png","markedImage":"marked/h2/test07/161_DAB.png","translation":"**Trường Tiểu học Hadenfield – Thông báo hằng tuần dành cho phụ huynh**\n\nXin nhắc rằng đến hết thứ Sáu tuần này, trường áp dụng lịch tan học sớm vì kỳ nghỉ lễ đang đến gần. Tiết học cuối kết thúc sớm ba giờ, vào 12 giờ 30 phút. Tất cả xe buýt trường học vẫn chạy theo tuyến bình thường, ngoại trừ xe số 4 và số 7; hai xe này không thể đón học sinh sống trên hoặc ngoài đường Renniford Drive. **Toàn bộ chương trình sau giờ học bị tạm ngừng trong phần còn lại của tuần**, vì vậy thông báo không nói rằng học sinh vẫn có thể ở lại tham gia các chương trình này.\n\nHội chợ sách sẽ diễn ra vào thứ Tư và thứ Năm tuần tới, từ 10 giờ sáng đến 12 giờ trưa. Học sinh sẽ mang phiếu đặt hàng về nhà vào thứ Ba và **phải điền phiếu trước khi nộp nếu muốn mua sách**. Các em cũng sẽ nhận một cuốn sổ nhỏ cung cấp thông tin về mọi sản phẩm được bán tại hội chợ. Nếu có câu hỏi, vui lòng liên hệ cô Debbie Dreyfus qua email d.dreyfus@hadenfieldelem.org.\n\nHọc sinh được khuyến khích mua sách thuộc danh mục đọc mùa đông, được chọn riêng cho từng năm học nên **nội dung thay đổi theo khối lớp**. Các em phải đọc ít nhất hai cuốn trong kỳ nghỉ đông.\n\nĐáp án: **161 D, 162 A, 163 B**.","translationStatus":"reviewed"},{"id":"h2/test07/164_CBCB.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 164–167","questions":{"164":"C","165":"B","166":"C","167":"B"},"image":"data/h2/test07/164_CBCB.png","markedImage":"marked/h2/test07/164_CBCB.png","translation":"**Trò chuyện trực tuyến với RMP Financial Trust**\n\n**Vivianne Gonyer – 9:12:** Tôi muốn hỏi tài khoản ở ngân hàng của ông còn hoạt động không. Tôi ngừng sử dụng khi chuyển ra nước ngoài, nhưng vài tuần nữa sẽ trở về sống lâu dài.\n\n**Greg Fournier – 9:12:** Cô cho tôi xin số trên thẻ ATM được không?\n\n**Vivianne Gonyer – 9:13:** **Đó chính là vấn đề. Tôi không giữ thẻ ATM vì nghĩ rằng mình không cần nữa**, nên hiện không có thông tin cần thiết để tra cứu.\n\n**Greg Fournier – 9:15:** Cô có loại tài khoản nào?\n\n**Vivianne Gonyer – 9:16:** Tài khoản thanh toán; lần cuối tôi dùng có lẽ đã hơn hai năm trước.\n\n**Greg Fournier – 9:17:** Vậy tài khoản có lẽ đã hết hiệu lực. Tài khoản thanh toán sẽ bị đóng nếu không được sử dụng hơn hai năm.\n\n**Vivianne Gonyer – 9:17:** Hiện tôi có những lựa chọn nào?\n\n**Greg Fournier – 9:18:** Cô có thể mở tài khoản mới có thời hạn năm năm, hoặc mở một tài khoản thanh toán khác.\n\n**Vivianne Gonyer – 9:20:** Tôi chọn phương án sau, tức là **mở một tài khoản thanh toán**. Tôi có thể làm trực tuyến không?\n\n**Greg Fournier – 9:20:** Nhân viên cần xác minh danh tính nên **cô phải trực tiếp đến một cơ sở tài chính**.\n\nCuộc trò chuyện cũng cho thấy cô Gonyer **đã ở nước ngoài ít nhất hai năm**.\n\nĐáp án: **164 C, 165 B, 166 C, 167 B**.","translationStatus":"reviewed"},{"id":"h2/test07/168_CDBA.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 168–171","questions":{"168":"C","169":"D","170":"B","171":"A"},"image":"data/h2/test07/168_CDBA.png","markedImage":"marked/h2/test07/168_CDBA.png","translation":"**Công viên giải trí Stryker – Một tháng lễ hội Fright Nights**\n\nTháng Mười sắp đến, và Công viên giải trí Stryker đang chuẩn bị cho cả tháng vui chơi Halloween. Từ ngày 1 đến ngày 31 tháng 10, công viên tổ chức Fright Nights thường niên với nhiều hoạt động rùng rợn nhưng thú vị dành cho mọi lứa tuổi.\n\nLịch hoạt động:\n\n- 1–31 tháng 10: Tham quan dinh thự ma ám – Nhà mái che phía Bắc\n- 10–31 tháng 10: Trò Evil Zombies Ride – Nhà mái che phía Đông\n- 15–31 tháng 10: Mê cung ngô – Bãi đỗ xe phía Nam\n- 25–31 tháng 10: Khu trẻ em – **Khu ẩm thực**\n\nĐiểm nổi bật:\n\n- Chuyến tham quan dinh thự ma ám trở lại năm thứ ba. Tạp chí **California Living đã xếp nơi này là “ngôi nhà ma ám đáng sợ thứ ba ở Bờ Tây”**, nghĩa là một hạng mục của sự kiện đã được một ấn phẩm công nhận.\n- Khu trẻ em có vẽ mặt, kể chuyện và trang trí bí ngô.\n- Ngày 31 tháng 10, diễn viên Kayla Draper của phim *Darkness Rises* sẽ ký tặng tại nhà mái che chính; thông báo **không nói sẽ có buổi chiếu đặc biệt của bộ phim**.\n- Các quầy ăn trong công viên phục vụ cà phê vị bí ngô và táo bọc đường.\n\nVé Fright Nights đã nằm trong giá vé vào cửa thông thường.\n\nĐáp án: **168 C, 169 D, 170 B, 171 A**.","translationStatus":"reviewed"},{"id":"h2/test07/172_CCAB.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 172–175","questions":{"172":"C","173":"C","174":"A","175":"B"},"image":"data/h2/test07/172_CCAB.png","markedImage":"marked/h2/test07/172_CCAB.png","translation":"**Edmond Estrada giành được vị trí thẩm phán tại Albuquerque**\n\nNgày 18 tháng 3, người phát ngôn của Tòa án Quận Albuquerque thông báo luật sư Edmond Estrada đã thắng cử vào vị trí thẩm phán. Ông sẽ thay thế thẩm phán Wendy Delwes, người xác nhận sẽ nghỉ hưu vào cuối tháng Ba.\n\nTrong 25 năm hành nghề luật, ông Estrada đã tham gia hàng nghìn vụ án, gồm cả khiếu kiện dân sự và tranh chấp giữa chủ nhà với người thuê nhà. **Trong mọi vụ việc pháp lý, ông luôn thể hiện cam kết vững chắc đối với việc theo đuổi công lý.**\n\nÔng Estrada cho biết mình rất vinh dự được phục vụ người dân Albuquerque với tư cách luật sư và được chứng kiến năng lực lãnh đạo của thẩm phán Delwes trong nhiều năm. **Qua tấm gương của bà, ông đã học được rất nhiều về cách tòa án có thể phục vụ người dân Albuquerque tốt nhất**, cho thấy bà Delwes đã ảnh hưởng đến sự nghiệp pháp lý của ông. Ông cảm thấy vinh dự khi được kế nhiệm bà.\n\nNgoài kinh nghiệm pháp lý, ông Estrada còn tích cực tham gia cộng đồng địa phương. Theo tiểu sử, ông là thành viên Ủy ban Đất đai Rio Rancho và đã làm tình nguyện cho nhiều tổ chức từ thiện địa phương. Bài viết **không đề cập việc ông đại diện cho một công ty bất động sản**.\n\nĐáp án: **172 C, 173 C, 174 A, 175 B**.","translationStatus":"reviewed"},{"id":"h2/test07/176_DCCCA.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 176–180","questions":{"176":"D","177":"C","178":"C","179":"C","180":"A"},"image":"data/h2/test07/176_DCCCA.png","markedImage":"marked/h2/test07/176_DCCCA.png","translation":"**Tài liệu 1 – Khu nghỉ dưỡng trượt tuyết Lake Godard**\n\nLake Godard đón hơn 10.000 du khách và tổ chức nhiều hội nghị mỗi năm, là một trong những điểm nghỉ dưỡng mùa đông nổi tiếng nhất Hoa Kỳ. Khu trượt tuyết có đường trượt cho người mới lẫn đồi dốc thử thách cho người có kinh nghiệm. Thang máy trượt tuyết tự động giúp khách nhanh chóng lên đỉnh, và nhân viên luôn có mặt khi cần hỗ trợ.\n\nKhu nghỉ dưỡng còn có phòng trò chơi, dịch vụ mát-xa tại spa và các chuyến đi bộ có hướng dẫn xuyên rừng. Nhân viên có thể giúp đặt vé hoặc giới thiệu điểm tham quan trong thành phố. Phòng đơn có giá từ 129 đô la một đêm; phòng cao cấp nhìn ra Bear Mountain có giá từ 149 đô la. Khách từ bảy ngày trở lên được học trượt tuyết miễn phí hằng ngày với huấn luyện viên chuyên nghiệp. Khu nghỉ dưỡng **không cung cấp dịch vụ đào tạo vận động viên trượt tuyết chuyên nghiệp**.\n\n---\n\n**Tài liệu 2 – Email của Anna Fuller**\n\nKính gửi bộ phận đặt phòng,\n\nTôi từng đến khu vực Lake Godard nhưng chưa ở tại cơ sở của quý vị. Tôi dự định đi cùng chồng và hai con gái trong kỳ nghỉ. Vì mùa này rất đông, xin hỏi còn phòng từ ngày 20 đến ngày 29 tháng 12 không. Tôi đã liên hệ vài khách sạn khác nhưng đều kín phòng.\n\nNếu còn, tôi muốn đặt **phòng cao cấp được giới thiệu trên trang web**, cho thấy tôi thích phòng có tầm nhìn ra núi. Hai con gái tôi chưa từng trượt tuyết nên tôi muốn đăng ký lớp học cho các cháu; với thời gian lưu trú này, các cháu có thể nhận bài học miễn phí. Cuối cùng, xin giới thiệu một chương trình biểu diễn địa phương trong thời gian chúng tôi ở đó. Chúng tôi thích ảo thuật hoặc nhạc kịch nhẹ nhàng, vì vậy tôi muốn **dành thời gian xem một buổi biểu diễn**.\n\nTrân trọng,  \nAnna Fuller\n\nĐáp án: **176 D, 177 C, 178 C, 179 C, 180 A**.","translationStatus":"reviewed"},{"id":"h2/test07/181_CDBCC.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 181–185","questions":{"181":"C","182":"D","183":"B","184":"C","185":"C"},"image":"data/h2/test07/181_CDBCC.png","markedImage":"marked/h2/test07/181_CDBCC.png","translation":"**Tài liệu 1 – Email về cuộc họp quản lý**\n\nGửi Angela,\n\nHy vọng buổi trao đổi với khách hàng diễn ra tốt đẹp. Chúng tôi không gặp bạn ở cuộc họp quản lý. Bạn có thể đọc ghi chú đính kèm để xem tóm tắt, nhưng nội dung chính là lịch làm việc trong kỳ nghỉ sắp tới. Tôi viết email này để **cập nhật cho bạn về nội dung cuộc thảo luận vừa diễn ra**.\n\nÔng Baker muốn đăng thông báo nhắc nhân viên về trách nhiệm trong giai đoạn này. Nhiều người vắng mặt năm ngoái nên các trưởng bộ phận cần lên kế hoạch nghỉ lễ trước để có thể điều chỉnh giờ làm khi cần. Lịch cuối cùng được đăng trên mạng nội bộ trước ngày 25 tháng 11, một ngày trước khi mùa cao điểm bắt đầu và kéo dài từ 26 tháng 11 đến 4 tháng 1. Ông Baker nói mọi yêu cầu nghỉ lễ phải được phê duyệt, trừ trường hợp khẩn cấp về y tế hoặc cá nhân. Thông báo cần được đăng trước cuối tháng này.\n\nMason Daley  \nGiám sát ca, Bộ phận Vận hành\n\n---\n\n**Tài liệu 2 – Thông báo của BigBuy**\n\nĐể chuẩn bị cho mùa mua sắm cuối năm, nhân viên cần xem lịch làm việc trên mạng nội bộ, kiểm tra số giờ và ngày nghỉ. Hãy nộp yêu cầu nghỉ lễ chậm nhất ngày 30 tháng 10. Các yêu cầu gửi sau đó đến ngày 25 tháng 11 chỉ được duyệt theo quyết định của trưởng bộ phận, dựa trên nhu cầu nhân sự.\n\nMọi yêu cầu sẽ được phản hồi trước khi lịch cuối cùng được đăng. Yêu cầu nghỉ từ ngày 26 tháng 11 đến ngày 4 tháng 1 sẽ không được chấp thuận, kể cả cấp quản lý, trừ trường hợp khẩn cấp. Khi đó, nhân viên phải nộp giấy tờ chứng minh đủ điều kiện nghỉ khẩn cấp. Nếu có câu hỏi, hãy hỏi trưởng bộ phận.\n\nThông báo cho thấy BigBuy **từng gặp vấn đề về nhân viên vắng mặt**, và quản lý đang chuẩn bị cho mùa cao điểm. Các trưởng bộ phận sẽ phê duyệt một số yêu cầu nghỉ bổ sung, bảo đảm đủ người làm việc và giải đáp thắc mắc; tài liệu **không nói họ sẽ đào tạo nhân viên thời vụ**. Nhân viên nhận xác nhận nghỉ phép **chậm nhất trước ngày 25 tháng 11**. Trong mùa cao điểm, cô Porter phải **gặp các trưởng bộ phận của mình** để phối hợp lịch làm việc.\n\nĐáp án: **181 C, 182 D, 183 B, 184 C, 185 C**.","translationStatus":"reviewed"},{"id":"h2/test07/186_CBBDB.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 186–190","questions":{"186":"C","187":"B","188":"B","189":"D","190":"B"},"image":"data/h2/test07/186_CBBDB.png","markedImage":"marked/h2/test07/186_CBBDB.png","translation":"**Tài liệu 1 – Tạp chí Art Vibe**\n\nViệc cải tạo Bảo tàng Nghệ thuật Brayman đã hoàn tất. Bảo tàng mở cửa lại vào thứ Tư, ngày 26 tháng 9, với một buổi lễ trên bãi cỏ phía trước. Giám tuyển Jane Wellington sẽ nói về những thành tựu của bảo tàng trong 50 năm hoạt động tại Auckland và giới thiệu triển lãm đặc biệt *France in Focus*. Đây là **một sự kiện đặc biệt diễn ra sau quá trình cải tạo**.\n\nTriển lãm gồm các hiện vật của những bộ tộc Gaul cổ đại tại châu Âu. Sau Auckland, triển lãm sẽ tiếp tục đến Sydney rồi Perth. Vé giá 12 đô la, có thể đặt trước; trẻ từ 10 tuổi trở xuống chỉ trả 5 đô la trong suốt thời gian triển lãm.\n\n---\n\n**Tài liệu 2 – Xác nhận thanh toán**\n\nKhách: Kerry Rosales  \nTriển lãm: *France in Focus*  \nNgày vào cửa: 26 tháng 9\n\n- 1 vé thường: 12 đô la\n- 2 vé đặc biệt: 10 đô la\n- Tổng cộng: 22 đô la\n\nBiên lai cho thấy cô Rosales **dự định đưa trẻ em đến triển lãm khai mạc**. Người mua vé trước phải **mang theo biên lai làm bằng chứng mua hàng** khi nhận vé. Thời gian vào cửa: 8 giờ sáng đến 3 giờ chiều.\n\n---\n\n**Tài liệu 3 – Email thay đổi khẩn cấp**\n\nJane Wellington báo rằng một số hiện vật bị giữ ở hải quan để kiểm tra giấy tờ nên triển lãm bị trì hoãn ít nhất hai tuần. Các hiện vật dự kiến bắt đầu đến bảo tàng vào ngày sau ngày khai mạc cũ; vì vậy bảo tàng **không thể nhận hiện vật vào ngày 27 tháng 9 như dự kiến ban đầu**. Henry Kang phải liên hệ người đã mua vé trước và cho họ lựa chọn dùng vé vào ngày mới hoặc **nhận lại tiền**.\n\nĐáp án: **186 C, 187 B, 188 B, 189 D, 190 B**.","translationStatus":"reviewed"},{"id":"h2/test07/191_DCADC.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 191–195","questions":{"191":"D","192":"C","193":"A","194":"D","195":"C"},"image":"data/h2/test07/191_DCADC.png","markedImage":"marked/h2/test07/191_DCADC.png","translation":"**Tài liệu 1 – Thông báo về nhân viên mới**\n\nTechno Tel đã mua lại Regent Mobile ngày 1 tháng 8. Vì vậy, năm nhân viên cũ của Regent Mobile sẽ gia nhập văn phòng trong khoảng một tuần nữa: ba người làm ở bộ phận nghiên cứu và phát triển, hai người làm marketing. Họ bắt đầu làm việc thứ Hai, ngày 16 tháng 8, sau một ngày đào tạo để hoàn tất thủ tục hành chính. Nhân viên hiện tại được đề nghị chào đón và hỗ trợ họ thích nghi.\n\n---\n\n**Tài liệu 2 – Email đặt vật tư cho nhân viên mới**\n\nNeil Adams cho biết nhóm của ông đã dựng các ô làm việc gồm bàn, ghế và vách ngăn nhưng còn thiếu một số vật dụng. Ông cần đặt ba tủ hồ sơ, ba máy tính cá nhân, ba tủ sách để bàn và một số đồ dùng văn phòng cơ bản. Điều này cho thấy ông làm ở **bộ phận nghiên cứu và phát triển**, nơi tiếp nhận ba nhân viên mới.\n\nÔng nói đây là đơn gấp và muốn giao trước ngày 13 tháng 8 vì nhân viên mới bắt đầu đào tạo tuần sau. Email cũng cho thấy Techno Tel **đã từng đặt hàng từ Office Interiors and Supplies** qua một nhà cung cấp thường xuyên. Những thay đổi tại văn phòng nhằm **bố trí chỗ làm cho nhân viên sắp đến**.\n\n---\n\n**Tài liệu 3 – Giỏ hàng trực tuyến**\n\nĐơn hàng gồm 3 tủ hồ sơ, 6 bút bi, 3 bộ máy tính cá nhân, 3 sổ tay và 3 tủ sách để bàn. Tổng tiền là 2.423,16 đô la. Đơn từ 3.000 đô la mới được miễn phí vận chuyển, nên **đơn hàng này phải chịu phí giao hàng**. Hàng được giao sau ba ngày; như vậy Office Interiors and Supplies **không đáp ứng được yêu cầu giao trước ngày 13 tháng 8 của ông Adams**.\n\nĐáp án: **191 D, 192 C, 193 A, 194 D, 195 C**.","translationStatus":"reviewed"},{"id":"h2/test07/196_CDBCB.png","folder":"h2/test07","book":"h2","bookLabel":"Hacker 2","test":"test07","testLabel":"Test 07","title":"Hacker 2 · Test 07 · Câu 196–200","questions":{"196":"C","197":"D","198":"B","199":"C","200":"B"},"image":"data/h2/test07/196_CDBCB.png","markedImage":"marked/h2/test07/196_CDBCB.png","translation":"**Tài liệu 1 – Rochester Times: Kế hoạch cải tạo ga trung tâm**\n\nCác ga tàu hỏa và tàu điện ngầm trên toàn bang có khu chờ thoải mái, sân ga rộng và trang thiết bị an toàn tốt hơn, nhưng Ga Trung tâm Rochester đang tụt lại phía sau. Chính quyền thành phố đang thương lượng để tìm kinh phí cải tạo và mở rộng cơ sở được xây từ đầu thập niên 1950. Nếu huy động được vốn, thành phố sẽ mời nhà thầu gửi đề xuất trong vài tuần tới.\n\nDự án dự kiến bổ sung khu bán lẻ và ăn uống, phòng chờ lớn hơn, hai sân ga mới, quầy vé nâng cấp và hệ thống thanh toán tự động. Đây là **kế hoạch đổi mới một đầu mối giao thông**. Việc thành phố vẫn đang tìm nguồn tài chính cho thấy **chi phí có thể cao hơn dự kiến**.\n\n---\n\n**Tài liệu 2 – Email mời dự thầu**\n\nSelena Gambrell cảm ơn James Vaughan đã quan tâm đến dự án. Hồ sơ dự thầu phải gồm đơn đăng ký đã điền, nghiên cứu khả thi và đề xuất chi tiết có lịch trình cùng dự toán ngân sách. Tất cả hồ sơ phải niêm phong và nộp trực tiếp cho Tòa thị chính trước ngày 1 tháng 3. Email yêu cầu dự toán ngân sách trong đề xuất, nhưng **không yêu cầu một ngân sách đã được phê duyệt**.\n\n---\n\n**Tài liệu 3 – Đơn dự thầu của Pettus-Pagano**\n\nDự án: Cải tạo Ga Trung tâm Rochester  \nCông ty dự thầu: Pettus-Pagano Firm  \nNgười ký: James Vaughan  \nNgày: 28 tháng 2\n\nNgười dự thầu đồng ý thực hiện công việc theo hợp đồng với giá đã thỏa thuận và chỉ bắt đầu khi đề xuất được phê duyệt bằng văn bản. Hồ sơ có đính kèm tài liệu theo yêu cầu và một tập giới thiệu trình bày **lịch sử cùng các thành tựu hợp đồng của công ty**. Điều này cho thấy Pettus-Pagano đã cung cấp phần mô tả doanh nghiệp kèm đơn.\n\nVì hồ sơ phải được nộp trực tiếp cho Tòa thị chính, ông Vaughan **sẽ tự mình đến một văn phòng thành phố để giao tài liệu**.\n\nĐáp án: **196 C, 197 D, 198 B, 199 C, 200 B**.","translationStatus":"reviewed"},{"id":"h2/test08/131_CBCC.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 131–134","questions":{"131":"C","132":"B","133":"C","134":"C"},"image":"data/h2/test08/131_CBCC.png","markedImage":"marked/h2/test08/131_CBCC.png","translation":"**Thư tư vấn về việc xin quốc tịch**\n\nNgày 18 tháng 9\n\nKính gửi cô Murillo,\n\nCảm ơn cô đã hỏi về dịch vụ hỗ trợ xin **quốc tịch**. Dựa trên thông tin trong thư, con gái cô có thể đã có quốc tịch do là con của một công dân Hoa Kỳ.\n\nĐiều này cần được **xác minh** bằng giấy tờ mà cô chưa gửi kèm. Hồ sơ khai sinh ở nước ngoài của trẻ được xem là bằng chứng nếu đã đăng ký tại lãnh sự quán hoặc đại sứ quán Hoa Kỳ. **Ngoài ra**, người cha hoặc mẹ có quốc tịch phải sống tại Hoa Kỳ ít nhất năm năm trước khi đứa trẻ ra đời.\n\nĐể biết thêm thông tin, cô có thể đến gặp chúng tôi. Trang web cung cấp địa chỉ văn phòng địa phương: chỉ cần chọn tiểu bang hoặc quốc gia nơi cô đang sống, **sau đó chọn cơ quan chính phủ gần nhất**.\n\nVui lòng mang theo mọi giấy tờ liên quan khi đến.\n\nTrân trọng,  \nSonia Esteban","translationStatus":"reviewed"},{"id":"h2/test08/135_ACBB.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 135–138","questions":{"135":"A","136":"C","137":"B","138":"B"},"image":"data/h2/test08/135_ACBB.png","markedImage":"marked/h2/test08/135_ACBB.png","translation":"**Thư cảm ơn Cayman Interior Decorating**\n\nNgày 30 tháng 5\n\nKính gửi ông Maximus,\n\nTôi viết thư để **khen ngợi** ông và đội ngũ vì đã trang trí lại sảnh khách sạn. Kết quả còn tốt hơn kỳ vọng ban đầu. **Chúng tôi cũng ấn tượng không kém với tốc độ hoàn thành công việc.** Nhìn chung, khách rất thích diện mạo mới, đặc biệt là **bầu không khí** đậm phong cách thập niên 1920 và đồ nội thất tiện nghi.\n\nKhách sạn dự định cải tạo các phòng nghỉ từ tháng tới. Ngoài ra, chúng tôi **sẽ** mở rộng trung tâm dịch vụ doanh nghiệp ở tầng hai để có thêm không gian lắp đặt cơ sở vật chất mới.\n\nTôi sẽ liên hệ lại khi kế hoạch cụ thể hơn và hy vọng lịch của ông cho phép tiếp tục làm việc với chúng tôi.\n\nTrân trọng,  \nDevon Green  \nQuản lý, Nuance Hotel","translationStatus":"reviewed"},{"id":"h2/test08/139_CAAC.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 139–142","questions":{"139":"C","140":"A","141":"A","142":"C"},"image":"data/h2/test08/139_CAAC.png","markedImage":"marked/h2/test08/139_CAAC.png","translation":"**Đợt thanh lý hàng tồn kho thường niên tại Dan’s Hardware Store**\n\nĐể cảm ơn khách hàng trung thành, Dan’s Hardware Store mời mọi người tham dự đợt thanh lý từ ngày 1 đến 16 tháng 9. Tất cả hàng hóa sẽ được **giảm giá**, với mức giảm lên tới 80% cho mọi thứ từ dụng cụ làm vườn đến thiết bị ngoài trời. **Mỗi khu hàng đều có những ưu đãi hấp dẫn.**\n\nKhách mua hàng trị giá từ 500 đô la trở lên sẽ **được quyền nhận** phiếu mua hàng 50 đô la, sử dụng đến ngày 31 tháng 12. Mỗi giao dịch chỉ được nhận **một** phiếu.\n\nThông tin và chỉ đường đến cửa hàng gần nhất có tại www.danshardware.com.","translationStatus":"reviewed"},{"id":"h2/test08/143_CDBA.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 143–146","questions":{"143":"C","144":"D","145":"B","146":"A"},"image":"data/h2/test08/143_CDBA.png","markedImage":"marked/h2/test08/143_CDBA.png","translation":"**Loạt phim *Feed* của Grimsby chinh phục người xem**\n\nTrong loạt phim tài liệu ba phần *Feed*, nhà làm phim David Grimsby **đầy nhiệt huyết** khám phá ngành công nghiệp thực phẩm hiện đại. Phim đưa người xem vào hậu trường các trang trại và nhà máy, hé lộ những chi tiết gây sốc về thực phẩm và cách chúng được sản xuất.\n\nDù đã có nhiều phim tài liệu khác về **chủ đề** này, *Feed* nổi bật nhờ lời dẫn thông minh, các cuộc phỏng vấn hấp dẫn và đồ họa hoạt hình. **Điểm khác biệt nổi bật nhất của bộ phim có lẽ là tính trung lập, không thiên vị.** Phim trình bày cả lợi ích lẫn hạn chế của sản xuất thực phẩm hiện đại mà không ủng hộ riêng quan điểm nào.\n\nGiàu thông tin và hấp dẫn về hình ảnh, loạt phim cuốn hút **đến mức** nhiều người sẽ muốn xem hai lần. Tập đầu tiên phát sóng trong tháng này trên Modern Film Channel.","translationStatus":"reviewed"},{"id":"h2/test08/147_CD.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 147–148","questions":{"147":"C","148":"D"},"image":"data/h2/test08/147_CD.png","markedImage":"marked/h2/test08/147_CD.png","translation":"**Thông báo nội bộ — Tiệc chào mừng phó chủ tịch khu vực mới**\n\nGửi: Toàn thể nhân viên  \nTừ: Donald Manzo  \nNgày: 5 tháng 8\n\nCông ty sẽ tổ chức tiệc chào mừng phó chủ tịch khu vực mới, Gertrude Crowley. Trước đây, cô Crowley làm quản lý cửa hàng tại chi nhánh Knightland Electronics ở Charleston trong năm năm, lãnh đạo văn phòng Atlanta hai năm, rồi chuyển đến New Orleans làm quản lý khu vực.\n\nCô sẽ phụ trách khu vực đông nam từ văn phòng vùng của chúng ta tại **Nashville — nơi cô chưa từng làm việc trước đây**.\n\nTiệc diễn ra lúc 7 giờ 30 tối thứ Sáu, ngày 9 tháng 8 tại Khách sạn Bluegrass. Người dự định tham gia vui lòng báo cho thư ký của tôi theo số máy lẻ 44.","translationStatus":"reviewed"},{"id":"h2/test08/149_BD.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 149–150","questions":{"149":"B","150":"D"},"image":"data/h2/test08/149_BD.png","markedImage":"marked/h2/test08/149_BD.png","translation":"**Chuỗi tin nhắn chuẩn bị hội chợ thương mại**\n\n**Helen Moon — 2:20 chiều**  \nSue, cô đã lấy các vật tư trong danh sách chuẩn bị hội chợ chưa?\n\n**Sue Sloane — 2:24**  \nTôi tìm thấy phần lớn trong kho. Phần còn lại tôi sẽ mua trên đường đến trung tâm hội nghị ngày mai.\n\n**Helen Moon — 2:25**  \nHãy kiểm tra bảng kẹp giấy. Chúng ta cần hai chiếc giữ bảng câu hỏi và hai chiếc cho phiếu đăng ký khách hàng mới.\n\n**Sue Sloane — 2:27**  \nKhông vấn đề. Có ai lấy tờ giới thiệu từ nhà in chưa? Nếu chưa, tôi có thể lấy.\n\n**Helen Moon — 2:28**  \nTôi vốn định làm việc đó. Tôi rất biết ơn nếu cô giúp.\n\n**Sue Sloane — 2:29**  \n**Tôi sẵn lòng làm việc vặt đó, không có gì bất tiện.** Nhà in gần Coulier Office Supplies, nơi tôi mua các vật tư còn lại. Tôi sẽ mang tờ giới thiệu đến sớm để mọi người chuẩn bị **phát cho người tham dự hội chợ** ngay khi mở cửa. Tôi sẽ có mặt để dựng gian hàng trước 3 giờ.","translationStatus":"reviewed"},{"id":"h2/test08/151_AC.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 151–152","questions":{"151":"A","152":"C"},"image":"data/h2/test08/151_AC.png","markedImage":"marked/h2/test08/151_AC.png","translation":"**Chủ đề: Tiền đặt cọc văn phòng tại Spiral Towers**\n\nKính gửi ông Webster,\n\nSéc đặt cọc đã được rút tiền và chúng tôi xác nhận ông có thể chuyển vào văn phòng mới tại Spiral Towers vào ngày đầu tháng tới. Điều này cho thấy ông Webster là **người thuê và sử dụng tòa nhà**.\n\nSeafront Realty giữ khoản đặt cọc cho đến khi ông chuyển đi. Khi đó, bất động sản được kiểm tra và phải được trả lại trong tình trạng như lúc bắt đầu hợp đồng. Chi phí hư hại vượt mức sẽ được trừ vào tiền đặt cọc.\n\nKhoản tiền được giữ trong tài khoản ngân hàng; tiền lãi phát sinh cũng được hoàn lại khi ông rời đi. Email **không cho biết tiền đặt cọc tương đương một tháng tiền thuê**.\n\nTrân trọng,  \nCaroline Gomez  \nSeafront Realty Miami","translationStatus":"reviewed"},{"id":"h2/test08/153_CCD.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 153–155","questions":{"153":"C","154":"C","155":"D"},"image":"data/h2/test08/153_CCD.png","markedImage":"marked/h2/test08/153_CCD.png","translation":"**Giải Marathon Quốc tế Nairobi thu hút sự chú ý**\n\nBan tổ chức thông báo đã có 12.000 vận động viên đăng ký, **tăng gần 30% so với năm ngoái**, và dự kiến còn nhiều người tham gia hơn. Từ sau giải năm trước, họ tích cực quảng bá trên mạng xã hội để tiếp cận thêm vận động viên quốc tế.\n\nSự nổi tiếng ngày càng tăng của cuộc đua đã **thúc đẩy du lịch địa phương**, và ban tổ chức tin xu hướng này sẽ tiếp tục.\n\nCác tuyến đường mới cũng được công bố. Marathon toàn phần và bán marathon bắt đầu ở rìa phía tây Công viên Quốc gia; các cuộc đua ngắn hơn bắt đầu trên Outer Ring Road. **Tất cả cuộc đua kết thúc tại City Stadium.**\n\nĐăng ký mở đến cuối tháng 8. Thông tin phí và điều kiện tại www.nairobimarathon.org.","translationStatus":"reviewed"},{"id":"h2/test08/156_BC.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 156–157","questions":{"156":"B","157":"C"},"image":"data/h2/test08/156_BC.png","markedImage":"marked/h2/test08/156_BC.png","translation":"**Ace Venture Systems — Phần mềm Kế toán Phiên bản 1**\n\nAce Venture Systems giới thiệu phần mềm kế toán miễn phí cho doanh nghiệp nhỏ và vừa. Chương trình có các chức năng kế toán thiết yếu, giúp quản lý hàng tồn kho, đơn mua hàng, dữ liệu bán hàng, báo cáo tài chính và thông tin tài khoản.\n\nNgười dùng có thể **tải trực tiếp phần mềm từ trang web**.\n\nAce Venture Systems thúc đẩy phần mềm nguồn mở và cung cấp miễn phí các ứng dụng kinh doanh đáng tin cậy cho hơn 200.000 người dùng. Công ty cũng mời khách hàng gửi phản hồi qua bảng câu hỏi.\n\nTrang **không nói công ty bán phần mềm theo gói đăng ký hằng năm**.","translationStatus":"reviewed"},{"id":"h2/test08/158_BDB.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 158–160","questions":{"158":"B","159":"D","160":"B"},"image":"data/h2/test08/158_BDB.png","markedImage":"marked/h2/test08/158_BDB.png","translation":"**Trung tâm Giải trí Cộng đồng Madison — Đăng ký hoạt động thanh thiếu niên**\n\nTrung tâm tổ chức chương trình hoạt động mùa hè kéo dài 10 tuần cho trẻ em và thanh thiếu niên, gồm cầu lông, bơi, bóng rổ, bóng đá và nhiều môn khác.\n\nMọi môn thể thao đều do **hướng dẫn viên người lớn có chuyên môn** giám sát. Người tham gia được xếp theo trình độ tương đương để vừa vui chơi vừa học kỹ năng và rèn luyện sức khỏe.\n\nCẩm nang ngày giờ và giá có tại quầy lễ tân hoặc được gửi qua bưu điện. Đăng ký mở một tuần từ ngày 15 tháng 9; người tham gia phải **truy cập trang web www.mclc.com** và làm theo hướng dẫn.\n\nChỗ được phân theo thứ tự đăng ký. Nếu có người đổi lịch hoặc bỏ cuộc, chỗ trống bổ sung sẽ được mở **14 ngày — hai tuần — sau khi đăng ký đóng**.","translationStatus":"reviewed"},{"id":"h2/test08/161_DACA.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 161–164","questions":{"161":"D","162":"A","163":"C","164":"A"},"image":"data/h2/test08/161_DACA.png","markedImage":"marked/h2/test08/161_DACA.png","translation":"**Cuộc trò chuyện về vấn đề rác thải của thành phố**\n\n**Ruth Fiorentino — 3:10 chiều**  \nThị trưởng Watkins muốn chúng ta lập **danh sách đề xuất để trình tại cuộc họp hội đồng tiếp theo** nhằm xử lý vấn đề rác thải đang tăng.\n\n**Vickie Hill — 3:11**  \nNên có chiến dịch truyền thông tập trung vào giảm thiểu, tái sử dụng và tái chế.\n\n**Lloyd Medrano — 3:12**  \n**Tôi hoàn toàn đồng ý rằng truyền thông sẽ hữu ích.** Chúng ta cũng cần thêm thùng rác, nhất là tại khu công cộng và công viên.\n\n**Marcella Sanders — 3:13**  \nSở vệ sinh còn thiếu nhân viên. Có thể tuyển thêm nhưng cần tìm nguồn chi trả.\n\n**Dennis Kang — 3:15**  \nNếu có kế hoạch hành động vững chắc, tôi có thể tìm cách cung cấp kinh phí.\n\n**Ruth Fiorentino — 3:15**  \nHãy họp lúc 2 giờ 30 chiều mai tại phòng hội nghị 3 để phát triển ý tưởng.\n\n**Dennis Kang — 3:16**  \nNên mời trưởng Sở vệ sinh tham dự.\n\n**Marcella Sanders — 3:17**  \nNgày mai tôi nghỉ nhưng sẽ gửi ý tưởng qua email trước khi về hôm nay.\n\n**Ruth Fiorentino — 3:17**  \nTôi sẽ gọi cho Edith Holmes ngay. Điều này cho thấy **Edith Holmes là trưởng Sở vệ sinh**.","translationStatus":"reviewed"},{"id":"h2/test08/165_BDD.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 165–167","questions":{"165":"B","166":"D","167":"D"},"image":"data/h2/test08/165_BDD.png","markedImage":"marked/h2/test08/165_BDD.png","translation":"**Đêm ca nhạc tại Maroon Theater**\n\nNgày 5 tháng 12, hai ca sĩ Pháp Pierre Chrétien và Celine Laurier sẽ biểu diễn lần thứ hai tại Los Angeles. Chương trình bắt đầu lúc 7 giờ 30 tối, còn có nghệ sĩ piano Pháp Amanda Depuis và hai ca sĩ soul Mỹ Andy Red, Cindy Dawson.\n\nCeline Laurier sẽ giới thiệu album truyền cảm hứng mới *Crossroads*, phát hành tại Paris tuần trước. Bản thu âm của cả hai ca sĩ Pháp sẽ được bán tại địa điểm. Chương trình **không đề cập buổi ký tặng**.\n\nĐến ngày 20 tháng 11, người mua từ ba vé sớm trở lên được nhận **thẻ vào hậu trường miễn phí**. **Ưu đãi này không áp dụng cho vé thường.** Vé bán tại Gatewing Ticketing hoặc www.gatewing.com.","translationStatus":"reviewed"},{"id":"h2/test08/168_CCBC.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 168–171","questions":{"168":"C","169":"C","170":"B","171":"C"},"image":"data/h2/test08/168_CCBC.png","markedImage":"marked/h2/test08/168_CCBC.png","translation":"**Chủ đề: Đơn hàng quà tặng của ông Haggerty**\n\nGift Lane đã nhận đơn hàng trực tuyến nhưng do lượng đặt hàng mùa lễ quá cao, **một sản phẩm chưa sẵn hàng để giao trước Giáng sinh**.\n\nĐơn hàng gửi cho **nhiều người nhận tại các địa chỉ khác nhau**:\n\n- Chai rượu vang hồng cá nhân hóa — giao ngày 21 tháng 12\n- Hộp sô-cô-la — giao ngày 21 tháng 12\n- Bộ nhật ký và bút — giao ngày 22 tháng 12\n- Chậu cây trang trí — sớm nhất ngày 27 tháng 12\n\nNếu ông Haggerty không trả lời, Gift Lane sẽ **tiếp tục giao chậu cây ngày 27 tháng 12** khi có hàng. Nếu muốn mọi món đến trước ngày 25, ông cần **nhấp liên kết để sửa đơn và thay sản phẩm**.\n\nMargaret Hill  \nChăm sóc Khách hàng, Gift Lane","translationStatus":"reviewed"},{"id":"h2/test08/172_BABB.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 172–175","questions":{"172":"B","173":"A","174":"B","175":"B"},"image":"data/h2/test08/172_BABB.png","markedImage":"marked/h2/test08/172_BABB.png","translation":"**Vở nhạc kịch *The Triumph of Lester Beebe* trở lại sân khấu**\n\nPhiên bản nhạc kịch từ tiểu thuyết của Michelle Gable sẽ ra mắt ngày 22 tháng 5. Lấy bối cảnh South Bend, tác phẩm kể về con trai tuổi thiếu niên của một công nhân nhà máy ô tô trong thập niên 1960. Cuốn sách được **độc giả trẻ yêu thích khi xuất bản năm 1968**. **Sự nổi tiếng giúp sách được ca ngợi rộng rãi và dịch sang 82 ngôn ngữ.**\n\nHai nhà sản xuất Todd Carlisle và Emma Wright đồng cảm với những khó khăn thời niên thiếu của Lester. Họ còn quản lý Eden Playhouse và hy vọng chương trình thúc đẩy sân khấu nhạc kịch tại địa phương.\n\nHenry Thomas đóng Lester; Neil Chandler đóng người cha; Stephanie O’Connor và Audrey Blanco sẽ **thể hiện** hai chị em Mandy và Corinne.\n\nSau thời gian diễn tại South Bend, chương trình sẽ đến New York vào tháng 8 để ra mắt Broadway. Bài viết chủ yếu nói về **việc một nghệ sĩ/tác phẩm âm nhạc trở lại sân khấu qua bản chuyển thể**.","translationStatus":"reviewed"},{"id":"h2/test08/176_CAABD.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 176–180","questions":{"176":"C","177":"A","178":"A","179":"B","180":"D"},"image":"data/h2/test08/176_CAABD.png","markedImage":"marked/h2/test08/176_CAABD.png","translation":"**Tài liệu 1 — Ergo Office Works**\n\nNhân viên văn phòng có thể **đau do ngồi trong thời gian dài** và dùng đồ nội thất thiết kế kém. Ergo bán đèn LED giảm mỏi mắt, ghế hỗ trợ tư thế, kê cổ tay, bàn đứng và bàn công thái học.\n\nGiao miễn phí trong Portland. Đơn trên 1.000 đô la đến Gresham, Oregon City hoặc Beaverton chịu phí 200 đô la. Đơn trực tuyến mua từ hai bàn thuộc các nhãn hiệu nêu trong quảng cáo được tặng giá đỡ màn hình.\n\n---\n\n**Tài liệu 2 — Đơn hàng của Optimo Web Design**\n\nCông ty ở Gresham, đặt tổng cộng 1.100 đô la nên trả **200 đô la phí giao hàng**. Đơn gồm năm đèn LED, hai bàn công thái học Grafton, năm kê cổ tay và một bàn đứng Drape Desks.\n\nVì đơn có **hai bàn Grafton — mã 3665**, khách nhận quà tặng giá đỡ màn hình.\n\nVăn phòng đóng cửa ngày **8 tháng 4**, vì vậy không thể giao hàng vào ngày đó. Nhân viên bảo vệ chỉ cho xe vào trong những ngày văn phòng mở.","translationStatus":"reviewed"},{"id":"h2/test08/181_CDABD.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 181–185","questions":{"181":"C","182":"D","183":"A","184":"B","185":"D"},"image":"data/h2/test08/181_CDABD.png","markedImage":"marked/h2/test08/181_CDABD.png","translation":"**Tài liệu 1 — Yêu cầu tổ chức kỳ nghỉ điều hành của Burke Capital**\n\nCharlotte Hoffman hỏi Khách sạn Rome Kingstonian về sự kiện ngày 8–10 tháng 5. Công ty có 12 giám đốc, 15 quản lý và 8 nhân viên hỗ trợ. Họ cần phòng ở, một phòng hội nghị lớn, ba phòng họp nhỏ, máy chiếu, Internet và phục vụ bữa ăn.\n\nMột số nhân viên Burke Capital **đã từng ở khách sạn ba năm trước**, vì người tiền nhiệm của Charlotte từng tổ chức sự kiện tại đây.\n\n---\n\n**Tài liệu 2 — Phản hồi của khách sạn**\n\nKhách sạn còn đủ **phòng suite cho lãnh đạo**, nhưng thiếu một số phòng khác và đề nghị thêm bốn người ở chung phòng đôi.\n\nPhòng hội nghị chính đã được đặt cho sự kiện khác. Một trung tâm hội nghị cách khách sạn 10 phút đi bộ có thể tiếp nhận đoàn, và khách sạn sẽ mang bữa trưa đến đó. Điều này cho thấy **phòng hội nghị lớn tại khách sạn không còn trống ngày 8 tháng 5**.\n\nKhách sạn có dịch vụ ăn uống và gần trung tâm hội nghị, nhưng **không đề cập xe buýt miễn phí từ sân bay**.","translationStatus":"reviewed"},{"id":"h2/test08/186_DBCBB.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 186–190","questions":{"186":"D","187":"B","188":"C","189":"B","190":"B"},"image":"data/h2/test08/186_DBCBB.png","markedImage":"marked/h2/test08/186_DBCBB.png","translation":"**Tài liệu 1 — Ruben St. Claire, người viết và biên tập tự do**\n\nÔng St. Claire viết, biên tập, đọc soát và nghiên cứu nhiều chủ đề; trang web có hồ sơ và mẫu bài viết. Ông từng nhận giải về truyền thông, biên tập và viết. Ông có bằng đại học nhưng **không được nói là đang làm việc tại một cơ sở giáo dục**.\n\n---\n\n**Tài liệu 2 — Đề nghị hợp tác từ FineThreads.com**\n\nChrista Gables muốn thuê ông viết ba trang blog cho cửa hàng quần áo trực tuyến. Cô biết khách hàng trước đây của ông là **Sportsworld Outfitters**, doanh nghiệp bán sản phẩm tương tự. Nếu hài lòng, cô còn giao ba giờ nghiên cứu và sáu giờ đọc soát. Cô yêu cầu **bảng phí và ước tính tổng chi phí**.\n\n---\n\n**Tài liệu 3 — Hóa đơn**\n\nViết ba trang: 225 đô la  \nĐọc soát sáu giờ: 120 đô la  \nNghiên cứu năm giờ: 100 đô la  \nTổng sau thuế: 489,50 đô la\n\nSố giờ nghiên cứu trên hóa đơn nhiều hơn đề nghị ban đầu, nên cô Gables có thể đã **phải trả cho nhiều công việc hơn dự tính**.","translationStatus":"reviewed"},{"id":"h2/test08/191_BDCDA.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 191–195","questions":{"191":"B","192":"D","193":"C","194":"D","195":"A"},"image":"data/h2/test08/191_BDCDA.png","markedImage":"marked/h2/test08/191_BDCDA.png","translation":"**Tài liệu 1 — Xe đưa đón miễn phí của TrueBlue Mart**\n\nCửa hàng mở dịch vụ xe miễn phí vì nhận thấy **một số khách hàng khó đến cửa hàng do thiếu phương tiện giá hợp lý**. Xe xuất phát từ Edgewood Avenue Apartments lúc 8:30 sáng từ thứ Hai đến thứ Sáu, chạy bốn chuyến. Thứ Bảy xe chạy ba chuyến từ 10 giờ và bỏ qua điểm dừng thứ hai; Chủ nhật không hoạt động.\n\n---\n\n**Tài liệu 2 — Ý kiến của Emilia Harper**\n\nCô Harper sống gần điểm thứ hai, Glengarry University. Cuối tuần xe bỏ điểm này nên cô phải đi bộ xa hơn đến **điểm thứ ba — Horizons Crossings Recreation Club**.\n\nCô thường không cần đủ hai giờ để mua sắm và đề nghị tăng tần suất xe. Cô đã dùng xe nhiều lần; bản thân đi bộ được nhưng một số cư dân khác gặp khó khăn vận động. Vì vậy, bài không nói **cô Harper có vấn đề vận động**.\n\nTrong trang web, “presents” có nghĩa là thời tiết **gây ra/tạo ra** trở ngại.","translationStatus":"reviewed"},{"id":"h2/test08/196_CBCCB.png","folder":"h2/test08","book":"h2","bookLabel":"Hacker 2","test":"test08","testLabel":"Test 08","title":"Hacker 2 · Test 08 · Câu 196–200","questions":{"196":"C","197":"B","198":"C","199":"C","200":"B"},"image":"data/h2/test08/196_CBCCB.png","markedImage":"marked/h2/test08/196_CBCCB.png","translation":"**Tài liệu 1 — Fresh & Sharp sắp mở tại Old Ridge Mall**\n\nChi nhánh rộng 1.200 foot vuông của cửa hàng thời trang Fresh & Sharp sẽ mở tại Stockton. Công trình bắt đầu ngày 9 tháng 5 tại vị trí trước đây của Always Good Supermarket. Vì cửa hàng nằm ở tầng trệt của Old Ridge Mall, điều này cho thấy **Always Good trước đó cũng ở tầng trệt**.\n\n---\n\n**Tài liệu 2 — Khuyến mãi khai trương ngày 9 tháng 9**\n\nPhụ kiện đánh dấu giảm 50%; một số áo len và áo khoác giảm 30%; quần jean giảm 20%. Khách chi trên 200 đô la được giảm thêm 10% sau thuế. Thành viên có từ 10.000 điểm nhận túi miễn phí.\n\n“Performance” trong bài báo mang nghĩa **thành tích/kết quả hoạt động**. Khuyến mãi cho biết **chi tiêu đủ mức sẽ được giảm thêm**.\n\n---\n\n**Tài liệu 3 — Hóa đơn của Patricia Jones**\n\nTổng thanh toán là 167,97 đô la, dưới 200 đô la. Sau giao dịch cô có 8.534 điểm, dưới 10.000, nên **không đủ điều kiện nhận túi miễn phí**.\n\nFresh & Sharp không hoàn tiền; chỉ đổi hàng còn nguyên nhãn trong 14 ngày hoặc cấp tín dụng cửa hàng. Vì vậy cô không được lấy lại tiền mặt trong hai tuần.","translationStatus":"reviewed"},{"id":"h2/test09/131_ABCB.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 131–134","questions":{"131":"A","132":"B","133":"C","134":"B"},"image":"data/h2/test09/131_ABCB.png","markedImage":"marked/h2/test09/131_ABCB.png","translation":"Scott Harper đã được **chọn** làm đội trưởng đội tuyển đua thuyền buồm quốc gia Canada tại giải Cannon Regatta sắp tới. Người phát ngôn Jeremy Dawes công bố thông tin này trong một cuộc họp báo sáng nay. **Ông cũng trả lời câu hỏi của các phóng viên tại sự kiện.**\n\nHarper, 39 tuổi, quê New Brunswick, là người đam mê thuyền bè cả đời và từng thi đấu tại nhiều sự kiện quốc tế. Ông đã giành hai cúp Yachtmaster ở nội dung thuyền buồm đơn và sẽ tranh tài lần thứ ba vào cuối tháng tới, **lần này** cùng thủy thủ đoàn sáu người.\n\nPhát biểu thay mặt đội tuyển trong vai trò mới, Harper tỏ ra tự tin về cơ hội của Canada: “Hầu hết chúng tôi từng phối hợp trong những dịp trước đây. **Thực tế**, tôi đã cùng ít nhất bốn thành viên khác tham gia các cuộc đua.”\n\nĐáp án: **131 A, 132 B, 133 C, 134 B**.","translationStatus":"reviewed"},{"id":"h2/test09/135_DBCB.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 135–138","questions":{"135":"D","136":"B","137":"C","138":"B"},"image":"data/h2/test09/135_DBCB.png","markedImage":"marked/h2/test09/135_DBCB.png","translation":"**Chủ đề: Sự cố máy móc**\n\nKính gửi ông Randy Huffington,\n\nĐây là lần thứ hai tôi liên hệ về thiết bị nhà máy gần đây **đã gặp trục trặc** tại cơ sở Denver. Như đã nói trong email đầu tiên, một công nhân cho biết máy phát ra tiếng động lớn và rung **dữ dội**. Vì có nguy cơ gây nguy hiểm, chúng tôi đã tắt máy để tránh làm nhân viên bị thương nghiêm trọng.\n\nMáy mới được công ty ông giao đến nhà máy một tuần trước. **Vì vậy, thiết bị chúng tôi mua vẫn còn trong thời hạn bảo hành.** Xin ông cử kỹ sư đến kiểm tra thiết bị. Hy vọng kỹ thuật viên có thể xác định nguyên nhân máy hỏng ngay sau khi **kiểm tra**.\n\nChúng tôi mong sớm nhận được phản hồi.\n\nTrân trọng,\nOlivia Cottrell  \nQuản trị viên cấp cao, Edicare Industrials\n\nĐáp án: **135 D, 136 B, 137 C, 138 B**.","translationStatus":"reviewed"},{"id":"h2/test09/139_CDDC.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 139–142","questions":{"139":"C","140":"D","141":"D","142":"C"},"image":"data/h2/test09/139_CDDC.png","markedImage":"marked/h2/test09/139_CDDC.png","translation":"**PIZZA ĐÔNG LẠNH DIMAGGIANO – HƯỚNG DẪN CHẾ BIẾN**\n\nLấy pizza ra khỏi bao bì nhưng không rã đông. Nếu pizza đã tan đá, hãy giảm thời gian nướng **khoảng ba phút**.\n\nLàm nóng lò ở 230°C. Muốn đế mềm hơn, đặt pizza ở giá giữa và nướng 10–12 phút. **Lấy pizza ra khi đế có màu vàng và phô mai đã tan chảy.** Muốn đế giòn hơn, nướng pizza ở giá trên với nhiệt độ **cao hơn**. Hãy chỉnh lò lên 280°C để có lớp đế giòn hoàn hảo.\n\nCẩn thận lấy pizza ra để không bị bỏng tay. Để pizza **nguội bớt** trong 3–4 phút trước khi ăn. Sau đó cắt bánh và thưởng thức cùng đồ uống yêu thích.\n\nĐáp án: **139 C, 140 D, 141 D, 142 C**.","translationStatus":"reviewed"},{"id":"h2/test09/143_BADA.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 143–146","questions":{"143":"B","144":"A","145":"D","146":"A"},"image":"data/h2/test09/143_BADA.png","markedImage":"marked/h2/test09/143_BADA.png","translation":"**Chủ đề: Yêu cầu đặt hàng qua email**\n\nKính gửi cô Tara Fanning,\n\nMột đồng nghiệp đã cho tôi dùng thử một số mẫu kem dưỡng và kem bôi của cô. Sau khi dùng, tôi nhận ra đây chính là những sản phẩm mình cần.\n\nTôi hiểu rằng cô **tiếp thị** sản phẩm chăm sóc da Beauty Deep theo hình thức bán tận nhà. Tuy nhiên, tôi muốn biết có cách mua nào khác không. Cụ thể, tôi muốn mua trực tuyến kem dưỡng ẩm chuyên sâu và giao đến nhà. **Ngoài ra**, tôi muốn mua một tuýp kem dưỡng mắt tuyệt vời của cô. Loại kem này phục hồi **sức sống** cho vùng da quanh mắt, điều mà những sản phẩm tôi từng dùng không làm được. **Vì vậy tôi rất ngạc nhiên khi làn da của mình trông trẻ hơn nhờ kem của cô.**\n\nXin cho tôi biết cô có xử lý đơn trực tuyến không. Nếu có, tôi sẽ gửi đơn hàng đầy đủ cùng thông tin thanh toán và giao hàng.\n\nTrân trọng,\nSarah Monaco\n\nĐáp án: **143 B, 144 A, 145 D, 146 A**.","translationStatus":"reviewed"},{"id":"h2/test09/147_CD.png","folder":"h2/test09","book":"h2","bookLabel":"Hacker 2","test":"test09","testLabel":"Test 09","title":"Hacker 2 · Test 09 · Câu 147–
